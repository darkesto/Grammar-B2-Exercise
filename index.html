        "Correct. “Where” introduces a relative clause describing a place.",
        "“Whose” expresses possession and must be followed by a noun."]},
    {q:"Monday is the day ______ the project officially starts.",
     o:["where","when","which","who"], a:1,
     e:["“Where” refers to a place, not to a day.",
        "Correct. “When” introduces a relative clause referring to a time.",
        "“Which” alone cannot replace a time reference after “the day” in this structure.",
        "“Who” refers to people, not to a point in time."]},
    {q:"Choose the correct sentence.",
     o:["The report who I sent you contains the schedule.","The report I sent you contains the schedule.","The report what I sent you contains the schedule.","The report whose I sent you contains the schedule."], a:1,
     e:["“Who” refers to people, so it cannot refer to a report.",
        "Correct. The object pronoun of a defining relative clause can be left out.",
        "“What” is never a relative pronoun after a noun in English.",
        "“Whose” shows possession and must be followed by a noun."]},
    {q:"The deadline ______ the client proposed is far too tight.",
     o:["who","whose","where","which"], a:3,
     e:["“Who” refers to people, but a deadline is a thing.",
        "“Whose” expresses possession and needs a noun after it.",
        "“Where” refers to a place, not to a deadline.",
        "Correct. “Which” refers to a thing as the object of the relative clause."]},
    {q:"Our team leader, ______ opened the kick-off session, works in the Lyon office.",
     o:["which","whose","who","where"], a:2,
     e:["“Which” refers to things or animals, not to a person.",
        "“Whose” expresses possession and must be followed by a noun.",
        "Correct. In a non-defining clause about a person, “who” works as the subject after the comma.",
        "“Where” introduces a place, not a person."]},
    {q:"The software ______ we bought last month doesn’t support our old files.",
     o:["who","that","when","whose"], a:1,
     e:["“Who” refers to people, but software is a thing.",
        "Correct. “That” refers to a thing as the object of a defining relative clause.",
        "“When” introduces a time, not the object of “bought”.",
        "“Whose” expresses possession and would need a noun immediately after it."]}
   ]},
   {t:"Part 4 · Conditionals & Advanced Modals", q:[
    {q:"If the client ______ the plan tomorrow, we will start the first phase on Monday.",
     o:["will approve","approves","would approve","approved"], a:1,
     e:["“Will” is not used in the “if” clause of a first conditional.",
        "Correct. The first conditional uses the present simple after “if” and “will” in the main clause.",
        "“Would approve” belongs to a second conditional and does not match “we will start”.",
        "The past simple after “if” would create a second conditional, which clashes with “will start”."]},
    {q:"If you heat this material above 200 degrees, it ______ its shape.",
     o:["loses","would lose","will have lost","lost"], a:0,
     e:["Correct. The zero conditional uses the present simple in both clauses for a general scientific fact.",
        "“Would lose” suggests an imaginary situation, not a fact that is always true.",
        "“Will have lost” is a future perfect form and does not express a general rule.",
        "The past simple does not fit a situation that is always true."]},
    {q:"If I ______ you, I would ask for an extra week before the deadline.",
     o:["am","was being","will be","were"], a:3,
     e:["The present simple does not fit the imaginary advice expressed by “I would ask”.",
        "“Was being” describes temporary behaviour and is impossible in this fixed expression.",
        "“Will be” cannot appear after “if” in a conditional of this type.",
        "Correct. The second conditional uses “were” in the “if” clause to give imaginary advice."]},
    {q:"We ______ finish the risk analysis before the meeting; otherwise the client will be angry.",
     o:["had better","would rather","used to","are able"], a:0,
     e:["Correct. “Had better” plus the bare infinitive gives strong advice with a warning.",
        "“Would rather” expresses a preference, not a warning about consequences.",
        "“Used to” describes a past habit and cannot talk about a future task.",
        "“Are able” needs “to” before the verb and expresses ability, not advice."]},
    {q:"You ______ to check the version number before sending the document.",
     o:["should","must","ought","might"], a:2,
     e:["“Should” is followed directly by the bare infinitive, never by “to”.",
        "“Must” is followed by the bare infinitive, so it cannot precede “to check”.",
        "Correct. “Ought” is the only modal in this list that is followed by “to” plus the infinitive.",
        "“Might” takes the bare infinitive and would express possibility, not a recommendation."]},
    {q:"If the test ______ tomorrow, we would need to redesign the whole module.",
     o:["will fail","fails","failed","has failed"], a:2,
     e:["“Will” cannot be used in the “if” clause of a conditional sentence.",
        "The present simple after “if” goes with “will” in the main clause, not with “would need”.",
        "Correct. The second conditional uses the past simple after “if” together with “would” in the main clause.",
        "The present perfect after “if” does not form a conditional pattern with “would need”."]},
    {q:"The delivery ______ arrive late, because the weather forecast is very bad.",
     o:["may","may to","mays","is may"], a:0,
     e:["Correct. “May” plus the bare infinitive expresses a possibility in the future.",
        "A modal verb is never followed by “to” in this structure.",
        "Modal verbs take no “s” in the third person, so this form does not exist.",
        "A modal cannot follow the verb “be”; the two cannot be combined like this."]},
    {q:"If we don’t fix the database today, the whole team ______ blocked tomorrow.",
     o:["is","would be","will be","were"], a:2,
     e:["The present simple does not express the future consequence announced by the “if” clause.",
        "“Would be” belongs to a second conditional and does not match the present simple “don’t fix”.",
        "Correct. A first conditional with the present simple after “if” takes “will” in the main clause.",
        "“Were” would create a second conditional and clashes with “don’t fix”."]},
    {q:"Choose the correct sentence.",
     o:["If the budget would increase, we could hire a second developer.","If the budget increase, we could hire a second developer.","If the budget will increase, we could hire a second developer.","If the budget increased, we could hire a second developer."], a:3,
     e:["“Would” is never used in the “if” clause of a conditional sentence.",
        "“Increase” lacks the third person ending, so the verb does not agree with the singular subject.",
        "“Will” cannot appear in the “if” clause of a conditional.",
        "Correct. The second conditional uses the past simple after “if” with “could” in the main clause."]},
    {q:"We ______ postpone the kick-off if the room is not available, but nothing is decided yet.",
     o:["must","could","have to","should to"], a:1,
     e:["“Must” expresses a strong obligation, which contradicts the fact that nothing is decided.",
        "Correct. “Could” plus the bare infinitive presents one possible option among others.",
        "“Have to” states an external obligation, not an open possibility.",
        "“Should” is never followed by “to” before the infinitive."]}
   ]},
   {t:"Part 5 · Comparatives, Superlatives & Frequency", q:[
    {q:"This method is ______ than the one we used last year.",
     o:["more efficient","efficienter","the most efficient","most efficient"], a:0,
     e:["Correct. Long adjectives form the comparative with “more” before the adjective and “than” after it.",
        "“Efficient” is a long adjective, so it cannot take the ending “-er”.",
        "A superlative cannot be used with “than” in this comparison of two things.",
        "“Most efficient” without “the” is not a comparative form and does not go with “than”."]},
    {q:"The kick-off meeting was ______ day of the whole week.",
     o:["a busier","busier","most busy","the busiest"], a:3,
     e:["A comparative with “a” cannot express that something is the top of a group.",
        "A comparative needs “than” and does not single out one element of a group.",
        "“Most busy” is not the standard superlative of this short adjective and is missing “the”.",
        "Correct. The superlative of a short adjective takes “the” plus the “-est” ending."]},
    {q:"Our new timeline is not ______ the one the client suggested.",
     o:["as realistic as","so realistic than","as realistic than","more realistic as"], a:0,
     e:["Correct. The structure “as … as” compares two things and works in the negative too.",
        "“So … than” mixes two structures; “so” must be followed by “as” in a negative comparison.",
        "The structure “as … as” cannot end with “than”.",
        "A comparative with “more” must be followed by “than”, not “as”."]},
    {q:"The second prototype is ______ better than the first one.",
     o:["very","too","far","absolutely"], a:2,
     e:["“Very” cannot intensify a comparative form such as “better”.",
        "“Too” means more than is acceptable and does not strengthen a comparative.",
        "Correct. “Far” is an intensifier that can be placed before a comparative.",
        "“Absolutely” goes with extreme adjectives, not with comparative forms."]},
    {q:"We ______ start the week with a short team briefing.",
     o:["always","are always","always are","always to"], a:0,
     e:["Correct. An adverb of frequency goes before the main verb in the present simple.",
        "Adding “are” creates a double verb, because “start” is already the main verb.",
        "“Are” is not needed here and the word order with the adverb is impossible.",
        "A main verb in the present simple is never preceded by “to”."]},
    {q:"The project manager is ______ late for the Monday meeting.",
     o:["never is","hardly never","rarely","rare"], a:2,
     e:["Repeating the verb “is” after the adverb creates an impossible structure.",
        "“Hardly never” is a double negative; English uses “hardly ever”.",
        "Correct. An adverb of frequency comes after the verb “be” and before the adjective.",
        "“Rare” is an adjective and cannot describe how often something happens."]},
    {q:"This planning document is ______ long for a first presentation.",
     o:["enough","very much","so much","too"], a:3,
     e:["“Enough” follows the adjective and means a sufficient amount, not an excessive one.",
        "“Very much” cannot be placed directly before an adjective in this position.",
        "“So much” goes with nouns or verbs, not directly before an adjective like this.",
        "Correct. “Too” before an adjective means more than is acceptable."]},
    {q:"The tool is not simple ______ for the whole team to use without training.",
     o:["too","enough","so","much"], a:1,
     e:["“Too” is placed before the adjective, not after it.",
        "Correct. “Enough” is placed after the adjective to say whether something is sufficient.",
        "“So” comes before the adjective and does not express a sufficient degree.",
        "“Much” cannot follow an adjective to express sufficiency."]},
    {q:"Choose the correct sentence.",
     o:["He goes often to the client’s office.","Often he is going to the client’s office.","He often goes to the client’s office.","He goes to often the client’s office."], a:2,
     e:["The adverb of frequency should not be placed between the main verb and the rest of the sentence here.",
        "Starting with the adverb plus a continuous form does not express a regular habit correctly.",
        "Correct. An adverb of frequency is placed between the subject and the main verb.",
        "Placing the adverb after the preposition breaks the word order of the sentence."]},
    {q:"Of all the solutions we tested, this one was by far ______ solution to implement.",
     o:["easier","more easy","the easiest","easiest"], a:2,
     e:["A comparative cannot be used to select one item out of a whole group.",
        "“Easy” is a short adjective and does not form its comparative with “more”.",
        "Correct. The superlative with “the” plus the “-est” ending singles out one item in a group.",
        "The superlative form needs the article “the” before it in this sentence."]}
   ]}
  ]
},
{
  id: 32, name: "BAC+3 · Test 2", theme: "Describing my company",
  parts: [
   {t:"Part 1 · Present Perfect", q:[
    {q:"Our company ______ in Lyon since 1998.",
     o:["is based","was based","has been based","is being based"], a:2,
     e:["The present simple states a current fact but cannot be used with “since” plus a starting point.",
        "The past simple cuts the link with the present, while “since 1998” runs up to today.",
        "Correct. With “since” plus a point in time, English uses the present perfect to connect past and present.",
        "The present continuous suggests a temporary action in progress, which does not fit a permanent location."]},
    {q:"We ______ our new logo last March.",
     o:["launched","have launched","have been launching","are launching"], a:0,
     e:["Correct. A finished time expression such as “last March” requires the past simple.",
        "The present perfect cannot be combined with a finished past time such as “last March”.",
        "The present perfect continuous describes an activity continuing until now, not one finished event.",
        "The present continuous refers to now or to a future plan, not to last March."]},
    {q:"______ you ever visited our production site in Poland?",
     o:["Did","Do","Are","Have"], a:3,
     e:["After “did” the verb must be in the base form, so this auxiliary cannot go with “visited”.",
        "“Do” also requires the base form “visit” and cannot build a perfect question.",
        "“Are” goes with -ing forms or passives, not with a past participle like this.",
        "Correct. “Ever” asking about experience up to now takes the present perfect: have plus past participle."]},
    {q:"The R&D department ______ on this prototype for six months.",
     o:["works","has been working","is working since","has work"], a:1,
     e:["The present simple states a habit and cannot express a duration reaching the present.",
        "Correct. The present perfect continuous expresses an activity that started earlier and is still going on.",
        "“Since” is followed by a starting point, never by a duration such as six months, and the tense is wrong too.",
        "“Has work” is an impossible form: the perfect needs the past participle “worked”."]},
    {q:"I ______ met the new quality manager yet.",
     o:["haven’t","didn’t","don’t have","am not"], a:0,
     e:["Correct. “Yet” in a negative sentence goes with the present perfect: haven’t plus past participle.",
        "After “didn’t” the verb must be in the base form, and the past simple does not take “yet” here.",
        "“Don’t have met” mixes the present simple of “have” with a participle and is not a possible form.",
        "“Am not met” would be a passive form and cannot describe your own experience."]},
    {q:"The company ______ three new subsidiaries since the merger.",
     o:["opens","opened","has opened","is opening"], a:2,
     e:["The present simple describes routines, not a result counted from a past event up to now.",
        "The past simple would need a finished time expression, but “since the merger” reaches the present.",
        "Correct. The present perfect reports completed actions inside a period that is still open.",
        "The present continuous shows one action in progress and cannot count three finished openings."]},
    {q:"Choose the correct sentence.",
     o:["We work here since 2019.","We have worked here since 2019.","We are working here since 2019.","We worked here since 2019."], a:1,
     e:["The present simple is never used with “since”; this is the classic French-speaker mistake.",
        "Correct. “Since” plus a date needs the present perfect to link 2019 to today.",
        "The present continuous describes a temporary action now and does not take “since” plus a date.",
        "The past simple is not used with “since”, and it would suggest the situation is over."]},
    {q:"How long ______ the group owned this factory?",
     o:["does","is","did","has"], a:3,
     e:["“Does” requires the base form “own”, not the past participle “owned”.",
        "“Is owned” would be a passive and cannot express a duration continuing until now.",
        "“Did” also needs the base form and would close the period in the past.",
        "Correct. “How long” about a situation continuing now takes the present perfect: has plus past participle."]},
    {q:"The maintenance team ______ the main line twice this week.",
     o:["has repaired","repaired","repairs","is repairing"], a:0,
     e:["Correct. “This week” is an unfinished period, so the present perfect is used.",
        "The past simple needs a finished period such as “last week”.",
        "The present simple expresses a general habit, not two repairs already completed.",
        "The present continuous shows one action in progress, so it cannot count two finished repairs."]},
    {q:"Our logistics manager ______ in Germany for two years, and she is still there.",
     o:["lived","is living","has lived","was living"], a:2,
     e:["The past simple would mean she has left Germany, which the second clause contradicts.",
        "The present continuous cannot carry a duration counted from the past with “for”.",
        "Correct. The present perfect with “for” gives the duration of a situation that continues now.",
        "The past continuous describes a background action in the past, not a situation that is still true."]}
   ]},
   {t:"Part 2 · Past Tenses & Continuous Forms", q:[
    {q:"While the visitors ______ the assembly line, the alarm went off.",
     o:["toured","were touring","have toured","tour"], a:1,
     e:["The past simple presents a finished event, but “while” here introduces the longer background action.",
        "Correct. The past continuous gives the action in progress that a shorter event interrupted.",
        "The present perfect connects to the present and cannot describe an interrupted past action.",
        "The present simple does not fit a past narrative built around “went off”."]},
    {q:"The power ______ while we were presenting the new product range.",
     o:["was failing","fails","has failed","failed"], a:3,
     e:["Two past continuous forms would mean two parallel actions; here a short event cuts into a longer one.",
        "The present simple cannot be used in a sentence clearly set in the past.",
        "The present perfect links to now, while this event belongs to a finished past moment.",
        "Correct. The sudden short event takes the past simple and the background takes the past continuous."]},
    {q:"Our founder ______ the company in 1986 with only four employees.",
     o:["founded","was founding","has founded","founds"], a:0,
     e:["Correct. A single finished action with a past date takes the past simple.",
        "The past continuous suggests an action in progress, which does not suit one act of creation.",
        "The present perfect is impossible with the finished date 1986.",
        "The present simple cannot describe an event that happened in 1986."]},
    {q:"When I joined the firm, the marketing team ______ a new website.",
     o:["built","builds","was building","has built"], a:2,
     e:["The past simple would mean the building started after I joined, not around that moment.",
        "The present simple does not fit a sentence set in the past.",
        "Correct. The past continuous describes a situation already in progress when another event happened.",
        "The present perfect connects to the present and breaks the past time frame."]},
    {q:"The rain ______ heavily when the delegation arrived at the plant.",
     o:["fell","has fallen","falls","was falling"], a:3,
     e:["The past simple makes the rain a short event, but here it is the background to the arrival.",
        "The present perfect links the rain to now, which contradicts the past arrival.",
        "The present simple describes general truths, not a scene in the past.",
        "Correct. The past continuous sets the background scene around a shorter past event."]},
    {q:"Choose the correct sentence.",
     o:["While she wrote the report, the client was calling.","While she was writing the report, the client called.","While she was writing the report, the client was calling her twice.","While she wrote the report, the client called suddenly."], a:1,
     e:["The tenses are reversed: the long background action is in the simple and the short event in the continuous.",
        "Correct. “While” plus the past continuous gives the background, and the interrupting event takes the past simple.",
        "“Twice” counts completed calls, so the past continuous is impossible there.",
        "After “while” English normally uses the past continuous for the longer action, not the past simple."]},
    {q:"They ______ not expecting so many questions during the factory tour.",
     o:["did","was","were","have"], a:2,
     e:["“Did not expecting” is impossible, because “did” must be followed by the base form.",
        "“Was” does not agree with the plural subject “they”.",
        "Correct. The past continuous of a plural subject is were plus the -ing form.",
        "“Have not expecting” is not a possible form; the perfect needs a past participle."]},
    {q:"What ______ you doing when the fire drill started?",
     o:["were","did","are","have"], a:0,
     e:["Correct. A past continuous question is formed with were plus subject plus the -ing form.",
        "“Did you doing” is impossible, because “did” takes the base form “do”.",
        "“Are” puts the question in the present, which clashes with “started”.",
        "“Have you doing” is not a possible form; the perfect needs the participle “done”."]},
    {q:"The technician ______ the machine three times yesterday afternoon.",
     o:["was restarting","has restarted","restarting","restarted"], a:3,
     e:["The past continuous cannot count three completed repetitions.",
        "The present perfect is blocked by the finished time expression “yesterday afternoon”.",
        "“Restarting” alone has no auxiliary, so the sentence has no finite verb.",
        "Correct. Finished, counted actions at a stated past time take the past simple."]},
    {q:"As the director ______ the company history, a journalist took notes.",
     o:["explained","was explaining","has explained","explains"], a:1,
     e:["The past simple would present the explanation as one short event, not as the ongoing frame.",
        "Correct. The past continuous describes the longer action during which another action happened.",
        "The present perfect connects to the present, but “took” places the scene in the past.",
        "The present simple cannot be mixed with the past simple “took” in the same narrative."]}
   ]},
   {t:"Part 3 · Relative Pronouns", q:[
    {q:"The colleague ______ showed you the workshop is our site manager.",
     o:["who","which","whose","whom"], a:0,
     e:["Correct. “Who” is the relative pronoun used as subject when it refers to a person.",
        "“Which” refers to things or animals, never to a person.",
        "“Whose” expresses possession and must be followed by a noun.",
        "“Whom” is an object form and cannot be the subject of “showed”."]},
    {q:"This is the department ______ designs all our packaging.",
     o:["who","whose","which","where"], a:2,
     e:["“Who” refers to people, and a department is treated as a thing here.",
        "“Whose” shows possession and needs a noun directly after it.",
        "Correct. “Which” is the subject relative pronoun used for things.",
        "“Where” replaces a place expression and cannot be the subject of “designs”."]},
    {q:"The engineer ______ team redesigned the pump has been promoted.",

        "Correct. “Whose” plus a noun expresses possession, like the French “dont”.",

        "“Which” refers to things and cannot show possession before a noun."]},
    {q:"This is the room ______ we welcome our customers.",

        "“That” leaves the sentence without the idea of place and without the required preposition.",
        "“When” refers to time, not to a place.",
        "Correct. “Where” replaces a place expression such as “in the room”."]},
    {q:"Friday is the day ______ the whole factory stops for maintenance.",
     o:["where","which","when","whose"], a:2,
     e:["“Where” refers to places, and a day is not a place.",
        "“Which” would have to be subject or object, or follow a preposition, which is not the case here.",
        "Correct. “When” is the relative adverb used after a noun expressing time.",
        "“Whose” shows possession and must be followed by a noun."]},
    {q:"Our Italian plant, ______ produces the engines, will be enlarged.",
     o:["which","that","who","where"], a:0,
     e:["Correct. In a non-defining clause between commas, only “which” is possible for things.",
        "“That” is never used in a non-defining clause after a comma.",
        "“Who” refers to people, not to a plant.",
        "“Where” replaces a place expression and cannot be the subject of “produces”."]},
    {q:"Choose the correct sentence (in each one a relative pronoun has been left out).",
     o:["The team works upstairs handles exports.","The manager signed the contract is away.","The machine broke down is Italian.","The supplier we met yesterday is German."], a:3,
     e:["The missing pronoun was the subject of “works”, and a subject pronoun can never be dropped.",
        "The missing pronoun was the subject of “signed”, so it has to be kept.",

        "Correct. The pronoun was the object of “met”, and object pronouns in defining clauses can be left out."]},
    {q:"The products ______ we sell in Asia are made in Spain.",

        "“Where” replaces a place expression, but the place “Asia” is already expressed."]},
    {q:"Mr Lemoine, ______ welcomed you at reception, runs the quality department.",
     o:["which","what","who","whose"], a:2,
     e:["“Which” refers to things and cannot replace a person.",
        "“What” is never a relative pronoun after a noun in English.",
        "Correct. “Who” refers to a person and is the subject of “welcomed” in this non-defining clause.",
        "“Whose” shows possession and needs a noun directly after it."]},
    {q:"Choose the correct sentence.",
     o:["The supplier I called this morning has confirmed the delivery.","The supplier what I called this morning has confirmed the delivery.","The supplier, that I called this morning, has confirmed the delivery.","The supplier who I called him this morning has confirmed the delivery."], a:0,
     e:["Correct. The object pronoun of a defining relative clause can be omitted.",
        "“What” cannot introduce a relative clause after a noun.",
        "“That” is impossible in a clause placed between commas.",
        "The object is already expressed by the relative pronoun, so the extra “him” must disappear."]}
   ]},
   {t:"Part 4 · Conditionals & Advanced Modals", q:[
    {q:"If the client confirms the order, we ______ production next week.",
     o:["started","will start","would start","start"], a:1,
     e:["The past simple does not fit a real condition about the future.",
        "Correct. In the first conditional the if-clause is present simple and the main clause uses will.",
        "“Would” belongs to the second conditional, used for unreal situations.",
        "The present simple in the main clause would turn this into a general rule, not a future plan."]},
    {q:"If a machine stops, the supervisor ______ an alert on his tablet.",
     o:["is receive","would receive","is receiving","receives"], a:3,
     e:["“Is receive” is impossible: “be” cannot be followed by a base verb.",
        "“Would” signals an unreal situation, which contradicts this automatic process.",
        "The present continuous describes an action happening now, not a general rule.",
        "Correct. The zero conditional uses the present simple in both clauses for things that are always true."]},
    {q:"If we had a bigger warehouse, we ______ more stock.",
     o:["will keep","keep","would keep","kept"], a:2,
     e:["“Will” belongs to the first conditional, but “had” here signals an unreal present.",
        "The present simple would make this a general truth instead of a hypothesis.",
        "Correct. The second conditional pairs a past simple if-clause with would plus the base form.",
        "A second past simple in the main clause cannot express the hypothetical result."]},
    {q:"If I ______ the budget, I would modernise the whole line.",
     o:["had","have","would have","am having"], a:0,
     e:["Correct. The second conditional uses the past simple in the if-clause for an imaginary present.",
        "The present simple announces a real condition, which clashes with “would modernise”.",
        "“Would” is not used in the if-clause of a standard conditional.",
        "The present continuous cannot express an imaginary situation after “if” here."]},
    {q:"We ______ the visit if the weather is bad.",
     o:["cancelled","would cancel","are cancel","will cancel"], a:3,
     e:["The past simple does not match a real condition about the future.",
        "“Would” makes the situation unreal, but “is” presents a real possibility.",
        "“Are cancel” is an impossible form, since “be” cannot be followed by a base verb.",
        "Correct. First conditional: present simple after “if” and will in the main clause."]},
    {q:"You ______ wear safety shoes before entering the workshop.",
     o:["had better to","had better","would better","better had"], a:1,
     e:["“Had better” is followed by the base form without “to”.",
        "Correct. “Had better” plus the base form gives strong advice or a warning.",
        "“Would better” does not exist in English.",
        "The word order is wrong, because “had” comes before “better”."]},
    {q:"The brochure ______ mention our new service.",
     o:["ought","should to","ought to","must to"], a:2,
     e:["“Ought” always needs “to” before the verb.",
        "“Should” is followed by the base form without “to”.",
        "Correct. “Ought to” plus the base form expresses what is advisable or expected.",
        "“Must” is never followed by “to”."]},
    {q:"The director isn’t in her office; she ______ be with the auditors.",
     o:["can","musts","should to","might"], a:3,
     e:["“Can” expresses ability or permission, not a guess about the present.",
        "“Musts” is impossible, because modal verbs never take an -s.",
        "“Should” is never followed by “to” before the verb.",
        "Correct. “Might” expresses a possibility the speaker is not sure about."]},
    {q:"______ I show you our showroom before lunch?",
     o:["May","Might to","Am","Ought"], a:0,
     e:["Correct. “May” plus the base form is the polite way to offer or to ask permission.",
        "Modal verbs are never followed by “to” in this structure.",
        "“Am” would need an -ing form or a passive, not a base verb.",
        "“Ought” requires “to” and is used for advice, not for an offer."]},
    {q:"If you ______ the red button, the conveyor stops immediately.",
     o:["will press","press","would press","pressed"], a:1,
     e:["“Will” is not used after “if” in a conditional of this type.",
        "Correct. The zero conditional uses the present simple in the if-clause for an automatic result.",
        "“Would” after “if” is not possible in a standard conditional.",
        "The past simple would create a second conditional, which does not match “stops”."]}
   ]},
   {t:"Part 5 · Comparatives, Superlatives & Frequency", q:[
    {q:"Our Spanish subsidiary is ______ than the French one.",
     o:["more big","the biggest","bigger","as big"], a:2,
     e:["Short adjectives form the comparative with -er, not with “more”.",
        "A superlative can never be followed by “than”.",
        "Correct. One-syllable adjectives take -er before “than”.",
        "“As big” must be followed by “as”, not by “than”."]},
    {q:"This is ______ product in our whole catalogue.",
     o:["the most expensive","the expensivest","more expensive","most expensive than"], a:0,
     e:["Correct. Long adjectives form the superlative with “the most”.",
        "“Expensive” is too long to take the ending -est.",
        "The comparative compares two items and would need “than”.",
        "A superlative is never followed by “than”."]},
    {q:"The new press is not as noisy ______ the old one.",
     o:["than","that","like","as"], a:3,
     e:["“Than” is used only after a comparative form.",
        "“That” cannot introduce the second part of a comparison of equality.",
        "“Like” is followed by a noun but cannot complete the structure as … as.",
        "Correct. The structure is as plus adjective plus as, including in the negative."]},
    {q:"Our delivery times are ______ shorter than they were in 2020.",
     o:["very","much","so","too"], a:1,
     e:["“Very” cannot strengthen a comparative form.",
        "Correct. “Much”, like “far” or “a lot”, is the intensifier used before a comparative.",
        "“So” intensifies a simple adjective, not a comparative followed by “than”.",
        "“Too” means more than necessary and does not fit a comparison with “than”."]},
    {q:"The meeting room is ______ small for the whole team.",
     o:["too","enough","so much","very too"], a:0,
     e:["Correct. “Too” plus an adjective expresses an excess that creates a problem.",
        "“Enough” comes after the adjective and would reverse the meaning.",
        "“So much” goes with nouns or verbs, not directly before an adjective.",
        "“Very” and “too” cannot be combined before an adjective."]},
    {q:"The prototype isn’t light ______ to be carried by one person.",
     o:["too","so","enough","much"], a:2,
     e:["“Too” is placed before the adjective, never after it.",
        "“So” cannot follow the adjective and cannot introduce “to” plus infinitive here.",
        "Correct. “Enough” comes after the adjective and before “to” plus the infinitive.",
        "“Much” strengthens comparatives and cannot stand after this adjective."]},
    {q:"I ______ visit the Italian site; I go there about twice a year.",
     o:["never","always","am rarely","rarely"], a:3,
     e:["“Never” means zero times, which contradicts the two visits a year.",
        "“Always” means every time, which does not match twice a year.",
        "With a main verb such as “visit”, the frequency adverb takes no form of “be”.",
        "Correct. “Rarely” matches two visits a year and is placed before the main verb."]},
    {q:"Our quality team ______ late when a big order arrives.",
     o:["works often","often works","work often","is often work"], a:1,
     e:["The frequency adverb must come before the main verb, not after it.",
        "Correct. Adverbs of frequency are placed between the subject and the main verb.",
        "The adverb is misplaced: a frequency adverb goes before the main verb.",
        "“Is work” is an impossible combination of “be” and a base verb."]},
    {q:"The results were ______ impossible to predict.",
     o:["absolutely","very much","far","the most"], a:0,
     e:["Correct. Ungradable adjectives such as “impossible” take “absolutely” or “completely”.",
        "“Very much” is not used directly before an adjective.",
        "“Far” strengthens only comparatives and superlatives.",
        "“The most” builds a superlative, which this sentence does not contain."]},
    {q:"Our site in Tours is ______ the most modern in the group.",
     o:["more","very","by far","too"], a:2,
     e:["“More” cannot be added in front of a superlative.",
        "“Very” cannot strengthen a superlative formed with “the most”.",
        "Correct. “By far” is the usual intensifier placed before a superlative.",
        "“Too” expresses an excess and cannot modify a superlative."]}
   ]}
  ]
},
{
  id: 33, name: "BAC+3 · Test 3", theme: "Applying for a job",
  parts: [
   {t:"Part 1 · Present Perfect", q:[
    {q:"I ______ my CV to four engineering companies since the beginning of September.",
     o:["sent","have sent","am sending","was sending"], a:1,
     e:["The past simple needs a finished time reference, but “since September” connects the action to now.",
        "Correct. The present perfect is used with “since” to count actions in a period that is still open.",
        "The present continuous describes an action happening at this moment, not four completed actions.",
        "The past continuous describes an action in progress in the past and does not fit “since September”."]},
    {q:"The recruiter ______ me last Thursday at ten o’clock.",
     o:["called","has been calling","is calling","has called"], a:0,
     e:["Correct. “Last Thursday” is a finished past time, so the past simple is required.",
        "The present perfect continuous suggests a duration continuing until now, which “last Thursday” excludes.",
        "The present continuous refers to now or to a plan, not to a past Thursday.",
        "The present perfect is impossible with a finished time expression such as “last Thursday”."]},
    {q:"______ you ever ______ a job interview in English?",
     o:["Do / had","Did / had","Have / had","Have / have"], a:2,
     e:["“Do” cannot be followed by a past participle; it takes the base form.",
        "“Had” is a past form and cannot follow the auxiliary “did”.",
        "Correct. “Ever” with life experience takes the present perfect: have + past participle “had”.",
        "The auxiliary is right but “have” is not the past participle needed after “have”."]},
    {q:"She ______ for a position in logistics for three months now.",
     o:["is looking","has been looking","looks","looked"], a:1,
     e:["The present continuous cannot express a duration starting in the past with “for three months now”.",
        "Correct. The present perfect continuous expresses an action that started in the past and is still going on.",
        "The present simple describes habits or general truths, not a period measured up to now.",
        "The past simple would close the period, but “now” shows the search continues."]},
    {q:"We can’t shortlist him: he ______ the application form ______.",
     o:["hasn’t returned / still","doesn’t return / yet","hasn’t returned / yet","didn’t return / already"], a:2,
     e:["“Still” does not go at the end of the sentence in this structure; it comes before the negative auxiliary.",
        "The present simple cannot describe a result that affects the present situation in this way.",
        "Correct. “Yet” in a negative present perfect sentence means the action is expected but has not happened.",
        "“Already” is for something that has happened, so it contradicts a negative sentence."]},
    {q:"Choose the correct sentence.",
     o:["I have worked in this department since 2023.","I worked in this department since 2023.","I work in this department since 2023.","I am working in this department since 2023."], a:0,
     e:["Correct. A period that begins in the past and continues now takes the present perfect with “since”.",
        "The past simple with “since” suggests the job is over, which contradicts the meaning.",
        "The present simple cannot be used with “since”, even though French uses the present here.",
        "The present continuous is also impossible with “since” to express a period up to now."]},
    {q:"The HR manager ______ just ______ the candidate a second interview.",
     o:["is / offering","had / offer","have / offered","has / offered"], a:3,
     e:["“Just” in this position does not combine with the present continuous to mean a recent completed action.",
        "After “had” the verb must be a past participle, not the base form, and the past perfect needs a past reference.",
        "“Have” does not agree with the singular subject “the HR manager”.",
        "Correct. “Just” with a very recent action takes the present perfect: has + past participle."]},
    {q:"How long ______ your internship ______?",
     o:["did / lasted","has / lasted","is / lasting","has / last"], a:1,
     e:["After “did” the verb must be in the base form “last”, not the past form.",
        "Correct. “How long” about a situation continuing until now uses the present perfect.",
        "The present continuous does not express a duration measured from the past to the present.",
        "After “has” the verb must be in the past participle form, not the base form."]},
    {q:"They ______ the salary range in the advert, so applicants know what to expect.",
     o:["have already mentioned","already mentioned yesterday","are already mentioning","had already mentioned"], a:0,
     e:["Correct. The present perfect with “already” links a completed action to its present result.",
        "“Yesterday” is a finished time marker that does not fit a result valid now in this sentence.",
        "The present continuous describes an action in progress, not a completed mention in the advert.",
        "The past perfect needs an earlier past reference point, and there is none here."]},
    {q:"I ______ never ______ of that recruitment agency before today.",
     o:["was / heard","did / hear","have / heard","am / hearing"], a:2,
     e:["“Was heard” is a passive form, so the sentence would mean that nobody heard the speaker.",
        "“Did” cannot be followed by a past participle, and “never … before” points to experience up to now.",
        "Correct. “Never” for life experience up to the present takes the present perfect.",
        "“Hear” is not normally used in the continuous, and the meaning here is experience, not progress."]}
   ]},
   {t:"Part 2 · Past Tenses & Continuous Forms", q:[
    {q:"While I ______ my cover letter, the recruiter ______ me.",
     o:["was writing / was phoning","wrote / phoned","wrote / was phoning","was writing / phoned"], a:3,
     e:["Two past continuous forms would mean both actions lasted together, but one clearly interrupts the other.",
        "Two past simple forms suggest a sequence, not one action interrupting another in progress.",
        "The longer background action needs the continuous, and the short interrupting action the past simple.",
        "Correct. The past continuous gives the background action and the past simple the action that interrupts it."]},
    {q:"When the interview ______, the candidate ______ visibly nervous.",
     o:["started / was looking","started / looked","was starting / was looking","was starting / looked"], a:1,
     e:["“Look” in the sense of appearance is a state verb and is not normally used in the continuous.",
        "Correct. Both the point in time and the state use the past simple here.",
        "Neither verb works in the continuous: one is a single event and the other describes an appearance.",
        "The start of the interview is a single point in time, so the continuous is not appropriate."]},
    {q:"I ______ for the tram when I ______ that I had forgotten my portfolio.",
     o:["was waiting / realised","waited / was realising","was waiting / was realising","waited / realised"], a:0,
     e:["Correct. The past continuous sets the ongoing situation and the past simple gives the sudden realisation.",
        "“Realise” is a mental state verb and is not used in the continuous in this meaning.",
        "The second verb cannot be continuous, as realising is a sudden mental event.",
        "The past simple for “wait” loses the idea of an action in progress interrupted by a thought."]},
    {q:"At three o’clock yesterday the whole panel ______ applications in the meeting room.",
     o:["have reviewed","review","reviewed","were reviewing"], a:3,
     e:["The present perfect cannot be used with the finished time marker “yesterday”.",
        "The present simple cannot describe a specific moment in the past.",
        "The past simple would present the review as a complete event, not as what was happening at that exact time.",
        "Correct. The past continuous describes an action in progress at a precise past moment."]},
    {q:"Choose the correct sentence.",
     o:["He dropped his coffee while he was shaking the recruiter’s hand.","He was dropping his coffee while he shook the recruiter’s hand.","He drops his coffee while he was shaking the recruiter’s hand.","He was dropping his coffee while he was shaking the recruiter’s hand."], a:0,
     e:["Correct. The short event takes the past simple and the longer background action the past continuous.",
        "The tenses are the wrong way round: the handshake is the background, not the sudden event.",
        "Mixing the present simple with a past continuous clause is not possible in one past narrative.",
        "Dropping something is instantaneous, so the continuous does not suit the first verb."]},
    {q:"The candidates ______ in the corridor while the jury ______ about the first interview.",
     o:["waited / was talking","were waiting / talked","waited / talked","were waiting / was talking"], a:3,
     e:["The first verb should also be continuous, since both actions last through the same period.",
        "The second verb should also be continuous, since the discussion was going on at the same time.",
        "Two past simple forms do not show two actions going on at the same time.",
        "Correct. Two past continuous forms show two parallel actions in progress at the same moment."]},
    {q:"She ______ her degree in 2024 and ______ a graduate scheme the same year.",
     o:["finished / joined","finished / was joining","was finishing / joined","was finishing / was joining"], a:0,
     e:["Correct. Two finished past events in sequence both take the past simple.",
        "The second verb is a completed event in 2024, not an action in progress.",
        "The first verb is a completed event, so the continuous is not appropriate.",
        "Both verbs are completed events in a finished year, so the continuous is not used."]},
    {q:"______ you ______ notes when the manager explained the job description?",
     o:["Was / taking","Were / taking","Have / taken","Did / taking"], a:1,
     e:["“Was” does not agree with the subject “you”, which takes “were”.",
        "Correct. The past continuous question asks about an action in progress during another past action.",
        "The present perfect cannot refer to a specific finished past moment introduced by “when”.",
        "“Did” must be followed by the base form, never by an -ing form."]},
    {q:"The office was quiet: the phones ______ and nobody ______ in the open space.",
     o:["didn’t ring / moved","weren’t ringing / was moving","weren’t ringing / moved","didn’t ring / was moving"], a:1,
     e:["The past simple describes events rather than the scene in progress that the sentence is painting.",
        "Correct. Both verbs describe the background scene in progress, so the past continuous is used twice.",
        "The second verb should also be continuous, as it belongs to the same description of the scene.",
        "The first verb should also be continuous, as the sentence describes the atmosphere at that moment."]},
    {q:"I ______ to explain my project when the interviewer ______ me a new question.",
     o:["was still trying / was asking","still tried / asked","was still trying / asked","still tried / was asking"], a:2,
     e:["Asking a question is a short event and cannot be presented as a parallel ongoing action here.",
        "The past simple with “still” does not express an action that was in progress and got cut short.",
        "Correct. The unfinished action takes the past continuous and the interruption the past simple.",
        "The question is a single short event, so it does not take the continuous here."]}
   ]},
   {t:"Part 3 · Relative Pronouns", q:[
    {q:"The engineer ______ interviewed me used to work in the same lab as my tutor.",
     o:["whose","whom","who","which"], a:2,
     e:["“Whose” shows possession and must be followed by a noun.",
        "“Whom” is an object pronoun, but here the pronoun is the subject of “interviewed”.",
        "Correct. “Who” is the relative pronoun for a person who is the subject of the relative clause.",
        "“Which” refers to things or animals, not to a person."]},
    {q:"I applied for the position ______ was advertised on the school careers page.",
     o:["whose","where","who","which"], a:3,
     e:["“Whose” expresses possession and needs a noun directly after it.",
        "“Where” introduces a place, not the subject of “was advertised”.",
        "“Who” is only used for people, and a position is a thing.",
        "Correct. “Which” is the relative pronoun for things and can be the subject of the clause."]},
    {q:"We hired a graduate ______ final-year project was about predictive maintenance.",
     o:["which","who","that","whose"], a:3,
     e:["“Which” does not express possession and is not used for a person.",
        "“Who” cannot be followed directly by a noun like “final-year project”.",
        "“That” cannot express possession before a noun in this way.",
        "Correct. “Whose” links a person to something belonging to them, here the project."]},
    {q:"That is the company ______ I did my second-year internship.",
     o:["when","which","where","who"], a:2,
     e:["“When” refers to a time, but the sentence identifies a place.",
        "“Which” would need a preposition, as in “at which”, to express the place of the internship.",
        "Correct. “Where” replaces a place expression such as “at that company”.",
        "“Who” refers to people, not to an organisation seen as a location."]},
    {q:"Do you remember the day ______ you received your first job offer?",
     o:["which","whose","where","when"], a:3,
     e:["“Which” alone cannot follow a time noun here; it would need “on which”.",
        "“Whose” expresses possession and must be followed by a noun.",
        "“Where” refers to a place, but “the day” is a time expression.",
        "Correct. “When” is the relative pronoun used after a noun expressing time."]},
    {q:"My supervisor, ______ has twenty years of experience, helped me prepare the interview.",
     o:["who","which","whom","that"], a:0,
     e:["Correct. A non-defining clause about a person uses “who”, never “that”.",
        "“Which” refers to things, not to a person.",
        "“Whom” is used as an object, but here the pronoun is the subject of “has”.",
        "“That” is never used in a non-defining clause between commas."]},
    {q:"Choose the correct sentence.",
     o:["The skills which I listed in my CV are all technical.","The skills whose I listed in my CV are all technical.","The skills where I listed in my CV are all technical.","The skills who I listed in my CV are all technical."], a:0,
     e:["Correct. “Which” refers to things and works as the object of “listed”.",
        "“Whose” expresses possession and must be followed by a noun.",
        "“Where” introduces a place, which does not fit “the skills”.",
        "“Who” is reserved for people, and skills are things."]},
    {q:"In which sentence can the relative pronoun be left out?",
     o:["The recruiter who signed my contract is on holiday.","The letter that arrived this morning is from HR.","The questions that the panel asked were quite technical.","The manager whose team I joined is on holiday."], a:2,
     e:["The pronoun is the subject of “signed”, so it cannot be omitted.",
        "The pronoun is the subject of “arrived”, so it must stay.",
        "Correct. The pronoun is the object of “asked”, and an object relative pronoun can be omitted.",
        "“Whose” shows possession and can never be left out."]},
    {q:"The training programme, ______ lasts six months, starts in January.",
     o:["that","which","who","where"], a:1,
     e:["“That” cannot be used in a non-defining clause placed between commas.",
        "Correct. A non-defining clause about a thing uses “which”.",
        "“Who” is only used for people.",
        "“Where” refers to a place, not to the subject of “lasts”."]},
    {q:"The two candidates ______ we met yesterday both have an engineering background.",
     o:["what","which","whose","who"], a:3,
     e:["“What” is not a relative pronoun after a noun in English.",
        "“Which” refers to things, not to candidates.",
        "“Whose” expresses possession and must be followed by a noun.",
        "Correct. “Who” refers to people and works here as the object of “met”."]}
   ]},
   {t:"Part 4 · Conditionals & Advanced Modals", q:[
    {q:"If you ______ the deadline, your application is automatically rejected.",
     o:["miss","would miss","missed","will miss"], a:0,
     e:["Correct. The zero conditional uses the present simple in both clauses for a general rule.",
        "“Would” belongs to the result clause of the second conditional, not to the “if” clause.",
        "The past simple would create a hypothetical meaning, but this is a general fact.",
        "“Will” is not used in the “if” clause of a conditional sentence."]},
    {q:"If they offer me the job, I ______ it immediately.",
     o:["accept","will accept","would accept","accepted"], a:1,
     e:["The present simple in the result clause would turn this into a general rule, not a future decision.",
        "Correct. The first conditional uses “will” in the result clause for a real future possibility.",
        "“Would” expresses an imaginary situation, which does not match the real possibility here.",
        "The past simple does not express a future consequence."]},
    {q:"If I ______ more fluent in English, I would apply for the position in Dublin.",
     o:["were","have been","am","will be"], a:0,
     e:["Correct. The second conditional uses the past form, and “were” is standard after “if I”.",
        "The present perfect does not express an imaginary present condition.",
        "The present simple makes the condition real, but the result clause with “would” requires a hypothesis.",
        "“Will” is not used in the “if” clause of this type of conditional."]},
    {q:"If the company ______ my travel costs, I would accept the internship in Lyon.",
     o:["has paid","pays","paid","will pay"], a:2,
     e:["The present perfect does not express a hypothetical condition.",
        "The present simple would create a first conditional, which does not match “would accept”.",
        "Correct. The second conditional pairs a past form after “if” with “would” in the result.",
        "“Will” cannot follow “if” in a conditional sentence."]},
    {q:"You ______ send a thank-you email after the interview; recruiters appreciate it.",
     o:["should","would","will have to","might"], a:0,
     e:["Correct. “Should” gives advice or a recommendation.",
        "“Would” expresses a hypothesis or a polite offer, not advice.",
        "“Will have to” expresses a future obligation, which is stronger than the advice meant here.",
        "“Might” expresses possibility, not a recommendation."]},
    {q:"Your interview is at eight tomorrow, so you ______ leave home early.",
     o:["had better","would better","might better","should better"], a:0,
     e:["Correct. “Had better” plus the base form gives strong practical advice with a sense of urgency.",
        "“Would better” is not an existing structure in English.",
        "“Might better” is not a possible combination of modals.",
        "“Should better” is incorrect, as “should” and “better” are not combined."]},
    {q:"We don’t know yet, but the company ______ create two more positions next year.",
     o:["had better","must","may","ought to"], a:2,
     e:["“Had better” gives urgent advice, which does not fit an uncertain plan.",
        "“Must” expresses certainty or obligation, which contradicts “we don’t know yet”.",
        "Correct. “May” expresses a real but uncertain possibility.",
        "“Ought to” gives advice or expresses duty, not uncertainty."]},
    {q:"Choose the correct sentence.",
     o:["If I will have more experience, I would get the job.","If I have more experience, I would get the job.","If I would have more experience, I would get the job.","If I had more experience, I would get the job."], a:3,
     e:["“Will” is never used after “if” in a conditional sentence.",
        "The present simple after “if” does not match “would” in the result clause.",
        "“Would” cannot appear in the “if” clause of a conditional sentence.",
        "Correct. The second conditional is “if” plus a past form, with “would” in the result clause."]},
    {q:"If candidates ______ not understand a question, they ______ always ask for it to be repeated.",
     o:["would / could","did / can","do / can","will / can"], a:2,
     e:["“Would” after “if” is impossible, and the sentence states a general rule, not a hypothesis.",
        "The past form creates a hypothesis that does not match the general advice in the result clause.",
        "Correct. The zero conditional uses the present simple after “if” and a general present modal in the result.",
        "“Will” cannot be used after “if” in a conditional sentence."]},
    {q:"You ______ to mention your volunteering experience; it shows real team spirit.",
     o:["had better","should","ought","might"], a:2,
     e:["“Had better” is followed by the base form, without “to”.",
        "“Should” is followed directly by the base form, without “to”.",
        "Correct. “Ought” is the only modal here that takes “to” before the infinitive.",
        "“Might” is followed by the base form, without “to”."]}
   ]},
   {t:"Part 5 · Comparatives, Superlatives & Frequency", q:[
    {q:"The second interview was ______ than the first one.",
     o:["difficulter","most difficult","the more difficult","more difficult"], a:3,
     e:["English does not add “-er” to long adjectives such as “difficult”.",
        "“Most difficult” is a superlative and cannot be followed by “than” in this sentence.",
        "The article “the” marks a superlative and does not go with a comparative plus “than”.",
        "Correct. Long adjectives form the comparative with “more” before the adjective."]},
    {q:"This is ______ job offer I have received so far.",
     o:["the better","the best","better","best"], a:1,
     e:["“Better” is a comparative and does not express the idea of “number one so far”.",
        "Correct. “The best” is the superlative of “good” and needs the definite article.",
        "A comparative without “than” cannot express a superlative meaning here.",
        "The superlative requires the article “the” before it in this position."]},
    {q:"My written English is almost ______ my spoken English.",
     o:["as good than","so good as","better as","as good as"], a:3,
     e:["“Than” is used with comparatives, never after “as good”.",
        "In an affirmative sentence the structure is “as … as”, not “so … as”.",
        "“Better” is followed by “than”, not by “as”.",
        "Correct. Equality between two things is expressed with “as + adjective + as”."]},
    {q:"The salary is lower than expected, but the position is ______ interesting.",
     o:["enough","too","far more","very more"], a:2,
     e:["“Enough” follows the adjective and does not create a comparison here.",
        "“Too” means more than acceptable and does not simply strengthen a comparison.",
        "Correct. “Far” is an intensifier used before a comparative such as “more interesting”.",

   {t:"Part 3 · Relative Pronouns", q:[

   {t:"Part 4 · Conditionals & Advanced Modals", q:[

    {q:"He ______ the apartment online, so the real thing was a shock.",

    {q:"While Léa ______ her keynote, the fire alarm went off.",
     o:["rehearsed","had rehearsed","was rehearsing","has rehearsed"], a:2,
     e:["The simple past would mean the rehearsal happened and finished; here it was interrupted.",
        "The past perfect would place the rehearsal before the alarm instead of around it.",

        "The present perfect is never used to narrate a specific past scene."]},
    {q:"She couldn’t pay for the taxi because she ______ her wallet at the hotel.",

     e:["The present simple can’t explain a past problem.",

        "The present perfect doesn’t fit a narrative already set in the past."]},
    {q:"They ______ in the queue for two hours when the consulate finally opened.",
     o:["waited","were waiting","had been waiting","have been waiting"], a:2,
     e:["The simple past gives no link with the moment the consulate opened.",

        "Correct. The past perfect continuous measures how long something had gone on before a past moment.",
        "The present perfect continuous measures duration up to now, not up to a past moment."]},
    {q:"He ______ the door and immediately knew something was wrong.",

        "The present perfect can’t be mixed into a past narrative."]},
    {q:"Before he moved to Texas, he ______ on the right-hand side of the road.",

     e:["The simple past doesn’t make the “before that moment” relationship explicit.",
        "Correct. The past perfect expresses experience up to a point in the past.",
        "The present perfect would mean “never in his life up to now”.",

    {q:"I ______ my emails when the immigration officer called my name.",

        "The past perfect would place it before the officer spoke, which loses the interruption.",
        "Correct. The past continuous sets the background action that gets interrupted.",
        "The present perfect doesn’t belong in a past narrative."]},
    {q:"After the investors ______, the team celebrated all night.",
     o:["were leaving","had left","have left","leave"], a:1,
     e:["The past continuous shows an action in progress, not one finished before the party.",
        "Correct. The past perfect marks the earlier of two past actions.",
        "The present perfect can’t be used in a past narrative.",
        "The present simple can’t report a past event."]},
    {q:"Halfway through the meeting she realised she ______ the same mistake twice.",
     o:["makes","was making","has made","had made"], a:3,

   {t:"Part 2 · Future Continuous & Future Forms", q:[
    {q:"This time tomorrow, I ______ over the Atlantic.",
     o:["fly","will fly","will be flying","am flying"], a:2,
     e:["The present simple is for timetables and habits, not a moment in progress tomorrow.",
        "“Will fly” states a future fact; it doesn’t show the action in progress at that exact time.",
        "Correct. The future continuous describes an action in progress at a precise future moment.",
        "The present continuous is for arrangements; “this time tomorrow” calls for an action in progress."]},
    {q:"Look at those clouds — it ______ .",
     o:["will rain","is going to rain","will be raining","rains"], a:1,
     e:["“Will” is for predictions with no present evidence, or decisions made while speaking.",
        "Correct. “Going to” is used for a prediction based on evidence you can see now.",
        "The future continuous would describe rain in progress at a stated future time.",
        "The present simple would describe a habit or a general fact, not this moment."]},
    {q:"According to the schedule, the shuttle ______ at 6:40.",
     o:["will leave","leaves","will be leaving","is leaving"], a:1,
     e:["“Will leave” sounds like a prediction or a decision, not a published timetable.",
        "Correct. The present simple is used for timetables and scheduled events.",
        "The future continuous describes an action in progress at a future moment.",
        "The present continuous is for personal arrangements, not official timetables."]},
    {q:"“My flight lands at eleven.” — “Don’t worry, I ______ you.”",
     o:["pick up","will pick up","am picking up","will be picking up"], a:1,
     e:["The present simple can’t express a decision about the future.",
        "Correct. “Will” expresses a decision made at the moment of speaking.",
        "The present continuous would mean the arrangement already existed before this conversation.",
        "The future continuous would describe the action in progress at a given time."]},
    {q:"By the end of the month, we ______ forty interviews.",
     o:["will finish","will be finishing","will have finished","finish"], a:2,
     e:["“Will finish” doesn’t express completion before a deadline.",
        "The future continuous shows an action in progress, not a finished total.",
        "Correct. The future perfect is used for something completed before a future point (“by…”).",
        "The present simple can’t express a future result."]},
    {q:"Don’t call at eight — we ______ dinner with Priya’s family.",
     o:["have","will have","are have","will be having"], a:3,
     e:["The present simple describes routines, not one specific evening.",
        "“Will have” states a future fact; here the point is being in the middle of dinner.",
        "This is not a possible verb form in English.",
        "Correct. The future continuous describes an action in progress at a stated time."]},
    {q:"At 10 a.m. tomorrow, the board ______ the budget.",
     o:["will be discussing","discusses","will have discussed","discussed"], a:0,
     e:["Correct. The future continuous describes an action in progress at a precise future time.",
        "The present simple would suggest a habit, not one specific meeting.",
        "The future perfect would mean the discussion is already over by 10 a.m.",
        "The simple past puts the meeting in the past, but “tomorrow” is in the future."]},
    {q:"I’ve made up my mind: I ______ my notice.",
     o:["will hand in","am going to hand in","hand in","will be handing in"], a:1,
     e:["“Will” suits a decision taken while speaking; this decision is already made.",
        "Correct. “Be going to” expresses an intention decided before the moment of speaking.",
        "The sentence needs a future form; the present simple can’t express an intention.",
        "The future continuous describes an action in progress at a future moment."]},
    {q:"Which sentence is in the future continuous?",
     o:["We will have moved by June.","We are moving in June.","We will be moving all through June.","We move in June."], a:2,
     e:["This is the future perfect: “will have” + past participle.",
        "This is the present continuous used for a future arrangement.",
        "Correct. “Will be” + -ing is the future continuous.",
        "This is the present simple used for a fixed schedule."]},
    {q:"I’ll email you as soon as I ______ the signed contract.",
     o:["will get","get","will be getting","am getting"], a:1,
     e:["After time words like “as soon as”, “when” and “until”, we don’t use “will”.",
        "Correct. The present simple follows a time conjunction, even when we talk about the future.",
        "Same problem: no future form after “as soon as”.",
        "The present continuous suggests an arrangement, which doesn’t fit this condition."]}
   ]},
   {t:"Part 3 · Reported Speech", q:[
    {q:"“Your English is improving,” she said. → She said that my English ______ .",
     o:["is improving","was improving","has improved","improves"], a:1,
     e:["This is the direct-speech tense; after a past reporting verb it normally shifts back.",
        "Correct. The present continuous becomes the past continuous.",
        "The present perfect changes the meaning and isn’t the backshift of “is improving”.",
        "The present simple loses the “in progress” idea and doesn’t backshift."]},
    {q:"“You can call me any time.” → He told me that I ______ call him any time.",
     o:["could","can","would","might"], a:0,
     e:["Correct. “Can” becomes “could” after a past reporting verb.",
        "“Can” is the direct-speech form; it needs to shift back.",
        "“Would” is the backshift of “will”, not of “can”.",
        "“Might” changes the meaning from permission to possibility."]},
    {q:"“Send me the file before noon.” → She told me ______ the file before noon.",
     o:["send","to send","sending","that send"], a:1,
     e:["A bare infinitive can’t follow “told me”.",
        "Correct. Reported orders use “tell somebody to do something”.",
        "The -ing form doesn’t follow “tell someone”.",
        "A “that” clause needs a subject and a full verb."]},
    {q:"“Do you like Austin?” → He asked me ______ Austin.",
     o:["do I like","if I liked","that I liked","if did I like"], a:1,
     e:["Reported questions don’t keep question word order or the auxiliary “do”.",
        "Correct. “If” + normal word order + backshift.",
        "“That” introduces reported statements, not questions.",
        "This mixes “if” with question word order and “did”."]},
    {q:"“Why are you leaving?” → She asked me why ______ .",
     o:["was I leaving","I was leaving","am I leaving","I leave"], a:1,
     e:["Reported questions use statement word order, without inversion.",
        "Correct. Subject before verb, with the tense shifted back.",
        "This keeps both the inversion and the present tense.",
        "The present simple loses the continuous meaning and the backshift."]},
    {q:"“I’ll review it tomorrow.” → He said he ______ it the next day.",
     o:["will review","would review","reviewed","had reviewed"], a:1,
     e:["“Will” must shift back after a past reporting verb.",
        "Correct. “Will” becomes “would”.",
        "The simple past loses the future meaning of the original.",
        "The past perfect would place the review before the moment of speaking."]},
    {q:"Choose the correct sentence.",
     o:["He said me he was tired.","He told me he was tired.","He told to me he was tired.","He said to me that tired."], a:1,
     e:["“Say” is not followed directly by a person.",
        "Correct. “Tell” takes a person immediately after it.",
        "“Tell” never takes “to” before the person.",
        "The final clause has no subject or verb."]},
    {q:"“Don’t reply to that email.” → She told me ______ to that email.",
     o:["to not reply","not to reply","don’t reply","no reply"], a:1,
     e:["The negative goes before “to”, not after it.",
        "Correct. Negative orders use “not to” + verb.",
        "A direct-speech imperative can’t follow “told me”.",
        "This is not a verb form."]},
    {q:"“We signed the contract yesterday.” → They said they ______ the contract the day before.",
     o:["signed","have signed","had signed","were signing"], a:2,
     e:["Without the backshift, the sequence with “the day before” sounds unnatural.",

        "Correct. A past simple in direct speech becomes a past perfect.",
        "The continuous changes the meaning to an action in progress."]},
    {q:"Priya still lives in Boston today. Which report sounds most natural?",
     o:["She said she lives in Boston.","She told she lives in Boston.","She said she had lived in Boston.","She said she would live in Boston."], a:0,
     e:["Correct. When the fact is still true, keeping the present tense is natural.",
        "“Tell” needs a person after it (“told me”).",
        "The past perfect suggests she doesn’t live there any more.",
        "“Would live” turns a present fact into a future plan."]}
   ]},
   {t:"Part 4 · Active & Passive Voice", q:[
    {q:"Someone stole his laptop at the airport. → His laptop ______ at the airport.",
     o:["was stolen","was stole","stole","has stole"], a:0,
     e:["Correct. Past simple passive: “was” + past participle.",
        "“Stole” is the past simple; the passive needs the participle “stolen”.",
        "This is the active form, and the laptop didn’t steal anything.",
        "Wrong auxiliary and wrong participle."]},
    {q:"All payments ______ in dollars.",
     o:["are processing","process","are processed","processed"], a:2,
     e:["The active continuous suggests the payments process themselves.",
        "The active present simple; payments don’t process anything.",
        "Correct. Present simple passive for a general procedure.",
        "The past simple active, while the sentence states a general rule."]},
    {q:"The results ______ next Monday.",
     o:["will announce","will be announced","are announcing","announce"], a:1,
     e:["Active: the results can’t announce themselves.",
        "Correct. Future passive: “will be” + past participle.",
        "Active continuous with a subject that doesn’t act.",
        "Active present simple, and the time is in the future."]},
    {q:"This bug ______ three times already.",
     o:["has been reported","has reported","is reported","was reporting"], a:0,
     e:["Correct. Present perfect passive for a result that matters now (“already”).",
        "Active: the bug isn’t reporting anything.",
        "The present simple passive doesn’t fit “three times already”.",
        "Past continuous active, which doesn’t work here."]},
    {q:"“The keynote was written by Léa.” In the active voice, this is:",

     e:["This keeps a passive verb with the wrong subject.",
        "This reverses the roles: the keynote didn’t write anyone.",
        "Correct. The agent becomes the subject and the verb becomes active.",
        "“By” can’t stay in an active sentence."]},
    {q:"The invoices ______ yet.",
     o:["haven’t paid","aren’t paying","weren’t paid","haven’t been paid"], a:3,
     e:["Active: invoices don’t pay anything.",
        "Active continuous, with the wrong meaning.",
        "The past simple passive doesn’t fit “yet”, which points to now.",
        "Correct. Present perfect passive: “haven’t been” + past participle."]},
    {q:"The office ______ at the moment, so we’re all remote.",
     o:["is renovating","is being renovated","renovates","has renovated"], a:1,
     e:["Active: the office isn’t doing the work.",
        "Correct. Present continuous passive: “is being” + past participle.",
        "Active present simple, and wrong for “at the moment”.",
        "Active present perfect, with the wrong subject."]},
    {q:"When is it better to use the passive?",
     o:["When you want to hide a grammar mistake","When the action matters more than who did it","Whenever the sentence feels too short","When the verb has no object"], a:1,
     e:["The passive is not a way to cover up mistakes.",
        "Correct. The passive puts the focus on the action or the result.",
        "Length is not a reason to change the voice.",
        "Only verbs that take an object can be made passive, so this is the opposite."]},
    {q:"Every application ______ by two engineers before Friday.",
     o:["will review","reviews","will be reviewed","is reviewing"], a:2,
     e:["Active, with a subject that doesn’t perform the action.",
        "Active present simple; applications don’t review anything.",
        "Correct. Future passive, with the agent introduced by “by”.",
        "Active continuous, with the wrong meaning."]},
    {q:"The report ______ right now, so I can’t send it yet.",
     o:["is written","writes","is being written","has written"], a:2,
     e:["The present simple passive states a general fact, not an action happening now.",
        "Active: the report doesn’t write itself.",
        "Correct. “Is being written” expresses a passive action in progress.",
        "Active present perfect, with the wrong subject."]}
   ]},
   {t:"Part 5 · Linking Words", q:[
    {q:"______ the traffic, we arrived on time.",
     o:["Despite","Although","Because","However"], a:0,
     e:["Correct. “Despite” is followed by a noun.",
        "“Although” needs a subject and a verb after it.",
        "“Because” introduces a cause, and it needs a full clause.",
        "“However” links two separate sentences, not a noun."]},
    {q:"The presentation was long; ______, nobody complained.",
     o:["therefore","however","because","so that"], a:1,
     e:["“Therefore” introduces a result, but the second idea doesn’t follow from the first.",
        "Correct. “However” introduces a contrast between two sentences.",
        "“Because” gives a reason and can’t stand between two independent clauses like this.",
        "“So that” introduces a purpose."]},
    {q:"She practised every evening; ______, her accent improved fast.",
     o:["although","whereas","as a result","despite"], a:2,
     e:["“Although” introduces a contrast, but the two ideas agree here.",
        "“Whereas” compares two contrasting facts.",
        "Correct. “As a result” introduces a consequence.",
        "“Despite” is followed by a noun and expresses contrast."]},
    {q:"______ he had prepared for weeks, he still felt nervous.",
     o:["Despite","Although","Therefore","Because of"], a:1,
     e:["“Despite” is followed by a noun or an -ing form, not a full clause.",
        "Correct. “Although” + subject + verb introduces a contrast.",
        "“Therefore” introduces a result, not a contrast.",
        "“Because of” gives a cause and is followed by a noun."]},
    {q:"We stayed an extra day ______ visit the coast.",
     o:["in order to","so that","because","for"], a:0,
     e:["Correct. “In order to” + infinitive expresses purpose.",
        "“So that” needs a clause with a subject and usually a modal.",
        "“Because” needs a subject and a verb.",
        "“For” + verb is not used to express purpose."]},
    {q:"The interface is simple; ______, it hides some very complex code.",
     o:["as a result","nevertheless","therefore","in addition"], a:1,
     e:["This is a contradiction, not a result.",
        "Correct. “Nevertheless” signals a surprising contrast.",
        "“Therefore” introduces a logical consequence.",
        "“In addition” adds a similar idea."]},
    {q:"The project succeeded ______ the whole team’s effort.",
     o:["although","thanks to","however","whereas"], a:1,
     e:["“Although” introduces a clause and a contrast.",
        "Correct. “Thanks to” + noun gives a positive cause.",
        "“However” links two sentences with a contrast.",
        "“Whereas” compares two opposite facts."]},
    {q:"We rewrote the whole page ______ the client would understand it.",
     o:["so that","in order to","because of","despite"], a:0,
     e:["Correct. “So that” introduces a purpose clause with a subject and a modal.",
        "“In order to” is followed by an infinitive, not a clause.",
        "“Because of” takes a noun and gives a cause.",
        "“Despite” takes a noun and expresses contrast."]},
    {q:"Maxime works in English, ______ his brother works in French.",
     o:["therefore","whereas","because","so"], a:1,
     e:["There is no cause-and-effect link between the two facts.",
        "Correct. “Whereas” contrasts two parallel facts.",
        "One fact isn’t the reason for the other.",
        "“So” introduces a result."]},
    {q:"First we tested the app; ______ we published it.",
     o:["however","then","although","whereas"], a:1,
     e:["“However” would signal a contrast, but these steps simply follow each other.",
        "Correct. “Then” marks the next step in a sequence.",
        "“Although” introduces a contrast clause.",
        "“Whereas” compares two opposite facts."]}
   ]}
  ]
},
