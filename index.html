        "“In” is used with longer periods such as months or years.",
        "“For” expresses duration, not a point in the day."]},
    {q:"Tomorrow we are going ______ the head office in Rouen.",
     o:["to","at","in","on"], a:0,
     e:["Correct. “To” is used after verbs of movement to show the destination.",
        "“At” shows position, not movement towards a place.",
        "“In” shows position inside something, not movement towards it.",
        "“On” shows a surface and does not express a destination."]},
    {q:"The coffee machine is ______ the lift and the stairs.",
     o:["between","in","at","on"], a:0,
     e:["Correct. “Between” is used for a position with something on each side.",
        "“In” means inside a space, so it cannot link two separate places.",
        "“At” marks a single point or place, not a position with two sides.",
        "“On” indicates a surface, so it cannot link two places like this."]},
    {q:"My desk is ______ the window; there is a lot of light.",
     o:["on","between","in","by"], a:3,
     e:["“On” indicates contact with a surface, which does not fit a desk and a window.",
        "“Between” needs two places or things, one on each side.",
        "“In” means inside something, but the desk is not inside the window.",
        "Correct. “By” means very close to or beside something."]},
    {q:"Please don’t use your phone ______ the safety presentation.",
     o:["while","since","for","during"], a:3,
     e:["“While” introduces a clause with a verb, not a noun phrase.",
        "“Since” marks a starting point in time, not an event you are inside.",
        "“For” expresses how long, not the event during which something happens.",
        "Correct. “During” is followed by a noun and means throughout that event."]},
    {q:"The meeting room is free ______ four o’clock; after that the sales team needs it.",
     o:["since","during","until","by"], a:2,
     e:["“Since” marks the starting point of a period that continues up to now.",
        "“During” is followed by an event or a period, not by a clock time.",
        "Correct. “Until” shows the moment when a situation stops.",
        "“By” means not later than a deadline, not up to the end of a period."]},
    {q:"Please send me the figures ______ Friday at the latest.",
     o:["until","by","during","since"], a:1,
     e:["“Until” shows when a situation stops, not a deadline for a single action.",
        "Correct. “By” means at or before a deadline.",
        "“During” is followed by a period and does not express a deadline.",
        "“Since” marks the start of a period, not the limit for finishing a task."]},
    {q:"The company closes ______ August, so my internship stops for two weeks.",
     o:["on","at","to","in"], a:3,
     e:["“On” is used with days and dates, not with the name of a month alone.",
        "“At” is used with clock times and a few fixed expressions, not with months.",
        "“To” shows a destination or the end of a period with a matching “from”.",
        "Correct. “In” is used with months, seasons and years."]}
   ]},
   {t:"Part 5 · Future Forms: Will & Going To", q:[
    {q:"I booked the room yesterday: we ______ present our project on Thursday.",
     o:["are going to","will to","are going","would"], a:0,
     e:["Correct. “Going to” is used for a plan or intention already decided.",
        "A modal such as “will” is never followed by “to” before the main verb.",
        "“Are going” needs “to” before the base verb, so the verb group is incomplete.",
        "“Would” does not express a plan for next Thursday."]},
    {q:"“The printer is out of paper.” — “Don’t worry, I ______ refill it.”",
     o:["am going to","will","will to","am refilling"], a:1,
     e:["“Going to” suggests a plan made earlier, but this decision is taken now.",
        "Correct. “Will” is used for a decision or offer made at the moment of speaking.",
        "A modal such as “will” is never followed by “to” before the main verb.",
        "The present continuous would describe an action in progress, not a spontaneous offer."]},
    {q:"Look at those dark clouds — it ______ rain before we leave the office.",
     o:["will be","goes to","is going to","go to"], a:2,
     e:["“Will be” must be followed by an -ing form, not by the base verb “rain”.",
        "“Goes to” is a present simple form and cannot build the future here.",
        "Correct. “Going to” is used for a prediction based on something we can see now.",
        "This is not a possible future form in English."]},
    {q:"According to the schedule, the new intern ______ arrive next Monday.",
     o:["will be","is going","will","will to"], a:2,
     e:["“Will be” must be followed by an -ing form, not by the base verb “arrive”.",
        "“Going to” needs “to” before the verb, so this form is incomplete.",
        "Correct. “Will” is used for a neutral statement about a future event.",
        "A modal such as “will” is never followed by “to”."]},
    {q:"I think our group ______ enjoy the visit to the factory tomorrow.",
     o:["will","am going to","will going to","going to"], a:0,
     e:["Correct. “Will” is used to express an opinion or prediction about the future.",
        "“Am going to” does not agree with the subject “our group”, which needs “is”.",
        "“Will” and “going to” cannot be combined in the same verb form.",
        "“Going to” needs the verb “be” before it, so this form is incomplete."]},
    {q:"The lift is making a strange noise; I think it ______ break down soon.",
     o:["is going to","will to","will be","goes to"], a:0,
     e:["Correct. “Going to” is used for a prediction based on evidence we can see or hear now.",
        "A modal such as “will” is never followed by “to” before the main verb.",
        "“Will be” must be followed by an -ing form, not by the base verb “break”.",
        "This is not a future form in English; the structure needs “be going to”."]},
    {q:"“Don’t worry about the deadline.” — “I ______ you the file tonight; I promise.”",
     o:["would send","used to send","send","will send"], a:3,
     e:["“Would” does not express a promise made at the moment of speaking.",
        "“Used to” describes a past habit and cannot refer to tonight.",
        "The present simple is used for timetables and routines, not for a promise.",
        "Correct. “Will” is used to make a promise or an offer while you are speaking."]},
    {q:"______ you ______ to apply for a job here after your internship?",
     o:["Will / going","Are / going","Do / going","Are / go"], a:1,
     e:["“Will” cannot combine with “going” in this structure.",
        "Correct. The question form is “be” + subject + “going to” + base verb.",
        "“Do” is not used as the auxiliary with “going to”; the auxiliary is “be”.",
        "“Go” is not possible here; the structure needs “going to” + base verb."]},
    {q:"“We still need somebody to take the notes.” — “Fine, ______ do it.”",
     o:["I am","I used to","I will","I going to"], a:2,
     e:["“Be” cannot be followed directly by a base verb, so this form is impossible.",
        "“Used to” refers to a past habit and does not accept a task now.",
        "Correct. “Will” expresses a decision made at the moment of speaking.",
        "The structure needs “am going to” before the base verb."]},
    {q:"Choose the correct sentence about next week.",
     o:["Next week I going to meet the whole team.","Next week I will to meet the whole team.","Next week I am going to meet the whole team.","Next week I am going meet the whole team."], a:2,
     e:["The structure needs the verb “be” before “going to”.",
        "“Will” is never followed by “to” before the main verb.",
        "Correct. The structure is “be” + “going to” + base verb for a planned future action.",
        "“Going” must be followed by “to” before the main verb."]}
   ]},
   {t:"Part 6 · Common Phrasal Verbs", q:[
    {q:"Can you ______ this form with your name and address, please?",
     o:["fill in","fill up","look for","turn on"], a:0,
     e:["Correct. “Fill in” means to write information in the spaces of a form.",
        "“Fill up” means to fill a container completely, like a tank.",
        "“Look for” means to try to find something.",
        "“Turn on” means to start a machine or a light."]},
    {q:"I have to ______ my report to my tutor before Friday.",
     o:["hand out","pick up","hand in","log in"], a:2,
     e:["“Hand out” means to distribute something to several people.",
        "“Pick up” means to collect something or someone.",
        "Correct. “Hand in” means to give work to a teacher or a manager.",
        "“Log in” means to enter a username and password on a system."]},
    {q:"The technician will ______ my computer tomorrow morning.",
     o:["set off","look after","call back","set up"], a:3,
     e:["“Set off” means to start a journey.",
        "“Look after” means to take care of somebody or something.",
        "“Call back” means to telephone somebody again.",
        "Correct. “Set up” means to install and prepare equipment so it is ready to use."]},
    {q:"Please ______ the lights when you leave the meeting room.",
     o:["turn up","turn off","take off","put off"], a:1,
     e:["“Turn up” means to increase the volume, or to arrive somewhere.",
        "Correct. “Turn off” means to stop a light or a machine.",
        "“Take off” means to remove clothes, or for a plane to leave the ground.",
        "“Put off” means to postpone something to a later date."]},
    {q:"I was ______ my badge all morning — I couldn’t find it anywhere.",
     o:["looking for","looking after","looking at","looking up"], a:0,
     e:["Correct. “Look for” means to try to find something you have lost.",
        "“Look after” means to take care of something, not to search for it.",
        "“Look at” means to direct your eyes towards something.",
        "“Look up” means to search for information in a list or a dictionary."]},
    {q:"Could you ______ when the next safety training takes place?",
     o:["find off","go on","find out","put up"], a:2,
     e:["This combination does not exist as a phrasal verb in English.",
        "“Go on” means to continue.",
        "Correct. “Find out” means to discover information.",
        "“Put up” means to build or to fix something on a wall."]},
    {q:"Part of my job is to ______ customer complaints by email.",
     o:["deal in","get over","take in","deal with"], a:3,
     e:["“Deal in” means to buy and sell a type of product.",
        "“Get over” means to recover from an illness or a bad experience.",
        "“Take in” means to absorb or to understand information.",
        "Correct. “Deal with” means to handle a problem or a task."]},
    {q:"Can you ______ the visitors at reception at two o’clock?",
     o:["pick out","pick up","bring up","run out"], a:1,
     e:["“Pick out” means to choose something from a group.",
        "Correct. “Pick up” means to collect somebody from a place.",
        "“Bring up” means to mention a subject, or to raise a child.",
        "“Run out” means to have no more of something."]},
    {q:"I ______ my new colleagues very well; the atmosphere is friendly.",
     o:["get on with","get up with","go off with","give in to"], a:0,
     e:["Correct. “Get on with” somebody means to have a good relationship with them.",
        "“Get up” means to leave your bed and does not take “with” in this sense.",
        "“Go off” means to explode or to go bad, which does not fit people.",
        "“Give in to” means to stop resisting something."]},
    {q:"The client phoned while you were out; he asked you to ______ this afternoon.",
     o:["call off","call in sick","call back","call for"], a:2,
     e:["“Call off” means to cancel an event.",
        "“Call in sick” means to phone to say you are ill.",
        "Correct. “Call back” means to telephone somebody again, usually in return.",
        "“Call for” means to demand something, or to collect somebody."]}
   ]},
   {t:"Part 7 · Articles, Countable & Uncountable", q:[
    {q:"My tutor is ______ engineer, and she manages the quality team.",
     o:["a","the","an","no article"], a:2,
     e:["“A” is used before a consonant sound, but “engineer” begins with a vowel sound.",
        "“The” would point to a specific engineer already known, which is not the case here.",
        "Correct. “An” is used before a word beginning with a vowel sound.",
        "English needs an article before a singular job name after “be”."]},
    {q:"There is a small kitchen on each floor. ______ kitchen on my floor is always very clean.",
     o:["A","The","An","Some"], a:1,
     e:["“A” introduces something for the first time, but this kitchen is already identified.",
        "Correct. “The” is used for something already mentioned or clearly identified.",
        "“An” is used before a vowel sound and also introduces something new.",
        "“Some” is used for an indefinite quantity, not for one identified thing."]},
    {q:"How ______ information did you get during the welcome session?",
     o:["much","many","few","a lot"], a:0,
     e:["Correct. “Much” is used with uncountable nouns such as “information”.",
        "“Many” is used with countable plural nouns, but “information” is uncountable.",
        "“Few” is used with countable plural nouns and cannot follow “how”.",
        "“A lot” is not used in questions of this type and needs “of” before a noun."]},
    {q:"I only have ______ questions left, then I can start.",
     o:["a little","much","any","a few"], a:3,
     e:["“A little” is used with uncountable nouns, but “questions” is countable.",
        "“Much” is used with uncountable nouns and is unusual in a positive statement.",
        "“Any” is normally used in questions and negatives, not in this positive sentence.",
        "Correct. “A few” is used with countable plural nouns like “questions”."]},
    {q:"We don’t have ______ milk left for the coffee.",
     o:["some","any","many","a few"], a:1,
     e:["“Some” is normally used in positive sentences, not after a negative verb.",
        "Correct. “Any” is used with uncountable nouns in negative sentences.",
        "“Many” is used with countable plural nouns, but “milk” is uncountable.",
        "“A few” is used with countable plural nouns, which “milk” is not."]},
    {q:"There is ______ meeting room on every floor of the building.",
     o:["a","an","the","some"], a:0,
     e:["Correct. “A” introduces a singular countable noun for the first time before a consonant sound.",
        "“An” is only used before a word that begins with a vowel sound.",
        "“The” points to one room already known, but this one is new information.",
        "“Some” is used with plural or uncountable nouns, not with a singular countable noun."]},
    {q:"How ______ people work in your department?",
     o:["much","a lot of","many","a little"], a:2,
     e:["“Much” is used with uncountable nouns, but “people” is countable and plural.",
        "“A lot of” is not used after “how”; it appears in statements.",
        "Correct. “Many” is used with countable plural nouns.",
        "“A little” is used with uncountable nouns and never follows “how”."]},
    {q:"I still have ______ work to finish before I go home.",
     o:["a few","many","several","a little"], a:3,
     e:["“A few” is used with countable plural nouns, but “work” is uncountable here.",
        "“Many” is used with countable plural nouns, not with an uncountable noun.",
        "“Several” is followed by a countable plural noun.",
        "Correct. “A little” is used with uncountable nouns to mean a small quantity."]},
    {q:"I go to ______ work by bus every morning.",
     o:["the","no article","a","an"], a:1,
     e:["“The” is not used in the fixed expression “go to work”.",
        "Correct. Some fixed expressions such as “go to work” take no article.",
        "“Work” is uncountable here, so it cannot follow “a”.",
        "“An” is used before a vowel sound and not with an uncountable noun."]},
    {q:"There are ______ new interns in the office this week.",
     o:["some","much","any","a little"], a:0,
     e:["Correct. “Some” is used in positive sentences with plural countable nouns.",
        "“Much” is used with uncountable nouns, not with a plural countable noun.",
        "“Any” belongs to negative sentences and questions, not to this positive statement.",
        "“A little” is used with uncountable nouns, not with plural people."]}
   ]}
  ]
},
{
  id: 22, name: "BAC+2 · Test 2", theme: "A week at the office",
  parts: [
   {t:"Part 1 · Present Simple, Continuous & Past Simple", q:[
    {q:"Every morning the team ______ at nine for a short meeting.",
     o:["is meeting","meets","met","meeting"], a:1,
     e:["The present continuous describes what is happening now, not a daily routine.",
        "Correct. The present simple is used for habits and routines, especially with “every morning”.",
        "The past simple refers to a finished past action, but this happens every day.",
        "An -ing form cannot be the main verb of a sentence without an auxiliary."]},
    {q:"Please be quiet — Mr Dupont ______ on the phone with a client right now.",
     o:["is talking","talks","talked","talk"], a:0,
     e:["Correct. The present continuous describes an action in progress at the moment of speaking.",
        "The present simple would describe a habit, not something happening right now.",
        "The past simple places the action in finished time, which “right now” contradicts.",
        "This form does not agree with the third person singular subject “Mr Dupont”."]},
    {q:"Yesterday I ______ my laptop at the office by mistake.",
     o:["leave","am leaving","left","was leaving"], a:2,
     e:["The present simple cannot be used with the finished past time “yesterday”.",
        "The present continuous refers to now, not to a finished action yesterday.",
        "Correct. The past simple is used for a completed action at a stated past time.",
        "The past continuous suggests an action in progress, but this was a single completed event."]},
    {q:"Our manager usually ______ coffee in the canteen before she starts work.",
     o:["is drinking","drink","drinking","drinks"], a:3,
     e:["The present continuous does not fit the frequency adverb “usually”.",
        "The verb must take an -s ending to agree with the third person singular “our manager”.",
        "An -ing form alone cannot be the main verb of a sentence.",
        "Correct. The present simple with -s is used for a habit with “usually”."]},
    {q:"What ______ when the fire alarm rang this morning?",
     o:["did you do","do you do","are you doing","you did"], a:0,
     e:["Correct. The past simple question uses “did” plus the base verb for a finished past moment.",
        "The present simple asks about habits, not about a specific past moment.",
        "The present continuous refers to now, but the alarm rang this morning.",
        "A question needs the auxiliary before the subject, so this word order is not possible."]},
    {q:"Listen! Someone ______ in the meeting room next door.",
     o:["shouts","shouted","shout","is shouting"], a:3,
     e:["The present simple states a general fact, not an action happening at this second.",
        "The past simple places the action in the past, but “Listen!” points to now.",
        "This form does not agree with the singular subject “someone”.",
        "Correct. The present continuous describes a temporary action happening at this moment."]},
    {q:"We ______ twenty emails before lunch yesterday.",
     o:["answer","answered","are answering","answering"], a:1,
     e:["The present simple cannot describe a finished action in past time.",
        "Correct. The past simple is used for a completed action in a finished time period.",
        "The present continuous refers to the present moment, not to yesterday.",
        "An -ing form needs an auxiliary verb such as “were” to be a main verb."]},
    {q:"Choose the correct sentence.",
     o:["I take the train every day, but this week I am driving to the office.","I am taking the train every day, but this week I drive to the office.","I take the train every day, but this week I drove to the office.","I took the train every day, but this week I am drive to the office."], a:0,
     e:["Correct. The present simple gives the routine and the present continuous the temporary change.",
        "The tenses are the wrong way round, since the routine needs the present simple.",
        "The past simple does not fit “this week”, which is a present temporary situation.",
        "“Am drive” mixes an auxiliary with a base verb, which is not a possible form."]},
    {q:"My colleague ______ for the bus when I saw her this morning.",
     o:["waits","is waiting","waited","was waiting"], a:3,
     e:["The present simple cannot describe a scene in the past.",
        "The present continuous refers to now, not to this morning.",
        "The past simple suggests a completed action, not one in progress when something happened.",
        "Correct. The past continuous describes an action in progress interrupted by a past simple event."]},
    {q:"The printer ______ work last Friday, so we called technical support.",
     o:["doesn’t","isn’t","didn’t","not"], a:2,
     e:["The present simple negative does not fit the past time “last Friday”.",
        "“Isn’t” would need an -ing form after it, and it is also present.",
        "Correct. The past simple negative uses “didn’t” plus the base verb.",
        "A negative verb needs an auxiliary, so “not work” alone is not possible here."]}
   ]},
   {t:"Part 2 · Common Modal Auxiliaries", q:[
    {q:"You ______ use your badge to enter the building; there is no other way in.",
     o:["must","can’t","may not","shouldn’t"], a:0,
     e:["Correct. “Must” expresses a strong obligation or necessity.",
        "“Can’t” expresses prohibition or impossibility, which contradicts the second part.",
        "“May not” refuses permission, but the badge is in fact necessary.",
        "“Shouldn’t” gives negative advice, which does not match a necessary action."]},
    {q:"Visitors ______ take photos in the laboratory. It is strictly forbidden.",
     o:["must","should","mustn’t","don’t have to"], a:2,
     e:["“Must” expresses obligation, the opposite of a prohibition.",
        "“Should” only gives advice, which is too weak for something strictly forbidden.",
        "Correct. “Mustn’t” expresses prohibition: it is not allowed.",
        "“Don’t have to” means it is not necessary, not that it is forbidden."]},
    {q:"______ I borrow your pen for a minute?",
     o:["Must","Ought","Should","May"], a:3,
     e:["“Must” asks about obligation, not about permission.",
        "“Ought” is always followed by “to” and is not used to ask permission.",
        "“Should” asks for advice, not for permission.",
        "Correct. “May” is used in polite questions asking for permission."]},
    {q:"Sophie ______ speak three languages; that is very useful in our team.",
     o:["must","should","has to","can"], a:3,
     e:["“Must” expresses obligation, not a personal ability.",
        "“Should” gives advice, which does not describe a skill someone has.",
        "“Has to” expresses an external obligation, not an ability.",
        "Correct. “Can” expresses ability or skill."]},
    {q:"You look very tired. You ______ take a short break.",
     o:["should","mustn’t","can’t","may not"], a:0,
     e:["Correct. “Should” is used to give advice or a recommendation.",
        "“Mustn’t” forbids the action, which makes no sense after noticing someone is tired.",
        "“Can’t” says the action is impossible or not allowed, not advisable.",
        "“May not” refuses permission, so it does not give advice."]},
    {q:"I ______ finish this report today because the client is waiting for it.",
     o:["can","may","have to","mustn’t"], a:2,
     e:["“Can” expresses ability or permission, not a necessity coming from outside.",
        "“May” expresses permission or possibility, not an obligation.",
        "Correct. “Have to” expresses an obligation that comes from the situation or from other people.",
        "“Mustn’t” forbids the action, but the report is in fact required."]},
    {q:"It is Saturday tomorrow, so we ______ come to the office.",
     o:["mustn’t","don’t have to","can’t","shouldn’t"], a:1,
     e:["“Mustn’t” means it is forbidden, but the office is simply closed, not prohibited.",
        "Correct. “Don’t have to” means there is no obligation or necessity.",
        "“Can’t” expresses impossibility or prohibition, which is stronger than the meaning needed.",
        "“Shouldn’t” gives negative advice, not an absence of obligation."]},
    {q:"Choose the correct sentence about the form.",
     o:["You must to fill in the form before Friday.","You must filling in the form before Friday.","You must fill in the form before Friday.","You musting fill in the form before Friday."], a:2,
     e:["A modal verb is never followed by “to” plus the infinitive.",
        "A modal verb is followed by the base verb, never by an -ing form.",
        "Correct. A modal such as “must” is followed directly by the base form of the verb.",
        "Modal verbs have no -ing form, so this is not a possible verb form."]},
    {q:"Employees ______ wear safety shoes in the workshop. It is a company rule.",
     o:["can","have to","may","might"], a:1,
     e:["“Can” expresses permission or ability, not a rule to follow.",
        "Correct. “Have to” expresses an obligation created by a rule.",
        "“May” expresses permission or possibility, not a compulsory rule.",
        "“Might” expresses a weak possibility, which does not fit a company rule."]},
    {q:"Sorry, I ______ come to the meeting at four: I have a train to catch.",
     o:["shouldn’t","mustn’t","don’t have to","can’t"], a:3,
     e:["“Shouldn’t” gives advice against the action, not a practical impossibility.",
        "“Mustn’t” means the action is forbidden, which is not the reason given.",
        "“Don’t have to” means it is not necessary, but the problem is that it is not possible.",
        "Correct. “Can’t” expresses inability: it is not possible for the speaker."]}
   ]},
   {t:"Part 3 · Past Habit: Used To", q:[
    {q:"Before the new canteen opened, we ______ eat our sandwiches at our desks.",
     o:["used to","use to","are used to","will use"], a:0,
     e:["Correct. “Used to” plus the base verb describes a past habit that has now changed.",
        "In a positive sentence the past form “used to” is required, not the base “use to”.",
        "“Are used to” means being familiar with something and is followed by an -ing form.",
        "“Will use” points to the future and cannot be followed by another base verb."]},
    {q:"When I worked in Lyon, I ______ take the tram every morning.",
     o:["will","use to","used to","am used to"], a:2,
     e:["“Will” refers to the future, but the sentence describes the past.",
        "In a positive sentence the correct form is the past “used to”, not “use to”.",
        "Correct. “Used to” plus the base verb describes a repeated habit in the past that has stopped.",
        "“Am used to” means being familiar with something, and it is followed by an -ing form."]},
    {q:"My first manager ______ very strict about punctuality.",
     o:["used to be","used to being","was used to","uses to be"], a:0,
     e:["Correct. “Used to be” describes a state that was true in the past but is not true now.",
        "After “used to” the verb stays in the base form, so an -ing form is not possible.",
        "“Was used to” means familiar with something and needs a noun or an -ing form after it.",
        "“Used to” has no present form, so “uses to” is not a possible verb form."]},
    {q:"My colleague ______ smoke, but he stopped two years ago.",
     o:["is used to","used to","will","uses"], a:1,
     e:["“Is used to” means being familiar with something and takes an -ing form.",
        "Correct. “Used to” describes a past habit that no longer exists.",
        "“Will” refers to the future, but the habit belongs to the past.",
        "“Uses” is a present simple form, yet the habit has stopped."]},
    {q:"There ______ be a coffee machine on the first floor, but the company removed it.",
     o:["use to","is used to","did use to","used to"], a:3,
     e:["“Use to” is the base form and needs an auxiliary such as “did” in front of it.",
        "“Is used to” is present and means familiar with something, not a past situation.",
        "“Did use to” belongs to questions and negatives, not to a positive statement.",
        "Correct. “There used to be” describes a past state that has now ended."]},
    {q:"______ you ______ take notes by hand in your old job?",
     o:["Did / use to","Did / used to","Do / use to","Were / used to"], a:0,
     e:["Correct. Questions put the past auxiliary “did” first and keep the base form “use to”.",
        "After the auxiliary “did” the form must stay “use to” without the past -d.",
        "“Do” is a present auxiliary and cannot ask about a past habit.",
        "“Were” would need an -ing form and does not build a question about a past habit."]},
    {q:"______ you use to work in the Paris office?",
     o:["Do","Are","Will","Did"], a:3,
     e:["“Do” is a present auxiliary and cannot ask about a past habit.",
        "“Are” would need an -ing form and refers to the present.",
        "“Will” asks about the future, not about a past habit.",
        "Correct. Questions with “use to” need the past auxiliary “did” plus “use to”."]},
    {q:"Our new manager ______ work here; she joined the company in March.",
     o:["didn’t used to","doesn’t use to","didn’t use to","not used to"], a:2,
     e:["After the auxiliary “didn’t” the verb must stay in the base form “use”.",
        "“Doesn’t” is present, so it cannot describe a situation that belongs to the past.",
        "Correct. The negative is “didn’t use to” with the base form after the auxiliary.",
        "A negative needs an auxiliary verb, so “not used to” alone is not possible."]},
    {q:"Choose the correct sentence about meetings in the past.",
     o:["I didn’t used to like meetings, but now I enjoy them.","I didn’t use to like meetings, but now I enjoy them.","I don’t used to like meetings, but now I enjoy them.","I not use to like meetings, but now I enjoy them."], a:1,
     e:["After the auxiliary “didn’t” the verb must stay in the base form “use”.",
        "Correct. Negatives use “didn’t use to” with the base form after the auxiliary.",
        "“Don’t” is present, so it cannot describe a habit that belongs to the past.",
        "A negative needs an auxiliary verb, so “not use to” is not a possible form."]},
    {q:"I ______ to Lyon twice last month for a training course.",
     o:["used to go","use to go","went","was going"], a:2,
     e:["“Used to” describes a long repeated habit, not a stated number of trips in one month.",
        "“Use to go” has no auxiliary and no past form, so it cannot be the main verb here.",
        "Correct. The past simple is used for a counted number of actions in a finished period.",
        "The past continuous describes an action in progress, not two completed trips."]}
   ]},
   {t:"Part 4 · Prepositions of Place & Time", q:[
    {q:"The weekly meeting starts ______ nine o’clock.",
     o:["in","on","at","for"], a:2,
     e:["“In” is used with months, years and parts of the day, not with clock times.",
        "“On” is used with days and dates, not with exact times.",
        "Correct. “At” is used before an exact clock time.",
        "“For” expresses a length of time, not a point in time."]},
    {q:"I usually read my emails ______ the morning, before the first meeting.",
     o:["in","at","on","for"], a:0,
     e:["Correct. “In” is used with parts of the day, such as in the morning.",
        "“At” is used with clock times and in the fixed phrase “at night”.",
        "“On” is used with days and dates, as in “on Monday morning”.",
        "“For” expresses a length of time, not a part of the day."]},
    {q:"I worked in this company ______ 2023 to 2025.",
     o:["since","for","during","from"], a:3,
     e:["“Since” needs the present perfect, so it does not fit a finished past period.",
        "“For” is used with a period of time, such as two years.",
        "“During” is used with a named period, such as during the meeting.",
        "Correct. “From” marks the start of a period and pairs with “to”."]},
    {q:"The canteen serves lunch ______ twelve and two.",
     o:["from","during","until","between"], a:3,
     e:["“From” needs “to” as its second part, not “and”.",
        "“During” is followed by one named period, such as during lunch.",
        "“Until” marks only the end of a period and takes a single time expression.",
        "Correct. “Between … and …” gives the two limits of a period."]},
    {q:"My boss was very quiet ______ the whole presentation.",
     o:["since","during","while","at"], a:1,
     e:["“Since” marks a starting point, not a period someone passes through.",
        "Correct. “During” is used with a named event or period.",
        "“While” introduces a clause with a verb, not a noun phrase.",
        "“At” marks a precise point in time, not a long event."]},
    {q:"Please send me your notes ______ Friday at the latest.",
     o:["until","since","during","by"], a:3,
     e:["“Until” shows how long a situation continues, not a deadline for an action.",
        "“Since” marks a starting point in the past, not a future limit.",
        "“During” needs a named period and does not express a deadline.",
        "Correct. “By” means at that moment or before it, so it gives a deadline."]},
    {q:"I put the file ______ your desk this morning.",
     o:["in","on","to","at"], a:1,
     e:["“In” suggests inside something closed, such as in a drawer.",
        "Correct. “On” is used for a surface such as a desk or a table.",
        "“To” shows movement towards a place, not the final position.",
        "“At” refers to a general location, not to a surface."]},
    {q:"My commute ______ the office takes forty minutes.",
     o:["at","to","on","during"], a:1,
     e:["“At” shows a fixed position, not movement towards a place.",
        "Correct. “To” shows movement towards a destination.",
        "“On” is used for surfaces and for floors of a building.",
        "“During” introduces a period of time, not a destination."]},
    {q:"Choose the correct sentence about going to work.",
     o:["I go at work by train on Mondays.","I go to the work by train in Mondays.","I go to work by train on Mondays.","I go in work with train at Mondays."], a:2,
     e:["“Go at work” is the wrong preposition, since movement needs “to”.",
        "“The work” adds an unnecessary article, and days take “on”, not “in”.",
        "Correct. “Go to work” has no article, and days of the week take “on”.",
        "“In work” and “with train” are the wrong prepositions, and days take “on”."]},
    {q:"Our offices are ______ the second floor of the building.",
     o:["in","at","on","to"], a:2,
     e:["“In” is used for enclosed spaces, such as in the building, not for floors.",
        "“At” gives a general position and is not used with floors.",
        "Correct. “On” is the preposition used with floors of a building.",
        "“To” shows direction, not where something is situated."]}
   ]},
   {t:"Part 5 · Future Forms: Will & Going To", q:[
    {q:"The phone is ringing. Don’t worry, I ______ answer it.",
     o:["will","am going to","am going","would"], a:0,
     e:["Correct. “Will” expresses a decision made at the moment of speaking.",
        "“Going to” expresses an intention decided before now, but this decision is immediate.",
        "“Am going” needs “to” before the base verb, so the verb group is incomplete.",
        "“Would” is not used for an immediate decision about the present situation."]},
    {q:"Nobody knows yet, but I think the client ______ accept our offer.",
     o:["is going","will","goes to","used to"], a:1,
     e:["“Is going” must be followed by “to” before the base verb to build the future.",
        "Correct. “Will” is used for an opinion or a prediction about the future after “I think”.",
        "“Goes to” is a present simple form and cannot build the future here.",
        "“Used to” refers to a habit in the past, not to a future decision by the client."]},
    {q:"Look at those dark clouds! It ______ rain before we get to the office.",
     o:["will to","shall","will be","is going to"], a:3,
     e:["A modal such as “will” is never followed by “to” before the main verb.",
        "“Shall” is used mainly for offers and suggestions with “I” and “we”.",
        "“Will be” must be followed by an -ing form, not by the base verb “rain”.",
        "Correct. “Going to” is used for a prediction based on evidence we can see now."]},
    {q:"Be careful with that cup — the coffee ______ spill on the keyboard.",
     o:["will to","is going to","will be","goes to"], a:1,
     e:["A modal such as “will” is never followed by “to” before the main verb.",
        "Correct. “Going to” announces something very likely because of present evidence.",
        "“Will be” would need an -ing form after it and does not fit the base verb “spill”.",
        "“Goes to” is a present simple form and cannot build the future here."]},
    {q:"We booked the room yesterday: we ______ present the project on Monday.",
     o:["will to","is going to","are going to","go"], a:2,
     e:["A modal such as “will” is never followed by “to” before the main verb.",
        "“Is going to” does not agree with the subject “we”, which needs “are”.",
        "Correct. “Going to” is used for a plan or intention decided before the moment of speaking.",
        "The present simple is not used here for a personal arrangement of this kind."]},
    {q:"I already have my ticket; I ______ attend the conference in Lille next week.",
     o:["will going to","am going","go to","am going to"], a:3,
     e:["“Will” and “going to” cannot be combined in the same verb form.",
        "“Am going” needs “to” before the base verb, so the verb group is incomplete.",
        "“Go to” is a present simple form and cannot introduce another base verb.",
        "Correct. “Be going to” is used for a plan decided before the moment of speaking."]},
    {q:"I think the new software ______ be easier to use than the old one.",
     o:["will","used to","is going","shall"], a:0,
     e:["Correct. “Will” is used for a prediction or an opinion about the future after “I think”.",
        "“Used to” describes a past habit, not an opinion about the future.",
        "“Is going” would need “to” before the verb to form the future.",
        "“Shall” is not used for a prediction about a third person."]},
    {q:"There ______ be a company party next December.",
     o:["used to","will","is going","goes to"], a:1,
     e:["“Used to” places the event in the past, but “next December” is in the future.",
        "Correct. “Will” is used with “there” to announce a future event.",
        "This form is incomplete, as “going” must be followed by “to”.",
        "“Goes to” is a present simple form and cannot build the future here."]},
    {q:"Hurry up, or we ______ miss the nine o’clock train.",
     o:["use to","are used to","will","would"], a:2,
     e:["“Use to” is not a correct form on its own and does not refer to the future.",
        "“Are used to” means being familiar with something, which does not fit a warning.",
        "Correct. “Will” is used to predict a future result or consequence.",
        "“Would” expresses an imagined situation, not a real future consequence."]},
    {q:"Choose the correct sentence about the agenda.",
     o:["She will to send the agenda tomorrow.","She is going send the agenda tomorrow.","She will sending the agenda tomorrow.","She will send the agenda tomorrow."], a:3,
     e:["“Will” is a modal and is never followed by “to” plus the infinitive.",
        "“Going” must be followed by “to” before the base verb.",
        "A modal verb is followed by the base verb, never by an -ing form.",
        "Correct. “Will” is followed directly by the base form of the verb."]}
   ]},
   {t:"Part 6 · Common Phrasal Verbs", q:[
    {q:"Please ______ this form before you leave the reception desk.",
     o:["fill in","fill up","fill out of","fill off"], a:0,
     e:["Correct. “Fill in” means to write the required information on a form.",
        "“Fill up” means to make something completely full, such as a tank.",
        "“Fill out of” is not a possible combination in English.",
        "“Fill off” does not exist as a phrasal verb."]},
    {q:"Can you ______ the lights? It is getting dark in here.",
     o:["turn down","turn over","turn in","turn on"], a:3,
     e:["“Turn down” means to reduce the volume or the level of something.",
        "“Turn over” means to move something so the other side is up.",
        "“Turn in” means to hand something to a person in authority.",
        "Correct. “Turn on” means to start a machine or a light working."]},
    {q:"I am still ______ my badge. I think I left it in the car.",
     o:["finding out","looking after","looking for","looking up"], a:2,
     e:["“Find out” means to discover information, not to search for an object.",
        "“Look after” means to take care of someone or something.",
        "Correct. “Look for” means to try to find something you have lost, and the -ing form follows “am still”.",
        "“Look up” means to search for information in a list or a dictionary."]},
    {q:"We need to ______ who is coming to the training on Thursday.",
     o:["find out","look for","deal with","set up"], a:0,
     e:["Correct. “Find out” means to discover a piece of information.",
        "“Look for” means to search for something physical you cannot find.",
        "“Deal with” means to handle a problem or a task.",
        "“Set up” means to organise or prepare something new."]},
    {q:"The technician will ______ the new computer in the meeting room.",
     o:["set off","set up","set in","set down"], a:1,
     e:["“Set off” means to start a journey or to make an alarm ring.",
        "Correct. “Set up” means to install or prepare equipment so it is ready to use.",
        "“Set in” is used for bad weather or conditions that begin and continue.",
        "“Set down” means to put something on a surface."]},
    {q:"Sorry, I am busy now. Can I ______ you ______ in ten minutes?",
     o:["call / off","call / out","call / up to","call / back"], a:3,
     e:["“Call off” means to cancel an event, which does not fit a phone promise.",
        "“Call out” means to shout something or to challenge someone, not to telephone again.",
        "“Call up to” is not a possible phrasal verb combination.",
        "Correct. “Call back” means to telephone someone again later."]},
    {q:"Our new intern ______ very well with the rest of the team.",
     o:["gets on","gets up","gets off","gets in"], a:0,
     e:["Correct. “Get on with” means to have a good relationship with someone.",
        "“Get up” means to leave your bed or to stand up.",
        "“Get off” means to leave a bus, a train or a plane.",
        "“Get in” means to enter a car or to arrive somewhere."]},
    {q:"Don’t forget to ______ before you use the company intranet.",
     o:["log off","log in","sign off","put in"], a:1,
     e:["“Log off” means to end your session, so you cannot use the system after it.",
        "Correct. “Log in” means to enter your name and password to start using a system.",
        "“Sign off” means to finish or to approve something, not to start a session.",
        "“Put in” means to insert or to submit, and it is not used for computer access."]},
    {q:"Marie is very calm; she knows how to ______ difficult customers.",
     o:["fill in","hand in","pick up","deal with"], a:3,
     e:["“Fill in” means to complete a form with information.",
        "“Hand in” means to give a document to someone in authority.",
        "“Pick up” means to lift something or to collect someone.",
        "Correct. “Deal with” means to handle a problem or a difficult person."]},
    {q:"We must ______ this invoice problem before the end of the week.",
     o:["sort out","turn off","hand in","look up"], a:0,
     e:["Correct. “Sort out” means to solve a problem or to put things in order.",
        "“Turn off” means to stop a machine or a light working.",
        "“Hand in” means to submit a document to a person in charge.",
        "“Look up” means to search for information in a list or online."]}
   ]},
   {t:"Part 7 · Articles, Countable & Uncountable", q:[
    {q:"She is ______ engineer in the production department.",
     o:["a","no article","the","an"], a:3,
     e:["“A” is used before a consonant sound, but this word begins with a vowel sound.",
        "English needs an article before a singular job noun after the verb “be”.",
        "“The” would point to one specific engineer already known to the listener.",
        "Correct. “An” is used before a word starting with a vowel sound, such as engineer."]},
    {q:"Hugo is ______ best engineer in our department.",
     o:["a","an","the","no article"], a:2,
     e:["“A” cannot introduce a superlative, which points to one unique person.",
        "“An” is used before a vowel sound and also cannot introduce a superlative.",
        "Correct. Superlatives such as “best” take the definite article “the”.",
        "A superlative needs “the” in front of it, so leaving the article out is not possible."]},
    {q:"We usually have ______ lunch in the canteen at half past twelve.",
     o:["no article","a","the","an"], a:0,
     e:["Correct. Meals take no article in expressions such as “have lunch”.",
        "“A” is not used before the names of meals in this expression.",
        "“The” would be needed only to point to one particular lunch already mentioned.",
        "“An” is used before a vowel sound and is not used before meals either."]},
    {q:"There isn’t ______ milk left in the fridge.",
     o:["many","a few","much of","any"], a:3,
     e:["“Many” is used with countable plural nouns, but milk is uncountable.",
        "“A few” is only used with countable plural nouns.",
        "“Much of” would need a determiner such as “the” after it.",
        "Correct. “Any” is used with uncountable nouns in negative sentences."]},
    {q:"She gave me ______ useful advice about the report.",
     o:["a","an","some","a few"], a:2,
     e:["“A” cannot be used with an uncountable noun such as advice.",
        "“An” is an article for singular countable nouns, and advice is uncountable.",
        "Correct. “Some” is used with uncountable nouns in positive sentences.",
        "“A few” is only used with countable plural nouns."]},
    {q:"How ______ people were there at the team lunch?",
     o:["much","many","a little","any"], a:1,
     e:["“Much” is used with uncountable nouns, but people is countable and plural.",
        "Correct. “Many” is used with countable plural nouns in questions.",
        "“A little” is used with uncountable nouns and does not fit a question with “how”.",
        "“Any” does not combine with “how” to ask about a number."]},
    {q:"How ______ sugar do you take in your coffee?",
     o:["many","a few","much","any"], a:2,
     e:["“Many” is used with countable plural nouns, but sugar is uncountable here.",
        "“A few” is used with countable plural nouns and does not follow “how”.",
        "Correct. “Much” is used with uncountable nouns to ask about a quantity.",
        "“Any” does not combine with “how” to ask about a quantity."]},
    {q:"We only have ______ time before the client arrives, so let’s be quick.",
     o:["a little","a few","many","few"], a:0,
     e:["Correct. “A little” is used with uncountable nouns such as time.",
        "“A few” is only used with countable plural nouns.",
        "“Many” is used with countable plural nouns, but time here is uncountable.",
        "“Few” is used with countable plural nouns and also has a negative meaning."]},
    {q:"I only took ______ notes during the meeting because the slides were shared.",
     o:["a little","a few","much","any"], a:1,
     e:["“A little” is used with uncountable nouns, but notes is countable and plural.",
        "Correct. “A few” is used for a small number of countable plural nouns.",
        "“Much” is used with uncountable nouns, mainly in questions and negatives.",
        "“Any” is not used in a simple positive statement of this kind."]},
    {q:"There were too ______ emails in my inbox this morning.",
     o:["much","many","a little","a lot"], a:1,
     e:["“Much” is used with uncountable nouns, but emails is countable and plural.",
        "Correct. “Many” follows “too” before a countable plural noun.",
        "“A little” is used with uncountable nouns and does not follow “too”.",
        "“A lot” is not used after “too”; the phrases are “too many” and “too much”."]}
   ]}
  ]
},
{
  id: 23, name: "BAC+2 · Test 3", theme: "Writing my CV",
  parts: [
   {t:"Part 1 · Present Simple, Continuous & Past Simple", q:[
    {q:"I ______ my CV in English at the moment, so I can’t come to the meeting.",
     o:["write","writes","wrote","am writing"], a:3,
     e:["The present simple describes habits, not an action happening right now.",
        "This form adds a third-person “s” to a verb with the subject “I”, so the agreement is wrong.",
        "The past simple refers to a finished action, but this action is still going on.",
        "Correct. The present continuous is used for an action in progress now, shown by “at the moment”."]},
    {q:"Last summer I ______ a two-month internship in a small factory.",
     o:["have doing","do","am doing","did"], a:3,
     e:["This mixes “have” with a participle incorrectly, so it is not a possible English verb form.",
        "The present simple cannot express a finished action placed in the past.",
        "The present continuous describes something happening now, not last summer.",
        "Correct. The past simple is used for a finished action with a past time marker like “last summer”."]},
    {q:"My sister ______ for a job in logistics these days.",
     o:["look","looks","is looking","looked"], a:2,
     e:["The verb does not agree with the singular subject “my sister”.",
        "The present simple suggests a permanent routine, but “these days” shows a temporary situation.",
        "Correct. The present continuous is used for a temporary situation around the present, shown by “these days”.",
        "The past simple places the action in finished past time, which “these days” contradicts."]},
    {q:"Engineers usually ______ their CVs to one page in France.",
     o:["are keeping","kept","keep","keeps"], a:2,
     e:["The present continuous describes a temporary action, not a general habit with “usually”.",
        "The past simple refers to finished past time, but this is a general truth.",
        "Correct. The present simple with “usually” expresses a general habit or general truth.",
        "The third-person “s” does not agree with the plural subject “engineers”."]},
    {q:"Why ______ you ______ that photo from your CV yesterday?",
     o:["do / remove","did / remove","did / removed","are / removing"], a:1,
     e:["The present simple auxiliary cannot be used with the past time marker “yesterday”.",
        "Correct. Past simple questions use “did” plus the base form of the verb.",
        "After the auxiliary “did”, the verb must stay in the base form, not the past form.",
        "The present continuous does not fit a finished action marked by “yesterday”."]},
    {q:"Right now the recruiter ______ my application letter.",
     o:["reads","was read","read","is reading"], a:3,
     e:["The present simple expresses habits and does not fit “right now”.",
        "This is a past passive form, but the recruiter is the one doing the action.",
        "This form gives no sense of an action in progress at the present moment.",
        "Correct. The present continuous is used for an action happening at this moment."]},
    {q:"Choose the correct sentence.",
     o:["I am speaking three languages and I learn Spanish now.","I speak three languages and I am learning Spanish now.","I speaking three languages and I learning Spanish now.","I spoke three languages and I am learn Spanish now."], a:1,
     e:["A permanent ability needs the present simple, and an action happening now needs the continuous, so both tenses are swapped here.",
        "Correct. The present simple states a permanent skill and the present continuous states an action in progress now.",
        "Both verbs are missing the auxiliary “am”, so neither form is complete.",
        "The first verb puts a present ability in the past, and the second mixes “am” with a base verb."]},
    {q:"When I ______ at school, I had no professional experience.",
     o:["am","was","been","were"], a:1,
     e:["The present tense does not fit a situation described in the past with “had”.",
        "Correct. The past simple of “be” with “I” is “was”, and it matches the past verb “had”.",
        "This is a past participle and cannot stand alone as the verb of the clause.",
        "This past form is used with “you”, “we” and “they”, not with “I”."]},
    {q:"My tutor ______ me to add my soft skills, and I added them the same day.",
     o:["advises","is advising","advised","advise"], a:2,
     e:["The present simple does not match the finished past action in the second clause.",
        "The present continuous describes an action in progress, not a completed past event.",
        "Correct. The past simple is used because the action is finished and linked to “the same day”.",
        "The verb does not agree with the singular subject “my tutor”."]},
    {q:"______ you ______ English at work every day?",
     o:["Do / use","Are / use","Do / using","Did / use"], a:0,
     e:["Correct. Present simple questions with “you” use “do” plus the base form, which suits “every day”.",
        "The auxiliary “are” must be followed by an “-ing” form, not a base form.",
        "The auxiliary “do” must be followed by the base form, not an “-ing” form.",
        "The auxiliary “did” refers to past time and does not fit “every day” as a present habit."]}
   ]},
   {t:"Part 2 · Common Modal Auxiliaries", q:[
    {q:"You ______ write your date of birth on a British CV; it is not expected.",
     o:["mustn’t","shouldn’t have","can’t","don’t have to"], a:3,
     e:["This modal expresses a strict prohibition, which is stronger than the idea of “not expected”.",
        "This form criticises a past action, but the sentence talks about a general rule.",
        "This modal expresses impossibility or lack of permission, not absence of obligation.",
        "Correct. “Don’t have to” expresses the absence of obligation."]},
    {q:"I ______ use spreadsheet software quite well, but I am still slow with databases.",
     o:["must","should","can","may"], a:2,
     e:["This modal expresses obligation, not personal skill.",
        "This modal gives advice, not information about what someone is able to do.",
        "Correct. “Can” expresses ability or skill.",
        "This modal expresses permission or possibility, not ability."]},
    {q:"Candidates ______ arrive late for the interview; the door is closed at nine o’clock exactly.",
     o:["mustn’t","needn’t","may not have","don’t must"], a:0,
     e:["Correct. “Mustn’t” expresses a strong prohibition or a strict rule.",
        "This modal expresses the absence of obligation, which is the opposite of a strict rule.",
        "This adds “have” after a modal without a participle, so the form is not possible here.",
        "Modals never take the auxiliary “do”, so this construction does not exist in English."]},
    {q:"Your CV has three spelling mistakes. You ______ check it again before sending it.",
     o:["can","should","may","mustn’t"], a:1,
     e:["This modal expresses ability, but the sentence gives a recommendation.",
        "Correct. “Should” is used to give advice or a recommendation.",
        "This modal expresses permission or possibility, not advice.",
        "This modal forbids an action, but checking the CV is being encouraged."]},
    {q:"______ I use your computer to print my application form?",
     o:["Must","Have to","Should","May"], a:3,
     e:["This modal asks about obligation, which does not fit a polite request.",
        "This form is not used at the start of a question without an auxiliary, so the structure is wrong.",
        "This modal asks for advice rather than permission.",

    {q:"In France you ______ provide a payslip when you sign a rental contract.",
     o:["may not","can","mustn’t","have to"], a:3,
     e:["This form refuses permission, which contradicts the idea of a requirement.",
        "This modal expresses ability, not an obligation imposed by rules.",
        "This modal forbids the action, but the document is in fact required.",
        "Correct. “Have to” expresses an obligation that comes from an external rule."]},
    {q:"Choose the correct sentence about her skills.",
     o:["She can to speak German and she must finishing her CV.","She cans speak German and she musts finish her CV.","She can speak German and she must finish her CV.","She can speaking German and she must to finish her CV."], a:2,
     e:["“To” must not follow “can”, and “must” must be followed by a base form, not an “-ing” form.",
        "Modals never take a third-person “s”, so both verbs are wrongly conjugated.",

    {q:"He ______ drive, so he always travels to the office by train.",

    {q:"You ______ send a cover letter if the advert doesn’t ask for one, but it is a good idea.",

   {t:"Part 3 · Past Habit: Used To", q:[
    {q:"Before I joined CESI, I ______ work in a supermarket at the weekend.",
     o:["use to","used to","am used to","will use to"], a:1,
     e:["In the affirmative, this form is missing the past “-d”, so it is not correct.",
        "Correct. “Used to” plus a base verb describes a habit that existed in the past but stopped.",
        "This structure means being familiar with something and needs an “-ing” form after it.",
        "“Used to” has no future form, so this construction does not exist."]},
    {q:"My father ______ work in a garage before he became a driver.",
     o:["used to","use to","is used to","used"], a:0,
     e:["Correct. “Used to” plus a base verb describes a habit that stopped in the past.",
        "In an affirmative sentence the form needs the past “-d”, so the base form is wrong here.",
        "This structure means being familiar with something and takes an “-ing” form after “to”.",
        "Without “to”, this reads as the simple past of “use”, which cannot be followed by “work”."]},
    {q:"There ______ a photo on my old CV, but I removed it last month.",
     o:["uses to be","used to being","is used to be","used to be"], a:3,
     e:["This form adds a present “-s”, but the sentence refers to past time.",
        "After “used to” for past habits, the verb must be in the base form, not “-ing”.",
        "This structure means being familiar with something, which is not the meaning here.",
        "Correct. “Used to be” describes a past state that is no longer true."]},
    {q:"I ______ be very shy in interviews; now I feel much calmer.",
     o:["used to","am used to","use to","used for"], a:0,
     e:["Correct. “Used to be” describes a past state that is no longer true.",
        "This structure means being familiar with something, and it also places the idea in the present.",
        "An affirmative sentence needs the past form with “-d”, not the base form.",
        "“Used for” introduces a purpose and takes an “-ing” form, so it cannot describe a past state."]},
    {q:"I ______ speak any English at all, but now I can hold a short conversation.",
     o:["didn’t used to","didn’t use to","not used to","don’t use to"], a:1,
     e:["After the auxiliary “didn’t”, the verb must be “use”, without the final “-d”.",
        "Correct. The negative of “used to” is “didn’t use to”, with the base form after “didn’t”.",
        "This form has no auxiliary, so the negative sentence is not complete.",
        "The present auxiliary “don’t” cannot be used for a habit that belongs to the past."]},
    {q:"She ______ like English, but last year she passed her exam with a good mark.",
     o:["didn’t used to","didn’t use to","not used to","wasn’t used to"], a:1,
     e:["After “didn’t” the verb must lose the past “-d”, so this form is not correct.",
        "Correct. The negative of “used to” is “didn’t use to” plus a base verb.",
        "There is no auxiliary here, so the negative sentence has no complete verb group.",
        "This structure means being familiar with something and needs an “-ing” form after it."]},
    {q:"My brother ______ a very good student, but he works hard now.",
     o:["didn’t use to be","wasn’t used to be","didn’t used to be","doesn’t use to be"], a:0,
     e:["Correct. “Didn’t use to be” describes a past state that was not true before.",
        "“Be used to” expresses familiarity and cannot be followed by the base verb “be”.",
        "After “didn’t” the verb must be “use”, without the past “-d”.",
        "The present auxiliary “doesn’t” cannot describe a state that belongs to the past."]},
    {q:"______ you ______ to write your CV by hand at school?",
     o:["Did / used","Do / use","Did / use","Were / use"], a:2,
     e:["After the auxiliary “did”, the verb must stay in the base form “use”.",
        "The present auxiliary “do” cannot ask about a habit that belongs to past school days.",
        "Correct. Questions about past habits are formed with “did” plus “use to”.",
        "“Were” must be followed by an “-ing” form or an adjective, not by “use to”."]},
    {q:"We ______ have a careers lesson every Friday, but the school stopped it last year.",
     o:["didn’t use to","are used to","use to","used to"], a:3,
     e:["This negative says the habit did not exist, but the second clause shows that it did.",
        "This structure expresses present familiarity, not a habit that has stopped.",
        "The affirmative form needs the past “-d”, so the base form is wrong here.",
        "Correct. “Used to” plus a base verb describes a repeated past habit that has now stopped."]},
    {q:"Last Monday I ______ three job adverts in the local paper.",
     o:["used to answer","use to answer","answered","am answering"], a:2,
     e:["“Used to” describes a repeated habit, not a single action on one named day.",
        "This form is missing the past “-d” and it also expresses a habit, not a single action.",
        "Correct. The past simple is used for a finished action with a precise past time marker.",
        "The present continuous describes an action in progress now, not one finished last Monday."]}
   ]},
   {t:"Part 4 · Prepositions of Place & Time", q:[
    {q:"I sent my application ______ Monday morning.",
     o:["in","on","at","during"], a:1,
     e:["This preposition is used with months, years and parts of the day, not with a named day.",
        "Correct. “On” is used before days and dates.",
        "This preposition is used with clock times and fixed expressions, not with days.",
        "This preposition introduces a period of time, not a precise day."]},
    {q:"My training course is ______ September; it lasts four weeks.",
     o:["on","in","at","since"], a:1,
     e:["This preposition is used with days and dates, not with the name of a month.",
        "Correct. “In” is used with months, seasons and years.",
        "This preposition is used with clock times and a few fixed expressions, not with months.",
        "This preposition marks the start of a situation, not the month when something happens."]},
    {q:"The interview starts ______ half past nine.",
     o:["in","on","at","by"], a:2,
     e:["This preposition is used with months, years and longer periods, not with clock times.",
        "This preposition is used with days and dates, not with a precise time.",
        "Correct. “At” is used with clock times.",
        "“By” means not later than a limit, but here the time is the exact starting point."]},
    {q:"I worked in this company ______ 2024 to 2026.",
     o:["since","for","during","from"], a:3,
     e:["“Since” needs the present perfect, so it does not fit a finished past period.",
        "This preposition is used with a length of time, such as “two years”, not with a date.",
        "This preposition introduces a period in which something happens, not a starting point.",
        "Correct. “From” marks the start of a period and pairs with “to”."]},
    {q:"I worked in that restaurant ______ six months.",
     o:["since","during","until","for"], a:3,
     e:["“Since” is used with a point in time, not with a length of time.",
        "“During” introduces a named period, such as “the summer”, not a measured length.",
        "“Until” marks the end point of a period, not how long the period lasted.",
        "Correct. “For” is used with a length of time, such as “six months”."]},
    {q:"I keep my diplomas ______ a blue folder on my desk.",
     o:["on","at","in","to"], a:2,
     e:["This preposition means on a surface, but the diplomas are inside the folder.",
        "This preposition indicates a point or a place in general, not the inside of an object.",
        "Correct. “In” is used for something inside a container or closed space.",
        "This preposition expresses movement towards a place, not a position."]},
    {q:"The HR office is ______ the second floor, ______ the lift and the stairs.",
     o:["in / between","on / among","on / between","at / between"], a:2,
     e:["Floors take “on”, not “in”, so the first preposition is wrong.",
        "“Among” is used with a group or three or more things, not with two named objects.",
        "Correct. “On” is used with floors and “between” is used with two things.",
        "“At” gives a general point, but a floor of a building takes “on”."]},
    {q:"We talked about my skills ______ the whole interview.",
     o:["during","since","while","at"], a:0,
     e:["Correct. “During” is followed by a noun and shows when something happens inside a period.",
        "This preposition marks the start of a situation, not the period in which something happens.",
        "This word introduces a clause with a verb, not a noun phrase like “the whole interview”.",
        "“At” marks a precise point in time, not a long event."]},
    {q:"Please send your CV ______ Friday at the latest.",
     o:["by","until","since","during"], a:0,
     e:["Correct. “By” means at or before a deadline.",
        "“Until” shows that an action continues up to a moment, which does not fit a single action.",
        "“Since” shows when a situation started, not when something must be finished.",
        "“During” introduces a period in which something happens, not a deadline."]},
    {q:"I usually go ______ the career office ______ lunchtime.",
     o:["to / at","at / to","in / on","to / on"], a:0,
     e:["Correct. “To” shows movement towards a place and “at” is used with points in time such as “lunchtime”.",
        "The first preposition shows position, not movement, and the second expresses direction, not time.",
        "The first preposition cannot follow the verb “go” before a place, and the second is used with days.",
        "The second preposition is used with days and dates, not with “lunchtime”."]}
   ]},
   {t:"Part 5 · Future Forms: Will & Going To", q:[
    {q:"I decided yesterday: I ______ apply for that internship in Lyon.",
     o:["am going to","will have","will to","would"], a:0,
     e:["Correct. “Going to” expresses a plan or an intention already decided.",
        "This form needs a past participle after “have”, so the construction is incomplete.",
        "A modal such as “will” is never followed by “to” before the main verb.",
        "This modal expresses a hypothesis, not a decision already taken."]},
    {q:"We ______ meet the HR manager at ten; the appointment is in my diary.",
     o:["will to","is going to","are going to","go"], a:2,
     e:["A modal such as “will” is never followed by “to” before the main verb.",
        "“Is going to” does not agree with the subject “we”, which needs “are”.",
        "Correct. “Going to” expresses a plan or arrangement already fixed.",
        "The present simple is used for timetables, but here the verb has no future meaning on its own."]},
    {q:"That box of brochures looks heavy. I ______ carry it for you.",
     o:["am going","will","go to","am will"], a:1,
     e:["“Am going” needs “to” before the next verb, so the verb group is incomplete.",
        "Correct. “Will” is used for an offer or a decision made while speaking.",
        "“Go to” before a base verb is not a possible English verb form.",
        "A modal such as “will” is never preceded by “am”, so this form does not exist."]},
    {q:"Don’t worry about the interview questions. I ______ help you with them.",
     o:["am going","am helping","will","was going to"], a:2,
     e:["“Am going” needs “to” before the base verb, so the verb group is incomplete.",
        "The present continuous would announce a fixed arrangement, not a spontaneous offer.",
        "Correct. “Will” is used for an offer or a decision taken at the moment of speaking.",
        "This past form says the plan did not happen, which contradicts the reassurance."]},
    {q:"Look at those dark clouds. The recruitment fair ______ close early.",

     e:["A modal such as “will” is never followed by “to” before the main verb.",
        "“Is” cannot be followed directly by the base verb “close”.",
        "“Goes to” is a present simple form and cannot build the future here.",
        "Correct. “Going to” is used for a prediction based on present evidence we can see."]},
    {q:"Look at the long queue at the job fair — we ______ wait a long time.",
     o:["are going to","will to","go to","are going"], a:0,
     e:["Correct. “Going to” expresses a prediction based on evidence we can see now.",
        "A modal such as “will” is followed directly by the base verb, never by “to”.",
        "“Go to” before a base verb is not a possible English verb form.",
        "“Are going” needs “to” before the next verb, so the verb group is incomplete."]},
    {q:"Our teacher thinks the exam ______ be easier than last year’s.",
     o:["will","is going to have","used to","going to"], a:0,
     e:["Correct. “Will” expresses a prediction or an opinion about the future.",
        "This form adds “have” without a participle, so the verb group is not possible.",
        "This form describes a past habit and cannot express an opinion about a future exam.",

    {q:"I promise I ______ answer your email tomorrow morning.",

        "A modal such as “will” is followed directly by the base verb, never by “to”.",
        "This form is missing the verb “be”, so the structure is not complete.",
        "Correct. “Will” is used to make a promise."]},
    {q:"I’m sure you ______ get a reply before the end of the week.",

     e:["This form refers to a past habit, not to a prediction about this week.",
        "This form needs “to” before the next verb, so the structure is incomplete.",
        "Correct. “Will” is used to make a prediction about the future.",
        "This form refers to something that did not happen in the past."]},
    {q:"Choose the correct sentence about sending your CV.",
     o:["I am going to send my CV tonight and I will call the company tomorrow.","I will going to send my CV tonight and I am call the company tomorrow.","I am going send my CV tonight and I will to call the company tomorrow.","I going to send my CV tonight and I will calling the company tomorrow."], a:0,
     e:["Correct. “Be going to” gives the plan already decided and “will” plus the base verb gives the decision about tomorrow.",
        "“Will” and “going to” cannot be combined, and “am call” is not a possible verb form.",

   {t:"Part 6 · Common Phrasal Verbs", q:[

    {q:"Choose the correct sentence about your account.",

   {t:"Part 7 · Articles, Countable & Uncountable", q:[
    {q:"She is ______ engineering student in her second year.",
     o:["a","no article","the","an"], a:3,
     e:["This article is used before a consonant sound, but the next word begins with a vowel sound.",
        "A singular countable noun describing a job or status needs an article.",
        "The definite article points to a known person, but here the person is introduced for the first time.",
        "Correct. “An” is used before a word beginning with a vowel sound, as in “engineering”."]},
    {q:"My mother is ______ nurse in a big hospital.",
     o:["a","some","an","no article"], a:0,
     e:["Correct. A job in the singular takes “a” before a word beginning with a consonant sound.",
        "“Some” is used with plural or uncountable nouns, not with a singular job noun.",
        "“An” is used before a vowel sound, and “nurse” begins with a consonant sound.",
        "A singular countable noun naming a job cannot stand alone without an article."]},
    {q:"______ interview was shorter than I expected, and I left at five.",
     o:["A","An","The","No article"], a:2,
     e:["This article introduces something for the first time, but this interview is already known.",
        "This article also introduces a new item, and the sentence refers to a specific known interview.",
        "Correct. “The” is used for a specific thing already known to both speakers.",
        "A singular countable noun cannot stand alone as the subject without a determiner."]},
    {q:"I put my photo at the top of ______ first page of my CV.",
     o:["a","an","the","no article"], a:2,
     e:["The indefinite article introduces a new item, but this page is a unique, identified one.",
        "This article is also indefinite and is used before a vowel sound, which does not apply here.",
        "Correct. “The” is used with ordinal numbers such as “first” to point to a unique item.",
        "A singular countable noun needs a determiner in this position."]},
    {q:"How ______ experience do you have with technical drawing?",
     o:["many","much","few","a lot"], a:1,
     e:["This quantifier is used with countable plural nouns, but “experience” is uncountable here.",
        "Correct. “Much” is used in questions with uncountable nouns such as “experience”.",
        "This quantifier is used with countable nouns and is not used in this question pattern.",
        "This expression is not used in questions of this type and needs “of” before an uncountable noun."]},
    {q:"How ______ languages do you speak?",
     o:["much","many","a little","any"], a:1,
     e:["“Much” goes with uncountable nouns, but “languages” is countable and plural.",
        "Correct. “Many” is used with countable plural nouns in questions about number.",
        "“A little” goes with uncountable nouns and is not used in this question pattern.",
        "“Any” is not used after “how” in a question about number."]},
    {q:"There are only ______ places left on the English course.",
     o:["a little","much","a few","any"], a:2,
     e:["This quantifier is used with uncountable nouns, but “places” is countable and plural.",
        "This quantifier is also used with uncountable nouns, so it does not fit “places”.",
        "Correct. “A few” is used with countable plural nouns to mean a small number.",
        "This quantifier is normally used in questions and negative sentences, not in this affirmative one."]},
    {q:"I need ______ advice about my cover letter.",
     o:["a few","many","a little","an"], a:2,
     e:["“A few” counts separate items, but “advice” is uncountable in English.",
        "“Many” asks about a number, and “advice” has no plural form.",
        "Correct. “A little” is used with uncountable nouns to mean a small quantity.",
        "An uncountable noun cannot take the indefinite article."]},
    {q:"Did you get ______ feedback after the interview?",
     o:["few","any","many","a"], a:1,
     e:["“Few” counts separate items, so it cannot go with an uncountable noun like “feedback”.",
        "Correct. “Any” is used with uncountable nouns in questions and negative sentences.",
        "“Many” asks about a number, but “feedback” has no plural form and cannot be counted.",
        "An uncountable noun cannot take the indefinite article."]},
    {q:"I don’t have ______ work experience in that field.",
     o:["many","a few","some","any"], a:3,
     e:["“Many” goes with countable plural nouns, and “work experience” is uncountable here.",
        "“A few” counts separate items, so it does not fit an uncountable noun.",
        "“Some” belongs to affirmative sentences; this negative sentence needs another quantifier.",
        "Correct. “Any” is used with uncountable nouns in negative sentences."]}
   ]}
  ]
