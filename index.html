<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Grammar Practice · CESI</title>
<style>
:root{
  --paper:#fbfaf5;
  --ink:#16233d;
  --ink-soft:#5c6a85;
  --ink-faint:#93a0b5;
  --rule:#cbd9ef;
  --margin:#e3aab2;
  --pen:#b3352c;
  --accent:#16233d;
  --good:#1c7a56;
  --good-bg:#eef7f2;
  --bad-bg:#fbf1f0;
  --card:#ffffff;
  --line:#e6e5dc;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body[data-lvl="bac1"]{--accent:#7a3b5e}
body[data-lvl="bac2"]{--accent:#1d6f6a}
body[data-lvl="bac3"]{--accent:#8a5a14}
body[data-lvl="bac4"]{--accent:#3f6b3f}
body[data-lvl="bac5"]{--accent:#3b4a8c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:32px;
  -webkit-font-smoothing:antialiased;
}
.sheet{max-width:780px;margin:0 auto;padding:32px 24px 96px 24px;position:relative}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:56px;width:1px;background:var(--margin)}
.wrap{padding-left:44px}
@media(max-width:700px){
  .sheet{padding-left:16px;padding-right:16px}
  .sheet::before{display:none}
  .wrap{padding-left:0}
}
.eyebrow{
  font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);line-height:32px;margin:0;
}
.eyebrow b{color:var(--accent);font-weight:600}
h1{font-size:34px;line-height:48px;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
.lede{color:var(--ink-soft);margin:0 0 32px;max-width:54ch}
.pick{display:grid;gap:16px;margin:0 0 32px}
.pick button{
  display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:2px;padding:16px 20px;cursor:pointer;
  font-family:inherit;color:inherit;transition:transform .12s ease,border-color .12s ease;
}
.pick button:hover{transform:translateX(3px);border-left-color:var(--pen)}
.pick .pt{font-size:20px;line-height:28px;display:block}
.pick .ps{font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;color:var(--ink-soft);line-height:24px;display:block}
.pick .pc{
  font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);line-height:22px;display:block;
}
.syl{margin:0 0 32px;border-top:1px solid var(--line)}
.syl div{
  font-family:var(--sans);font-size:13px;line-height:22px;color:var(--ink-soft);
  border-bottom:1px solid var(--line);padding:9px 0;
}
.note{font-family:var(--sans);font-size:13px;line-height:22px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:16px}
.note b{color:var(--ink)}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px}
.part{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--pen)}
.count{font-family:var(--sans);font-size:12px;color:var(--ink-faint);letter-spacing:.06em}
.bar{height:2px;background:var(--line);margin-bottom:32px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .3s ease}
.qnum{
  position:absolute;left:-44px;width:32px;text-align:right;color:var(--pen);
  font-family:var(--sans);font-size:13px;letter-spacing:.02em;
}
@media(max-width:700px){.qnum{display:none}}
.qbox{position:relative}
.q{font-size:22px;line-height:36px;margin:0 0 24px}
.opts{display:grid;gap:8px;margin-bottom:24px}
.opt{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:11px 16px;cursor:pointer;font-family:inherit;font-size:17px;line-height:26px;color:inherit;
}
.opt:hover:not(:disabled){border-color:var(--ink-soft)}
.opt:disabled{cursor:default}
.opt .k{
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-faint);
  border:1px solid var(--line);border-radius:2px;min-width:22px;height:22px;display:grid;place-items:center;
  margin-top:2px;flex:none;
}
.opt.sel{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.opt.sel .k{border-color:var(--ink);color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:inset 3px 0 0 var(--good)}
.opt.right .k{border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:#e9cdc9;box-shadow:inset 3px 0 0 #e0b6b1;color:var(--ink-soft)}
.opt.picked.wrong{box-shadow:inset 3px 0 0 var(--pen);border-color:var(--pen)}
.opt .tag{
  font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  margin-left:auto;padding-left:12px;flex:none;color:var(--pen);line-height:26px;
}
.opt.right .tag{color:var(--good)}
.why{font-family:var(--sans);font-size:13.5px;line-height:22px;color:var(--ink-soft);margin:0;padding:0 16px 12px 52px}
.why.ok{color:var(--good)}
.verdict{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--pen)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button.go{
  font-family:var(--sans);font-size:14px;letter-spacing:.02em;background:var(--ink);color:#fff;
  border:1px solid var(--ink);border-radius:2px;padding:10px 22px;cursor:pointer;
}
button.go:disabled{background:transparent;color:var(--ink-faint);border-color:var(--line);cursor:not-allowed}
button.ghost{
  font-family:var(--sans);font-size:14px;background:transparent;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:2px;padding:10px 18px;cursor:pointer;
}
button.ghost:hover{color:var(--ink);border-color:var(--ink-soft)}
.hint{font-family:var(--sans);font-size:12px;color:var(--ink-faint);margin-left:auto}
@media(max-width:700px){.hint{display:none}}
.score{font-size:64px;line-height:72px;margin:0}
.score small{font-size:24px;color:var(--ink-faint)}
.gradeline{font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin:0 0 24px}
.gradeline b{color:var(--accent);font-size:15px}
.breakdown{display:grid;gap:8px;margin:24px 0 32px}
.brow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;font-family:var(--sans);font-size:13px}
.brow .track{grid-column:1/-1;height:4px;background:var(--line)}
.brow .track i{display:block;height:4px;background:var(--ink)}
.brow .track i.low{background:var(--pen)}
.review{border-top:1px solid var(--line)}
.rev{border-bottom:1px solid var(--line);padding:12px 0}
.rev summary{cursor:pointer;font-size:16px;line-height:26px;list-style:none;display:flex;gap:12px}
.rev summary::-webkit-details-marker{display:none}
.rev summary .n{font-family:var(--sans);font-size:12px;color:var(--pen);min-width:28px;flex:none;line-height:26px}
.rev summary .rpart{
  display:block;font-family:var(--sans);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);font-style:normal;line-height:20px;
}
.rev[open] summary{margin-bottom:12px}
.rev .opts{margin-bottom:0}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="sheet"><div class="wrap" id="app"></div></div>
<script>
const T_BAC1 = [
{
  id: 11, name: "BAC+1 · Test 1", theme: "Introducing myself",
  parts: [
   {t:"Part 1 · Present Simple", q:[
    {q:"Marie ______ English every Monday morning.",
     o:["study","studies","studys","is study"], a:1,
     e:["After “Marie” the present simple verb needs an -s.",
        "Correct. With he, she or it we add -s to the present simple verb.",
        "The spelling is wrong: a verb ending in a consonant plus -y changes the -y to -ies.",
        "“Is” cannot be followed by the bare verb."]},
    {q:"We ______ our classes at eight every morning.",
     o:["begin","begins","is beginning","beginning"], a:0,
     e:["Correct. With “we” the present simple verb has no -s.",
        "The -s form is only for he, she or it.",
        "“Is” does not go with “we”.",
        "A verb with -ing cannot stand alone as the main verb."]},
    {q:"My brother ______ like coffee. He drinks tea.",
     o:["don’t","isn’t","doesn’t","not"], a:2,
     e:["“Don’t” is for I, you, we and they.",
        "“Isn’t” cannot make a negative with another main verb.",
        "Correct. With he, she or it the negative is doesn’t plus the bare verb.",
        "“Not” alone cannot make a negative verb in English."]},
    {q:"______ you live near the school?",
     o:["Are","Is","Does","Do"], a:3,
     e:["“Are” cannot be used with a main verb like live.",
        "“Is” does not go with “you”.",
        "“Does” is only for he, she or it.",
        "Correct. Present simple questions with “you” start with Do."]},
    {q:"Hugo and I ______ in the same student flat.",
     o:["live","lives","is living","am living"], a:0,
     e:["Correct. “Hugo and I” means “we”, so the verb has no -s.",
        "The -s form is only for one person: he, she or it.",
        "“Is” does not go with a plural subject.",
        "“Am” is only used with “I” alone."]},
    {q:"______ your sister study at CESI too?",
     o:["Do","Does","Is","Are"], a:1,
     e:["“Do” is not used with he, she or it in present simple questions.",
        "Correct. For he, she or it, questions use Does plus the bare verb.",
        "“Is” cannot be followed by the bare verb study.",
        "“Are” cannot be followed by the bare verb “study”."]},
    {q:"Choose the correct sentence.",
     o:["She play football every weekend.","She is play football every weekend.","She plays football every weekend.","She playing football every weekend."], a:2,
     e:["The verb is missing the -s after “she”.",
        "“Is” cannot be followed by the bare verb.",
        "Correct. With “she” the present simple verb takes an -s.",
        "This sentence needs “is” before the -ing form."]},
    {q:"They ______ in a small flat in the city centre.",
     o:["live","lives","is living","living"], a:0,
     e:["Correct. With “they” the present simple verb has no -s.",
        "The -s form is only for he, she or it.",
        "“Is” does not go with “they”.",
        "A verb with -ing needs “are” before it."]},
    {q:"My sister never ______ coffee in the morning.",
     o:["drink","is drinking","drinking","drinks"], a:3,
     e:["After “my sister” the present simple verb needs an -s.",
        "“Never” describes a habit, not an action happening now.",
        "A verb with -ing cannot stand alone as the main verb.",
        "Correct. With he, she or it the present simple verb takes an -s."]},
    {q:"My father ______ work at seven o’clock every day.",
     o:["start","is start","starting","starts"], a:3,
     e:["After “my father” the present simple verb needs an -s.",
        "“Is” cannot be followed by the bare verb.",
        "A verb with -ing cannot stand alone as the main verb.",
        "Correct. “Every day” shows a routine, and he takes the -s form."]}
   ]},
   {t:"Part 2 · Present Continuous", q:[
    {q:"Right now I ______ to my new classmates.",
     o:["am talking","talk","talks","are talking"], a:0,
     e:["Correct. For something happening right now we use am, is or are plus -ing.",
        "The present simple is for routines, not for this moment.",
        "The -s form is only for he, she or it.",
        "“Are” does not go with “I”."]},
    {q:"Look! Our teacher ______ on the board.",
     o:["writes","is writing","write","writing"], a:1,
     e:["The present simple describes a habit, not an action happening now.",
        "Correct. “Look!” shows the action is happening now, so we use is plus -ing.",
        "This form has no -s and it does not show an action in progress.",
        "A verb with -ing needs “is” before it."]},
    {q:"Listen! The teacher ______ our names.",
     o:["is calling","call","calls","calling"], a:0,
     e:["Correct. “Listen!” shows the action is happening now, so we use is plus -ing.",
        "This form has no -s and it does not show an action in progress.",
        "The present simple describes a habit, not something happening at this moment.",
        "A verb with -ing cannot stand alone as the main verb."]},
    {q:"We ______ for the bus at the moment.",
     o:["wait","waits","are waiting","is waiting"], a:2,
     e:["The present simple describes a habit, not this moment.",
        "The -s form is only for he, she or it.",
        "Correct. “At the moment” needs are plus the -ing form.",
        "“Is” does not go with “we”."]},
    {q:"What ______ you doing in the library now?",
     o:["do","are","is","does"], a:1,
     e:["“Do” cannot be followed by the -ing form doing.",
        "Correct. Present continuous questions with “you” use are plus the -ing form.",
        "“Is” does not go with “you”.",
        "“Does” cannot be followed by the -ing form."]},
    {q:"Pierre ______ a book about planes at the moment.",
     o:["read","reads","readed","is reading"], a:3,
     e:["This form has no -s and it does not show an action in progress.",
        "The present simple describes a habit, not something happening at the moment.",
        "“Readed” is not an English word.",
        "Correct. “At the moment” needs is plus the -ing form."]},
    {q:"I ______ not listening to music right now.",
     o:["do","does","is","am"], a:3,
     e:["“Do” cannot be followed by the -ing form listening.",
        "“Does” is only for he, she or it and never comes before -ing.",
        "“Is” does not go with “I”.",
        "Correct. The negative with “I” is am not plus the -ing form."]},
    {q:"My parents ______ dinner in the kitchen now.",
     o:["cook","cooks","are cooking","is cooking"], a:2,
     e:["The present simple describes a habit, not an action in progress.",
        "The -s form is only for he, she or it.",
        "Correct. With a plural subject we use are plus the -ing form.",
        "“Is” does not go with a plural subject."]},
    {q:"Choose the correct sentence.",
     o:["He is runing to class now.","He is running to class now.","He running to class now.","He are running to class now."], a:1,
     e:["The spelling is wrong: run doubles the final n before -ing.",
        "Correct. Run doubles the final n, and “he” takes is before the -ing form.",
        "The verb “is” is missing before running.",
        "“Are” does not go with “he”."]},
    {q:"Sophie ______ a message to her family at the moment.",
     o:["send","sends","is sending","are sending"], a:2,
     e:["After “Sophie” the present simple verb needs an -s.",
        "The present simple describes a habit, not this moment.",
        "Correct. “At the moment” needs is plus the -ing form.",
        "“Are” does not go with “Sophie”; one person takes “is”."]}
   ]},
   {t:"Part 3 · To Be, To Have, To Do", q:[
    {q:"Hi, I ______ Camille and this is my friend Omar.",
     o:["are","am","is","be"], a:1,
     e:["“Are” is used with you, we or they.",
        "Correct. The verb to be with “I” is am.",
        "“Is” is used with he, she or it.",
        "“Be” is the base form and cannot be the verb here."]},
    {q:"My cousin ______ got two dogs.",
     o:["has","have","is","does"], a:0,
     e:["Correct. With he, she or it we use has got.",
        "“Have” is used with I, you, we and they.",
        "“Is” cannot be used before got in this structure.",
        "“Does” cannot be followed by got here."]},
    {q:"My parents ______ a small house in Brittany.",
     o:["has","is having","haves","have"], a:3,
     e:["“Has” is only used with he, she or it.",
        "“Is” does not go with a plural subject.",
        "“Haves” is not an English word.",
        "Correct. With a plural subject we use have."]},
    {q:"______ you got a brother or a sister?",
     o:["Do","Are","Have","Has"], a:2,
     e:["“Do” is not used before got in this structure.",
        "“Are” cannot be followed by got here.",
        "Correct. The question form of have got starts with Have.",
        "“Has” is only for he, she or it."]},
    {q:"Yesterday I ______ very nervous, but today I am fine.",
     o:["am","was","were","been"], a:1,
     e:["“Am” is a present form, but the sentence talks about yesterday.",
        "Correct. The past of am is was.",
        "“Were” is used with you, we and they.",
        "“Been” needs another verb before it."]},
    {q:"I ______ with you. English is difficult!",
     o:["agree","am agree","agrees","is agree"], a:0,
     e:["Correct. Agree is a normal verb, so we do not add the verb to be.",
        "The verb to be is never used before the main verb agree.",
        "The -s form is only for he, she or it.",
        "“Is” does not go with “I”."]},
    {q:"My best friend ______ long brown hair.",
     o:["have","is","has","does"], a:2,
     e:["“Have” is used with I, you, we and they.",
        "“Is” cannot show possession here.",
        "Correct. One person takes has.",
        "“Does” is an auxiliary and cannot show possession here."]},
    {q:"We ______ in the same group last year.",
     o:["was","are","is","were"], a:3,
     e:["“Was” is used with I, he, she and it.",
        "“Are” is a present form, but the sentence talks about last year.",
        "“Is” is a present form for one person or thing.",
        "Correct. The past of are with “we” is were."]},
    {q:"______ your father a teacher?",
     o:["Does","Is","Has","Do"], a:1,
     e:["“Does” cannot be followed directly by a noun like this.",
        "Correct. Questions with the verb to be start with Is for one person.",
        "“Has” would mean possession, which does not fit here.",
        "“Do” cannot be followed directly by a noun like this."]},
    {q:"Choose the correct sentence.",
     o:["I am twenty years old.","I have twenty years old.","I have got twenty years.","I am twenty years."], a:0,
     e:["Correct. In English we use the verb to be for age.",
        "This copies the French structure; have does not express age.",
        "Have got is not used for age in English.",
        "The word “old” is missing: we say “twenty years old”."]}
   ]},
   {t:"Part 4 · Past Simple", q:[
    {q:"I ______ to CESI for the first time last Monday.",
     o:["go","goed","went","am going"], a:2,
     e:["This is the present form, but “last Monday” needs the past.",
        "“Goed” is not an English word.",
        "Correct. The past simple of go is went.",
        "The present continuous cannot describe a finished past day."]},
    {q:"We ______ in the same school two years ago.",
     o:["are","is","was","were"], a:3,
     e:["This is a present form, but “two years ago” needs the past.",
        "“Is” is present and is used for one person or thing.",
        "“Was” is used with I, he, she and it.",
        "Correct. The past of are with “we” is were."]},
    {q:"She ______ not speak English at primary school.",
     o:["did","does","was","is"], a:0,
     e:["Correct. Past negatives use did not plus the bare verb.",
        "“Does” is a present auxiliary, but the sentence is about the past.",
        "“Was” cannot be followed by the bare verb speak.",
        "“Is” is present and cannot be followed by the bare verb."]},
    {q:"______ you meet your new classmates yesterday?",
     o:["Do","Did","Was","Are"], a:1,
     e:["“Do” is present, but “yesterday” needs a past question.",
        "Correct. Past questions use Did plus the bare verb.",
        "“Was” does not go with “you”.",
        "“Are” is present and cannot be followed by the bare verb."]},
    {q:"My family ______ to Lyon in 2019.",
     o:["move","moves","moved","moving"], a:2,
     e:["This present form does not fit the date 2019.",
        "This is a present form, but the sentence is about 2019.",
        "Correct. Regular past simple verbs end in -ed.",
        "A verb with -ing cannot stand alone as the main verb."]},
    {q:"Last week our teacher ______ us a funny video.",
     o:["show","shows","is showing","showed"], a:3,
     e:["This present form does not fit “last week”.",
        "This is the present simple, but the action is finished.",
        "The present continuous cannot describe a finished past week.",
        "Correct. The past simple of show is showed."]},
    {q:"I ______ my first English book when I was ten.",
     o:["read","readed","reads","am reading"], a:0,
     e:["Correct. Read keeps the same spelling in the past simple.",
        "“Readed” is not an English word.",
        "The -s form is present and only for he, she or it.",
        "The present continuous cannot be used with a finished past time."]},
    {q:"He ______ born in Nantes in 2006.",
     o:["is","was","were","did"], a:1,
     e:["“Is” is present, but 2006 is in the past.",
        "Correct. We say was born for one person in the past.",
        "“Were” is used with you, we and they.",
        "“Did” cannot be used before born."]},
    {q:"Yesterday they ______ me many questions about my studies.",
     o:["ask","asks","asked","asking"], a:2,
     e:["This present form does not fit “yesterday”.",
        "The -s form is present and only for he, she or it.",
        "Correct. The past simple of ask ends in -ed.",
        "A verb with -ing needs “were” before it."]},
    {q:"I ______ not have a laptop last year.",
     o:["do","was","am","did"], a:3,
     e:["“Do” is present, but “last year” needs the past.",
        "“Was” cannot be followed by the bare verb have.",
        "“Am” is present and cannot be followed by the bare verb.",
        "Correct. Did not plus the bare verb makes a past negative."]}
   ]},
   {t:"Part 5 · Question Words", q:[
    {q:"______ do you live? — In Rouen.",
     o:["Who","When","Why","Where"], a:3,
     e:["Who asks about a person, not a place.",
        "When asks about a time, not a place.",
        "Why asks for a reason, not a place.",
        "Correct. Where asks about a place."]},
    {q:"______ is your birthday? — In June.",
     o:["Where","Who","When","How"], a:2,
     e:["Where asks about a place, but the answer is a month.",
        "Who asks about a person.",
        "Correct. When asks about a time or a date.",
        "How asks about a way or a manner."]},
    {q:"______ are you studying engineering? — Because I like maths.",
     o:["What","Why","How","Who"], a:1,
     e:["What asks about a thing, not a reason.",
        "Correct. Why asks for a reason, and the answer starts with because.",
        "How asks about a way of doing something.",
        "Who asks about a person."]},
    {q:"______ brothers and sisters do you have?",
     o:["How many","How much","How long","How old"], a:0,
     e:["Correct. How many is used with countable plural nouns.",
        "How much is used with things we cannot count.",
        "How long asks about time or length.",
        "How old asks about age."]},
    {q:"______ is that girl next to the window? — She is my cousin.",
     o:["What","Where","Which","Who"], a:3,

   {t:"Part 6 · Determiners, Pronouns & Possession", q:[

   {t:"Part 7 · Prepositions of Place & Time", q:[

    {q:"We have a short break ______ the two lessons.",

    {q:"We eat lunch ______ the morning lesson, at half past twelve.",

        "On is used with days and dates."]}
   ]}

        "“What” asks about a thing, not a reason."]},
    {q:"______ does this coffee cost? Two euros.",
     o:["How many","How old","How far","How much"], a:3,
     e:["“How many” is for countable things, but coffee here is not counted.",
        "“How old” asks about age, not about a price.",
        "“How far” asks about distance, not about a price.",
        "Correct. “How much” asks about a price or an amount we cannot count."]},
    {q:"______ is the new manager? Her name is Claire.",
     o:["Who","Whose","Where","Which"], a:0,
     e:["Correct. “Who” asks about a person, and the answer gives a name.",
        "“Whose” asks about an owner, not about a person’s name.",
        "“Where” asks about a place, not a person.",
        "“Which” asks you to choose between clear options."]},
    {q:"______ do you go to the office? Three days a week.",
     o:["How long","How far","How often","How many"], a:2,
     e:["“How long” asks about a length of time.",
        "“How far” asks about distance.",
        "Correct. “How often” asks about frequency, and the answer gives days a week.",
        "“How many” needs a noun after it."]},
    {q:"______ bus do you take, the 12 or the 15?",

        "“Why” asks about a reason and cannot come before “bus”.",
        "“Who” asks about a person and cannot come before “bus”."]},
    {q:"Choose the correct question.",

     e:["A question with “where” needs the auxiliary “do”.",

   {t:"Part 6 · Determiners, Pronouns & Possession", q:[
    {q:"I need ______ pen to write the address.",
     o:["an","a","some","any"], a:1,
     e:["“An” goes before a vowel sound, and “pen” starts with a consonant.",
        "Correct. “A” goes before a singular noun that starts with a consonant sound.",
        "“Some” does not go with a singular noun like “pen”.",
        "“Any” does not fit a positive sentence with a singular noun."]},
    {q:"She is ______ engineer in our company.",
     o:["a","some","an","any"], a:2,
     e:["“A” goes before a consonant sound, but “engineer” starts with a vowel sound.",
        "“Some” does not go with a singular noun like “engineer”.",
        "Correct. “An” goes before a word that starts with a vowel sound.",
        "“Any” does not fit a positive sentence with a singular noun."]},
    {q:"______ chairs over there are very old.",

     e:["“This” is for one thing that is near.",

        "“Them” cannot come before a noun.",
        "Correct. “Those” is for several things that are far from you."]},
    {q:"This bag is not mine. It is ______ .",
     o:["her","she","her’s","hers"], a:3,
     e:["“Her” shows possession only before a noun; alone we use “hers”.",
        "“She” is a subject pronoun, not a possessive form.",
        "The spelling with an apostrophe is not a possible form.",
        "Correct. “Hers” is a possessive pronoun and can stand alone."]},
    {q:"We cleaned ______ desks before the visit.",
     o:["our","ours","us","we"], a:0,
     e:["Correct. “Our” is a possessive adjective and comes before the noun “desks”.",
        "“Ours” stands alone and cannot come before a noun.",
        "“Us” is an object pronoun, not a possessive form.",
        "“We” is a subject pronoun, not a possessive form."]},
    {q:"Choose the correct sentence about Marie’s desk.",
     o:["It is Marie desk’s.","It is the Marie desk.","It is Marie’s desk.","It is Marie desk."], a:2,
     e:["The apostrophe and -s go on the owner, not on the thing.",
        "A name cannot come after “the” before another noun like this.",
        "Correct. For people we add an apostrophe and -s to show possession.",
        "A name needs an apostrophe and -s to show possession."]},
    {q:"There is ______ information for you in this email.",

     e:["Correct. “Some” goes with an uncountable noun like “information”.",
        "“A” goes only before a singular countable noun.",
        "“An” goes only before a singular countable noun with a vowel sound.",
        "“Many” goes with countable plural nouns, and “information” is uncountable."]},
    {q:"We do not have ______ envelopes in the drawer.",

     e:["“Some” is not used in a negative sentence like this one.",

        "“A” goes only before a singular noun.",
        "“An” goes only before a singular noun."]},
    {q:"______ offices on the first floor are closed today.",

        "“An” goes only before a singular noun with a vowel sound.",
        "“Each” needs a singular noun after it."]},
    {q:"This coffee is not yours. It is ______ .",

        "“Me” is an object pronoun, not a possessive form.",
        "“I” is a subject pronoun, not a possessive form."]}
   ]},
   {t:"Part 7 · Prepositions of Place & Time", q:[
    {q:"The meeting is ______ Monday at ten.",
     o:["in","at","to","on"], a:3,
     e:["“In” is used for months, years and long periods.",
        "“At” is used for clock times, not for days.",
        "“To” shows direction, not a day.",
        "Correct. We use “on” before days of the week."]},
    {q:"My office is ______ the second floor.",
     o:["on","in","at","to"], a:0,
     e:["Correct. We use “on” before a floor of a building.",

        "“At” is used for one small point, not for a floor.",
        "“To” shows movement, but nothing moves here."]},
    {q:"I always start work ______ eight o’clock.",
     o:["in","on","at","to"], a:2,
     e:["“In” is used for months, years and long periods.",

        "Correct. We use “at” before a clock time.",
        "“To” shows direction, not a clock time."]},
    {q:"My desk is ______ the window and the door.",

     e:["“Next” needs “to” when it shows position.",
        "Correct. “Between” is used when there is one thing on each side.",

        "“On” means touching the top of something, which is not possible here."]},
    {q:"The keys are ______ the newspaper on my desk.",

        "“To” shows movement towards a place.",
        "“Of” does not show a position in space."]},
    {q:"Every morning I travel ______ the office by train.",

     e:["“At” shows a fixed point, not movement towards a place.",
        "Correct. “To” shows movement towards a place.",
        "“On” means touching a surface, not moving to a place.",
        "“Of” does not show direction."]},
    {q:"Claire sits ______ me in the open office.",
     o:["next to","next","between","under"], a:0,

        "“Between” needs two people or things after it.",
        "“Under” means below something."]},
    {q:"We have a short meeting ______ lunch, at half past one.",
     o:["in","on","after","of"], a:2,
     e:["“In” is used for months, years and long periods.",
        "“On” is used for days and dates.",
        "Correct. “After” shows that one thing happens later than another.",
        "“Of” does not show a time relation."]},
    {q:"I always check my emails ______ the meeting starts.",
     o:["in","at","on","before"], a:3,
     e:["“In” is used with months and years, not before a clause.",
        "“At” is used with clock times, not before a clause.",
        "“On” is used with days and dates, not before a clause.",
        "Correct. “Before” shows that one action happens earlier than another."]},
    {q:"My manager works ______ a small office near the entrance.",
     o:["on","to","of","in"], a:3,
     e:["“On” is used for floors and surfaces, not for a room.",
        "“To” shows movement, but nothing moves here.",
        "“Of” does not show a position in space.",
        "Correct. “In” is used for rooms and closed spaces."]}
   ]}
  ]

{

    {q:"I ______ the bus to work every day. I go by bike.",

    {q:"The shops ______ at eight o’clock on Saturday.",

    {q:"Choose the correct sentence.",

    {q:"How much ______ a bus ticket cost in this town?",

   {t:"Part 2 · Present Continuous", q:[

    {q:"My father ______ the newspaper in the kitchen at the moment.",

    {q:"Where is Anna? She ______ a coffee at the bar now.",

   {t:"Part 3 · To Be, To Have, To Do", q:[

   {t:"Part 5 · Question Words", q:[

        "Correct. “When” asks about time, and the answer gives a time."]},
    {q:"______ much is this coffee? — Two euros.",
     o:["How","What","Which","Who"], a:0,
     e:["Correct. “How much” asks about a price or an amount we cannot count.",
        "“What” cannot come before “much” in this question.",
        "“Which” is used to choose between things, not before “much”.",
        "“Who” asks about a person, not about a price."]},
    {q:"______ bus goes to the airport, the 5 or the 9?",
     o:["Who","Which","Whose","How"], a:1,
     e:["“Who” asks about a person, not about a bus.",
        "Correct. “Which” is used when we choose from a small number of options.",
        "“Whose” asks about the owner of something.",
        "“How” asks about a way or a manner, not about a choice."]},
    {q:"______ bag is this? — It is my sister’s.",
     o:["Who","Who’s","Whose","Which"], a:2,
     e:["“Who” asks about a person and cannot come before a noun like this.",
        "“Who’s” means “who is”, so it does not fit before “bag”.",
        "Correct. “Whose” asks who the owner is.",
        "“Which” asks you to choose, but the answer names an owner."]},
    {q:"______ are you late? — Because the bus didn’t come.",
     o:["How","When","Where","Why"], a:3,
     e:["“How” asks about a way or a manner.",
        "“When” asks about time, but the answer gives a reason.",
        "“Where” asks about a place, not about a reason.",
        "Correct. “Why” asks for a reason, and the answer starts with “because”."]},
    {q:"______ do you live? — Near the station.",
     o:["Where","What","Who","Why"], a:0,
     e:["Correct. “Where” asks about a place, and the answer gives a place.",
        "“What” asks about a thing, not about a place.",
        "“Who” asks about a person, not about a place.",
        "“Why” asks for a reason, not for a place."]},
    {q:"How ______ people were on the bus?",
     o:["much","many","long","old"], a:1,
     e:["“How much” is for things we cannot count, but “people” can be counted.",
        "Correct. “How many” is used with countable plural nouns like “people”.",
        "“How long” asks about time or length, not about a number of people.",
        "“How old” asks about age, not about a number of people."]},
    {q:"Choose the correct word order.",
     o:["Where you are going?","Where are going you?","Where are you going?","Where go you?"], a:2,
     e:["In a question the verb “are” must come before the subject.",
        "The subject “you” must come straight after “are”.",
        "Correct. Questions put the auxiliary before the subject, as in “are you going”.",
        "English questions need an auxiliary like “do” or “are”."]},
    {q:"______ is that man at the counter? — He is the waiter.",
     o:["Which","What","Whose","Who"], a:3,
     e:["“Which” is used to choose between options, but no options are given.",
        "“What” asks about a thing, not about a person.",
        "“Whose” asks about the owner of something.",
        "Correct. “Who” asks about a person, and the answer names a person."]},
    {q:"______ do you go to the shops? — By bus.",
     o:["Why","How","Where","When"], a:1,
     e:["“Why” asks for a reason, but the answer gives a means of transport.",
        "Correct. “How” asks about the way we do something, like travelling by bus.",
        "“Where” asks about a place, but the answer is not a place.",
        "“When” asks about time, but the answer is not a time."]}
   ]},
   {t:"Part 6 · Determiners, Pronouns & Possession", q:[
    {q:"I would like ______ apple and a glass of water, please.",
     o:["an","a","the","any"], a:0,
     e:["Correct. We use “an” before a word that starts with a vowel sound.",
        "“A” is only used before a consonant sound.",
        "“The” points to something already known, but this apple is new here.",
        "“Any” is not used in a positive sentence like this."]},
    {q:"Have we got ______ milk for the coffee?",
     o:["a","any","an","many"], a:1,
     e:["“A” is not used with an uncountable noun like “milk”.",
        "Correct. We use “any” with uncountable nouns in questions.",
        "“An” goes before a vowel sound and not with uncountable nouns.",
        "“Many” is used with countable plural nouns, not with “milk”."]},
    {q:"______ shoes over there are very expensive.",
     o:["This","That","Those","These"], a:2,
     e:["“This” is for one thing that is near you.",
        "“That” is for one thing that is far from you.",
        "Correct. “Those” is for more than one thing that is far away.",
        "“These” is for more than one thing that is near you."]},
    {q:"This is not my ticket. It is ______.",
     o:["her’s","she","of her","hers"], a:3,
     e:["Possessive pronouns never take an apostrophe.",
        "“She” is a subject pronoun and cannot show possession.",
        "“Of her” is not a possible way to say this in English.",
        "Correct. “Hers” is a possessive pronoun and stands alone after the verb."]},
    {q:"We are waiting for ______ friends in front of the cinema.",
     o:["our","us","ours","we"], a:0,
     e:["Correct. “Our” is a possessive adjective and goes before a noun.",
        "“Us” is an object pronoun and cannot come before a noun.",
        "“Ours” stands alone and cannot come before a noun.",
        "“We” is a subject pronoun and cannot show possession."]},
    {q:"That is ______ car. He drives it every day.",
     o:["Marc","Marc’s","Marcs","of Marc"], a:1,
     e:["A name before a noun needs an apostrophe and -s to show possession.",
        "Correct. We add ’s to a person’s name to show possession.",
        "Without an apostrophe, “Marcs” looks like a plural, not a possessive.",
        "“Of Marc” is not used before a noun in English."]},
    {q:"Excuse me, where is ______ nearest bus stop?",
     o:["a","an","the","some"], a:2,
     e:["A superlative like “nearest” never takes “a”.",
        "“An” goes before a vowel sound, and superlatives take “the”.",
        "Correct. We use “the” before a superlative like “nearest”.",
        "“Some” cannot come before a superlative."]},
    {q:"The students left ______ bags on the bus.",
     o:["they","them","theirs","their"], a:3,
     e:["“They” is a subject pronoun and cannot show possession.",
        "“Them” is an object pronoun and cannot come before a noun.",
        "“Theirs” stands alone and cannot come before a noun.",
        "Correct. “Their” is a possessive adjective and goes before a noun."]},
    {q:"Is this blue coat ______? I found it on the train.",
     o:["your","you","yours","your’s"], a:2,
     e:["“Your” is a possessive adjective and must come before a noun.",
        "“You” is a subject or object pronoun and cannot show possession.",
        "Correct. “Yours” is a possessive pronoun and stands alone after the verb.",
        "Possessive pronouns never take an apostrophe."]},
    {q:"Look at ______ man over there. He is my English teacher.",
     o:["this","these","those","that"], a:3,
     e:["“This” is for one person near you, not for someone far away.",
        "“These” is for more than one person near you.",
        "“Those” is for more than one person far away.",
        "Correct. “That” is for one person who is far from you."]}
   ]},
   {t:"Part 7 · Prepositions of Place & Time", q:[
    {q:"The café is ______ the bank and the post office.",
     o:["under","next","between","on"], a:2,
     e:["“Under” means below something.",
        "“Next” needs “to” when it shows position.",
        "Correct. “Between” is used when there is something on each side.",
        "“On” means on top of a surface."]},
    {q:"Let’s meet in front of the station ______ the film.",
     o:["before","under","between","at"], a:0,
     e:["Correct. “Before” says that one thing happens earlier than another.",
        "“Under” shows position below something, not time.",
        "“Between” needs two points, one on each side.",
        "“At” is used with clock times, not before a noun like “the film”."]},
    {q:"My train leaves ______ Monday morning.",
     o:["in","at","to","on"], a:3,
     e:["“In” is used with months, years and seasons, not with days.",
        "“At” is used with clock times, not with days of the week.",
        "“To” shows direction, not time.",
        "Correct. We use “on” with days and dates."]},
    {q:"Every morning I go ______ work by bus.",
     o:["at","to","in","on"], a:1,
     e:["“At” shows where something is, not movement towards a place.",
        "Correct. “To” shows movement towards a place.",
        "“In” shows position inside something, not movement.",
        "“On” shows position on a surface, not movement."]},
    {q:"Your bag is ______ the table. I can see it there.",
     o:["under","in","between","to"], a:0,
     e:["Correct. “Under” tells us that something is below another thing.",
        "“In” means inside something, and a table has no inside.",
        "“Between” needs two things, one on each side.",
        "“To” shows movement to a place, not a position."]},
    {q:"The small shops here are all closed ______ August.",
     o:["on","in","at","to"], a:1,
     e:["“On” is used with days and dates, not with months.",
        "Correct. We use “in” with months, years and seasons.",
        "“At” is used with clock times, not with months.",
        "“To” shows direction, not time."]},
    {q:"We always meet ______ seven o’clock at the bus stop.",
     o:["on","in","at","to"], a:2,
     e:["“On” is used with days and dates, not with clock times.",
        "“In” is used with months and parts of the day, not with clock times.",
        "Correct. We use “at” with clock times.",
        "“To” shows direction, not time."]},
    {q:"We had a hot chocolate ______ the museum visit.",
     o:["under","after","between","to"], a:1,
     e:["“Under” shows position below something, not time.",
        "Correct. “After” says that one thing happens later than another.",
        "“Between” needs two points, one on each side.",
        "“To” shows direction, not time."]},
    {q:"The post office is ______ to the baker’s shop.",
     o:["next","between","under","in"], a:0,
     e:["Correct. “Next to” means right beside something.",
        "“Between” needs two things, one on each side, and never takes “to”.",
        "“Under” means below something and never takes “to”.",
        "“In” means inside something and never takes “to”."]},
    {q:"Our hotel room is ______ the first floor, near the lift.",
     o:["in","at","under","on"], a:3,
     e:["“In” means inside something, not on a level of a building.",
        "“At” is used with clock times and exact points, not with floors.",
        "“Under” means below something.",
        "Correct. We use “on” with floors of a building."]}
   ]}
  ]
},
{
  id: 14, name: "BAC+1 · Test 4", theme: "My first work experience",
  parts: [
   {t:"Part 1 · Present Simple", q:[
    {q:"My boss ______ coffee every morning.",
     o:["drink","drinks","is drinking","drinking"], a:1,
     e:["After “my boss” the present simple needs an -s on the verb.",
        "Correct. The present simple with “every morning” describes a routine, and a singular subject takes an -s.",
        "The present continuous is for this moment, but “every morning” is a habit.",
        "A verb with -ing cannot be the main verb without “is” or “are”."]},
    {q:"______ you work on Saturdays?",
     o:["Does","Do","Are","Is"], a:1,
     e:["“Does” does not go with “you” in a present simple question.",
        "Correct. Present simple questions with “you” use the auxiliary “do”.",
        "“Are” cannot be used as the auxiliary before the base verb “work”.",
        "“Is” goes with he, she or it, and it cannot come before the base verb “work”."]},
    {q:"My manager ______ French at work.",
     o:["doesn’t speaks","don’t speak","doesn’t speak","not speak"], a:2,
     e:["After “doesn’t” the verb never takes an -s.",
        "“Don’t” is not used with a singular person like “my manager”.",
        "Correct. Present simple negatives use “doesn’t” plus the base verb.",
        "A negative sentence needs the auxiliary “do” or “does” before “not”."]},
    {q:"Where ______ your friend work?",
     o:["does","do","is","are"], a:0,
     e:["Correct. Questions about a routine with a singular subject use “does” plus the base verb.",
        "“Do” is not used with a singular person like “your friend”.",
        "“Is” cannot be used as the auxiliary before the base verb “work”.",
        "“Are” goes with plural subjects, and it cannot come before the base verb “work”."]},
    {q:"The machines ______ a lot of noise every day.",
     o:["makes","is making","is make","make"], a:3,
     e:["“Makes” goes with one thing, but “machines” is plural.",
        "“Is” goes with one thing, and the continuous does not fit “every day”.",
        "“Is make” is not a possible form in English.",
        "Correct. Plural subjects take the base verb in the present simple."]},
    {q:"Every Monday the shop ______ at nine o’clock.",
     o:["open","is opening","opens","are opening"], a:2,
     e:["A singular subject needs an -s on the verb in the present simple.",
        "The continuous does not fit the routine “every Monday”.",
        "Correct. “Every Monday” is a routine, so the present simple with -s is right.",
        "“Are” goes with plural subjects, and the continuous does not fit a routine."]},
    {q:"My brother ______ his new job very much.",
     o:["is liking","like","likes","are liking"], a:2,
     e:["“Like” describes a state, so the continuous sounds wrong here.",
        "After “my brother” the verb needs an -s.",
        "Correct. State verbs like “like” use the present simple, with -s for he or she.",
        "“Are” goes with plural subjects, and a state verb with -ing does not fit."]},
    {q:"We usually ______ our lunch in the staff kitchen.",
     o:["eats","is eating","are eat","eat"], a:3,
     e:["“Eats” does not go with “we”, which is plural.",
        "“Is” is singular, and the continuous does not fit “usually”.",
        "“Are eat” is not a possible form in English.",
        "Correct. “Usually” shows a habit, and “we” takes the base verb."]},
    {q:"My tutor never ______ late for a meeting.",
     o:["arrive","is arriving","are arriving","arrives"], a:3,
     e:["After “my tutor” the present simple needs an -s on the verb.",
        "The continuous does not fit “never”, which describes a habit.",
        "“Are” goes with plural subjects, and “never” needs the present simple.",
        "Correct. “Never” describes a habit, and a singular subject takes an -s."]},
    {q:"Choose the correct sentence.",
     o:["She works in a shop every summer.","She work in a shop every summer.","She is work in a shop today.","She is works in a shop today."], a:0,
     e:["Correct. “Every summer” is a routine, and “she” takes an -s in the present simple.",
        "The verb is missing the -s after “she”.",
        "“Is work” is not a possible form in English.",
        "“Is” and a verb with -s cannot go together."]}
   ]},
   {t:"Part 2 · Present Continuous", q:[
    {q:"Look! Anna ______ the photocopier.",
     o:["is using","uses","use","used"], a:0,
     e:["Correct. “Look!” points to this moment, so we use am/is/are plus the -ing form.",
        "The present simple is for routines, but “Look!” shows the action is happening now.",
        "After “Anna” the present simple needs an -s, and it does not fit “Look!”.",
        "“Used” is past simple, but the sentence is about now."]},
    {q:"Be quiet! The manager ______ on the phone.",
     o:["is talking","talks","talk","talked"], a:0,
     e:["Correct. “Be quiet!” points to this moment, so we use “is” plus the -ing form.",
        "The present simple describes a habit, but this is happening now.",
        "After “the manager” the present simple needs an -s, and a habit does not fit here.",
        "“Talked” is past simple, but the action is happening now."]},
    {q:"Right now I ______ a report for my boss.",
     o:["write","writes","am writing","am write"], a:2,
     e:["The present simple does not fit “right now”, which means at this moment.",
        "“Writes” does not go with “I”.",
        "Correct. “Right now” needs the present continuous: am plus the -ing form.",
        "“Am write” is not a possible form; a verb after “am” takes -ing."]},
    {q:"I cannot answer now. I ______ a letter for my tutor.",
     o:["type","am typing","types","am type"], a:1,
     e:["The present simple does not fit an action in progress at this moment.",
        "Correct. “Now” needs the present continuous: “am” plus the -ing form.",
        "“Types” does not go with “I”.",
        "“Am type” is not a possible form; a verb after “am” takes -ing."]},
    {q:"Where ______ you going with those boxes?",
     o:["do","are","is","does"], a:1,
     e:["“Do” cannot come before the -ing form “going”.",
        "Correct. Continuous questions with “you” use “are” plus the -ing form.",
        "“Is” does not go with “you”.",
        "“Does” does not go with “you”, and it cannot come before “going”."]},
    {q:"My colleague ______ not working today. She is ill.",
     o:["does","is","are","do"], a:1,
     e:["“Does” cannot come before the -ing form “working”.",
        "Correct. The present continuous negative uses “is not” plus the -ing form.",
        "“Are” goes with plural subjects, but “my colleague” is one person.",
        "“Do” cannot come before the -ing form “working”."]},
    {q:"Sam is in the kitchen. He ______ lunch at the moment.",
     o:["eat","eats","ate","is eating"], a:3,
     e:["After “he” the verb needs an -s in the present simple.",
        "The present simple does not work with “at the moment”.",
        "“Ate” is past simple, but the action is happening now.",
        "Correct. “At the moment” needs am/is/are plus the -ing form."]},
    {q:"Listen! Two visitors ______ at the front door.",
     o:["are knocking","knocks","is knocking","knock"], a:0,
     e:["Correct. “Listen!” shows the action is happening now, so we use “are” plus -ing.",
        "“Knocks” does not go with the plural subject “two visitors”.",
        "“Is” goes with one person, but “two visitors” is plural.",
        "The present simple describes a habit, but this is happening now."]},
    {q:"It is ten o’clock and the two trainees ______ the shelves.",
     o:["cleans","is cleaning","are cleaning","clean"], a:2,
     e:["“Cleans” does not go with the plural subject “two trainees”.",
        "“Is” goes with one person, but “two trainees” is plural.",
        "Correct. The action is in progress now, so we use “are” plus the -ing form.",
        "The present simple does not describe an action in progress right now."]},
    {q:"My boss ______ to a client at the moment.",
     o:["speak","speaks","speaked","is speaking"], a:3,
     e:["After “my boss” the present simple needs an -s on the verb.",
        "The present simple does not fit “at the moment”.",
        "“Speaked” is not a word, because “speak” is irregular.",
        "Correct. “At the moment” needs “is” plus the -ing form."]}
   ]},
   {t:"Part 3 · To Be, To Have, To Do", q:[
    {q:"I ______ twenty years old.",
     o:["have","am having","am","has"], a:2,
     e:["In English we do not use “have” for age.",
        "The continuous form “am having” is never used for age.",
        "Correct. English uses the verb “be” plus the number of years for age.",
        "“Has” does not go with “I”, and English does not use “have” for age."]},
    {q:"I ______ with you. The office is too cold.",
     o:["agree","am agree","am agreed","agreeing"], a:0,
     e:["Correct. “Agree” is an ordinary verb, so it needs no form of “be”.",
        "“Am agree” is not a possible form in English.",
        "“Am agreed” is not used to give your own opinion.",
        "An -ing verb cannot be the main verb without “am”."]},
    {q:"My first day ______ very long and tiring.",
     o:["were","was","be","is being"], a:1,
     e:["“Were” goes with plural subjects like “we” or “they”.",
        "Correct. “Was” is the past of “be” for a singular subject.",
        "“Be” cannot follow a subject without a helping verb.",
        "“Is being” talks about now, but the first day is finished."]},
    {q:"______ you got a badge for the building?",
     o:["Do","Does","Are","Have"], a:3,
     e:["“Do” cannot be used before “got” in this question.",
        "“Does” does not go with “you”, and it does not go with “got”.",
        "“Are” cannot be followed by “got”.",
        "Correct. Questions with “have got” start with “have” for “you”."]},
    {q:"We ______ a short meeting every Friday morning.",
     o:["have","has","are","is having"], a:0,
     e:["Correct. “We” takes “have” in the present simple.",
        "“Has” does not go with “we”.",
        "“Are” cannot replace “have” before a noun like “a meeting”.",
        "The continuous does not fit the routine “every Friday morning”."]},
    {q:"My tutor ______ not work on Wednesdays.",
     o:["do","does","is","has"], a:1,
     e:["“Do” is not used with he, she or it in present simple negatives.",
        "Correct. Negatives with he or she use “does” plus “not” plus the base verb.",
        "“Is” cannot be used as the auxiliary before “not work”.",
        "“Has” cannot be an auxiliary before “not work” here."]},
    {q:"______ your colleagues friendly?",
     o:["Is","Do","Does","Are"], a:3,
     e:["“Is” goes with one person, but “colleagues” is plural.",
        "“Do” needs a verb after the subject, not an adjective.",
        "“Does” goes with he, she or it, and it also needs a verb.",
        "Correct. “Are” is the plural form of “be” in questions."]},
    {q:"He ______ his best on his first day.",
     o:["made","was","did","had"], a:2,
     e:["“Make” is not used with “best” in this fixed expression.",
        "“Was” cannot be used before “his best” in this expression.",
        "Correct. English says “do your best”, so the past form is “did”.",
        "“Had his best” is not a possible English expression."]},
    {q:"______ she have a laptop at work?",
     o:["Is","Does","Do","Has"], a:1,
     e:["“Is” cannot be followed by “have”.",
        "Correct. Questions with “have” as a main verb use “does” for she.",
        "“Do” is not used with “she”.",
        "“Has” cannot be followed by “have” in a question."]},
    {q:"My two supervisors ______ very patient with me.",
     o:["were","was","is","be"], a:0,
     e:["Correct. “Were” is the past of “be” for plural subjects.",
        "“Was” goes with one person, but “supervisors” is plural.",
        "“Is” is singular and present, so it does not fit two people in the past.",
        "“Be” cannot follow a subject without a helping verb."]}
   ]},
   {t:"Part 4 · Past Simple", q:[
    {q:"Last week I ______ to a small company near Lille.",
     o:["go","went","goed","was going"], a:1,
     e:["“Go” is the present form, but “last week” is finished time.",
        "Correct. “Went” is the irregular past simple of “go”.",
        "“Goed” is not a word, because “go” is irregular.",
        "“Was going” describes an action in progress, not a finished trip."]},
    {q:"I ______ not understand my first task.",
     o:["did","do","was","am"], a:0,
     e:["Correct. Past simple negatives use “did not” plus the base verb.",
        "“Do” is present, but the sentence talks about the past.",
        "“Was” cannot be followed by the base verb “understand”.",
        "“Am” is present and cannot come before “understand”."]},
    {q:"______ you enjoy your placement last summer?",
     o:["Do","Did","Was","Were"], a:1,
     e:["“Do” is present and does not fit “last summer”.",
        "Correct. Past simple questions use “did” plus the base verb.",
        "“Was” cannot be followed by the base verb “enjoy”.",
        "“Were” cannot be followed by the base verb “enjoy”."]},
    {q:"My placement ______ three weeks in June.",
     o:["last","lasted","was last","is lasting"], a:1,
     e:["“Last” is the present form, but June is finished.",
        "Correct. Regular verbs add -ed to make the past simple.",
        "“Was last” is not a possible past form of the verb “last”.",
        "The continuous does not fit a finished period in June."]},
    {q:"I finished my placement ______ week.",
     o:["ago","yesterday","last","in"], a:2,
     e:["“Ago” comes after a time period, not before the noun.",
        "“Yesterday” cannot come before “week”.",
        "Correct. “Last week” means the week just before this one.",
        "“In” is not used before “week” to say when something finished."]},
    {q:"She ______ me how to use the machine.",
     o:["showed","shown","showing","show"], a:0,
     e:["Correct. “Showed” is the past simple of the regular verb “show”.",
        "“Shown” is a past participle and cannot stand alone as the main verb.",
        "An -ing form cannot be the main verb without “was” or “is”.",
        "“Show” has no past ending, so it cannot describe a finished action."]},
    {q:"In 2019 my cousin ______ a trainee in a hotel.",
     o:["is","were","was","are"], a:2,
     e:["“Is” is present, but 2019 is finished time.",
        "“Were” goes with plural subjects like “we” or “they”.",
        "Correct. “Was” is the past of “be” for a singular subject.",
        "“Are” is present and plural, so it does not fit here."]},
    {q:"I ______ my manager two months ago.",
     o:["meet","meeted","met","meeting"], a:2,
     e:["“Meet” is the present form and does not fit “two months ago”.",
        "“Meeted” is not a word, because “meet” is irregular.",
        "Correct. “Met” is the irregular past simple of “meet”.",
        "An -ing form cannot be the main verb without a helping verb."]},
    {q:"Choose the correct negative sentence.",
     o:["I didn’t worked on Monday.","I not worked on Monday.","I was work on Monday.","I didn’t work on Monday."], a:3,
     e:["After “didn’t” the verb never takes -ed.",
        "A past negative needs “did” before “not”.",
        "“Was” cannot be followed by the base verb “work”.",
