function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function setLvl(id){ document.body.setAttribute("data-lvl", id || ""); }

/* Options are shuffled on every attempt: it removes any positional bias in the
   answer key and stops a retake being memorised as a sequence of letters.
   `e` moves with `o`, and `a` is remapped, so the notes stay aligned. */
function shuffleQ(q){
  const order = q.o.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return { q:q.q, o:order.map(i=>q.o[i]), e:order.map(i=>q.e[i]), a:order.indexOf(q.a) };
}

function flatten(test){
  const out = [];
  test.parts.forEach((p, pi) => p.q.forEach(q => out.push({ part: p.t, pi, q: shuffleQ(q) })));
  return out;
}

    so students can retake a test as often as they like. No account, no internet needed.</p>`;
  app.querySelectorAll(".pick button").forEach(b =>
    b.addEventListener("click", () => levelHome(+b.dataset.l)));
}

/* ---------- screen 2: choose a test inside a level ---------- */
function levelHome(li){
  S = null;
  const l = LEVELS[li];
  setLvl(l.id);
  const syllabus = l.tests[0].parts.map(p => p.t);
  app.innerHTML = `
    <p class="eyebrow"><b>${esc(l.label)}</b> · ${esc(l.grid)} · target ${esc(l.cefr)}</p>
    <h1>${esc(l.label)} practice tests</h1>
    <p class="lede">Four tests, fifty questions each, in the five parts below.
    Every test covers the same grammar in a different work situation, so none of them
    can be learned by heart.</p>
    <div class="pick">${l.tests.map((t,i)=>`
      <button data-t="${i}">
        <span class="pt">Test ${i+1}</span>
        <span class="ps">${esc(t.theme)} · 50 questions</span>
      </button>`).join("")}
    </div>
    <p class="eyebrow">What is tested</p>
    <div class="syl">${syllabus.map(s=>`<div>${esc(s)}</div>`).join("")}</div>
    <div class="actions"><button class="ghost" id="back">Other levels</button></div>`;
  app.querySelectorAll(".pick button").forEach(b =>
    b.addEventListener("click", () => start(li, +b.dataset.t)));
  document.getElementById("back").addEventListener("click", home);
  window.scrollTo({top:0});
}

/* ---------- screen 3: the test ---------- */
function start(li, ti, only){
  const all = flatten(LEVELS[li].tests[ti]);
  const idx = only || all.map((_,i)=>i);
  S = { li, ti, all, idx, pos:0,
        picked:new Array(all.length).fill(null),
        done:new Array(all.length).fill(false),
        retry: !!only };
  setLvl(LEVELS[li].id);
  render();
}

function render(){
  const { all, idx, pos, li, ti } = S;
  const gi = idx[pos];
  const item = all[gi];
  const picked = S.picked[gi];
  const checked = S.done[gi];

  app.innerHTML = `
    <div class="topbar">
      <span class="part">${esc(item.part)}</span>
      <span class="count">${esc(LEVELS[li].label)} · Test ${ti+1} · ${pos+1} / ${idx.length}${S.retry ? " · retry" : ""}</span>
    </div>
    <div class="bar"><i style="width:${(pos/idx.length)*100}%"></i></div>
    <div class="qbox">
      <span class="qnum">${gi+1}.</span>
      <p class="q">${esc(item.q.q)}</p>
      <div class="opts">
        ${item.q.o.map((o,i)=>{
          const isRight = i === item.q.a;
          let cls = "opt";
          if (!checked && picked === i) cls += " sel";
          if (checked){
            cls += isRight ? " right" : " wrong";
            if (picked === i) cls += " picked";
          }
          const tag = checked && picked === i ? `<span class="tag">your answer</span>`
                    : (checked && isRight ? `<span class="tag">correct</span>` : "");
          return `<button class="${cls}" data-o="${i}" ${checked?"disabled":""}>
                    <span class="k">${KEYS[i]}</span><span>${esc(o)}</span>${tag}
                  </button>
                  ${checked ? `<p class="why${isRight?" ok":""}">${esc(item.q.e[i])}</p>` : ""}`;
        }).join("")}
      </div>
      ${checked ? `<p class="verdict ${picked===item.q.a?"ok":"no"}">${picked===item.q.a?"Correct":"Not correct — read the notes above"}</p>` : ""}
      <div class="actions">
        ${checked
          ? `<button class="go" id="next">${pos+1 < idx.length ? "Next question" : "See results"}</button>`
          : `<button class="go" id="check" ${picked===null?"disabled":""}>Check answer</button>`}
        <button class="ghost" id="quit">Leave test</button>
        <span class="hint">Keys A–D or 1–4 to choose · Enter to continue</span>
      </div>
    </div>`;

  app.querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", () => { S.picked[gi] = +b.dataset.o; render(); }));
  const c = document.getElementById("check");
  if (c) c.addEventListener("click", () => { S.done[gi] = true; render(); });
  const n = document.getElementById("next");
  if (n) n.addEventListener("click", () => {
    if (S.pos + 1 < S.idx.length){ S.pos++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
    else results();
  });
  document.getElementById("quit").addEventListener("click", () => levelHome(S.li));
}

/* ---------- screen 4: results ---------- */
function letter(pct){
  if (pct >= 80) return "A";
  if (pct >= 60) return "B";
  if (pct >= 40) return "C";
  return "D";
}

function results(){
  const { all, idx, li, ti } = S;
  const test = LEVELS[li].tests[ti];
  const answered = idx.filter(i => S.done[i]);
  const right = answered.filter(i => S.picked[i] === all[i].q.a);
  const missed = answered.filter(i => S.picked[i] !== all[i].q.a);
  const pct = answered.length ? Math.round((right.length/answered.length)*100) : 0;

  const perPart = test.parts.map((p, pi) => {
    const ids = idx.filter(i => all[i].pi === pi);
    const ok = ids.filter(i => S.picked[i] === all[i].q.a).length;
    return { title: p.t, ok, total: ids.length };
  }).filter(p => p.total > 0);

  app.innerHTML = `
    <p class="eyebrow"><b>${esc(LEVELS[li].label)}</b> · Test ${ti+1} · ${esc(test.theme)}</p>
    <p class="score">${right.length}<small> / ${answered.length}</small></p>
    <p class="gradeline">${pct}% · indicative grid letter <b>${letter(pct)}</b>
      <span style="color:var(--ink-faint)">(A ≥ 80% · B ≥ 60% · C ≥ 40% · D below)</span></p>
    <div class="breakdown">
      ${perPart.map(p=>{
        const v = p.total ? (p.ok/p.total)*100 : 0;
        return `<div class="brow"><span>${esc(p.title)}</span><span>${p.ok}/${p.total}</span>
          <span class="track"><i class="${v<60?"low":""}" style="width:${v}%"></i></span></div>`;
      }).join("")}
    </div>
    <div class="actions" style="margin-bottom:32px">
      ${missed.length ? `<button class="go" id="again">Redo the ${missed.length} I missed</button>` : ""}
      <button class="ghost" id="restart">Restart this test</button>
      <button class="ghost" id="back">Other tests</button>
      <button class="ghost" id="levels">Other levels</button>
    </div>
    ${missed.length ? `<p class="eyebrow">Questions to review</p><div class="review">${missed.map(i=>{
      const it = all[i];
      return `<details class="rev"><summary><span class="n">${i+1}.</span><span>${esc(it.q.q)}</span></summary>
        <div class="opts">${it.q.o.map((o,k)=>{
          const isRight = k === it.q.a;
          const cls = "opt " + (isRight ? "right" : "wrong") + (S.picked[i]===k ? " picked" : "");
          const tag = S.picked[i]===k ? `<span class="tag">your answer</span>` : (isRight ? `<span class="tag">correct</span>` : "");
          return `<div class="${cls}"><span class="k">${KEYS[k]}</span><span>${esc(o)}</span>${tag}</div>
                  <p class="why${isRight?" ok":""}">${esc(it.q.e[k])}</p>`;
        }).join("")}</div></details>`;
    }).join("")}</div>` : `<p class="note">Nothing to review — every answer was correct.</p>`}`;

  const a = document.getElementById("again");
  if (a) a.addEventListener("click", () => start(li, ti, missed));
  document.getElementById("restart").addEventListener("click", () => start(li, ti));
  document.getElementById("back").addEventListener("click", () => levelHome(li));
  document.getElementById("levels").addEventListener("click", home);
  window.scrollTo({top:0});
}

document.addEventListener("keydown", e => {
  if (!S) return;
  const gi = S.idx[S.pos];
  const k = e.key.toUpperCase();
  const map = {A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if (k in map && !S.done[gi]){
    if (map[k] < S.all[gi].q.o.length){ S.picked[gi] = map[k]; render(); e.preventDefault(); }
  } else if (e.key === "Enter"){
    const btn = document.getElementById("next") || document.getElementById("check");
    if (btn && !btn.disabled){ btn.click(); e.preventDefault(); }
  }
});

home();
</script>
</body>
</html>
