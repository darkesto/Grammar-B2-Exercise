<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Practice · My American Year · B2</title>
<style>
:root{
  --paper:#fbfaf5;
  --ink:#16233d;
  --ink-soft:#5c6a85;
  --ink-faint:#93a0b5;
  --rule:#cbd9ef;
  --margin:#e3aab2;
  --pen:#b3352c;
  --good:#1c7a56;
  --good-bg:#eef7f2;
  --bad-bg:#fbf1f0;
  --card:#ffffff;
  --line:#e6e5dc;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:32px;
  -webkit-font-smoothing:antialiased;
}
.sheet{
  max-width:780px;margin:0 auto;padding:32px 24px 96px 24px;position:relative;
}
.sheet::before{
  content:"";position:absolute;top:0;bottom:0;left:56px;width:1px;background:var(--margin);
}
.wrap{padding-left:44px}
@media(max-width:700px){
  .sheet{padding-left:16px;padding-right:16px}
  .sheet::before{display:none}
  .wrap{padding-left:0}
}
.eyebrow{
  font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);line-height:32px;margin:0;
}
h1{font-size:34px;line-height:48px;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
.lede{color:var(--ink-soft);margin:0 0 32px;max-width:52ch}
.pick{display:grid;gap:16px;margin:0 0 32px}
.pick button{
  display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--ink);border-radius:2px;padding:16px 20px;cursor:pointer;
  font-family:inherit;color:inherit;transition:transform .12s ease,border-color .12s ease;
}
.pick button:hover{transform:translateX(3px);border-left-color:var(--pen)}
.pick .pt{font-size:20px;line-height:28px;display:block}
.pick .ps{font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;color:var(--ink-soft);line-height:24px}
.note{font-family:var(--sans);font-size:13px;line-height:22px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:16px}
.note b{color:var(--ink)}

.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px}
.part{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--pen)}
.count{font-family:var(--sans);font-size:12px;color:var(--ink-faint);letter-spacing:.06em}
.bar{height:2px;background:var(--line);margin-bottom:32px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .3s ease}
.qnum{
  position:absolute;left:-44px;width:32px;text-align:right;color:var(--pen);
  font-family:var(--sans);font-size:13px;letter-spacing:.02em;
}
@media(max-width:700px){.qnum{display:none}}
.qbox{position:relative}
.q{font-size:22px;line-height:36px;margin:0 0 24px}
.opts{display:grid;gap:8px;margin-bottom:24px}
.opt{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:11px 16px;cursor:pointer;font-family:inherit;font-size:17px;line-height:26px;color:inherit;
}
.opt:hover:not(:disabled){border-color:var(--ink-soft)}
.opt:disabled{cursor:default}
.opt .k{
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-faint);
  border:1px solid var(--line);border-radius:2px;min-width:22px;height:22px;display:grid;place-items:center;
  margin-top:2px;flex:none;
}
.opt.sel{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.opt.sel .k{border-color:var(--ink);color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:inset 3px 0 0 var(--good)}
.opt.right .k{border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:#e9cdc9;box-shadow:inset 3px 0 0 #e0b6b1;color:var(--ink-soft)}
.opt.picked.wrong{box-shadow:inset 3px 0 0 var(--pen);border-color:var(--pen)}
.opt .tag{
  font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  margin-left:auto;padding-left:12px;flex:none;color:var(--pen);line-height:26px;
}
.opt.right .tag{color:var(--good)}
.why{
  font-family:var(--sans);font-size:13.5px;line-height:22px;color:var(--ink-soft);
  margin:0;padding:0 16px 12px 52px;
}
.why.ok{color:var(--good)}
.verdict{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--pen)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button.go{
  font-family:var(--sans);font-size:14px;letter-spacing:.02em;background:var(--ink);color:#fff;
  border:1px solid var(--ink);border-radius:2px;padding:10px 22px;cursor:pointer;
}
button.go:disabled{background:transparent;color:var(--ink-faint);border-color:var(--line);cursor:not-allowed}
button.ghost{
  font-family:var(--sans);font-size:14px;background:transparent;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:2px;padding:10px 18px;cursor:pointer;
}
button.ghost:hover{color:var(--ink);border-color:var(--ink-soft)}
.hint{font-family:var(--sans);font-size:12px;color:var(--ink-faint);margin-left:auto}
@media(max-width:700px){.hint{display:none}}

.score{font-size:64px;line-height:72px;margin:0}
.score small{font-size:24px;color:var(--ink-faint)}
.breakdown{display:grid;gap:8px;margin:24px 0 32px}
.brow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;font-family:var(--sans);font-size:13px}
.brow .track{grid-column:1/-1;height:4px;background:var(--line)}
.brow .track i{display:block;height:4px;background:var(--ink)}
.brow .track i.low{background:var(--pen)}
.review{border-top:1px solid var(--line)}
.rev{border-bottom:1px solid var(--line);padding:12px 0}
.rev summary{cursor:pointer;font-size:16px;line-height:26px;list-style:none;display:flex;gap:12px}
.rev summary::-webkit-details-marker{display:none}
.rev summary .n{font-family:var(--sans);font-size:12px;color:var(--pen);min-width:28px;flex:none;line-height:26px}
.rev[open] summary{margin-bottom:12px}
.rev .opts{margin-bottom:0}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="sheet"><div class="wrap" id="app"></div></div>
<script>
const TESTS = [
{
  id: 1, name: "Practice Test 1", theme: "Landing in Austin",
  parts: [
   {t:"Part 1 · Past Perfect & Narrative Tenses", q:[
    {q:"By the time the plane landed, Maxime ______ his American playlist three times.",
     o:["listened to","had listened to","was listening to","has listened to"], a:1,
     e:["The simple past only reports an action; it doesn’t show it was finished before the plane landed.",
        "Correct. The past perfect shows an action completed before another past moment (“by the time the plane landed”).",
        "The past continuous shows an action in progress, not one repeated and completed three times.",
        "The present perfect can’t be used inside a finished past time frame."]},
    {q:"He ______ the apartment online, so the real thing was a shock.",
     o:["only sees","had only seen","was only seeing","has only seen"], a:1,
     e:["The present simple describes habits and facts, not a past story.",
        "Correct. He saw the photos before the moment of the shock, so the past perfect is used.",
        "“See” is a state verb here, so the continuous doesn’t work.",
        "The present perfect connects the past to now; this whole story is in the past."]},
    {q:"While Léa ______ her keynote, the fire alarm went off.",
     o:["rehearsed","had rehearsed","was rehearsing","has rehearsed"], a:2,
     e:["The simple past would mean the rehearsal happened and finished; here it was interrupted.",
        "The past perfect would place the rehearsal before the alarm instead of around it.",
        "Correct. The past continuous gives the longer action that a shorter one interrupts.",
        "The present perfect is never used to narrate a specific past scene."]},
    {q:"She couldn’t pay for the taxi because she ______ her wallet at the hotel.",
     o:["leaves","had left","was leaving","has left"], a:1,
     e:["The present simple can’t explain a past problem.",
        "Correct. The wallet was left before the moment she couldn’t pay.",
        "The continuous suggests an action in progress; leaving a wallet is one completed act.",
        "The present perfect doesn’t fit a narrative already set in the past."]},
    {q:"They ______ in the queue for two hours when the consulate finally opened.",
     o:["waited","were waiting","had been waiting","have been waiting"], a:2,
     e:["The simple past gives no link with the moment the consulate opened.",
        "The past continuous shows the action in progress but not the two hours leading up to that point.",
        "Correct. The past perfect continuous measures how long something had gone on before a past moment.",
        "The present perfect continuous measures duration up to now, not up to a past moment."]},
    {q:"He ______ the door and immediately knew something was wrong.",
     o:["had opened","opened","was opening","has opened"], a:1,
     e:["The past perfect is for an action clearly earlier than the story; these two follow each other directly.",
        "Correct. Two short consecutive actions in a narrative both take the simple past.",
        "The continuous would stretch out an action that was instant.",
        "The present perfect can’t be mixed into a past narrative."]},
    {q:"Before he moved to Texas, he ______ on the right-hand side of the road.",
     o:["never drove","had never driven","has never driven","was never driving"], a:1,
     e:["The simple past doesn’t make the “before that moment” relationship explicit.",
        "Correct. The past perfect expresses experience up to a point in the past.",
        "The present perfect would mean “never in his life up to now”.",
        "The past continuous can’t express an experience that never happened."]},
    {q:"I ______ my emails when the immigration officer called my name.",
     o:["checked","had checked","was checking","have checked"], a:2,
     e:["The simple past would make it a completed action rather than the background of the scene.",
        "The past perfect would place it before the officer spoke, which loses the interruption.",
        "Correct. The past continuous sets the background action that gets interrupted.",
        "The present perfect doesn’t belong in a past narrative."]},
    {q:"After the investors ______, the team celebrated all night.",
     o:["were leaving","had left","have left","leave"], a:1,
     e:["The past continuous shows an action in progress, not one finished before the party.",
        "Correct. The past perfect marks the earlier of two past actions.",
        "The present perfect can’t be used in a past narrative.",
        "The present simple can’t report a past event."]},
    {q:"Halfway through the meeting she realised she ______ the same mistake twice.",
     o:["makes","was making","has made","had made"], a:3,
     e:["The present simple can’t describe something that happened before a past realisation.",
        "The continuous doesn’t express a repeated, completed action (“twice”).",
        "The present perfect would link the mistakes to now, not to the meeting.",
        "Correct. The mistakes came before the moment she realised, so the past perfect is used."]}
   ]},
   {t:"Part 2 · Future Continuous & Future Forms", q:[
    {q:"This time tomorrow, I ______ over the Atlantic.",
     o:["fly","will fly","will be flying","am flying"], a:2,
     e:["The present simple is for timetables and habits, not a moment in progress tomorrow.",
        "“Will fly” states a future fact; it doesn’t show the action in progress at that exact time.",
        "Correct. The future continuous describes an action in progress at a precise future moment.",
        "The present continuous is for arrangements; “this time tomorrow” calls for an action in progress."]},
    {q:"Look at those clouds — it ______ .",
     o:["will rain","is going to rain","will be raining","rains"], a:1,
     e:["“Will” is for predictions with no present evidence, or decisions made while speaking.",
        "Correct. “Going to” is used for a prediction based on evidence you can see now.",
        "The future continuous would describe rain in progress at a stated future time.",
        "The present simple would describe a habit or a general fact, not this moment."]},
    {q:"According to the schedule, the shuttle ______ at 6:40.",
     o:["will leave","leaves","will be leaving","is leaving"], a:1,
     e:["“Will leave” sounds like a prediction or a decision, not a published timetable.",
        "Correct. The present simple is used for timetables and scheduled events.",
        "The future continuous describes an action in progress at a future moment.",
        "The present continuous is for personal arrangements, not official timetables."]},
    {q:"“My flight lands at eleven.” — “Don’t worry, I ______ you.”",
     o:["pick up","will pick up","am picking up","will be picking up"], a:1,
     e:["The present simple can’t express a decision about the future.",
        "Correct. “Will” expresses a decision made at the moment of speaking.",
        "The present continuous would mean the arrangement already existed before this conversation.",
        "The future continuous would describe the action in progress at a given time."]},
    {q:"By the end of the month, we ______ forty interviews.",
     o:["will finish","will be finishing","will have finished","finish"], a:2,
     e:["“Will finish” doesn’t express completion before a deadline.",
        "The future continuous shows an action in progress, not a finished total.",
        "Correct. The future perfect is used for something completed before a future point (“by…”).",
        "The present simple can’t express a future result."]},
    {q:"Don’t call at eight — we ______ dinner with Priya’s family.",
     o:["have","will have","are have","will be having"], a:3,
     e:["The present simple describes routines, not one specific evening.",
        "“Will have” states a future fact; here the point is being in the middle of dinner.",
        "This is not a possible verb form in English.",
        "Correct. The future continuous describes an action in progress at a stated time."]},
    {q:"At 10 a.m. tomorrow, the board ______ the budget.",
     o:["will be discussing","discusses","will have discussed","discussed"], a:0,
     e:["Correct. The future continuous describes an action in progress at a precise future time.",
        "The present simple would suggest a habit, not one specific meeting.",
        "The future perfect would mean the discussion is already over by 10 a.m.",
        "The simple past puts the meeting in the past, but “tomorrow” is in the future."]},
    {q:"I’ve made up my mind: I ______ my notice.",
     o:["will hand in","am going to hand in","hand in","will be handing in"], a:1,
     e:["“Will” suits a decision taken while speaking; this decision is already made.",
        "Correct. “Be going to” expresses an intention decided before the moment of speaking.",
        "The sentence needs a future form; the present simple can’t express an intention.",
        "The future continuous describes an action in progress at a future moment."]},
    {q:"Which sentence is in the future continuous?",
     o:["We will have moved by June.","We are moving in June.","We will be moving all through June.","We move in June."], a:2,
     e:["This is the future perfect: “will have” + past participle.",
        "This is the present continuous used for a future arrangement.",
        "Correct. “Will be” + -ing is the future continuous.",
        "This is the present simple used for a fixed schedule."]},
    {q:"I’ll email you as soon as I ______ the signed contract.",
     o:["will get","get","will be getting","am getting"], a:1,
     e:["After time words like “as soon as”, “when” and “until”, we don’t use “will”.",
        "Correct. The present simple follows a time conjunction, even when we talk about the future.",
        "Same problem: no future form after “as soon as”.",
        "The present continuous suggests an arrangement, which doesn’t fit this condition."]}
   ]},
   {t:"Part 3 · Reported Speech", q:[
    {q:"“Your English is improving,” she said. → She said that my English ______ .",
     o:["is improving","was improving","has improved","improves"], a:1,
     e:["This is the direct-speech tense; after a past reporting verb it normally shifts back.",
        "Correct. The present continuous becomes the past continuous.",
        "The present perfect changes the meaning and isn’t the backshift of “is improving”.",
        "The present simple loses the “in progress” idea and doesn’t backshift."]},
    {q:"“You can call me any time.” → He told me that I ______ call him any time.",
     o:["could","can","would","might"], a:0,
     e:["Correct. “Can” becomes “could” after a past reporting verb.",
        "“Can” is the direct-speech form; it needs to shift back.",
        "“Would” is the backshift of “will”, not of “can”.",
        "“Might” changes the meaning from permission to possibility."]},
    {q:"“Send me the file before noon.” → She told me ______ the file before noon.",
     o:["send","to send","sending","that send"], a:1,
     e:["A bare infinitive can’t follow “told me”.",
        "Correct. Reported orders use “tell somebody to do something”.",
        "The -ing form doesn’t follow “tell someone”.",
        "A “that” clause needs a subject and a full verb."]},
    {q:"“Do you like Austin?” → He asked me ______ Austin.",
     o:["do I like","if I liked","that I liked","if did I like"], a:1,
     e:["Reported questions don’t keep question word order or the auxiliary “do”.",
        "Correct. “If” + normal word order + backshift.",
        "“That” introduces reported statements, not questions.",
        "This mixes “if” with question word order and “did”."]},
    {q:"“Why are you leaving?” → She asked me why ______ .",
     o:["was I leaving","I was leaving","am I leaving","I leave"], a:1,
     e:["Reported questions use statement word order, without inversion.",
        "Correct. Subject before verb, with the tense shifted back.",
        "This keeps both the inversion and the present tense.",
        "The present simple loses the continuous meaning and the backshift."]},
    {q:"“I’ll review it tomorrow.” → He said he ______ it the next day.",
     o:["will review","would review","reviewed","had reviewed"], a:1,
     e:["“Will” must shift back after a past reporting verb.",
        "Correct. “Will” becomes “would”.",
        "The simple past loses the future meaning of the original.",
        "The past perfect would place the review before the moment of speaking."]},
    {q:"Choose the correct sentence.",
     o:["He said me he was tired.","He told me he was tired.","He told to me he was tired.","He said to me that tired."], a:1,
     e:["“Say” is not followed directly by a person.",
        "Correct. “Tell” takes a person immediately after it.",
        "“Tell” never takes “to” before the person.",
        "The final clause has no subject or verb."]},
    {q:"“Don’t reply to that email.” → She told me ______ to that email.",
     o:["to not reply","not to reply","don’t reply","no reply"], a:1,
     e:["The negative goes before “to”, not after it.",
        "Correct. Negative orders use “not to” + verb.",
        "A direct-speech imperative can’t follow “told me”.",
        "This is not a verb form."]},
    {q:"“We signed the contract yesterday.” → They said they ______ the contract the day before.",
     o:["signed","have signed","had signed","were signing"], a:2,
     e:["Without the backshift, the sequence with “the day before” sounds unnatural.",
        "The present perfect can’t be used with a specific past time.",
        "Correct. A past simple in direct speech becomes a past perfect.",
        "The continuous changes the meaning to an action in progress."]},
    {q:"Priya still lives in Boston today. Which report sounds most natural?",
     o:["She said she lives in Boston.","She told she lives in Boston.","She said she had lived in Boston.","She said she would live in Boston."], a:0,
     e:["Correct. When the fact is still true, keeping the present tense is natural.",
        "“Tell” needs a person after it (“told me”).",
        "The past perfect suggests she doesn’t live there any more.",
        "“Would live” turns a present fact into a future plan."]}
   ]},
   {t:"Part 4 · Active & Passive Voice", q:[
    {q:"Someone stole his laptop at the airport. → His laptop ______ at the airport.",
     o:["was stolen","was stole","stole","has stole"], a:0,
     e:["Correct. Past simple passive: “was” + past participle.",
        "“Stole” is the past simple; the passive needs the participle “stolen”.",
        "This is the active form, and the laptop didn’t steal anything.",
        "Wrong auxiliary and wrong participle."]},
    {q:"All payments ______ in dollars.",
     o:["are processing","process","are processed","processed"], a:2,
     e:["The active continuous suggests the payments process themselves.",
        "The active present simple; payments don’t process anything.",
        "Correct. Present simple passive for a general procedure.",
        "The past simple active, while the sentence states a general rule."]},
    {q:"The results ______ next Monday.",
     o:["will announce","will be announced","are announcing","announce"], a:1,
     e:["Active: the results can’t announce themselves.",
        "Correct. Future passive: “will be” + past participle.",
        "Active continuous with a subject that doesn’t act.",
        "Active present simple, and the time is in the future."]},
    {q:"This bug ______ three times already.",
     o:["has been reported","has reported","is reported","was reporting"], a:0,
     e:["Correct. Present perfect passive for a result that matters now (“already”).",
        "Active: the bug isn’t reporting anything.",
        "The present simple passive doesn’t fit “three times already”.",
        "Past continuous active, which doesn’t work here."]},
    {q:"“The keynote was written by Léa.” In the active voice, this is:",
     o:["Léa was written the keynote.","The keynote wrote Léa.","Léa wrote the keynote.","Léa has written by the keynote."], a:2,
     e:["This keeps a passive verb with the wrong subject.",
        "This reverses the roles: the keynote didn’t write anyone.",
        "Correct. The agent becomes the subject and the verb becomes active.",
        "“By” can’t stay in an active sentence."]},
    {q:"The invoices ______ yet.",
     o:["haven’t paid","aren’t paying","weren’t paid","haven’t been paid"], a:3,
     e:["Active: invoices don’t pay anything.",
        "Active continuous, with the wrong meaning.",
        "The past simple passive doesn’t fit “yet”, which points to now.",
        "Correct. Present perfect passive: “haven’t been” + past participle."]},
    {q:"The office ______ at the moment, so we’re all remote.",
     o:["is renovating","is being renovated","renovates","has renovated"], a:1,
     e:["Active: the office isn’t doing the work.",
        "Correct. Present continuous passive: “is being” + past participle.",
        "Active present simple, and wrong for “at the moment”.",
        "Active present perfect, with the wrong subject."]},
    {q:"When is it better to use the passive?",
     o:["When you want to hide a grammar mistake","When the action matters more than who did it","Whenever the sentence feels too short","When the verb has no object"], a:1,
     e:["The passive is not a way to cover up mistakes.",
        "Correct. The passive puts the focus on the action or the result.",
        "Length is not a reason to change the voice.",
        "Only verbs that take an object can be made passive, so this is the opposite."]},
    {q:"Every application ______ by two engineers before Friday.",
     o:["will review","reviews","will be reviewed","is reviewing"], a:2,
     e:["Active, with a subject that doesn’t perform the action.",
        "Active present simple; applications don’t review anything.",
        "Correct. Future passive, with the agent introduced by “by”.",
        "Active continuous, with the wrong meaning."]},
    {q:"The report ______ right now, so I can’t send it yet.",
     o:["is written","writes","is being written","has written"], a:2,
     e:["The present simple passive states a general fact, not an action happening now.",
        "Active: the report doesn’t write itself.",
        "Correct. “Is being written” expresses a passive action in progress.",
        "Active present perfect, with the wrong subject."]}
   ]},
   {t:"Part 5 · Linking Words", q:[
    {q:"______ the traffic, we arrived on time.",
     o:["Despite","Although","Because","However"], a:0,
     e:["Correct. “Despite” is followed by a noun.",
        "“Although” needs a subject and a verb after it.",
        "“Because” introduces a cause, and it needs a full clause.",
        "“However” links two separate sentences, not a noun."]},
    {q:"The presentation was long; ______, nobody complained.",
     o:["therefore","however","because","so that"], a:1,
     e:["“Therefore” introduces a result, but the second idea doesn’t follow from the first.",
        "Correct. “However” introduces a contrast between two sentences.",
        "“Because” gives a reason and can’t stand between two independent clauses like this.",
        "“So that” introduces a purpose."]},
    {q:"She practised every evening; ______, her accent improved fast.",
     o:["although","whereas","as a result","despite"], a:2,
     e:["“Although” introduces a contrast, but the two ideas agree here.",
        "“Whereas” compares two contrasting facts.",
        "Correct. “As a result” introduces a consequence.",

     o:["have interviewed","have been interviewed","are interviewed","were interviewing"], a:1,
     e:["Active: this would mean the candidates interviewed other people.",
        "Correct. Present perfect passive for a result counted up to now.",
        "The present simple passive doesn’t fit “so far”.",
        "Active past continuous, with the wrong meaning."]},
    {q:"“The decision will be announced by the board.” In the active voice, this is:",
     o:["The board will announce the decision.","The board will be announced the decision.","The decision will announce the board.","The board announces by the decision."], a:0,
     e:["Correct. The agent becomes the subject and the verb becomes active.",
        "This keeps a passive verb with an object, which isn’t possible.",
        "This reverses the roles.",
        "“By” can’t stay in an active sentence."]},
    {q:"My laptop ______ at the moment, so I’m using a spare.",
     o:["repairs","is repairing","is being repaired","has repaired"], a:2,
     e:["Active: the laptop doesn’t repair anything.",
        "Active continuous, with the wrong meaning.",
        "Correct. Present continuous passive: “is being” + past participle.",
        "Active present perfect, with the wrong subject."]},
    {q:"We ______ about the change only last week.",
     o:["were informed","informed","are informing","have informed"], a:0,
     e:["Correct. Passive: someone else gave us the information.",
        "Active, which reverses the meaning: it says we informed others.",
        "Active continuous, and wrong for a finished past time.",
        "Active present perfect, which can’t take “last week”."]},
    {q:"Which sentence is in the passive?",
     o:["The parcel arrived late.","The parcel has been opened.","The parcel weighs two kilos.","Someone opened the parcel."], a:1,
     e:["Active past simple.",
        "Correct. “Has been” + past participle is the present perfect passive.",
        "Active present simple with a state verb.",
        "Active past simple with the agent as subject."]},
    {q:"Every report ______ by two people before it goes out.",
     o:["is checking","has checked","is checked","checks"], a:2,
     e:["Active continuous: the report isn’t checking anything.",
        "Active present perfect, with the wrong subject.",
        "Correct. Present simple passive for a standard procedure.",
        "Active present simple, with the wrong subject."]},
    {q:"“The files were deleted by mistake.” In the active voice, this is:",
     o:["Someone deleted the files by mistake.","The files deleted someone by mistake.","The files were deleting by mistake.","By mistake was deleted the files."], a:0,
     e:["Correct. When the agent is unknown, the active version uses “someone”.",
        "This reverses the roles.",
        "This is an active continuous form with the wrong meaning.",
        "The word order is impossible in English."]}
   ]},
   {t:"Part 5 · Linking Words", q:[
    {q:"______ a difficult start, the year was a success.",
     o:["Despite","Although","Because","However"], a:0,
     e:["Correct. “Despite” + noun phrase expresses contrast.",
        "“Although” needs a subject and a verb after it.",
        "“Because” gives a cause and needs a clause.",
        "“However” links two separate sentences, not a noun."]},
    {q:"He didn’t speak much English; ______, he made friends quickly.",
     o:["therefore","nevertheless","because","so that"], a:1,

        "“Because” gives a reason and needs a clause.",
        "“So that” introduces a purpose."]},
    {q:"We rented a small flat ______ save money.",
     o:["in order to","so that","because of","despite"], a:0,
     e:["Correct. “In order to” + infinitive expresses purpose.",
        "“So that” needs a clause with a subject.",
        "“Because of” takes a noun and gives a cause.",
        "“Despite” takes a noun and expresses contrast."]},
    {q:"______ the rent was high, the location was perfect.",
     o:["Despite","Although","However","Because of"], a:1,

        "“Because of” takes a noun and gives a cause."]},
    {q:"Take a jacket ______ it gets cold tonight.",
     o:["in case","in order to","despite","whereas"], a:0,

        "“Despite” takes a noun and expresses contrast.",
        "“Whereas” compares two opposite facts."]},

     o:["however","as a result","although","whereas"], a:1,
     e:["“However” signals a contrast, but this is a logical consequence.",

        "“Although” introduces a contrast clause.",
        "“Whereas” compares two opposite facts."]},
    {q:"The food was excellent, ______ the service was very slow.",
     o:["therefore","although","so","because"], a:1,
     e:["“Therefore” introduces a result, but the two ideas contrast.",

        "“So” introduces a result.",
        "“Because” gives a reason, but slow service isn’t caused by good food."]},

     o:["Because of","Despite","Although","However"], a:1,
     e:["“Because of” gives a cause, but the delay didn’t cause the calm.",

        "“However” links two sentences, not a noun."]},

     o:["therefore","on the other hand","because","so"], a:1,

        "Correct. “On the other hand” introduces the opposite side of a comparison.",
        "“Because” gives a reason and needs a clause.",
        "“So” introduces a result."]},

     o:["Despite it was raining, we walked.","Although the rain, we walked.","Despite the rain, we walked.","However the rain, we walked."], a:2,
     e:["“Despite” can’t be followed by a clause; use “although” or “despite the rain”.",
        "“Although” needs a subject and a verb, not just a noun.",
        "Correct. “Despite” + noun phrase.",

const KEYS = ["A","B","C","D"];
const app = document.getElementById("app");
let S = null;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function flatten(test){
  const out = [];
  test.parts.forEach((p, pi) => p.q.forEach(q => out.push({ part: p.t, pi, q })));
  return out;
}

function home(){
  S = null;
  app.innerHTML = `
    <p class="eyebrow">My American Year · B2 · Practice</p>
    <h1>Grammar practice tests</h1>
    <p class="lede">Four tests, fifty questions each, in the same five parts as Friday's exam.
    Answer a question, check it, and you get the reason for every option — the right one and the three wrong ones.</p>
    <div class="pick">${TESTS.map((t,i)=>`
      <button data-t="${i}">
        <span class="pt">${esc(t.name)}</span>
        <span class="ps">${esc(t.theme)} · 50 questions · 5 parts</span>
      </button>`).join("")}
    </div>
    <p class="note"><b>Nothing is saved.</b> Close the page and the test starts again from zero, so students can retake it as often as they like.</p>`;
  app.querySelectorAll(".pick button").forEach(b =>
    b.addEventListener("click", () => start(+b.dataset.t)));
}

function start(ti, only){
  const all = flatten(TESTS[ti]);
  const idx = only || all.map((_,i)=>i);
  S = { ti, all, idx, pos:0, picked:new Array(all.length).fill(null), done:new Array(all.length).fill(false), retry: !!only };
  render();
}

function render(){
  const { all, idx, pos } = S;
  const gi = idx[pos];
  const item = all[gi];
  const picked = S.picked[gi];
  const checked = S.done[gi];
  const num = gi + 1;

  app.innerHTML = `
    <div class="topbar">
      <span class="part">${esc(item.part)}</span>
      <span class="count">${pos+1} / ${idx.length}${S.retry ? " · retry" : ""}</span>
    </div>
    <div class="bar"><i style="width:${(pos/idx.length)*100}%"></i></div>
    <div class="qbox">
      <span class="qnum">${num}.</span>
      <p class="q">${esc(item.q.q)}</p>
      <div class="opts">
        ${item.q.o.map((o,i)=>{
          const isRight = i === item.q.a;
          let cls = "opt";
          if (!checked && picked === i) cls += " sel";
          if (checked){
            cls += isRight ? " right" : " wrong";
            if (picked === i) cls += " picked";
          }
          const tag = checked && picked === i ? `<span class="tag">your answer</span>`
                    : (checked && isRight ? `<span class="tag">correct</span>` : "");
          return `<button class="${cls}" data-o="${i}" ${checked?"disabled":""}>
                    <span class="k">${KEYS[i]}</span><span>${esc(o)}</span>${tag}
                  </button>
                  ${checked ? `<p class="why${isRight?" ok":""}">${esc(item.q.e[i])}</p>` : ""}`;
        }).join("")}
      </div>
      ${checked ? `<p class="verdict ${picked===item.q.a?"ok":"no"}">${picked===item.q.a?"Correct":"Not correct — read the notes above"}</p>` : ""}
      <div class="actions">
        ${checked
          ? `<button class="go" id="next">${pos+1 < idx.length ? "Next question" : "See results"}</button>`
          : `<button class="go" id="check" ${picked===null?"disabled":""}>Check answer</button>`}
        <button class="ghost" id="quit">Leave test</button>
        <span class="hint">Keys A–D or 1–4 to choose · Enter to continue</span>
      </div>
    </div>`;

  app.querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", () => { S.picked[gi] = +b.dataset.o; render(); }));
  const c = document.getElementById("check");
  if (c) c.addEventListener("click", () => { S.done[gi] = true; render(); });
  const n = document.getElementById("next");
  if (n) n.addEventListener("click", () => {
    if (S.pos + 1 < S.idx.length){ S.pos++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
    else results();
  });
  document.getElementById("quit").addEventListener("click", home);
}

function results(){
  const { all, idx, ti } = S;
  const answered = idx.filter(i => S.done[i]);
  const right = answered.filter(i => S.picked[i] === all[i].q.a);
  const missed = answered.filter(i => S.picked[i] !== all[i].q.a);
  const test = TESTS[ti];

  const perPart = test.parts.map((p, pi) => {
    const ids = idx.filter(i => all[i].pi === pi);
    const ok = ids.filter(i => S.picked[i] === all[i].q.a).length;
    return { title: p.t, ok, total: ids.length };
  }).filter(p => p.total > 0);

  app.innerHTML = `
    <p class="eyebrow">${esc(test.name)} · result</p>
    <p class="score">${right.length}<small> / ${answered.length}</small></p>
    <div class="breakdown">
      ${perPart.map(p=>{
        const pct = p.total ? (p.ok/p.total)*100 : 0;
        return `<div class="brow"><span>${esc(p.title)}</span><span>${p.ok}/${p.total}</span>
          <span class="track"><i class="${pct<60?"low":""}" style="width:${pct}%"></i></span></div>`;
      }).join("")}
    </div>
    <div class="actions" style="margin-bottom:32px">
      ${missed.length ? `<button class="go" id="again">Redo the ${missed.length} I missed</button>` : ""}
      <button class="ghost" id="restart">Restart this test</button>
      <button class="ghost" id="back">Other tests</button>
    </div>
    ${missed.length ? `<p class="eyebrow">Questions to review</p><div class="review">${missed.map(i=>{
      const it = all[i];
      return `<details class="rev"><summary><span class="n">${i+1}.</span><span>${esc(it.q.q)}</span></summary>
        <div class="opts">${it.q.o.map((o,k)=>{
          const isRight = k === it.q.a;
          const cls = "opt " + (isRight ? "right" : "wrong") + (S.picked[i]===k ? " picked" : "");
          const tag = S.picked[i]===k ? `<span class="tag">your answer</span>` : (isRight ? `<span class="tag">correct</span>` : "");
          return `<div class="${cls}"><span class="k">${KEYS[k]}</span><span>${esc(o)}</span>${tag}</div>
                  <p class="why${isRight?" ok":""}">${esc(it.q.e[k])}</p>`;
        }).join("")}</div></details>`;
    }).join("")}</div>` : `<p class="note">Nothing to review — every answer was correct.</p>`}`;

  const a = document.getElementById("again");
  if (a) a.addEventListener("click", () => start(ti, missed));
  document.getElementById("restart").addEventListener("click", () => start(ti));
  document.getElementById("back").addEventListener("click", home);
  window.scrollTo({top:0});
}

document.addEventListener("keydown", e => {
  if (!S) return;
  const gi = S.idx[S.pos];
  const k = e.key.toUpperCase();
  const map = {A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if (k in map && !S.done[gi]){
    if (map[k] < S.all[gi].q.o.length){ S.picked[gi] = map[k]; render(); e.preventDefault(); }
  } else if (e.key === "Enter"){
    const btn = document.getElementById("next") || document.getElementById("check");
    if (btn && !btn.disabled){ btn.click(); e.preventDefault(); }
  }
});

home();
</script>
</body>
