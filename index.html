   {t:"Part 4 · Linking Words — Level 1", q:[
    {q:"We arrived at the client’s office late ______ the motorway was completely blocked.",
     o:["because","so","but","although"], a:0,
     e:["Correct. “Because” introduces the reason for something.",
        "“So” introduces a result, but the blocked motorway is the cause, not the consequence.",
        "“But” introduces a contrast, and the two ideas here do not contrast.",
        "“Although” introduces a contrast, which does not match a cause."]},
    {q:"The hotel near the station was fully booked, ______ we stayed in the next town.",
     o:["because","so","although","or"], a:1,
     e:["“Because” introduces a reason, but staying in the next town is the result.",
        "Correct. “So” introduces the result of the situation just described.",
        "“Although” introduces a contrast, not a result.",
        "“Or” offers an alternative between two options, which does not fit here."]},
    {q:"______ the flight was delayed by two hours, we still reached the client on time.",
     o:["Because","So","Although","And"], a:2,
     e:["“Because” would make the delay the reason for arriving on time, which makes no sense.",
        "“So” introduces a result, so it cannot open the first clause in this pattern.",
        "Correct. “Although” introduces an idea that contrasts with the main clause.",
        "“And” simply adds information and cannot express this contrast."]},
    {q:"The hotel room was very comfortable, ______ the Wi-Fi was far too slow for a video call.",
     o:["so","because","and","but"], a:3,
     e:["“So” introduces a result, and slow Wi-Fi is not the result of a comfortable room.",
        "“Because” introduces a reason, which does not fit these two ideas.",
        "“And” would simply add a similar idea, but the two ideas clearly contrast.",
        "Correct. “But” links two contrasting ideas."]},
    {q:"I read the whole client report ______ I was waiting at the gate.",
     o:["while","although","so","or"], a:0,
     e:["Correct. “While” introduces a longer action happening at the same time as another.",
        "“Although” introduces a contrast, and there is no contrast between the two ideas.",
        "“So” introduces a result, but waiting at the gate is not the result of reading.",
        "“Or” offers an alternative between two things, which does not fit here."]},
    {q:"______ we had signed the contract, we went out for dinner with the whole team.",
     o:["Although","After","While","Or"], a:1,
     e:["“Although” expresses a contrast, which does not match this sequence of events.",
        "Correct. “After” shows that the dinner came later than the signature.",
        "“While” means “at the same time”, which does not work with the completed action “had signed”.",
        "“Or” offers an alternative and cannot link two events in time."]},
    {q:"Some cities are much easier to reach than others. Lyon, ______ , is only two hours away by train.",
     o:["also","but","for example","then"], a:2,
     e:["“Also” adds a further idea; it does not introduce an illustration.",
        "“But” introduces a contrast, which is not what this second sentence does.",
        "Correct. “For example” introduces an illustration of the general statement.",
        "“Then” shows what happens next in time, not an example."]},
    {q:"First we visited the factory, next we met the production manager, and ______ we had lunch with the sales team.",
     o:["also","because","while","finally"], a:3,
     e:["“Also” adds information but does not mark the last step of a sequence.",
        "“Because” introduces a reason, not the final stage of a programme.",
        "“While” means “at the same time”, which contradicts a list of successive steps.",
        "Correct. “Finally” marks the last stage of a sequence."]},
    {q:"Choose the correct sentence about the second day of the trip.",
     o:["Although the programme was full, but we found time for a short walk.",
        "Although of the full programme, we found time for a short walk.",
        "Although the programme was full, we found time for a short walk.",
        "Although the programme was full, so we found time for a short walk."], a:2,
     e:["“Although” and “but” both express contrast, so using the two together repeats the same link.",
        "“Although” introduces a clause with a subject and a verb, not a noun phrase.",
        "Correct. “Although” plus a clause carries the contrast, and the main clause needs no second linker.",
        "“So” introduces a result, so it cannot be added to the main clause after “although”."]},
    {q:"Please call me ______ you land in Oslo, so that I know you have arrived safely.",
     o:["although","or","while","when"], a:3,
     e:["“Although” expresses a contrast, which does not fit this instruction.",
        "“Or” offers an alternative between two options, not a point in time.",
        "“While” would mean during the landing itself, which is not possible for a phone call.",
        "Correct. “When” introduces the moment at which the action should happen."]}
   ]}

{

   {t:"Part 1 · Future Forms & Conditional", q:[

    {q:"If you were in my position, ______ you accept the new deadline without any extra staff?",

   {t:"Part 2 · Present Perfect & Past Continuous Tenses", q:[
    {q:"We ______ on this reporting tool since the beginning of my placement.",
     o:["work","worked","have been working","are working"], a:2,
     e:["The present simple cannot be used with “since” to measure a period running up to now.",

    {q:"That is the clearest dashboard I ______ seen in this company.",

    {q:"We ______ three progress meetings this week, and it is only Wednesday.",

    {q:"I was checking the production data when my manager ______ me to come to his office.",

    {q:"Choose the correct sentence about the printer breakdown.",

   {t:"Part 3 · Gerund & Infinitive", q:[

   {t:"Part 4 · Linking Words — Level 1", q:[

{

const LEVELS = [
  { id:"bac1", label:"BAC+1", grid:"Niveau 5 · Année 1", cefr:"A2",
    scale:"Grid quiz scored out of 25", tests:T_BAC1 },
  { id:"bac2", label:"BAC+2", grid:"Niveau 5 · Année 2", cefr:"A2+ / B1-",
    scale:"Grid quiz scored out of 50", tests:T_BAC2 },
  { id:"bac3", label:"BAC+3", grid:"Niveau 6 · Année 3", cefr:"B1",
    scale:"Grid quiz scored out of 100 · TOEIC target 550", tests:T_BAC3 },
  { id:"bac4", label:"BAC+4", grid:"Niveau 7 · Année 4", cefr:"B1+",
    scale:"TOEIC target 650", tests:T_BAC4 },
  { id:"bac5", label:"BAC+5", grid:"Niveau 7 · Année 5", cefr:"B2-",
    scale:"Grid quiz scored out of 150 · TOEIC target 750", tests:T_BAC5 }
];

/* Each level's test length comes from its own grid: one 10-question section
   per linguistic criterion, so the totals differ by year. */
function testSize(l){ return l.tests[0].parts.reduce((n,p)=>n+p.q.length, 0); }

const KEYS = ["A","B","C","D"];
const app = document.getElementById("app");
let S = null;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function setLvl(id){ document.body.setAttribute("data-lvl", id || ""); }

/* Options are shuffled on every attempt: it removes any positional bias in the
   answer key and stops a retake being memorised as a sequence of letters.
   `e` moves with `o`, and `a` is remapped, so the notes stay aligned. */
function shuffleQ(q){
  const order = q.o.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return { q:q.q, o:order.map(i=>q.o[i]), e:order.map(i=>q.e[i]), a:order.indexOf(q.a) };
}

function flatten(test){
  const out = [];
  test.parts.forEach((p, pi) => p.q.forEach(q => out.push({ part: p.t, pi, q: shuffleQ(q) })));
  return out;
}

/* ---------- screen 1: choose a level ---------- */
function home(){
  S = null; setLvl("");
  app.innerHTML = `
    <p class="eyebrow">CESI · English · Practice</p>
    <h1>English grammar practice</h1>
    <p class="lede">Choose your year. Each level has four practice tests built on that
    year’s evaluation grid — one ten-question section per criterion, so the length differs
    by year. Answer a question, check it, and every option is explained: the right one and
    the three wrong ones.</p>
    <div class="pick">${LEVELS.map((l,i)=>`
      <button data-l="${i}">
        <span class="pc">${esc(l.grid)} · target ${esc(l.cefr)}</span>
        <span class="pt">${esc(l.label)}</span>
        <span class="ps">${l.tests.length} tests · ${testSize(l)} questions each · ${esc(l.scale)}</span>
      </button>`).join("")}
    </div>
    <p class="note"><b>Nothing is saved.</b> Close the page and everything starts again from zero,
    so students can retake a test as often as they like. No account, no internet needed.</p>`;
  app.querySelectorAll(".pick button").forEach(b =>
    b.addEventListener("click", () => levelHome(+b.dataset.l)));
}

/* ---------- screen 2: choose a test inside a level ---------- */
function levelHome(li){
  S = null;
  const l = LEVELS[li];
  setLvl(l.id);
  const syllabus = l.tests[0].parts.map(p => p.t);
  app.innerHTML = `
    <p class="eyebrow"><b>${esc(l.label)}</b> · ${esc(l.grid)} · target ${esc(l.cefr)}</p>
    <h1>${esc(l.label)} practice tests</h1>
    <p class="lede">Four tests of ${testSize(l)} questions, in the ${syllabus.length} sections below —
    ten questions each, one section per criterion of the ${esc(l.grid)} grid. Every test covers
    the same grammar in a different work situation, so none of them can be learned by heart.</p>
    <div class="pick">${l.tests.map((t,i)=>`
      <button data-t="${i}">
        <span class="pt">Test ${i+1}</span>
        <span class="ps">${esc(t.theme)} · ${testSize(l)} questions</span>
      </button>`).join("")}
    </div>
    <p class="eyebrow">What is tested</p>
    <div class="syl">${syllabus.map(s=>`<div>${esc(s)}</div>`).join("")}</div>
    <div class="actions"><button class="ghost" id="back">Other levels</button></div>`;
  app.querySelectorAll(".pick button").forEach(b =>
    b.addEventListener("click", () => start(li, +b.dataset.t)));
  document.getElementById("back").addEventListener("click", home);
  window.scrollTo({top:0});
}

/* ---------- screen 3: the test ---------- */
function start(li, ti, only){
  const all = flatten(LEVELS[li].tests[ti]);
  const idx = only || all.map((_,i)=>i);
  S = { li, ti, all, idx, pos:0,
        picked:new Array(all.length).fill(null),
        done:new Array(all.length).fill(false),
        retry: !!only };
  setLvl(LEVELS[li].id);
  render();
}

function render(){
  const { all, idx, pos, li, ti } = S;
  const gi = idx[pos];
  const item = all[gi];
  const picked = S.picked[gi];
  const checked = S.done[gi];

  app.innerHTML = `
    <div class="topbar">
      <span class="part">${esc(item.part)}</span>
      <span class="count">${esc(LEVELS[li].label)} · Test ${ti+1} · ${pos+1} / ${idx.length}${S.retry ? " · retry" : ""}</span>
    </div>
    <div class="bar"><i style="width:${(pos/idx.length)*100}%"></i></div>
    <div class="qbox">
      <span class="qnum">${gi+1}.</span>
      <p class="q">${esc(item.q.q)}</p>
      <div class="opts">
        ${item.q.o.map((o,i)=>{
          const isRight = i === item.q.a;
          let cls = "opt";
          if (!checked && picked === i) cls += " sel";
          if (checked){
            cls += isRight ? " right" : " wrong";
            if (picked === i) cls += " picked";
          }
          const tag = checked && picked === i ? `<span class="tag">your answer</span>`
                    : (checked && isRight ? `<span class="tag">correct</span>` : "");
          return `<button class="${cls}" data-o="${i}" ${checked?"disabled":""}>
                    <span class="k">${KEYS[i]}</span><span>${esc(o)}</span>${tag}
                  </button>
                  ${checked ? `<p class="why${isRight?" ok":""}">${esc(item.q.e[i])}</p>` : ""}`;
        }).join("")}
      </div>
      ${checked ? `<p class="verdict ${picked===item.q.a?"ok":"no"}">${picked===item.q.a?"Correct":"Not correct — read the notes above"}</p>` : ""}
      <div class="actions">
        ${checked
          ? `<button class="go" id="next">${pos+1 < idx.length ? "Next question" : "See results"}</button>`
          : `<button class="go" id="check" ${picked===null?"disabled":""}>Check answer</button>`}
        <button class="ghost" id="quit">Leave test</button>
        <span class="hint">Keys A–D or 1–4 to choose · Enter to continue</span>
      </div>
    </div>`;

  app.querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", () => { S.picked[gi] = +b.dataset.o; render(); }));
  const c = document.getElementById("check");
  if (c) c.addEventListener("click", () => { S.done[gi] = true; render(); });
  const n = document.getElementById("next");
  if (n) n.addEventListener("click", () => {
    if (S.pos + 1 < S.idx.length){ S.pos++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
    else results();
  });
  document.getElementById("quit").addEventListener("click", () => levelHome(S.li));
}

/* ---------- screen 4: results ---------- */
function letter(pct){
  if (pct >= 80) return "A";
  if (pct >= 60) return "B";
  if (pct >= 40) return "C";
  return "D";
}

function results(){
  const { all, idx, li, ti } = S;
  const test = LEVELS[li].tests[ti];
  const answered = idx.filter(i => S.done[i]);
  const right = answered.filter(i => S.picked[i] === all[i].q.a);
  const missed = answered.filter(i => S.picked[i] !== all[i].q.a);
  const pct = answered.length ? Math.round((right.length/answered.length)*100) : 0;

  const perPart = test.parts.map((p, pi) => {
    const ids = idx.filter(i => all[i].pi === pi);
    const ok = ids.filter(i => S.picked[i] === all[i].q.a).length;
    return { title: p.t, ok, total: ids.length };
  }).filter(p => p.total > 0);

  app.innerHTML = `
    <p class="eyebrow"><b>${esc(LEVELS[li].label)}</b> · Test ${ti+1} · ${esc(test.theme)}</p>
    <p class="score">${right.length}<small> / ${answered.length}</small></p>
    <p class="gradeline">${pct}% · indicative grid letter <b>${letter(pct)}</b>
      <span style="color:var(--ink-faint)">(A ≥ 80% · B ≥ 60% · C ≥ 40% · D below)</span></p>
    <div class="breakdown">
      ${perPart.map(p=>{
        const v = p.total ? (p.ok/p.total)*100 : 0;
        return `<div class="brow"><span>${esc(p.title)}</span><span>${p.ok}/${p.total}</span>
          <span class="track"><i class="${v<60?"low":""}" style="width:${v}%"></i></span></div>`;
      }).join("")}
    </div>
    <div class="actions" style="margin-bottom:32px">
      ${missed.length ? `<button class="go" id="again">Redo the ${missed.length} I missed</button>` : ""}
      <button class="ghost" id="restart">Restart this test</button>
      <button class="ghost" id="back">Other tests</button>
      <button class="ghost" id="levels">Other levels</button>
    </div>
    ${missed.length ? `<p class="eyebrow">Questions to review</p><div class="review">${missed.map(i=>{
      const it = all[i];
      return `<details class="rev"><summary><span class="n">${i+1}.</span><span>${esc(it.q.q)}<em class="rpart">${esc(it.part)}</em></span></summary>
        <div class="opts">${it.q.o.map((o,k)=>{
          const isRight = k === it.q.a;
          const cls = "opt " + (isRight ? "right" : "wrong") + (S.picked[i]===k ? " picked" : "");
          const tag = S.picked[i]===k ? `<span class="tag">your answer</span>` : (isRight ? `<span class="tag">correct</span>` : "");
          return `<div class="${cls}"><span class="k">${KEYS[k]}</span><span>${esc(o)}</span>${tag}</div>
                  <p class="why${isRight?" ok":""}">${esc(it.q.e[k])}</p>`;
        }).join("")}</div></details>`;
    }).join("")}</div>` : `<p class="note">Nothing to review — every answer was correct.</p>`}`;

  const a = document.getElementById("again");
  if (a) a.addEventListener("click", () => start(li, ti, missed));
  document.getElementById("restart").addEventListener("click", () => start(li, ti));
  document.getElementById("back").addEventListener("click", () => levelHome(li));
  document.getElementById("levels").addEventListener("click", home);
  window.scrollTo({top:0});
}

document.addEventListener("keydown", e => {
  if (!S) return;
  const gi = S.idx[S.pos];
  const k = e.key.toUpperCase();
  const map = {A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if (k in map && !S.done[gi]){
    if (map[k] < S.all[gi].q.o.length){ S.picked[gi] = map[k]; render(); e.preventDefault(); }
  } else if (e.key === "Enter"){
    const btn = document.getElementById("next") || document.getElementById("check");
    if (btn && !btn.disabled){ btn.click(); e.preventDefault(); }
  }
});

home();
</script>
