        "The present perfect is never used with a precise finished past time."]},
    {q:"Sorry, Mr Clarke ______ for a client at the moment. Can I take a message?",
     o:["waited","waits","is waiting","waiting"], a:2,
     e:["The past simple describes a finished past situation, not the present moment.",
        "The present simple is for routines, but “at the moment” needs a temporary action.",
        "Correct. The present continuous describes a temporary situation happening now, signalled by “at the moment”.",
        "A verb form without an auxiliary cannot be a main verb in this sentence."]},
    {q:"What time ______ the video call start every Tuesday?",
     o:["is","does","did","do"], a:1,
     e:["“Is” would need an -ing form after it, not the base verb “start”.",
        "Correct. Present simple questions with a singular subject use the auxiliary “does” plus the base verb.",
        "“Did” makes a past question, but the call happens every Tuesday.",
        "“Do” does not agree with the singular subject “the video call”."]},
    {q:"Last week I ______ three emails to Birmingham but nobody answered.",
     o:["send","am sending","sent","was sending"], a:2,
     e:["The present simple cannot describe a finished action in “last week”.",
        "The present continuous refers to now, not to a completed past action.",
        "Correct. The past simple is used for a completed action at a stated past time such as “last week”.",
        "The past continuous suggests an action in progress, but here the three emails were completed."]},
    {q:"Choose the correct sentence.",
     o:["She usually is checking the shared folder in the morning.","She is usually check the shared folder in the morning.","She usually check the shared folder in the morning.","She usually checks the shared folder in the morning."], a:3,
     e:["“Usually” signals a habit, so the present continuous is the wrong tense here.",
        "After “is” the verb cannot stay in the base form; this mixes two structures.",
        "The verb does not agree with “she”, which requires the -s ending.",
        "Correct. The present simple with -s expresses a habit, and “usually” sits before the main verb."]},
    {q:"They ______ the time of the call this morning, so now the meeting is at four.",
     o:["change","changed","are changing","were changing"], a:1,
     e:["The present simple does not express a single finished action this morning.",
        "Correct. The past simple describes a completed action in a finished period, here “this morning”.",
        "The present continuous would mean the change is still in progress, but it is already done.",
        "The past continuous describes a background action, not a single completed decision."]},
    {q:"Our manager ______ English with the UK team and French with us.",
     o:["is speaking","speak","spoke","speaks"], a:3,
     e:["The present continuous describes a temporary action, not a general fact about habits.",
        "The verb must agree with “our manager”, a singular subject.",
        "The past simple would place this fact in the past, but it is still true.",
        "Correct. The present simple expresses a general, permanent fact."]},
    {q:"While I ______ my notes, Sarah called from Leeds.",
     o:["write","was writing","wrote","am writing"], a:1,
     e:["The present simple cannot describe a past background action.",
        "Correct. The past continuous describes a longer action in progress when a shorter past action interrupted it.",
        "The past simple here would suggest two separate finished actions, not one interrupting the other.",
        "The present continuous refers to now, but the call happened in the past."]}
   ]},
   {t:"Part 2 · Common Modal Auxiliaries", q:[
    {q:"You ______ be late for the video call with London; it starts exactly at nine.",
     o:["mustn’t","don’t must","aren’t must","needn’t"], a:0,
     e:["Correct. “Mustn’t” expresses a strong prohibition or something it is important not to do.",
        "Modal verbs never take the auxiliary “do” in the negative.",
        "Modal verbs are not combined with “be” to form the negative.",
        "“Needn’t” means it is not necessary, which does not match a strict start time."]},
    {q:"______ you speak English on the phone without any problem?",
     o:["Must","Should","Can","Have"], a:2,
     e:["“Must” asks about obligation, not about someone’s ability.",
        "“Should” asks for advice, not about what a person is able to do.",
        "Correct. “Can” is used to ask about ability or skill.",
        "“Have” would need “to” plus a verb and expresses obligation, not ability."]},
    {q:"I ______ finish this report before five; my boss asked for it today.",
     o:["have to","must to","can to","should to"], a:0,
     e:["Correct. “Have to” expresses an obligation that comes from outside, here from the boss.",
        "“Must” is a modal and is never followed by “to”.",
        "“Can” is never followed by “to” and expresses ability, not obligation.",
        "“Should” is never followed by “to” and gives advice, not obligation."]},
    {q:"______ I use your phone to call back the Bristol office?",
     o:["Should","Must","Would","May"], a:3,
     e:["“Should” asks for advice rather than for permission.",
        "“Must” expresses obligation, so it is strange when asking the other person.",
        "“Would” alone does not ask for permission to do something.",
        "Correct. “May” is a polite way of asking for permission."]},
    {q:"Your accent is good, but you ______ speak a little more slowly on the phone.",
     o:["must not","should","can’t","may not"], a:1,
     e:["“Must not” forbids an action, but this is friendly advice.",
        "Correct. “Should” is used to give advice or a recommendation.",
        "“Can’t” says the person is unable to do it, which contradicts the first part.",
        "“May not” refuses permission, which does not fit a piece of advice."]},
    {q:"Sorry, I ______ hear you very well. The connection is bad today.",
     o:["mustn’t","shouldn’t","can’t","haven’t to"], a:2,
     e:["“Mustn’t” expresses prohibition, not a problem with hearing.",
        "“Shouldn’t” gives negative advice, not a lack of ability.",
        "Correct. “Can’t” expresses inability, here caused by the bad connection.",
        "“Haven’t to” is not a possible form in English."]},
    {q:"In our company we ______ wear a suit; jeans are fine.",
     o:["mustn’t","shouldn’t have to","can’t","don’t have to"], a:3,
     e:["“Mustn’t” would mean a suit is forbidden, but the sentence says there is simply no rule.",
        "This combination is not a natural form and does not express absence of obligation.",
        "“Can’t” would mean wearing a suit is not allowed, which is too strong here.",
        "Correct. “Don’t have to” means something is not necessary."]},
    {q:"Choose the correct sentence about joining the call.",
     o:["You can to join the call from your laptop.","You can join the call from your laptop.","You can joining the call from your laptop.","You can joins the call from your laptop."], a:1,
     e:["“Can” is never followed by “to” before the verb.",
        "Correct. A modal verb such as “can” is followed directly by the base form of the verb.",
        "A modal verb cannot be followed by an -ing form.",
        "A modal verb is never followed by a verb with -s."]},
    {q:"Visitors ______ sign in at reception before they enter the building.",
     o:["can","may","must","should have"], a:2,
     e:["“Can” expresses permission or ability, not a company rule.",
        "“May” would give permission, but this is a compulsory procedure.",
        "Correct. “Must” expresses a strong obligation, often a rule or regulation.",
        "This form is not used to express a present rule before a base verb."]},
    {q:"It’s only two o’clock in Glasgow, so Tom ______ still be at lunch.",
     o:["may","must not","can’t","has to"], a:0,
     e:["Correct. “May” expresses a possibility that the speaker is not sure about.",
        "“Must not” expresses prohibition, which makes no sense about someone’s lunch.",
        "“Can’t” would state that it is impossible, but the time makes it quite likely.",
        "“Has to” expresses obligation, not a guess about a situation."]}
   ]},
   {t:"Part 3 · Past Habit: Used To", q:[
    {q:"When I was a student I ______ work in a call centre every summer.",
     o:["am used to","use to","used to","was used"], a:2,
     e:["“Am used to” means being familiar with something and is followed by an -ing form.",
        "Without a negative or a question, the base form “use to” is not correct here.",
        "Correct. “Used to” describes a habit or a situation in the past that is no longer true.",
        "“Was used” is a passive form and does not express a past habit."]},
    {q:"The UK team ______ send the files by post, but now everything is online.",
     o:["used to","is used to","uses to","did use"], a:0,
     e:["Correct. “Used to” contrasts a past habit with a different present situation.",
        "“Is used to” means being familiar with something and needs an -ing form after it.",
        "“Uses to” is not a possible form in English.",
        "“Did use” would only appear in a question or a negative sentence."]},
    {q:"Our old office was very small; we ______ share one meeting room.",
     o:["used to","are used to","use to","used"], a:0,
     e:["Correct. “Used to” describes a past arrangement that is no longer true.",
        "“Are used to” means being familiar with something and takes an -ing form after it.",
        "“Use to” only appears after “did” in questions and negative sentences.",
        "“Used” on its own needs “to” before the next verb to express a past habit."]},
    {q:"I ______ speak English on the phone when I started, but last Monday I called Leeds myself.",
     o:["didn’t used to","not used to","didn’t use to","wasn’t used to"], a:2,
     e:["After “didn’t” the verb goes back to the base form “use”, with no -d ending.",
        "A past negative sentence needs the auxiliary “didn’t” before the verb.",
        "Correct. The negative of “used to” is “didn’t use to” with the base form.",
        "“Wasn’t used to” means not familiar with something and takes an -ing form."]},
    {q:"Choose the correct negative sentence.",
     o:["I didn’t used to speak English at work.","I didn’t use to speak English at work.","I didn’t used speak English at work.","I not used to speak English at work."], a:1,
     e:["After the auxiliary “didn’t” the verb goes back to its base form “use”.",
        "Correct. In the negative, “used to” becomes “didn’t use to” with the base form.",
        "“Used” cannot follow “didn’t”, and “to” is missing before the verb.",
        "A negative sentence in the past needs the auxiliary “didn’t” before the verb."]},
    {q:"______ you use to answer calls from the UK in your last job?",
     o:["Do","Did","Were","Have"], a:1,
     e:["“Do” forms a present question, but the sentence asks about a past habit.",
        "Correct. Questions with “use to” are formed with the past auxiliary “did”.",
        "“Were” cannot be followed by the base form “use” in a question.",
        "“Have” would need a past participle and does not form the “use to” question."]},
    {q:"Sam ______ be my team leader; now he works in Cardiff.",
     o:["used to","is used to","was used to","uses to"], a:0,
     e:["Correct. “Used to” describes a past state that is no longer true.",
        "“Is used to” means being familiar with something and is followed by an -ing form.",
        "“Was used to” also needs an -ing form and means being familiar with something.",
        "“Uses to” is not a possible form in English."]},
    {q:"I ______ be nervous on the phone, but now I quite enjoy it.",
     o:["will","am used to","used to","am going to"], a:2,
     e:["“Will” refers to the future, but the sentence contrasts the past with now.",
        "“Am used to” describes a present familiarity and needs an -ing form after it.",
        "Correct. “Used to” describes a past state that has changed.",
        "“Am going to” expresses a future plan, not a finished past state."]},
    {q:"Yesterday morning I ______ the Manchester office twice about the delivery.",
     o:["used to call","was used to calling","use to call","called"], a:3,
     e:["“Used to call” describes a repeated habit over a long period, not two calls on one morning.",
        "“Was used to calling” says the speaker was familiar with calling, not that it happened yesterday.",
        "“Use to call” is only possible after “did” in a question or a negative sentence.",
        "Correct. The past simple is used for a finished action at a stated past time."]},
    {q:"Choose the correct question about a past habit.",
     o:["Did your team used to work on Saturdays?","Did your team use to work on Saturdays?","Does your team use to work on Saturdays?","Did your team using to work on Saturdays?"], a:1,
     e:["After “did” the verb must be the base form “use”, without the -d ending.",
        "Correct. The question form is “did” plus “use to” plus the base verb.",
        "“Use to” for past habits needs the past auxiliary “did”, not “does”.",
        "An -ing form cannot follow the auxiliary “did”."]}
   ]},
   {t:"Part 4 · Prepositions of Place & Time", q:[
    {q:"The video call starts ______ half past two, London time.",
     o:["in","on","at","to"], a:2,
     e:["“In” is used with months, years and longer periods, not with clock times.",
        "“On” is used with days and dates, not with a precise hour.",
        "Correct. “At” is used with exact clock times.",
        "“To” shows direction or is used in expressions like “ten to three”, not alone before a time."]},
    {q:"The UK team usually takes its summer holiday ______ August.",
     o:["at","on","in","for"], a:2,
     e:["“At” is used with clock times and in fixed expressions such as “at night”.",
        "“On” is used with days and dates, not with the name of a month.",
        "Correct. “In” is used with months, seasons and years.",
        "“For” expresses how long something lasts, not when it happens."]},
    {q:"I worked with the Leeds office ______ 2023 to 2025.",
     o:["since","for","during","from"], a:3,
     e:["“Since” needs the present perfect, so it does not fit a finished past period.",
        "“For” is used with a length of time, such as two years.",
        "“During” is used with a period in which something happens, not with a starting point.",
        "Correct. “From” marks the start of a period and pairs with “to”."]},
    {q:"We stayed in Manchester ______ three days last autumn.",
     o:["since","during","at","for"], a:3,
     e:["“Since” needs a starting point in time, not a duration.",
        "“During” is used with a named period, such as “during the week”, not with a number of days.",
        "“At” is used with clock times and certain places, not with a duration.",
        "Correct. “For” is used with a length of time."]},
    {q:"The Bristol office stays open ______ six o’clock; after that nobody answers.",
     o:["until","since","during","for"], a:0,
     e:["Correct. “Until” marks the end point of a period of time.",
        "“Since” marks the beginning of a period that continues up to now.",
        "“During” is used with a period inside which something happens.",
        "“For” is used with a length of time, such as two hours."]},
    {q:"Please send me the figures ______ Thursday at the latest.",
     o:["until","by","since","during"], a:1,
     e:["“Until” means up to a moment and continuing, which does not fit a deadline.",
        "Correct. “By” means at or before a deadline.",
        "“Since” marks the start of a period that continues up to now.",
        "“During” is used with a period, not with a deadline."]},
    {q:"She took a lot of notes ______ the meeting.",
     o:["during","while","since","on"], a:0,
     e:["Correct. “During” is used with an event to say when something happened inside it.",
        "“While” introduces a clause with a verb, not a noun phrase like “the meeting”.",
        "“Since” marks the beginning of a period up to now.",
        "“On” is used with days and dates, not with an event like a meeting."]},
    {q:"The call is ______ two and three o’clock, so please do not phone me then.",
     o:["during","at","between","from"], a:2,
     e:["“During” is followed by a single period or event, not by two times joined by “and”.",
        "“At” is used with one exact time, not with a range of time.",
        "Correct. “Between … and …” shows the two limits of a period.",
        "“From” needs “to” rather than “and” to mark the end of a period."]},
    {q:"I put the signed contract ______ your desk this morning.",
     o:["in","on","at","to"], a:1,
     e:["“In” means inside something, but a desk has a surface.",
        "Correct. “On” is used for a flat surface such as a desk or a table.",
        "“At” refers to a general position, as in “at my desk”, not to the surface itself.",
        "“To” shows movement towards a place and does not follow “put” here."]},
    {q:"Our manager goes ______ London once a month for the review.",
     o:["in","at","on","to"], a:3,
     e:["“In” shows position inside a place, not movement towards it.",
        "“At” shows a point or a position, not a destination after “go”.",
        "“On” is used for surfaces and for days, not for a destination.",
        "Correct. “To” shows movement towards a destination."]}
   ]},
   {t:"Part 5 · Future Forms: Will & Going To", q:[
    {q:"Look at the screen; the slides ______ load. Let me try again.",
     o:["won’t","aren’t going","don’t will","will not to"], a:0,
     e:["Correct. “Won’t” is the short negative of “will” and is used for a refusal, even by a machine.",
        "“Going” needs “to” before the verb, so this form is incomplete.",
        "“Will” is a modal and never takes the auxiliary “do”.",
        "“Will” is never followed by “to” before the main verb."]},
    {q:"I booked the room yesterday, so we ______ meet the UK team there on Friday.",
     o:["will to","are going to","go to","will going to"], a:1,
     e:["“Will” is never followed by “to” before a verb.",
        "Correct. “Going to” is used for a plan or an intention decided before the moment of speaking.",
        "This form is not a future tense; it simply means moving to a place.",
        "“Will” and “going to” cannot be combined in the same verb phrase."]},
    {q:"That box looks heavy — I ______ it to the meeting room for you.",
     o:["carry","am carrying","will carry","will carrying"], a:2,
     e:["The present simple does not express an offer made at the moment of speaking.",
        "The present continuous suggests an arrangement already fixed, not a spontaneous offer.",
        "Correct. “Will” plus the base verb is used for an offer made while speaking.",
        "“Will” is never followed by an -ing form."]},
    {q:"Don’t worry about the figures; I ______ them for you.",
     o:["check","am checking","will","will check"], a:3,
     e:["The present simple does not express a decision taken at the moment of speaking.",
        "The present continuous would suggest a fixed arrangement, not a spontaneous offer.",
        "“Will” alone cannot stand without the main verb in this sentence.",
        "Correct. “Will” plus the base verb is used for a decision or an offer made while speaking."]},
    {q:"Don’t worry — I ______ forget to send the minutes to Birmingham.",
     o:["don’t will","won’t","am not going","will not to"], a:1,
     e:["Modal verbs such as “will” never take the auxiliary “do”.",
        "Correct. “Won’t” is the negative of “will” and is used here for a promise.",
        "“Going” must be followed by “to” before the main verb.",
        "“Will” is never followed by “to” before the main verb."]},
    {q:"Look at those clouds; I think it ______ rain before our train to York.",
     o:["goes to","used to","will to","is going to"], a:3,
     e:["This form is not a future tense and does not express a prediction.",
        "“Used to” refers to past habits, not to a prediction about today.",
        "“Will” is never followed by “to” before the verb.",
        "Correct. “Going to” is used for a prediction based on present evidence, here the clouds."]},
    {q:"The battery is nearly empty; my laptop ______ switch off in a minute.",
     o:["is going to","used to","will to","is go to"], a:0,
     e:["Correct. “Going to” is used for a prediction based on evidence we can see now.",
        "“Used to” describes a past habit, not something about to happen.",
        "“Will” is never followed by “to” before the main verb.",
        "“Is go to” mixes two forms; “going” is needed after “is”."]},
    {q:"There ______ be a new team leader next month; the directors decided yesterday.",
     o:["used to","going to","will to","is going to"], a:3,
     e:["“Used to” places the situation in the past, but this concerns next month.",
        "“Going to” needs the verb “be” before it to form the future.",
        "“Will” is never followed by “to” before the verb.",
        "Correct. “Going to” is used for a future event already decided or planned."]},
    {q:"We chose the hotel yesterday; we ______ stay near the Leeds office.",
     o:["will to","used to","go to","are going to"], a:3,
     e:["“Will” is never followed by “to” before a verb.",
        "“Used to” refers to a past habit, not to a plan for the future.",
        "“Go to” is not a future form; it simply means moving to a place.",
        "Correct. “Going to” expresses a plan decided before the moment of speaking."]},
    {q:"Our flight to Edinburgh ______ at seven tomorrow morning; the ticket is on my desk.",
     o:["will leaving","used to leave","will leave","leaved"], a:2,
     e:["“Will” is never followed by an -ing form.",
        "“Used to leave” refers to a past habit, not to tomorrow.",
        "Correct. “Will” plus the base verb states a scheduled future event.",
        "“Leaved” is not a correct form; the past of “leave” is “left”."]}
   ]},
   {t:"Part 6 · Common Phrasal Verbs", q:[
    {q:"Please ______ this form before you send it to the UK office.",
     o:["fill in","fill up","fill on","fill off"], a:0,
     e:["Correct. “Fill in” means to write the required information on a form.",
        "“Fill up” means to make something completely full, like a tank.",
        "“Fill on” is not an existing phrasal verb in English.",
        "“Fill off” is not an existing phrasal verb in English."]},
    {q:"He isn’t at his desk, but he will ______ you ______ after lunch.",
     o:["call / up","call / back","call / in","call / off"], a:1,
     e:["“Call up” means to telephone someone, but it does not mean returning a call.",
        "Correct. “Call back” means to return someone’s phone call.",
        "“Call in” means to visit briefly or to phone a workplace, not to return a call.",
        "“Call off” means to cancel something, such as a meeting."]},
    {q:"Can you ______ what time the London train arrives?",
     o:["look after","find out","take off","give up"], a:1,
     e:["“Look after” means to take care of someone or something.",
        "Correct. “Find out” means to discover a piece of information.",
        "“Take off” means to remove clothes or, for a plane, to leave the ground.",
        "“Give up” means to stop doing something."]},
    {q:"Don’t forget to ______ the projector before you leave the room.",
     o:["turn off","turn into","turn up","turn down"], a:0,
     e:["Correct. “Turn off” means to stop a machine or a light working.",
        "“Turn into” means to become something different.",
        "“Turn up” means to arrive or to increase the volume.",
        "“Turn down” means to reduce the volume or to refuse an offer."]},
    {q:"You have to ______ your timesheet to the manager every Friday.",
     o:["hand out","hand over to","hand round","hand in"], a:3,
     e:["“Hand out” means to distribute something to several people.",
        "“Hand over to” means to give responsibility or control to someone else.",
        "“Hand round” means to pass something from person to person in a group.",
        "Correct. “Hand in” means to give a document to a person in authority."]},
    {q:"Who is going to ______ this complaint from the client?",
     o:["deal to","deal on","deal in","deal with"], a:3,
     e:["“Deal to” is not a possible phrasal verb in English.",
        "“Deal on” is not a possible phrasal verb in English.",
        "“Deal in” means to buy and sell a type of product.",
        "Correct. “Deal with” means to handle a problem or a task."]},
    {q:"We need to ______ a meeting room with a good camera.",
     o:["set up","set off","set in","set out"], a:0,
     e:["Correct. “Set up” means to prepare or organise something.",
        "“Set off” means to start a journey.",
        "“Set in” is used for weather or a condition that begins and stays.",
        "“Set out” means to begin a journey or to explain something in detail."]},
    {q:"I really ______ my new colleague in Liverpool; she is very friendly.",
     o:["get on with","get up with","get in with","get off with"], a:0,
     e:["Correct. “Get on with” someone means to have a good relationship with them.",
        "“Get up” means to leave your bed and does not take “with” in this meaning.",
        "“Get in” means to enter a vehicle or a place, not to like a person.",
        "“Get off” means to leave a vehicle, so it does not fit a colleague."]},
    {q:"Our driver will ______ the visitors ______ at the airport.",
     o:["pick / off","pick / on","pick / out","pick / up"], a:3,
     e:["“Pick off” is not used for collecting people from a place.",
        "“Pick on” means to treat someone unfairly or to criticise them.",
        "“Pick out” means to choose or recognise something among others.",
        "Correct. “Pick up” means to collect someone from a place in a vehicle."]},
    {q:"The IT team will ______ the problem with the shared calendar today.",
     o:["sort through","sort out","sort in","sort off"], a:1,
     e:["“Sort through” means to look at many things to organise them, not to repair a problem.",
        "Correct. “Sort out” means to solve a problem or to put things in order.",
        "“Sort in” is not a possible phrasal verb in English.",
        "“Sort off” is not a possible phrasal verb in English."]}
   ]},
   {t:"Part 7 · Articles, Countable & Uncountable", q:[
    {q:"Tom is ______ engineer, and he works in the Bristol office.",
     o:["a","an","the","no article"], a:1,
     e:["“A” is used before a consonant sound, but “engineer” starts with a vowel sound.",
        "Correct. “An” is used before a word beginning with a vowel sound, as in “engineer”.",
        "“The” refers to something already known, but this simply states his job.",
        "A singular job noun needs an article in English, unlike in French."]},
    {q:"My new colleague in Leeds is ______ technician in the test lab.",
     o:["the","a","an","no article"], a:1,
     e:["“The” points to someone already known, but this simply states her job.",
        "Correct. “A” is used before a job noun beginning with a consonant sound.",
        "“An” is used before a vowel sound, and “technician” begins with a consonant sound.",
        "A singular job noun needs an article in English, unlike in French."]},
    {q:"We joined a video call this morning; ______ call lasted almost two hours.",
     o:["a","an","no article","the"], a:3,
     e:["“A” introduces something for the first time, but this call is already known.",
        "“An” is used before a vowel sound and also only introduces something new.",
        "A singular countable noun cannot stand alone as a subject here.",
        "Correct. “The” refers back to something already mentioned."]},
    {q:"Our colleagues in Cardiff speak ______ English and a little Welsh.",
     o:["no article","the","an","a"], a:0,
     e:["Correct. The names of languages are used without an article.",
        "“The English” would mean the people of England, not the language.",
        "“An” is not used before the name of a language.",
        "“A” is not used before the name of a language."]},
    {q:"There isn’t ______ coffee left in the kitchen.",

    {q:"The design team ______ with this client before, so everything is new for them.",

     e:["An adverb of frequency is not placed after the past participle in this structure.",
        "The adverb must come after the auxiliary “has”, not before it.",
        "This word order is impossible, because the auxiliary “has” must come before the participle.",
        "Correct. With an auxiliary verb, the adverb of frequency goes between “has” and the past participle."]},
    {q:"The project team meets ______ to review the progress of each task.",
     o:["twice a week","a week twice","two times the week","twice in week"], a:0,
     e:["Correct. An expression of frequency such as “twice a week” is placed at the end of the sentence.",
        "The number of times must come before “a week”, so this order is impossible.",
        "The correct pattern after a number of times is “a week”, not “the week”.",
        "The article is missing; the fixed expression is “twice a week”."]},
    {q:"The client ______ asks for extra features in the middle of a project.",
     o:["sometime","sometimes","is sometimes","sometimes is"], a:1,
     e:["“Sometime” means at an unspecified moment and does not express frequency.",
        "Correct. An adverb of frequency goes between the subject and the main verb in the present simple.",
        "“Asks” is already the main verb, so adding “is” creates two verbs.",
        "The verb “is” is not needed and this word order is impossible with “asks”."]},
    {q:"Choose the correct sentence.",
     o:["He often going to the client’s office.","Often he is going to the client’s office.","He often goes to the client’s office.","He goes to often the client’s office."], a:2,
     e:["Without an auxiliary, “going” cannot be the verb of the sentence.",
        "Starting with the adverb plus a continuous form does not express a regular habit correctly.",
        "Correct. An adverb of frequency is placed between the subject and the main verb.",
        "Placing the adverb after the preposition breaks the word order of the sentence."]},
    {q:"We ______ use paper documents now that everything is on the shared drive.",
     o:["hardly never","ever hardly","hardly ever","hardly ever not"], a:2,
     e:["“Hardly never” is a double negative, which English does not accept here.",
        "The two words cannot be reversed; the fixed expression is “hardly ever”.",
        "Correct. “Hardly ever” means almost never and goes before the main verb.",
        "“Hardly ever” is already negative, so adding “not” is impossible."]},
    {q:"Choose the correct sentence.",
     o:["We have meetings rarely on Friday afternoons.","Rarely we have meetings on Friday afternoons.","We have rarely meetings on Friday afternoons.","We rarely have meetings on Friday afternoons."], a:3,
     e:["Placing the adverb of frequency after the object is not the normal position here.",
        "“Rarely” is not placed at the beginning of the sentence in standard B1 word order; it goes between the subject and the main verb.",
        "The adverb cannot be placed between the main verb and its object.",
        "Correct. An adverb of frequency is placed between the subject and the main verb."]},
    {q:"The report should ______ include a short summary at the beginning.",
     o:["always","always to","be always","always be"], a:0,
     e:["Correct. With a modal verb, the adverb of frequency goes between the modal and the main verb.",
        "A modal verb is followed by the bare infinitive, so “to” cannot appear here.",
        "“Include” is already the main verb, so adding “be” before it is impossible.",
        "Putting “be” before “include” creates two verbs after the modal."]}
   ]},
   {t:"Part 7 · Comparatives, Superlatives & Intensifiers", q:[
    {q:"This method is ______ than the one we used last year.",
     o:["more efficient","efficienter","the most efficient","most efficient"], a:0,
     e:["Correct. Long adjectives form the comparative with “more” before the adjective and “than” after it.",
        "“Efficient” is a long adjective, so it cannot take the ending “-er”.",
        "A superlative cannot be used with “than” in this comparison of two things.",
        "“Most efficient” without “the” is not a comparative form and does not go with “than”."]},
    {q:"The kick-off meeting was ______ day of the whole week.",
     o:["a busier","busier","most busy","the busiest"], a:3,
     e:["A comparative with “a” cannot express that something is the top of a group.",
        "A comparative needs “than” and does not single out one element of a group.",
        "“Most busy” is not the standard superlative of this short adjective and is missing “the”.",
        "Correct. The superlative of a short adjective takes “the” plus the “-est” ending."]},
    {q:"Our new timeline is not ______ the one the client suggested.",
     o:["as realistic as","so realistic than","as realistic than","more realistic as"], a:0,
     e:["Correct. The structure “as … as” compares two things and works in the negative too.",
        "“So … than” mixes two structures; “so” must be followed by “as” in a negative comparison.",
        "The structure “as … as” cannot end with “than”.",
        "A comparative with “more” must be followed by “than”, not “as”."]},
    {q:"The first version of the interface was ______ slow that nobody wanted to test it.",
     o:["too","so","very","much"], a:1,
     e:["“Too” is followed by “to” plus a verb, not by a “that” clause.",
        "Correct. The pattern “so” plus an adjective plus “that” introduces a result.",
        "“Very” cannot be followed by a “that” clause expressing a result.",
        "“Much” does not intensify an adjective in this position."]},
    {q:"The second prototype is ______ better than the first one.",
     o:["very","too","far","absolutely"], a:2,
     e:["“Very” cannot intensify a comparative form such as “better”.",
        "“Too” means more than is acceptable and does not strengthen a comparative.",
        "Correct. “Far” is an intensifier that can be placed before a comparative.",
        "“Absolutely” goes with extreme adjectives, not with comparative forms."]},
    {q:"This planning document is ______ long for a first presentation.",
     o:["enough","very much","so much","too"], a:3,
     e:["“Enough” follows the adjective and means a sufficient amount, not an excessive one.",
        "“Very much” cannot be placed directly before an adjective in this position.",
        "“So much” goes with nouns or verbs, not directly before an adjective like this.",
        "Correct. “Too” before an adjective means more than is acceptable."]},
    {q:"The tool is not simple ______ for the whole team to use without training.",
     o:["too","enough","so","much"], a:1,
     e:["“Too” is placed before the adjective, not after it.",
        "Correct. “Enough” is placed after the adjective to say whether something is sufficient.",
        "“So” comes before the adjective and does not express a sufficient degree.",
        "“Much” cannot follow an adjective to express sufficiency."]},
    {q:"The new planning tool is ______ than the spreadsheet we used before.",
     o:["more simpler","the simplest","much simpler","simpler as"], a:2,
     e:["“More” cannot be combined with the “-er” ending on the same adjective.",
        "A superlative cannot be used with “than” to compare two things.",
        "Correct. “Much” strengthens a comparative, and the comparative is followed by “than”.",
        "A comparative ending in “-er” must be followed by “than”, not “as”."]},
    {q:"Of all the solutions we tested, this one was by far ______ solution to implement.",
     o:["easier","more easy","the easiest","easiest"], a:2,
     e:["A comparative cannot be used to select one item out of a whole group.",
        "“Easy” is a short adjective and does not form its comparative with “more”.",
        "Correct. The superlative with “the” plus the “-est” ending singles out one item in a group.",
        "The superlative form needs the article “the” before it in this sentence."]},
    {q:"The first draft of the plan was ______ impossible to follow, so we rewrote it.",
     o:["completely","very much","far","enough"], a:0,
     e:["Correct. “Completely” strengthens an extreme adjective such as “impossible”.",
        "“Very much” cannot be placed directly before an adjective in this position.",
        "“Far” strengthens comparative forms, not an extreme adjective like this one.",
        "“Enough” is placed after the adjective and expresses a sufficient degree."]}
   ]}
  ]
},
{
  id: 32, name: "BAC+3 · Test 2", theme: "Describing my company",
  parts: [
   {t:"Part 1 · Relative Pronouns", q:[
    {q:"The colleague ______ showed you the workshop is our site manager.",
     o:["who","which","whose","whom"], a:0,
     e:["Correct. “Who” is the relative pronoun used as subject when it refers to a person.",
        "“Which” refers to things or animals, never to a person.",
        "“Whose” expresses possession and must be followed by a noun.",
        "“Whom” is an object form and cannot be the subject of “showed”."]},
    {q:"This is the department ______ designs all our packaging.",
     o:["who","whose","which","where"], a:2,
     e:["“Who” refers to people, and a department is treated as a thing here.",
        "“Whose” shows possession and needs a noun directly after it.",
        "Correct. “Which” is the subject relative pronoun used for things.",
        "“Where” replaces a place expression and cannot be the subject of “designs”."]},
    {q:"The engineer ______ team redesigned the pump has been promoted.",
     o:["that","whose","who","which"], a:1,
     e:["“That” cannot be followed directly by a noun to express possession.",
        "Correct. “Whose” plus a noun expresses possession, like the French “dont”.",
        "“Who” would need a verb after it, not the noun “team”.",
        "“Which” refers to things and cannot show possession before a noun."]},
    {q:"This is the room ______ we welcome our customers.",
     o:["which","that","when","where"], a:3,
     e:["“Which” would need a preposition, as in “in which”, to express place.",
        "“That” leaves the sentence without the idea of place and without the required preposition.",
        "“When” refers to time, not to a place.",
        "Correct. “Where” replaces a place expression such as “in the room”."]},
    {q:"Friday is the day ______ the whole factory stops for maintenance.",
     o:["where","which","when","whose"], a:2,
     e:["“Where” refers to places, and a day is not a place.",
        "“Which” would have to be subject or object, or follow a preposition, which is not the case here.",
        "Correct. “When” is the relative adverb used after a noun expressing time.",
        "“Whose” shows possession and must be followed by a noun."]},
    {q:"Our Italian plant, ______ produces the engines, will be enlarged.",
     o:["which","that","who","where"], a:0,
     e:["Correct. In a non-defining clause between commas, only “which” is possible for things.",
        "“That” is never used in a non-defining clause after a comma.",
        "“Who” refers to people, not to a plant.",
        "“Where” replaces a place expression and cannot be the subject of “produces”."]},
    {q:"Choose the correct sentence (in each one a relative pronoun has been left out).",
     o:["The team works upstairs handles exports.","The manager signed the contract is away.","The machine broke down is Italian.","The supplier we met yesterday is German."], a:3,
     e:["The missing pronoun was the subject of “works”, and a subject pronoun can never be dropped.",
        "The missing pronoun was the subject of “signed”, so it has to be kept.",
        "The missing pronoun was the subject of “broke down” and cannot be omitted.",
        "Correct. The pronoun was the object of “met”, and object pronouns in defining clauses can be left out."]},
    {q:"The products ______ we sell in Asia are made in Spain.",
     o:["who","that","whose","where"], a:1,
     e:["“Who” refers to people, not to products.",
        "Correct. In a defining clause, “that” can refer to things as the object of “sell”.",
        "“Whose” shows possession and must be followed by a noun.",
        "“Where” replaces a place expression, but the place “Asia” is already expressed."]},
    {q:"Mr Lemoine, ______ welcomed you at reception, runs the quality department.",
     o:["which","what","who","whose"], a:2,
     e:["“Which” refers to things and cannot replace a person.",
        "“What” is never a relative pronoun after a noun in English.",
        "Correct. “Who” refers to a person and is the subject of “welcomed” in this non-defining clause.",
        "“Whose” shows possession and needs a noun directly after it."]},
    {q:"Choose the correct sentence.",
     o:["The supplier I called this morning has confirmed the delivery.","The supplier what I called this morning has confirmed the delivery.","The supplier, that I called this morning, has confirmed the delivery.","The supplier who I called him this morning has confirmed the delivery."], a:0,
     e:["Correct. The object pronoun of a defining relative clause can be omitted.",
        "“What” cannot introduce a relative clause after a noun.",
        "“That” is impossible in a clause placed between commas.",
        "The object is already expressed by the relative pronoun, so the extra “him” must disappear."]}
   ]},
   {t:"Part 2 · Present Perfect", q:[
    {q:"Our company ______ in Lyon since 1998.",
     o:["is based","was based","has been based","is being based"], a:2,
     e:["The present simple states a current fact but cannot be used with “since” plus a starting point.",
        "The past simple cuts the link with the present, while “since 1998” runs up to today.",
        "Correct. With “since” plus a point in time, English uses the present perfect to connect past and present.",
        "The present continuous suggests a temporary action in progress, which does not fit a permanent location."]},
    {q:"We ______ our new logo last March.",
     o:["launched","have launched","have been launching","are launching"], a:0,
     e:["Correct. A finished time expression such as “last March” requires the past simple.",
        "The present perfect cannot be combined with a finished past time such as “last March”.",
        "The present perfect continuous describes an activity continuing until now, not one finished event.",
        "The present continuous refers to now or to a future plan, not to last March."]},
    {q:"______ you ever visited our production site in Poland?",
     o:["Did","Do","Are","Have"], a:3,
     e:["After “did” the verb must be in the base form, so this auxiliary cannot go with “visited”.",
        "“Do” also requires the base form “visit” and cannot build a perfect question.",
        "“Are” goes with -ing forms or passives, not with a past participle like this.",
        "Correct. “Ever” asking about experience up to now takes the present perfect: have plus past participle."]},
    {q:"The R&D department ______ on this prototype for six months.",
     o:["works","has been working","is working since","has work"], a:1,
     e:["The present simple states a habit and cannot express a duration reaching the present.",
        "Correct. The present perfect continuous expresses an activity that started earlier and is still going on.",
        "“Since” is followed by a starting point, never by a duration such as six months, and the tense is wrong too.",
        "“Has work” is an impossible form: the perfect needs the past participle “worked”."]},
    {q:"I ______ met the new quality manager yet.",
     o:["haven’t","didn’t","don’t have","am not"], a:0,
     e:["Correct. “Yet” in a negative sentence goes with the present perfect: haven’t plus past participle.",
        "After “didn’t” the verb must be in the base form, and the past simple does not take “yet” here.",
        "“Don’t have met” mixes the present simple of “have” with a participle and is not a possible form.",
        "“Am not met” would be a passive form and cannot describe your own experience."]},
    {q:"The company ______ three new subsidiaries since the merger.",
     o:["opens","opened","has opened","is opening"], a:2,
     e:["The present simple describes routines, not a result counted from a past event up to now.",
        "The past simple would need a finished time expression, but “since the merger” reaches the present.",
        "Correct. The present perfect reports completed actions inside a period that is still open.",
        "The present continuous shows one action in progress and cannot count three finished openings."]},
    {q:"Choose the correct sentence.",
     o:["We work here since 2019.","We have worked here since 2019.","We are working here since 2019.","We worked here since 2019."], a:1,
     e:["The present simple is never used with “since”; this is the classic French-speaker mistake.",
        "Correct. “Since” plus a date needs the present perfect to link 2019 to today.",
        "The present continuous describes a temporary action now and does not take “since” plus a date.",
        "The past simple is not used with “since”, and it would suggest the situation is over."]},
    {q:"How long ______ the group owned this factory?",
     o:["does","is","did","has"], a:3,
     e:["“Does” requires the base form “own”, not the past participle “owned”.",
        "“Is owned” would be a passive and cannot express a duration continuing until now.",
        "“Did” also needs the base form and would close the period in the past.",
        "Correct. “How long” about a situation continuing now takes the present perfect: has plus past participle."]},
    {q:"The maintenance team ______ the main line twice this week.",
     o:["has repaired","repaired","repairs","is repairing"], a:0,
     e:["Correct. “This week” is an unfinished period, so the present perfect is used.",
        "The past simple needs a finished period such as “last week”.",
        "The present simple expresses a general habit, not two repairs already completed.",
        "The present continuous shows one action in progress, so it cannot count two finished repairs."]},
    {q:"Our logistics manager ______ in Germany for two years, and she is still there.",
     o:["lived","is living","has lived","was living"], a:2,
     e:["The past simple would mean she has left Germany, which the second clause contradicts.",
        "The present continuous cannot carry a duration counted from the past with “for”.",
        "Correct. The present perfect with “for” gives the duration of a situation that continues now.",
        "The past continuous describes a background action in the past, not a situation that is still true."]}
   ]},
   {t:"Part 3 · Past Continuous Tenses", q:[
    {q:"While the visitors ______ the assembly line, the alarm went off.",
     o:["toured","were touring","have toured","tour"], a:1,
     e:["The past simple presents a finished event, but “while” here introduces the longer background action.",
        "Correct. The past continuous gives the action in progress that a shorter event interrupted.",
        "The present perfect connects to the present and cannot describe an interrupted past action.",
        "The present simple does not fit a past narrative built around “went off”."]},
    {q:"The power ______ while we were presenting the new product range.",
     o:["was failing","fails","has failed","failed"], a:3,
     e:["Two past continuous forms would mean two parallel actions; here a short event cuts into a longer one.",
        "The present simple cannot be used in a sentence clearly set in the past.",
        "The present perfect links to now, while this event belongs to a finished past moment.",
        "Correct. The sudden short event takes the past simple and the background takes the past continuous."]},
    {q:"Our founder ______ the company in 1986 with only four employees.",
     o:["founded","was founding","has founded","founds"], a:0,
     e:["Correct. A single finished action with a past date takes the past simple.",
        "The past continuous suggests an action in progress, which does not suit one act of creation.",
        "The present perfect is impossible with the finished date 1986.",
        "The present simple cannot describe an event that happened in 1986."]},
    {q:"When I joined the firm, the marketing team ______ a new website.",
     o:["built","builds","was building","has built"], a:2,
     e:["The past simple would mean the building started after I joined, not around that moment.",
        "The present simple does not fit a sentence set in the past.",
        "Correct. The past continuous describes a situation already in progress when another event happened.",
        "The present perfect connects to the present and breaks the past time frame."]},
    {q:"The rain ______ heavily when the delegation arrived at the plant.",
     o:["fell","has fallen","falls","was falling"], a:3,
     e:["The past simple makes the rain a short event, but here it is the background to the arrival.",
        "The present perfect links the rain to now, which contradicts the past arrival.",
        "The present simple describes general truths, not a scene in the past.",
        "Correct. The past continuous sets the background scene around a shorter past event."]},
    {q:"Choose the correct sentence.",
     o:["While she wrote the report, the client was calling.","While she was writing the report, the client called.","While she was writing the report, the client was calling her twice.","While she wrote the report, the client called suddenly."], a:1,
     e:["The tenses are reversed: the long background action is in the simple and the short event in the continuous.",
        "Correct. “While” plus the past continuous gives the background, and the interrupting event takes the past simple.",
        "“Twice” counts completed calls, so the past continuous is impossible there.",
        "After “while” English normally uses the past continuous for the longer action, not the past simple."]},
    {q:"They ______ not expecting so many questions during the factory tour.",
     o:["did","was","were","have"], a:2,
     e:["“Did not expecting” is impossible, because “did” must be followed by the base form.",
        "“Was” does not agree with the plural subject “they”.",
        "Correct. The past continuous of a plural subject is were plus the -ing form.",
        "“Have not expecting” is not a possible form; the perfect needs a past participle."]},
    {q:"What ______ you doing when the fire drill started?",
     o:["were","did","are","have"], a:0,
     e:["Correct. A past continuous question is formed with were plus subject plus the -ing form.",
        "“Did you doing” is impossible, because “did” takes the base form “do”.",
        "“Are” puts the question in the present, which clashes with “started”.",
        "“Have you doing” is not a possible form; the perfect needs the participle “done”."]},
    {q:"The technician ______ the machine three times yesterday afternoon.",
     o:["was restarting","has restarted","restarting","restarted"], a:3,
     e:["The past continuous cannot count three completed repetitions.",
        "The present perfect is blocked by the finished time expression “yesterday afternoon”.",
        "“Restarting” alone has no auxiliary, so the sentence has no finite verb.",
        "Correct. Finished, counted actions at a stated past time take the past simple."]},
    {q:"As the director ______ the company history, a journalist took notes.",
     o:["explained","was explaining","has explained","explains"], a:1,
     e:["The past simple would present the explanation as one short event, not as the ongoing frame.",
        "Correct. The past continuous describes the longer action during which another action happened.",
        "The present perfect connects to the present, but “took” places the scene in the past.",
        "The present simple cannot be mixed with the past simple “took” in the same narrative."]}
   ]},
   {t:"Part 4 · Advanced Modals: Should, Might, Could", q:[
    {q:"You ______ wear safety shoes before entering the workshop.",
     o:["had better to","had better","would better","better had"], a:1,
     e:["“Had better” is followed by the base form without “to”.",
        "Correct. “Had better” plus the base form gives strong advice or a warning.",
        "“Would better” does not exist in English.",
        "The word order is wrong, because “had” comes before “better”."]},
    {q:"Smoking is not allowed inside, but visitors ______ smoke in the yard behind the office.",
     o:["may","should","had better","ought to"], a:0,
     e:["Correct. “May” plus the base form says that something is allowed.",
        "“Should” would turn the sentence into advice to smoke, which is not the idea here.",
        "“Had better” warns about a bad consequence and does not say that something is allowed.",
        "“Ought to” expresses what is advisable, not what the rules permit."]},
    {q:"The brochure ______ mention our new service.",
     o:["ought","should to","ought to","must to"], a:2,
     e:["“Ought” always needs “to” before the verb.",
        "“Should” is followed by the base form without “to”.",
        "Correct. “Ought to” plus the base form expresses what is advisable or expected.",
        "“Must” is never followed by “to”."]},
    {q:"The factory tour ______ last about two hours, but it depends on your questions.",
     o:["might to","might","mights","is might"], a:1,
     e:["Modal verbs such as “might” are never followed by “to”.",
        "Correct. “Might” plus the base form expresses something that is possible but not certain.",
        "Modal verbs never take an -s, whatever the subject.",
        "A modal verb cannot follow “is”, because two finite verbs cannot stand together."]},
    {q:"The director isn’t in her office; she ______ be with the auditors.",
     o:["can","musts","should to","might"], a:3,
     e:["“Can” expresses ability or permission, not a guess about the present.",
        "“Musts” is impossible, because modal verbs never take an -s.",
        "“Should” is never followed by “to” before the verb.",
        "Correct. “Might” expresses a possibility the speaker is not sure about."]},
    {q:"______ you tell me where the human resources office is, please?",
     o:["May","Should","Could","Ought"], a:2,
     e:["“May” asks permission for the speaker, not for something the other person does.",
        "“Should” would ask for advice about a duty instead of making a request.",
        "Correct. “Could you” plus the base form is a polite way of making a request.",
        "“Ought” needs “to” and introduces advice, not a request."]},
    {q:"Before the audit, we ______ check all the safety documents again.",
     o:["shoulds","should to","ought","should"], a:3,
     e:["Modal verbs never take an -s, whatever the subject.",
        "“Should” is followed directly by the base form, without “to”.",
        "“Ought” cannot be used without “to” before the verb.",
        "Correct. “Should” plus the base form expresses what is advisable."]},
    {q:"______ I show you our showroom before lunch?",
     o:["May","Might to","Am","Ought"], a:0,
     e:["Correct. “May” plus the base form is the polite way to offer or to ask permission.",
        "Modal verbs are never followed by “to” in this structure.",
        "“Am” would need an -ing form or a passive, not a base verb.",
        "“Ought” requires “to” and is used for advice, not for an offer."]},
    {q:"Our prices ______ to be reviewed every year, but sometimes we wait longer.",
     o:["should","ought","ought to","must"], a:1,
     e:["“Should” is followed directly by the base form, so it cannot stand before “to be”.",
        "Correct. “Ought” is the modal that takes “to” plus the base form, and “to” is already there.",
        "This would give “ought to to be”, because “to” is already in the sentence.",
        "“Must” is followed directly by the base form and never by “to”."]},
    {q:"We ______ leave the office now, or we will miss the guided tour of the plant.",
     o:["may","might","ought","had better"], a:3,
     e:["“May” says that something is allowed, which does not fit a warning introduced by “or”.",
        "“Might” expresses an uncertain possibility, not the urgent advice this warning needs.",
        "“Ought” is impossible without “to” before the verb.",
        "Correct. “Had better” plus the base form gives urgent advice with a warning about the consequence."]}
   ]},
   {t:"Part 5 · Conditionals with If", q:[
    {q:"If the client confirms the order, we ______ production next week.",
     o:["started","will start","would start","start"], a:1,
     e:["The past simple does not fit a real condition about the future.",
        "Correct. In the first conditional the if-clause is present simple and the main clause uses will.",
        "“Would” belongs to the second conditional, used for unreal situations.",
        "The present simple in the main clause would turn this into a general rule, not a future plan."]},
    {q:"If you ______ the reception desk, someone always comes to meet you.",
     o:["call","will call","would call","are calling"], a:0,
     e:["Correct. The zero conditional uses the present simple in the if-clause for a regular result.",
        "“Will” does not appear in the if-clause of this type of conditional.",
        "“Would” after “if” would make the situation unreal, which “always comes” contradicts.",
        "The present continuous describes one action happening now, not a general rule."]},
    {q:"If a machine stops, the supervisor ______ an alert on his tablet.",
     o:["is receive","would receive","is receiving","receives"], a:3,
     e:["“Is receive” is impossible: “be” cannot be followed by a base verb.",
        "“Would” signals an unreal situation, which contradicts this automatic process.",
        "The present continuous describes an action happening now, not a general rule.",
        "Correct. The zero conditional uses the present simple in both clauses for things that are always true."]},
    {q:"If I ______ you, I would ask the supplier for a detailed quotation.",
     o:["am","will be","were","would be"], a:2,
     e:["In an unreal condition English uses a past form, not the present “am”.",
        "“Will” is not used in the if-clause of a first conditional, even when the sentence looks to the future.",
        "Correct. The second conditional uses “were” after “if” for an imaginary situation.",
        "“Would” does not appear in the if-clause of a standard conditional."]},
    {q:"If we had a bigger warehouse, we ______ more stock.",
     o:["will keep","keep","would keep","kept"], a:2,
     e:["“Will” belongs to the first conditional, but “had” here signals an unreal present.",
        "The present simple would make this a general truth instead of a hypothesis.",
        "Correct. The second conditional pairs a past simple if-clause with would plus the base form.",
        "A second past simple in the main clause cannot express the hypothetical result."]},
    {q:"We will send you a free sample if you ______ us your postal address.",
     o:["will give","would give","gave","give"], a:3,
     e:["“Will” is not used in the if-clause of a first conditional, even when the sentence looks to the future.",
        "“Would” after “if” would make the situation unreal, which “will send” contradicts.",
        "The past simple would create a second conditional, which does not match “will send”.",
        "Correct. In the first conditional the if-clause stays in the present simple."]},
    {q:"If I ______ the budget, I would modernise the whole line.",
     o:["had","have","would have","am having"], a:0,
     e:["Correct. The second conditional uses the past simple in the if-clause for an imaginary present.",
        "The present simple announces a real condition, which clashes with “would modernise”.",
        "“Would” is not used in the if-clause of a standard conditional.",
        "The present continuous cannot express an imaginary situation after “if” here."]},
    {q:"We ______ the visit if the weather is bad.",
     o:["cancelled","would cancel","are cancel","will cancel"], a:3,
     e:["The past simple does not match a real condition about the future.",
        "“Would” makes the situation unreal, but “is” presents a real possibility.",
        "“Are cancel” is an impossible form, since “be” cannot be followed by a base verb.",
        "Correct. First conditional: present simple after “if” and will in the main clause."]},
    {q:"Choose the correct sentence.",
     o:["If the parts will arrive tomorrow, we will finish the order.","If the parts arrive tomorrow, we will finish the order.","If the parts arrive tomorrow, we finished the order.","If the parts would arrive tomorrow, we will finish the order."], a:1,
     e:["“Will” is never used in the if-clause of a first conditional.",
        "Correct. The if-clause takes the present simple and the main clause takes will.",
        "The past simple in the main clause cannot express a future result.",
        "“Would” does not belong in the if-clause of a standard conditional."]},
    {q:"If you ______ the red button, the conveyor stops immediately.",
     o:["will press","press","would press","pressed"], a:1,
     e:["“Will” is not used after “if” in a conditional of this type.",
        "Correct. The zero conditional uses the present simple in the if-clause for an automatic result.",
        "“Would” after “if” is not possible in a standard conditional.",
        "The past simple would create a second conditional, which does not match “stops”."]}
   ]},
   {t:"Part 6 · Adverbs of Frequency", q:[
    {q:"Our quality team ______ late when a big order arrives.",
     o:["works often","often works","work often","is often work"], a:1,
     e:["The frequency adverb must come before the main verb, not after it.",
        "Correct. Adverbs of frequency are placed between the subject and the main verb.",
        "The adverb is misplaced: a frequency adverb goes before the main verb.",
        "“Is work” is an impossible combination of “be” and a base verb."]},
    {q:"Our showroom ______ full of visitors in September.",
     o:["is always","always is being","is being always","always"], a:0,
     e:["Correct. With the verb “be”, the frequency adverb comes directly after it.",
        "“Is being” plus this adjective is not used for a regular fact, and the adverb is misplaced too.",
        "The adverb cannot be inserted inside “is being”, and this continuous form does not fit a regular fact.",
        "Without a form of “be” the sentence has no verb at all."]},
    {q:"Visitors ______ surprised by the size of our warehouse.",
     o:["often are being","often","are often","do often be"], a:2,
     e:["“Are being” does not fit a regular reaction, and the adverb cannot come before it here.",
        "The sentence needs a form of “be”, which is missing.",
        "Correct. After the verb “be”, the frequency adverb comes directly after it.",
        "The verb “be” does not take “do” in the present simple."]},
    {q:"I ______ visit the Italian site; I go there about twice a year.",
     o:["never","always","am rarely","rarely"], a:3,
     e:["“Never” means zero times, which contradicts the two visits a year.",
        "“Always” means every time, which does not match twice a year.",
        "With a main verb such as “visit”, the frequency adverb takes no form of “be”.",
        "Correct. “Rarely” matches two visits a year and is placed before the main verb."]},
    {q:"Our engineers ______ travel to the German plant in winter.",
     o:["hardly never","hardly ever","ever hardly","are hardly ever"], a:1,
     e:["“Hardly” is already negative, so it is never combined with “never”.",
        "Correct. “Hardly ever” means almost never and is placed before the main verb.",
        "The word order is wrong, because “hardly” comes before “ever”.",
        "A form of “be” cannot be added before a main verb in the present simple."]},
    {q:"The quality manager inspects the production line ______.",
     o:["three times a week","three times at week","at three times a week","three times the week"], a:0,
     e:["Correct. Frequency expressions such as “three times a week” go at the end of the sentence.",
        "The article “a” is needed here, so it must be “a week”, not “at week”.",
        "No preposition is placed before “three times” in this expression.",
        "These expressions use “a week”, not “the week”."]},
    {q:"Choose the correct sentence.",
     o:["Our director is in the office always before eight.","We sometimes going to the trade fair in Hanover.","Our team never works on Sundays.","The managers meet never the suppliers alone."], a:2,
     e:["“Always” must come straight after “is”, not at the end of the sentence.",
        "Without an auxiliary, “going” cannot be the verb of the sentence.",
        "Correct. “Never” is placed between the subject and the main verb.",
        "“Never” cannot stand between the verb and its object."]},
    {q:"The two directors ______ lunch with the new trainees in the canteen.",
     o:["have usually","usually have been","usually are have","usually have"], a:3,
     e:["The frequency adverb comes before the main verb, not after it.",
        "“Have been” builds a perfect form that does not fit this regular habit.",
        "“Are” cannot be combined with the base verb “have”.",
        "Correct. The frequency adverb is placed between the subject and the main verb."]},
    {q:"Our main supplier has ______ missed a delivery date.",
     o:["ever never","never","never not","been never"], a:1,
     e:["“Ever” and “never” cannot be combined in the same position.",
        "Correct. In a perfect form the frequency adverb goes between “has” and the past participle.",
        "“Never” is already negative, so adding “not” creates a double negative.",
        "Adding “been” would create a passive, and the adverb is misplaced as well."]},
    {q:"Our products are ______ sold directly to the public.",
     o:["rare","rarely been","never not","rarely"], a:3,
     e:["“Rare” is an adjective and cannot modify the verb “sold”.",
        "Adding “been” creates a perfect passive that does not fit “are”.",
        "“Never” is already negative, so “not” must not be added.",
        "Correct. After “be” the frequency adverb comes straight before the past participle."]}
   ]},
   {t:"Part 7 · Comparatives, Superlatives & Intensifiers", q:[
    {q:"Our Spanish subsidiary is ______ than the French one.",
     o:["more big","the biggest","bigger","as big"], a:2,
     e:["Short adjectives form the comparative with -er, not with “more”.",
        "A superlative can never be followed by “than”.",
        "Correct. One-syllable adjectives take -er before “than”.",
        "“As big” must be followed by “as”, not by “than”."]},
    {q:"This is ______ product in our whole catalogue.",
     o:["the most expensive","the expensivest","more expensive","most expensive than"], a:0,
     e:["Correct. Long adjectives form the superlative with “the most”.",
        "“Expensive” is too long to take the ending -est.",
        "The comparative compares two items and would need “than”.",
        "A superlative is never followed by “than”."]},
    {q:"The new press is not as noisy ______ the old one.",
     o:["than","that","like","as"], a:3,
     e:["“Than” is used only after a comparative form.",
        "“That” cannot introduce the second part of a comparison of equality.",
        "“Like” is followed by a noun but cannot complete the structure as … as.",
        "Correct. The structure is as plus adjective plus as, including in the negative."]},
    {q:"Our delivery times are ______ shorter than they were in 2020.",
     o:["very","much","so","too"], a:1,
     e:["“Very” cannot strengthen a comparative form.",
        "Correct. “Much”, like “far” or “a lot”, is the intensifier used before a comparative.",
        "“So” intensifies a simple adjective, not a comparative followed by “than”.",
        "“Too” means more than necessary and does not fit a comparison with “than”."]},
    {q:"Our German site produces ______ many units as our Polish site.",
     o:["so","than","more","as"], a:3,
     e:["“So … as” is not the usual structure in an affirmative comparison of equality.",
        "“Than” is used only after a comparative form.",
        "“More” would have to be followed by “than”, and it cannot be combined with “many” here.",
        "Correct. The structure as plus many plus noun plus as expresses an equal quantity."]},
    {q:"The meeting room is ______ small for the whole team.",
     o:["too","enough","so much","very too"], a:0,
     e:["Correct. “Too” plus an adjective expresses an excess that creates a problem.",
        "“Enough” comes after the adjective and would reverse the meaning.",
        "“So much” goes with nouns or verbs, not directly before an adjective.",
        "“Very” and “too” cannot be combined before an adjective."]},
    {q:"The prototype isn’t light ______ to be carried by one person.",
     o:["too","so","enough","much"], a:2,
     e:["“Too” is placed before the adjective, never after it.",
        "“So” cannot follow the adjective and cannot introduce “to” plus infinitive here.",
        "Correct. “Enough” comes after the adjective and before “to” plus the infinitive.",
        "“Much” strengthens comparatives and cannot stand after this adjective."]},
    {q:"The assembly instructions were ______ clear that nobody needed help.",
     o:["too","so","very","such"], a:1,
     e:["“Too” expresses an excess and is not followed by a “that” clause.",
        "Correct. The pattern is so plus adjective plus “that” plus the result.",
        "“Very” strengthens an adjective but cannot introduce a “that” clause.",
        "“Such” is used before a noun phrase, not directly before an adjective."]},
    {q:"The results were ______ impossible to predict.",
     o:["absolutely","very much","far","the most"], a:0,
     e:["Correct. Ungradable adjectives such as “impossible” take “absolutely” or “completely”.",
        "“Very much” is not used directly before an adjective.",
        "“Far” strengthens only comparatives and superlatives.",
        "“The most” builds a superlative, which this sentence does not contain."]},
    {q:"Our site in Tours is ______ the most modern in the group.",
     o:["more","very","by far","too"], a:2,
     e:["“More” cannot be added in front of a superlative.",
        "“Very” cannot strengthen a superlative formed with “the most”.",
        "Correct. “By far” is the usual intensifier placed before a superlative.",
        "“Too” expresses an excess and cannot modify a superlative."]}
   ]}
  ]
},
{
  id: 33, name: "BAC+3 · Test 3", theme: "Applying for a job",
  parts: [
   {t:"Part 1 · Relative Pronouns", q:[
    {q:"The engineer ______ interviewed me used to work in the same lab as my tutor.",
     o:["whose","whom","who","which"], a:2,
     e:["“Whose” shows possession and must be followed by a noun.",
        "“Whom” is an object pronoun, but here the pronoun is the subject of “interviewed”.",
        "Correct. “Who” is the relative pronoun for a person who is the subject of the relative clause.",
        "“Which” refers to things or animals, not to a person."]},
    {q:"I applied for the position ______ was advertised on the school careers page.",
     o:["whose","where","who","which"], a:3,
     e:["“Whose” expresses possession and needs a noun directly after it.",
        "“Where” introduces a place, not the subject of “was advertised”.",
        "“Who” is only used for people, and a position is a thing.",
        "Correct. “Which” is the relative pronoun for things and can be the subject of the clause."]},
    {q:"We hired a graduate ______ final-year project was about predictive maintenance.",
     o:["which","who","that","whose"], a:3,
     e:["“Which” does not express possession and is not used for a person.",
        "“Who” cannot be followed directly by a noun like “final-year project”.",
        "“That” cannot express possession before a noun in this way.",
        "Correct. “Whose” links a person to something belonging to them, here the project."]},
    {q:"That is the company ______ I did my second-year internship.",
     o:["when","which","where","who"], a:2,
     e:["“When” refers to a time, but the sentence identifies a place.",
        "“Which” would need a preposition, as in “at which”, to express the place of the internship.",
        "Correct. “Where” replaces a place expression such as “at that company”.",
        "“Who” refers to people, not to an organisation seen as a location."]},
    {q:"Do you remember the day ______ you received your first job offer?",
     o:["which","whose","where","when"], a:3,
     e:["“Which” alone cannot follow a time noun here; it would need “on which”.",
        "“Whose” expresses possession and must be followed by a noun.",
        "“Where” refers to a place, but “the day” is a time expression.",
        "Correct. “When” is the relative pronoun used after a noun expressing time."]},
    {q:"My supervisor, ______ has twenty years of experience, helped me prepare the interview.",
     o:["who","which","whom","that"], a:0,
     e:["Correct. A non-defining clause about a person uses “who”, never “that”.",
        "“Which” refers to things, not to a person.",
        "“Whom” is used as an object, but here the pronoun is the subject of “has”.",
        "“That” is never used in a non-defining clause between commas."]},
    {q:"Choose the correct sentence.",
     o:["The skills which I listed in my CV are all technical.","The skills whose I listed in my CV are all technical.","The skills where I listed in my CV are all technical.","The skills who I listed in my CV are all technical."], a:0,
     e:["Correct. “Which” refers to things and works as the object of “listed”.",
        "“Whose” expresses possession and must be followed by a noun.",
        "“Where” introduces a place, which does not fit “the skills”.",
        "“Who” is reserved for people, and skills are things."]},
    {q:"In which sentence can the relative pronoun be left out?",
     o:["The recruiter who signed my contract is on holiday.","The letter that arrived this morning is from HR.","The questions that the panel asked were quite technical.","The manager whose team I joined is on holiday."], a:2,
     e:["The pronoun is the subject of “signed”, so it cannot be omitted.",
        "The pronoun is the subject of “arrived”, so it must stay.",
        "Correct. The pronoun is the object of “asked”, and an object relative pronoun can be omitted.",
        "“Whose” shows possession and can never be left out."]},
    {q:"The training programme, ______ lasts six months, starts in January.",
     o:["that","which","who","where"], a:1,
     e:["“That” cannot be used in a non-defining clause placed between commas.",
        "Correct. A non-defining clause about a thing uses “which”.",
        "“Who” is only used for people.",
        "“Where” refers to a place, not to the subject of “lasts”."]},
    {q:"The two candidates ______ we met yesterday both have an engineering background.",
     o:["what","which","whose","who"], a:3,
     e:["“What” is not a relative pronoun after a noun in English.",
        "“Which” refers to things, not to candidates.",
        "“Whose” expresses possession and must be followed by a noun.",
        "Correct. “Who” refers to people and works here as the object of “met”."]}
   ]},
   {t:"Part 2 · Present Perfect", q:[
    {q:"I ______ my CV to four engineering companies since the beginning of September.",
     o:["sent","have sent","am sending","was sending"], a:1,
     e:["The past simple needs a finished time reference, but “since September” connects the action to now.",
        "Correct. The present perfect is used with “since” to count actions in a period that is still open.",
        "The present continuous describes an action happening at this moment, not four completed actions.",
        "The past continuous describes an action in progress in the past and does not fit “since September”."]},
    {q:"The recruiter ______ me last Thursday at ten o’clock.",
     o:["called","has been calling","is calling","has called"], a:0,
     e:["Correct. “Last Thursday” is a finished past time, so the past simple is required.",
        "The present perfect continuous suggests a duration continuing until now, which “last Thursday” excludes.",
        "The present continuous refers to now or to a plan, not to a past Thursday.",
        "The present perfect is impossible with a finished time expression such as “last Thursday”."]},
    {q:"______ you ever ______ a job interview in English?",
     o:["Do / had","Did / had","Have / had","Have / have"], a:2,
     e:["“Do” cannot be followed by a past participle; it takes the base form.",
        "“Had” is a past form and cannot follow the auxiliary “did”.",
        "Correct. “Ever” with life experience takes the present perfect: have + past participle “had”.",
        "The auxiliary is right but “have” is not the past participle needed after “have”."]},
    {q:"She ______ for a position in logistics for three months now.",
     o:["is looking","has been looking","looks","looked"], a:1,
     e:["The present continuous cannot express a duration starting in the past with “for three months now”.",
        "Correct. The present perfect continuous expresses an action that started in the past and is still going on.",
        "The present simple describes habits or general truths, not a period measured up to now.",
        "The past simple would close the period, but “now” shows the search continues."]},
    {q:"We can’t shortlist him: he ______ the application form ______.",
     o:["hasn’t returned / still","doesn’t return / yet","hasn’t returned / yet","didn’t return / already"], a:2,
     e:["“Still” does not go at the end of the sentence in this structure; it comes before the negative auxiliary.",
        "The present simple cannot describe a result that affects the present situation in this way.",
        "Correct. “Yet” in a negative present perfect sentence means the action is expected but has not happened.",
        "“Already” is for something that has happened, so it contradicts a negative sentence."]},
    {q:"Choose the correct sentence.",
     o:["I have worked in this department since 2023.","I worked in this department since 2023.","I work in this department since 2023.","I am working in this department since 2023."], a:0,
     e:["Correct. A period that begins in the past and continues now takes the present perfect with “since”.",
        "The past simple with “since” suggests the job is over, which contradicts the meaning.",
        "The present simple cannot be used with “since”, even though French uses the present here.",
        "The present continuous is also impossible with “since” to express a period up to now."]},
    {q:"The HR manager ______ just ______ the candidate a second interview.",
     o:["is / offering","had / offer","have / offered","has / offered"], a:3,
     e:["“Just” in this position does not combine with the present continuous to mean a recent completed action.",
