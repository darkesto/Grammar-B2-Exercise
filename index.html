<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Grammar Practice · BAC+1 → BAC+5</title>
<style>
:root{
  --paper:#fbfaf5;
  --ink:#16233d;
  --ink-soft:#5c6a85;
  --ink-faint:#93a0b5;
  --rule:#cbd9ef;
  --margin:#e3aab2;
  --pen:#b3352c;
  --accent:#16233d;
  --good:#1c7a56;
  --good-bg:#eef7f2;
  --bad-bg:#fbf1f0;
  --card:#ffffff;
  --line:#e6e5dc;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body[data-lvl="bac1"]{--accent:#7a3b5e}
body[data-lvl="bac2"]{--accent:#1d6f6a}
body[data-lvl="bac3"]{--accent:#8a5a14}
body[data-lvl="bac45"]{--accent:#3b4a8c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:32px;
  -webkit-font-smoothing:antialiased;
}
.sheet{max-width:780px;margin:0 auto;padding:32px 24px 96px 24px;position:relative}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:56px;width:1px;background:var(--margin)}
.wrap{padding-left:44px}
@media(max-width:700px){
  .sheet{padding-left:16px;padding-right:16px}
  .sheet::before{display:none}
  .wrap{padding-left:0}
}
.eyebrow{
  font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);line-height:32px;margin:0;
}
.eyebrow b{color:var(--accent);font-weight:600}
h1{font-size:34px;line-height:48px;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
.lede{color:var(--ink-soft);margin:0 0 32px;max-width:54ch}
.pick{display:grid;gap:16px;margin:0 0 32px}
.pick button{
  display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:2px;padding:16px 20px;cursor:pointer;
  font-family:inherit;color:inherit;transition:transform .12s ease,border-color .12s ease;
}
.pick button:hover{transform:translateX(3px);border-left-color:var(--pen)}
.pick .pt{font-size:20px;line-height:28px;display:block}
.pick .ps{font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;color:var(--ink-soft);line-height:24px;display:block}
.pick .pc{
  font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);line-height:22px;display:block;
}
.syl{margin:0 0 32px;border-top:1px solid var(--line)}
.syl div{
  font-family:var(--sans);font-size:13px;line-height:22px;color:var(--ink-soft);
  border-bottom:1px solid var(--line);padding:9px 0;
}
.note{font-family:var(--sans);font-size:13px;line-height:22px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:16px}
.note b{color:var(--ink)}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px}
.part{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--pen)}
.count{font-family:var(--sans);font-size:12px;color:var(--ink-faint);letter-spacing:.06em}
.bar{height:2px;background:var(--line);margin-bottom:32px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .3s ease}
.qnum{
  position:absolute;left:-44px;width:32px;text-align:right;color:var(--pen);
  font-family:var(--sans);font-size:13px;letter-spacing:.02em;
}
@media(max-width:700px){.qnum{display:none}}
.qbox{position:relative}
.q{font-size:22px;line-height:36px;margin:0 0 24px}
.opts{display:grid;gap:8px;margin-bottom:24px}
.opt{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:11px 16px;cursor:pointer;font-family:inherit;font-size:17px;line-height:26px;color:inherit;
}
.opt:hover:not(:disabled){border-color:var(--ink-soft)}
.opt:disabled{cursor:default}
.opt .k{
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-faint);
  border:1px solid var(--line);border-radius:2px;min-width:22px;height:22px;display:grid;place-items:center;
  margin-top:2px;flex:none;
}
.opt.sel{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.opt.sel .k{border-color:var(--ink);color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:inset 3px 0 0 var(--good)}
.opt.right .k{border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:#e9cdc9;box-shadow:inset 3px 0 0 #e0b6b1;color:var(--ink-soft)}
.opt.picked.wrong{box-shadow:inset 3px 0 0 var(--pen);border-color:var(--pen)}
.opt .tag{
  font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  margin-left:auto;padding-left:12px;flex:none;color:var(--pen);line-height:26px;
}
.opt.right .tag{color:var(--good)}
.why{font-family:var(--sans);font-size:13.5px;line-height:22px;color:var(--ink-soft);margin:0;padding:0 16px 12px 52px}
.why.ok{color:var(--good)}
.verdict{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--pen)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button.go{
  font-family:var(--sans);font-size:14px;letter-spacing:.02em;background:var(--ink);color:#fff;
  border:1px solid var(--ink);border-radius:2px;padding:10px 22px;cursor:pointer;
}
button.go:disabled{background:transparent;color:var(--ink-faint);border-color:var(--line);cursor:not-allowed}
button.ghost{
  font-family:var(--sans);font-size:14px;background:transparent;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:2px;padding:10px 18px;cursor:pointer;
}
button.ghost:hover{color:var(--ink);border-color:var(--ink-soft)}
.hint{font-family:var(--sans);font-size:12px;color:var(--ink-faint);margin-left:auto}
@media(max-width:700px){.hint{display:none}}
.score{font-size:64px;line-height:72px;margin:0}
.score small{font-size:24px;color:var(--ink-faint)}
.gradeline{font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin:0 0 24px}
.gradeline b{color:var(--accent);font-size:15px}
.breakdown{display:grid;gap:8px;margin:24px 0 32px}
.brow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;font-family:var(--sans);font-size:13px}
.brow .track{grid-column:1/-1;height:4px;background:var(--line)}
.brow .track i{display:block;height:4px;background:var(--ink)}
.brow .track i.low{background:var(--pen)}
.review{border-top:1px solid var(--line)}
.rev{border-bottom:1px solid var(--line);padding:12px 0}
.rev summary{cursor:pointer;font-size:16px;line-height:26px;list-style:none;display:flex;gap:12px}
.rev summary::-webkit-details-marker{display:none}
.rev summary .n{font-family:var(--sans);font-size:12px;color:var(--pen);min-width:28px;flex:none;line-height:26px}
.rev[open] summary{margin-bottom:12px}
.rev .opts{margin-bottom:0}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="sheet"><div class="wrap" id="app"></div></div>
<script>
const T_BAC1 = [
{
  id: 11, name: "BAC+1 · Test 1", theme: "Introducing myself",
  parts: [
   {t:"Part 1 · Present Simple & Present Continuous", q:[
    {q:"Right now I ______ to my new classmates.",
     o:["am talking","talk","talks","are talking"], a:0,
     e:["Correct. For something happening right now we use am, is or are plus -ing.",
        "The present simple is for routines, not for this moment.",
        "The -s form is only for he, she or it.",
        "“Are” does not go with “I”."]},
    {q:"Marie ______ English every Monday morning.",
     o:["study","studies","studys","is study"], a:1,
     e:["After “Marie” the present simple verb needs an -s.",
        "Correct. With he, she or it we add -s to the present simple verb.",
        "The spelling is wrong: a verb ending in a consonant plus -y changes the -y to -ies.",
        "“Is” cannot be followed by the bare verb."]},
    {q:"My brother ______ like coffee. He drinks tea.",
     o:["don’t","isn’t","doesn’t","not"], a:2,
     e:["“Don’t” is for I, you, we and they.",
        "“Isn’t” cannot make a negative with another main verb.",
        "Correct. With he, she or it the negative is doesn’t plus the bare verb.",
        "“Not” alone cannot make a negative verb in English."]},
    {q:"______ you live near the school?",
     o:["Are","Is","Does","Do"], a:3,
     e:["“Are” cannot be used with a main verb like live.",
        "“Is” does not go with “you”.",
        "“Does” is only for he, she or it.",
        "Correct. Present simple questions with “you” start with Do."]},
    {q:"Listen! The teacher ______ our names.",
     o:["is calling","call","calls","calling"], a:0,
     e:["Correct. “Listen!” shows the action is happening now, so we use is plus -ing.",
        "This form has no -s and it does not show an action in progress.",
        "The present simple describes a habit, not something happening at this moment.",
        "A verb with -ing cannot stand alone as the main verb."]},
    {q:"______ your sister study at CESI too?",
     o:["Do","Does","Is","Are"], a:1,
     e:["“Do” is not used with he, she or it in present simple questions.",
        "Correct. For he, she or it, questions use Does plus the bare verb.",
        "“Is” cannot be followed by the bare verb study.",
        "“Are” cannot be followed by the bare verb “study”."]},
    {q:"Choose the correct sentence.",
     o:["She play football every weekend.","She is play football every weekend.","She plays football every weekend.","She playing football every weekend."], a:2,
     e:["The verb is missing the -s after “she”.",
        "“Is” cannot be followed by the bare verb.",
        "Correct. With “she” the present simple verb takes an -s.",
        "This sentence needs “is” before the -ing form."]},
    {q:"Pierre ______ a book about planes at the moment.",
     o:["read","reads","readed","is reading"], a:3,
     e:["This form has no -s and it does not show an action in progress.",
        "The present simple describes a habit, not something happening at the moment.",
        "“Readed” is not an English word.",
        "Correct. “At the moment” needs is plus the -ing form."]},
    {q:"They ______ in a small flat in the city centre.",
     o:["live","lives","is living","living"], a:0,
     e:["Correct. With “they” the present simple verb has no -s.",
        "The -s form is only for he, she or it.",
        "“Is” does not go with “they”.",
        "A verb with -ing needs “are” before it."]},
    {q:"My father ______ work at seven o’clock every day.",
     o:["start","is start","starting","starts"], a:3,
     e:["After “my father” the present simple verb needs an -s.",
        "“Is” cannot be followed by the bare verb.",
        "A verb with -ing cannot stand alone as the main verb.",
        "Correct. “Every day” shows a routine, and he takes the -s form."]}
   ]},
   {t:"Part 2 · To Be, To Have, To Do", q:[
    {q:"Hi, I ______ Camille and this is my friend Omar.",
     o:["are","am","is","be"], a:1,
     e:["“Are” is used with you, we or they.",
        "Correct. The verb to be with “I” is am.",
        "“Is” is used with he, she or it.",
        "“Be” is the base form and cannot be the verb here."]},
    {q:"My cousin ______ got two dogs.",
     o:["has","have","is","does"], a:0,
     e:["Correct. With he, she or it we use has got.",
        "“Have” is used with I, you, we and they.",
        "“Is” cannot be used before got in this structure.",
        "“Does” cannot be followed by got here."]},
    {q:"My parents ______ a small house in Brittany.",
     o:["has","is having","haves","have"], a:3,
     e:["“Has” is only used with he, she or it.",
        "“Is” does not go with a plural subject.",
        "“Haves” is not an English word.",
        "Correct. With a plural subject we use have."]},
    {q:"______ you got a brother or a sister?",
     o:["Do","Are","Have","Has"], a:2,
     e:["“Do” is not used before got in this structure.",
        "“Are” cannot be followed by got here.",
        "Correct. The question form of have got starts with Have.",
        "“Has” is only for he, she or it."]},
    {q:"Yesterday I ______ very nervous, but today I am fine.",
     o:["am","was","were","been"], a:1,
     e:["“Am” is a present form, but the sentence talks about yesterday.",
        "Correct. The past of am is was.",
        "“Were” is used with you, we and they.",
        "“Been” needs another verb before it."]},
    {q:"I ______ with you. English is difficult!",
     o:["agree","am agree","agrees","is agree"], a:0,
     e:["Correct. Agree is a normal verb, so we do not add the verb to be.",
        "The verb to be is never used before the main verb agree.",
        "The -s form is only for he, she or it.",
        "“Is” does not go with “I”."]},
    {q:"My best friend ______ long brown hair.",
     o:["have","is","has","does"], a:2,
     e:["“Have” is used with I, you, we and they.",
        "“Is” cannot show possession here.",
        "Correct. One person takes has.",
        "“Does” is an auxiliary and cannot show possession here."]},
    {q:"We ______ in the same group last year.",
     o:["was","are","is","were"], a:3,
     e:["“Was” is used with I, he, she and it.",
        "“Are” is a present form, but the sentence talks about last year.",
        "“Is” is a present form for one person or thing.",
        "Correct. The past of are with “we” is were."]},
    {q:"______ your father a teacher?",
     o:["Does","Is","Has","Do"], a:1,
     e:["“Does” cannot be followed directly by a noun like this.",
        "Correct. Questions with the verb to be start with Is for one person.",
        "“Has” would mean possession, which does not fit here.",
        "“Do” cannot be followed directly by a noun like this."]},
    {q:"Choose the correct sentence.",
     o:["I am twenty years old.","I have twenty years old.","I have got twenty years.","I am twenty years."], a:0,
     e:["Correct. In English we use the verb to be for age.",
        "This copies the French structure; have does not express age.",
        "Have got is not used for age in English.",
        "The word “old” is missing: we say “twenty years old”."]}
   ]},
   {t:"Part 3 · Past Simple", q:[
    {q:"I ______ to CESI for the first time last Monday.",
     o:["go","goed","went","am going"], a:2,
     e:["This is the present form, but “last Monday” needs the past.",
        "“Goed” is not an English word.",
        "Correct. The past simple of go is went.",
        "The present continuous cannot describe a finished past day."]},
    {q:"We ______ in the same school two years ago.",
     o:["are","is","was","were"], a:3,
     e:["This is a present form, but “two years ago” needs the past.",
        "“Is” is present and is used for one person or thing.",
        "“Was” is used with I, he, she and it.",
        "Correct. The past of are with “we” is were."]},
    {q:"She ______ not speak English at primary school.",
     o:["did","does","was","is"], a:0,
     e:["Correct. Past negatives use did not plus the bare verb.",
        "“Does” is a present auxiliary, but the sentence is about the past.",
        "“Was” cannot be followed by the bare verb speak.",
        "“Is” is present and cannot be followed by the bare verb."]},
    {q:"______ you meet your new classmates yesterday?",
     o:["Do","Did","Was","Are"], a:1,
     e:["“Do” is present, but “yesterday” needs a past question.",
        "Correct. Past questions use Did plus the bare verb.",
        "“Was” does not go with “you”.",
        "“Are” is present and cannot be followed by the bare verb."]},
    {q:"My family ______ to Lyon in 2019.",
     o:["move","moves","moved","moving"], a:2,
     e:["This present form does not fit the date 2019.",
        "This is a present form, but the sentence is about 2019.",
        "Correct. Regular past simple verbs end in -ed.",
        "A verb with -ing cannot stand alone as the main verb."]},
    {q:"Last week our teacher ______ us a funny video.",
     o:["show","shows","is showing","showed"], a:3,
     e:["This present form does not fit “last week”.",
        "This is the present simple, but the action is finished.",
        "The present continuous cannot describe a finished past week.",
        "Correct. The past simple of show is showed."]},
    {q:"I ______ my first English book when I was ten.",
     o:["read","readed","reads","am reading"], a:0,
     e:["Correct. Read keeps the same spelling in the past simple.",
        "“Readed” is not an English word.",
        "The -s form is present and only for he, she or it.",
        "The present continuous cannot be used with a finished past time."]},
    {q:"He ______ born in Nantes in 2006.",
     o:["is","was","were","did"], a:1,
     e:["“Is” is present, but 2006 is in the past.",
        "Correct. We say was born for one person in the past.",
        "“Were” is used with you, we and they.",
        "“Did” cannot be used before born."]},
    {q:"Yesterday they ______ me many questions about my studies.",
     o:["ask","asks","asked","asking"], a:2,
     e:["This present form does not fit “yesterday”.",
        "The -s form is present and only for he, she or it.",
        "Correct. The past simple of ask ends in -ed.",
        "A verb with -ing needs “were” before it."]},
    {q:"I ______ not have a laptop last year.",
     o:["do","was","am","did"], a:3,
     e:["“Do” is present, but “last year” needs the past.",
        "“Was” cannot be followed by the bare verb have.",
        "“Am” is present and cannot be followed by the bare verb.",
        "Correct. Did not plus the bare verb makes a past negative."]}
   ]},
   {t:"Part 4 · Question Words", q:[
    {q:"______ do you live? — In Rouen.",
     o:["Who","When","Why","Where"], a:3,
     e:["Who asks about a person, not a place.",
        "When asks about a time, not a place.",
        "Why asks for a reason, not a place.",
        "Correct. Where asks about a place."]},
    {q:"______ is your birthday? — In June.",
     o:["Where","Who","When","How"], a:2,
     e:["Where asks about a place, but the answer is a month.",
        "Who asks about a person.",
        "Correct. When asks about a time or a date.",
        "How asks about a way or a manner."]},
    {q:"______ are you studying engineering? — Because I like maths.",
     o:["What","Why","How","Who"], a:1,
     e:["What asks about a thing, not a reason.",
        "Correct. Why asks for a reason, and the answer starts with because.",
        "How asks about a way of doing something.",
        "Who asks about a person."]},
    {q:"______ brothers and sisters do you have?",
     o:["How many","How much","How long","How old"], a:0,
     e:["Correct. How many is used with countable plural nouns.",
        "How much is used with things we cannot count.",
        "How long asks about time or length.",
        "How old asks about age."]},
    {q:"______ is that girl next to the window? — She is my cousin.",
     o:["What","Where","Which","Who"], a:3,
     e:["What asks about a thing, not a person.",
        "Where asks about a place, but the answer is a person.",
        "Which needs a choice between things that are given.",
        "Correct. Who asks about a person."]},
    {q:"______ bag is this? — It is Léa’s.",
     o:["Who","Which","Whose","Who’s"], a:2,
     e:["Who cannot come directly before a noun like bag.",
        "Which asks about a choice, not about the owner.",
        "Correct. Whose asks who something belongs to.",
        "“Who’s” means who is and does not show possession."]},
    {q:"______ old are you? — I am eighteen.",
     o:["What","How","Who","When"], a:1,
     e:["What is not used before old in this question.",
        "Correct. We ask about age with How old.",
        "Who asks about a person.",
        "When asks about a time."]},
    {q:"Choose the correct question.",
     o:["What do you study at CESI?","What you study at CESI?","What you do study at CESI?","What studies you at CESI?"], a:0,
     e:["Correct. After the question word we put do, then the subject, then the verb.",
        "The auxiliary do is missing in this question.",
        "The subject and the auxiliary are in the wrong order.",
        "The verb cannot come before the subject in this question."]},
    {q:"______ is your favourite sport? — Basketball.",
     o:["What","Who","Where","Whose"], a:0,
     e:["Correct. What asks about a thing when there is no list to choose from.",
        "Who asks about a person, not a sport.",
        "Where asks about a place.",
        "Whose asks about the owner of something."]},
    {q:"______ much does the book cost? — Ten euros.",
     o:["What","Who","How","Which"], a:2,
     e:["What is not used before much in this question.",
        "Who asks about a person.",
        "Correct. We ask about a price with How much.",
        "Which is not used before much."]}
   ]},
   {t:"Part 5 · Determiners, Possession & Prepositions", q:[
    {q:"I am ______ engineering student at CESI.",
     o:["a","an","any","this"], a:1,
     e:["“A” is used before a consonant sound, not before this vowel sound.",
        "Correct. We use an before a word that begins with a vowel sound.",
        "Any is not used before a singular noun in this positive sentence.",
        "This points to something near us and does not fit here."]},
    {q:"There is ______ milk in the fridge.",
     o:["a","an","some","many"], a:2,
     e:["“A” is not used with a noun we cannot count.",
        "“An” is not used with a noun we cannot count.",
        "Correct. We use some with nouns we cannot count.",
        "Many is only used with countable plural nouns."]},
    {q:"______ is my friend Hugo, and these are my parents.",
     o:["This","These","Them","That is"], a:0,
     e:["Correct. This introduces one person who is near us.",
        "These is for more than one person or thing.",
        "Them cannot be the subject of a sentence.",
        "This choice repeats the verb is, which is already in the sentence."]},
    {q:"This phone is not mine. It is ______.",
     o:["her","my","their","hers"], a:3,
     e:["“Her” must be followed by a noun.",
        "“My” must be followed by a noun.",
        "“Their” must be followed by a noun.",
        "Correct. Hers is a possessive pronoun and stands alone."]},
    {q:"______ name is Léa and she comes from Nice.",
     o:["She","Her","Hers","She’s"], a:1,
     e:["“She” is a subject pronoun and cannot come before a noun.",
        "Correct. Her is the possessive adjective we put before a noun.",
        "Hers stands alone and cannot be followed by a noun.",
        "“She’s” means she is and does not show possession."]},
    {q:"This is ______ laptop. Her name is on it.",
     o:["Julie","Julies","Julie’s","the Julie"], a:2,
     e:["A name needs the possessive form to show the owner.",
        "This plural spelling does not show possession.",
        "Correct. We add an apostrophe and s to a name to show possession.",
        "The is not used before the name of a person here."]},
    {q:"I sit ______ Paul and Marie in the English class.",

     e:["Correct. “Agree” is a normal verb, so we say “I agree”.",
        "“Agree” is a verb, so it does not need “am” in front of it.",
        "“Agreed” after “am” makes a passive form that we do not use here.",
        "A verb with -ing cannot stand alone as the main verb."]},
    {q:"My friends ______ a new car, so we can drive to the beach.",
     o:["has","have","is","does"], a:1,
     e:["“Has” is only for he, she or it.",
        "Correct. Plural subjects like “my friends” take “have”.",
        "“Is” is a form of “to be” and cannot show possession here.",
        "“Does” is an auxiliary and cannot be the main verb before “a new car”."]},
    {q:"______ she do her shopping on Saturday?",
     o:["Is","Do","Does","Has"], a:2,
     e:["“Is” cannot come before the bare verb “do”.",
        "“Do” is for I, you, we and they, not for “she”.",
        "Correct. “Does” is the auxiliary for he, she and it, and “do” here is the main verb.",
        "“Has” cannot be the auxiliary before the bare verb “do”."]},
    {q:"The restaurant ______ very busy last night.",
     o:["is","are","were","was"], a:3,
     e:["“Is” is present, but “last night” needs a past form.",
        "“Are” is present and plural, so it does not fit here.",
        "“Were” is the past form for we, you and they, not for one restaurant.",
        "Correct. “Was” is the past of “to be” for a singular subject."]},
    {q:"Choose the sentence that is correct.",
     o:["She has got a bike, but I haven’t got one.","She have got a bike, but I hasn’t got one.","She is got a bike, but I am not got one.","She got has a bike, but I not got one."], a:0,
     e:["Correct. “She” takes “has got” and “I” takes “haven’t got”.",
        "“She” needs “has”, and “I” needs “haven’t”.",
        "“Got” does not follow “is” or “am” in this structure.",
        "The word order is wrong and “not” cannot make the verb negative alone."]},
    {q:"I ______ hungry, so let’s find a restaurant.",
     o:["have","am","do","has"], a:1,
     e:["In English we do not use “have” with “hungry”.",
        "Correct. Feelings like “hungry” go with “to be”, so we say “I am hungry”.",
        "“Do” is an auxiliary and cannot come before an adjective.",
        "“Has” is only for he, she or it, and it is not used with “hungry”."]},
    {q:"My bag is heavy because it ______ a lot of books inside.",
     o:["have","is","does","has"], a:3,
     e:["“Have” is not used with the subject “it”.",
        "“Is” is a form of “to be” and cannot show possession here.",
        "“Does” is an auxiliary and cannot be the main verb before “a lot of books”.",
        "Correct. “It” takes “has” to say what something contains."]}
   ]},
   {t:"Part 3 · Past Simple", q:[
    {q:"We ______ to the market last Saturday.",
     o:["go","are going","went","goes"], a:2,
     e:["“Go” is the present form, but “last Saturday” needs the past.",
        "The present continuous cannot be used with “last Saturday”.",
        "Correct. “Went” is the past simple of “go”.",
        "The -s form is present and only for he, she or it."]},
    {q:"I ______ the bus because I was late.",
     o:["miss","missing","am missing","missed"], a:3,
     e:["“Miss” is the present form, but the sentence talks about the past.",
        "A verb with -ing cannot stand alone as the main verb.",
        "The present continuous does not fit a finished past action.",
        "Correct. “Missed” is the regular past simple of “miss”."]},
    {q:"______ you buy a ticket at the station yesterday?",
     o:["Did","Do","Was","Were"], a:0,
     e:["Correct. Past simple questions use “did” + the bare verb.",
        "“Do” is the present auxiliary, but “yesterday” needs the past.",
        "“Was” is wrong for “you” and cannot come before the bare verb “buy”.",
        "“Were” cannot be used as an auxiliary before the bare verb “buy”."]},
    {q:"She ______ her phone in the café two hours ago.",
     o:["leaves","left","leaved","is leaving"], a:1,
     e:["The -s form is present, but “two hours ago” needs the past.",
        "Correct. “Left” is the irregular past simple of “leave”.",
        "“Leave” is irregular, so it does not take -ed.",
        "The present continuous does not go with “two hours ago”."]},
    {q:"They ______ eat at the restaurant last night. It was closed.",
     o:["don’t","wasn’t","didn’t","not"], a:2,
     e:["“Don’t” is present, but “last night” needs the past.",
        "“Wasn’t” is wrong for “they” and cannot come before the bare verb “eat”.",
        "Correct. The past simple negative uses “didn’t” + the bare verb.",
        "“Not” alone cannot make a verb negative."]},
    {q:"The weather ______ very cold last January.",
     o:["is","were","are","was"], a:3,
     e:["“Is” is present, but “in 2019” needs a past form.",
        "“Were” is used with we, you and they, not with “the weather”.",
        "“Are” is present and plural, so it does not fit here.",
        "Correct. “Was” is the past of “to be” for a singular subject."]},
    {q:"Last week I ______ a new coat in the shop near my house.",
     o:["bought","buyed","buy","am buying"], a:0,
     e:["Correct. “Bought” is the irregular past simple of “buy”.",
        "“Buy” is irregular, so it does not take -ed.",
        "“Buy” is the present form, but “last week” needs the past.",
        "The present continuous does not go with “last week”."]},
    {q:"Choose the correct question.",
     o:["Where did you went on Sunday?","Where did you go on Sunday?","Where you went on Sunday?","Where did you goed on Sunday?"], a:1,
     e:["After “did” the verb stays in its bare form.",
        "Correct. Past simple questions use “did” + the bare verb.",
        "A question like this needs the auxiliary “did” before the subject.",
        "“Go” is irregular and never takes -ed."]},
    {q:"We ______ at the station for twenty minutes yesterday.",
     o:["wait","waits","waited","are waiting"], a:2,
     e:["“Wait” is the present form, but “yesterday” needs the past.",
        "The -s form is present and only for he, she or it.",
        "Correct. “Waited” is the regular past simple of “wait”.",
        "The present continuous does not go with “yesterday”."]},
    {q:"He ______ me the way to the museum. He was very kind.",
     o:["showed","shows","show","showing"], a:0,
     e:["Correct. “Showed” is the regular past simple of “show”.",
        "The -s form is present, but the second sentence is in the past.",
        "“Show” without -ed is the present form and does not fit the past.",
        "A verb with -ing cannot stand alone as the main verb."]}
   ]},
   {t:"Part 4 · Question Words", q:[
    {q:"______ is the train to Lyon? — At half past four.",
     o:["Where","What","How","When"], a:3,
     e:["“Where” asks about a place, not about a time.",
        "“What” asks about a thing, so it does not fit this answer.",
        "“How” asks about a way or a manner, not about a time.",
        "Correct. “When” asks about time, and the answer gives a time."]},
    {q:"______ much is this coffee? — Two euros.",
     o:["How","What","Which","Who"], a:0,
     e:["Correct. “How much” asks about a price or an amount we cannot count.",
        "“What” cannot come before “much” in this question.",
        "“Which” is used to choose between things, not before “much”.",
        "“Who” asks about a person, not about a price."]},
    {q:"______ bus goes to the airport, the 5 or the 9?",
     o:["Who","Which","Whose","How"], a:1,
     e:["“Who” asks about a person, not about a bus.",
        "Correct. “Which” is used when we choose from a small number of options.",
        "“Whose” asks about the owner of something.",
        "“How” asks about a way or a manner, not about a choice."]},
    {q:"______ bag is this? — It is my sister’s.",
     o:["Who","Who’s","Whose","Which"], a:2,
     e:["“Who” asks about a person and cannot come before a noun like this.",
        "“Who’s” means “who is”, so it does not fit before “bag”.",
        "Correct. “Whose” asks who the owner is.",
        "“Which” asks you to choose, but the answer names an owner."]},
    {q:"______ are you late? — Because the bus didn’t come.",
     o:["How","When","Where","Why"], a:3,
     e:["“How” asks about a way or a manner.",
        "“When” asks about time, but the answer gives a reason.",
        "“Where” asks about a place, not about a reason.",
        "Correct. “Why” asks for a reason, and the answer starts with “because”."]},
    {q:"______ do you live? — Near the station.",
     o:["Where","What","Who","Why"], a:0,
     e:["Correct. “Where” asks about a place, and the answer gives a place.",
        "“What” asks about a thing, not about a place.",
        "“Who” asks about a person, not about a place.",
        "“Why” asks for a reason, not for a place."]},
    {q:"How ______ people were on the bus?",
     o:["much","many","long","old"], a:1,
     e:["“How much” is for things we cannot count, but “people” can be counted.",
        "Correct. “How many” is used with countable plural nouns like “people”.",
        "“How long” asks about time or length, not about a number of people.",
        "“How old” asks about age, not about a number of people."]},
    {q:"Choose the correct word order.",
     o:["Where you are going?","Where are going you?","Where are you going?","Where go you?"], a:2,
     e:["In a question the verb “are” must come before the subject.",
        "The subject “you” must come straight after “are”.",
        "Correct. Questions put the auxiliary before the subject, as in “are you going”.",
        "English questions need an auxiliary like “do” or “are”."]},
    {q:"______ is that man at the counter? — He is the waiter.",
     o:["Which","What","Whose","Who"], a:3,
     e:["“Which” is used to choose between options, but no options are given.",
        "“What” asks about a thing, not about a person.",
        "“Whose” asks about the owner of something.",
        "Correct. “Who” asks about a person, and the answer names a person."]},
    {q:"______ do you go to the shops? — By bus.",
     o:["Why","How","Where","When"], a:1,
     e:["“Why” asks for a reason, but the answer gives a means of transport.",
        "Correct. “How” asks about the way we do something, like travelling by bus.",
        "“Where” asks about a place, but the answer is not a place.",
        "“When” asks about time, but the answer is not a time."]}
   ]},
   {t:"Part 5 · Determiners, Possession & Prepositions", q:[
    {q:"I would like ______ apple and a glass of water, please.",
     o:["an","a","the","any"], a:0,
     e:["Correct. We use “an” before a word that starts with a vowel sound.",
        "“A” is only used before a consonant sound.",
        "“The” points to something already known, but this apple is new here.",
        "“Any” is not used in a positive sentence like this."]},
    {q:"Have we got ______ milk for the coffee?",
     o:["a","any","an","many"], a:1,
     e:["“A” is not used with an uncountable noun like “milk”.",
        "Correct. We use “any” with uncountable nouns in questions.",
        "“An” goes before a vowel sound and not with uncountable nouns.",
        "“Many” is used with countable plural nouns, not with “milk”."]},
    {q:"______ shoes over there are very expensive.",
     o:["This","That","Those","These"], a:2,
     e:["“This” is for one thing that is near you.",
        "“That” is for one thing that is far from you.",
        "Correct. “Those” is for more than one thing that is far away.",
        "“These” is for more than one thing that is near you."]},
    {q:"This is not my ticket. It is ______.",
     o:["her’s","she","of her","hers"], a:3,
     e:["Possessive pronouns never take an apostrophe.",
        "“She” is a subject pronoun and cannot show possession.",
        "“Of her” is not a possible way to say this in English.",
        "Correct. “Hers” is a possessive pronoun and stands alone after the verb."]},
    {q:"We are waiting for ______ friends in front of the cinema.",
     o:["our","us","ours","we"], a:0,
     e:["Correct. “Our” is a possessive adjective and goes before a noun.",
        "“Us” is an object pronoun and cannot come before a noun.",
        "“Ours” stands alone and cannot come before a noun.",
        "“We” is a subject pronoun and cannot show possession."]},
    {q:"That is ______ car. He drives it every day.",
     o:["Marc","Marc’s","Marcs","of Marc"], a:1,
     e:["A name before a noun needs an apostrophe and -s to show possession.",
        "Correct. We add ’s to a person’s name to show possession.",
        "Without an apostrophe, “Marcs” looks like a plural, not a possessive.",
        "“Of Marc” is not used before a noun in English."]},
    {q:"The café is ______ the bank and the post office.",
     o:["under","next","between","on"], a:2,
     e:["“Under” means below something.",
        "“Next” needs “to” before a noun.",
        "Correct. “Between” is used when there is something on each side.",
        "“On” means on top of a surface."]},
    {q:"My train leaves ______ Monday morning.",
     o:["in","at","to","on"], a:3,
     e:["“In” is used with months, years and seasons, not with days.",
        "“At” is used with clock times, not with days of the week.",
        "“To” shows direction, not time.",
        "Correct. We use “on” with days and dates."]},
    {q:"Your bag is ______ the table. I can see it there.",
     o:["under","in","between","to"], a:0,
     e:["Correct. “Under” tells us that something is below another thing.",
        "“In” means inside something, and a table has no inside.",
        "“Between” needs two things, one on each side.",
        "“To” shows movement to a place, not a position."]},
    {q:"We always meet ______ seven o’clock at the bus stop.",
     o:["on","in","at","to"], a:2,
     e:["“On” is used with days and dates, not with clock times.",
        "“In” is used with months and parts of the day, not with clock times.",
        "Correct. We use “at” with clock times.",
        "“To” shows direction, not time."]}
   ]}
  ]
},
{
  id: 14, name: "BAC+1 · Test 4", theme: "My first work experience",
  parts: [
   {t:"Part 1 · Present Simple & Present Continuous", q:[
    {q:"My boss ______ coffee every morning.",
     o:["drink","drinks","is drinking","drinking"], a:1,
     e:["After “my boss” the present simple needs an -s on the verb.",
        "Correct. The present simple with “every morning” describes a routine, and a singular subject takes an -s.",
        "The present continuous is for this moment, but “every morning” is a habit.",
        "A verb with -ing cannot be the main verb without “is” or “are”."]},
    {q:"Look! Anna ______ the photocopier.",
     o:["is using","uses","use","used"], a:0,
     e:["Correct. “Look!” points to this moment, so we use am/is/are plus the -ing form.",
        "The present simple is for routines, but “Look!” shows the action is happening now.",
        "After “Anna” the present simple needs an -s, and it does not fit “Look!”.",
        "“Used” is past simple, but the sentence is about now."]},
    {q:"______ you work on Saturdays?",
     o:["Does","Do","Are","Is"], a:1,
     e:["“Does” is only for he, she or it, not for “you”.",
        "Correct. Present simple questions with “you” use the auxiliary “do”.",
        "“Are” cannot be used as the auxiliary before the base verb “work”.",
        "“Is” is for he, she or it, and it cannot come before the base verb “work”."]},
    {q:"My manager ______ French at work.",
     o:["doesn’t speaks","don’t speak","doesn’t speak","not speak"], a:2,
     e:["After “doesn’t” the verb never takes an -s.",
        "“Don’t” is not used with a singular person like “my manager”.",
        "Correct. Present simple negatives use “doesn’t” plus the base verb.",
        "A negative sentence needs the auxiliary “do” or “does” before “not”."]},
    {q:"Right now I ______ a report for my boss.",
     o:["write","writes","am writing","am write"], a:2,
     e:["The present simple does not fit “right now”, which means at this moment.",
        "“Writes” is only for he, she or it, not for “I”.",
        "Correct. “Right now” needs the present continuous: am plus the -ing form.",
        "After “am” the verb must end in -ing."]},
    {q:"Sam is in the kitchen. He ______ lunch at the moment.",
     o:["eat","eats","ate","is eating"], a:3,
     e:["After “he” the verb needs an -s in the present simple.",
        "The present simple does not work with “at the moment”.",
        "“Ate” is past simple, but the action is happening now.",
        "Correct. “At the moment” needs am/is/are plus the -ing form."]},
    {q:"Where ______ your friend work?",
     o:["does","do","is","are"], a:0,
     e:["Correct. Questions about a routine with a singular subject use “does” plus the base verb.",
        "“Do” is not used with a singular person like “your friend”.",
        "“Is” cannot be used as the auxiliary before the base verb “work”.",
        "“Are” is for plural subjects, and it cannot come before the base verb “work”."]},
    {q:"The machines ______ a lot of noise every day.",
     o:["makes","is making","is make","make"], a:3,
     e:["“Makes” is for one thing, but “machines” is plural.",
        "“Is” is for one thing, and the continuous does not fit “every day”.",
        "“Is make” is not a possible form in English.",
        "Correct. Plural subjects take the base verb in the present simple."]},
    {q:"My brother ______ his new job very much.",
     o:["is liking","like","likes","are liking"], a:2,
     e:["“Like” is a state verb, so it is not used in the continuous.",
        "After “my brother” the verb needs an -s.",
        "Correct. State verbs like “like” use the present simple, with -s for he or she.",
        "“Are” is for plural subjects, and state verbs do not take -ing."]},
    {q:"Choose the correct sentence.",
     o:["She works in a shop every summer.","She work in a shop every summer.","She is work in a shop today.","She is works in a shop today."], a:0,
     e:["Correct. “Every summer” is a routine, and “she” takes an -s in the present simple.",
        "The verb is missing the -s after “she”.",
        "After “is” the verb must end in -ing.",
        "“Is” and a verb with -s cannot go together."]}
   ]},
   {t:"Part 2 · To Be, To Have, To Do", q:[
    {q:"I ______ twenty years old.",
     o:["have","am having","am","has"], a:2,
     e:["In English we do not use “have” for age.",
        "The continuous form “am having” is never used for age.",
        "Correct. English uses the verb “be” plus the number of years for age.",
        "“Has” is only for he, she or it, and age does not use “have”."]},
    {q:"I ______ with you. The office is too cold.",
     o:["agree","am agree","am agreed","agreeing"], a:0,
     e:["Correct. “Agree” is an ordinary verb, so it needs no form of “be”.",
        "“Am agree” is not a possible form in English.",
        "“Am agreed” is not used to give your own opinion.",
        "An -ing verb cannot be the main verb without “am”."]},
    {q:"My first day ______ very long and tiring.",
     o:["were","was","be","is being"], a:1,
     e:["“Were” is for plural subjects like “we” or “they”.",
        "Correct. “Was” is the past of “be” for a singular subject.",
        "“Be” cannot follow a subject without a helping verb.",
        "“Is being” talks about now, but the first day is finished."]},
    {q:"______ you got a badge for the building?",
     o:["Do","Does","Are","Have"], a:3,
     e:["“Do” cannot be used before “got” in this question.",
        "“Does” is only for he, she or it, and it does not go with “got”.",
        "“Are” cannot be followed by “got”.",
        "Correct. Questions with “have got” start with “have” for “you”."]},
    {q:"We ______ a short meeting every Friday morning.",
     o:["have","has","are","is having"], a:0,
     e:["Correct. “We” takes “have” in the present simple.",
        "“Has” is only for he, she or it.",
        "“Are” cannot replace “have” before a noun like “a meeting”.",
        "The continuous does not fit the routine “every Friday morning”."]},
    {q:"My tutor ______ not work on Wednesdays.",
     o:["do","does","is","has"], a:1,
     e:["“Do” is not used with he, she or it in present simple negatives.",
        "Correct. Negatives with he or she use “does” plus “not” plus the base verb.",
        "“Is” cannot be used as the auxiliary before “not work”.",
        "“Has” cannot be an auxiliary before “not work” here."]},
    {q:"______ your colleagues friendly?",
     o:["Is","Do","Does","Are"], a:3,
     e:["“Is” is for one person, but “colleagues” is plural.",
        "“Do” needs a verb after the subject, not an adjective.",
        "“Does” is for he, she or it, and it also needs a verb.",
        "Correct. “Are” is the plural form of “be” in questions."]},
    {q:"He ______ his best on his first day.",
     o:["made","was","did","had"], a:2,
     e:["“Make” is not used with “best” in this fixed expression.",
        "“Was” cannot be used before “his best” in this expression.",
        "Correct. English says “do your best”, so the past form is “did”.",
        "“Had his best” is not a possible English expression."]},
    {q:"______ she have a laptop at work?",
     o:["Is","Does","Do","Has"], a:1,
     e:["“Is” cannot be followed by “have”.",
        "Correct. Questions with “have” as a main verb use “does” for she.",
        "“Do” is not used with “she”.",
        "“Has” cannot be followed by “have” in a question."]},
    {q:"My two supervisors ______ very patient with me.",
     o:["were","was","is","be"], a:0,
     e:["Correct. “Were” is the past of “be” for plural subjects.",
        "“Was” is for one person, but “trainers” is plural.",
        "“Is” is singular and present, so it does not fit two people in the past.",
        "“Be” cannot follow a subject without a helping verb."]}
   ]},
   {t:"Part 3 · Past Simple", q:[
    {q:"Last week I ______ to a small company near Lille.",
     o:["go","went","goed","was going"], a:1,
     e:["“Go” is the present form, but “last week” is finished time.",
        "Correct. “Went” is the irregular past simple of “go”.",
        "“Goed” is not a word, because “go” is irregular.",
        "“Was going” describes an action in progress, not a finished trip."]},
    {q:"I ______ not understand my first task.",
     o:["did","do","was","am"], a:0,
     e:["Correct. Past simple negatives use “did not” plus the base verb.",
        "“Do” is present, but the sentence talks about the past.",
        "“Was” cannot be followed by the base verb “understand”.",
        "“Am” is present and cannot come before “understand”."]},
    {q:"______ you enjoy your placement last summer?",
     o:["Do","Did","Was","Were"], a:1,
     e:["“Do” is present and does not fit “last summer”.",
        "Correct. Past simple questions use “did” plus the base verb.",
        "“Was” cannot be followed by the base verb “enjoy”.",
        "“Were” cannot be followed by the base verb “enjoy”."]},
    {q:"My placement ______ three weeks in June.",
     o:["last","lasted","was last","is lasting"], a:1,
     e:["“Last” is the present form, but June is finished.",

    {q:"I finished my placement ______ week.",
     o:["ago","yesterday","last","in"], a:2,
     e:["“Ago” comes after a time period, not before the noun.",
        "“Yesterday” cannot come before “week”.",
        "Correct. “Last week” means the week just before this one.",
        "“In” is not used before “week” to say when something finished."]},
    {q:"She ______ me how to use the machine.",
     o:["showed","shown","showing","show"], a:0,
     e:["Correct. “Showed” is the past simple of the regular verb “show”.",
        "“Shown” is a past participle and cannot stand alone as the main verb.",
        "An -ing form cannot be the main verb without “was” or “is”.",
        "“Show” has no past ending, so it cannot describe a finished action."]},
    {q:"In 2019 my cousin ______ a trainee in a hotel.",
     o:["is","were","was","are"], a:2,
     e:["“Is” is present, but 2019 is finished time.",
        "“Were” is for plural subjects like “we” or “they”.",
        "Correct. “Was” is the past of “be” for a singular subject.",
        "“Are” is present and plural, so it does not fit here."]},
    {q:"I ______ my manager two months ago.",
     o:["meet","meeted","met","meeting"], a:2,
     e:["“Meet” is the present form and does not fit “two months ago”.",
        "“Meeted” is not a word, because “meet” is irregular.",
        "Correct. “Met” is the irregular past simple of “meet”.",
        "An -ing form cannot be the main verb without a helping verb."]},
    {q:"Choose the correct negative sentence.",
     o:["I didn’t worked on Monday.","I not worked on Monday.","I was work on Monday.","I didn’t work on Monday."], a:3,
     e:["After “didn’t” the verb never takes -ed.",
        "A past negative needs “did” before “not”.",
        "“Was” cannot be followed by the base verb “work”.",
        "Correct. “Didn’t” is always followed by the base form of the verb."]},
    {q:"How many days ______ you spend there last month?",
     o:["do","was","were","did"], a:3,
     e:["“Do” is present and does not fit “last month”.",

{

        "After the auxiliary “did”, the verb must stay in the base form, not the past form.",
        "The present continuous does not fit a finished action marked by “yesterday”."]},
    {q:"Right now the recruiter ______ my application letter.",
     o:["reads","was read","read","is reading"], a:3,
     e:["The present simple expresses habits and does not fit “right now”.",
        "This is a past passive form, but the recruiter is the one doing the action.",
        "This form gives no sense of an action in progress at the present moment.",
        "Correct. The present continuous is used for an action happening at this moment."]},
    {q:"Choose the correct sentence.",
     o:["I am speaking three languages and I learn Spanish now.","I speak three languages and I am learning Spanish now.","I speaking three languages and I learning Spanish now.","I spoke three languages and I am learn Spanish now."], a:1,
     e:["A permanent ability needs the present simple, and an action happening now needs the continuous, so both tenses are swapped here.",
        "Correct. The present simple states a permanent skill and the present continuous states an action in progress now.",
        "Both verbs are missing the auxiliary “am”, so neither form is complete.",
        "The first verb puts a present ability in the past, and the second mixes “am” with a base verb."]},
    {q:"When I ______ at school, I had no professional experience.",
     o:["am","was","been","were"], a:1,
     e:["The present tense does not fit a situation described in the past with “had”.",
        "Correct. The past simple of “be” with “I” is “was”, and it matches the past verb “had”.",
        "This is a past participle and cannot stand alone as the verb of the clause.",
        "This past form is used with “you”, “we” and “they”, not with “I”."]},
    {q:"My tutor ______ me to add my soft skills, and I added them the same day.",
     o:["advises","is advising","advised","advise"], a:2,
     e:["The present simple does not match the finished past action in the second clause.",
        "The present continuous describes an action in progress, not a completed past event.",
        "Correct. The past simple is used because the action is finished and linked to “the same day”.",
        "The verb does not agree with the singular subject “my tutor”."]},
    {q:"______ you ______ English at work every day?",
     o:["Do / use","Are / use","Do / using","Did / use"], a:0,
     e:["Correct. Present simple questions with “you” use “do” plus the base form, which suits “every day”.",
        "The auxiliary “are” must be followed by an “-ing” form, not a base form.",
        "The auxiliary “do” must be followed by the base form, not an “-ing” form.",
        "The auxiliary “did” refers to past time and does not fit “every day” as a present habit."]}
   ]},
   {t:"Part 2 · Common Modal Auxiliaries", q:[
    {q:"You ______ write your date of birth on a British CV; it is not expected.",
     o:["mustn’t","shouldn’t have","can’t","don’t have to"], a:3,
     e:["This modal expresses a strict prohibition, which is stronger than the idea of “not expected”.",
        "This form criticises a past action, but the sentence talks about a general rule.",
        "This modal expresses impossibility or lack of permission, not absence of obligation.",
        "Correct. “Don’t have to” expresses the absence of obligation."]},
    {q:"I ______ use spreadsheet software quite well, but I am still slow with databases.",
     o:["must","should","can","may"], a:2,
     e:["This modal expresses obligation, not personal skill.",
        "This modal gives advice, not information about what someone is able to do.",
        "Correct. “Can” expresses ability or skill.",
        "This modal expresses permission or possibility, not ability."]},
    {q:"Candidates ______ arrive late for the interview; the door is closed at nine o’clock exactly.",
     o:["mustn’t","needn’t","may not have","don’t must"], a:0,
     e:["Correct. “Mustn’t” expresses a strong prohibition or a strict rule.",
        "This modal expresses the absence of obligation, which is the opposite of a strict rule.",
        "This adds “have” after a modal without a participle, so the form is not possible here.",
        "Modals never take the auxiliary “do”, so this construction does not exist in English."]},
    {q:"Your CV has three spelling mistakes. You ______ check it again before sending it.",
     o:["can","should","may","mustn’t"], a:1,
     e:["This modal expresses ability, but the sentence gives a recommendation.",
        "Correct. “Should” is used to give advice or a recommendation.",
        "This modal expresses permission or possibility, not advice.",
        "This modal forbids an action, but checking the CV is being encouraged."]},
    {q:"______ I use your computer to print my application form?",
     o:["Must","Have to","Should","May"], a:3,
     e:["This modal asks about obligation, which does not fit a polite request.",
        "This form is not used at the start of a question without an auxiliary, so the structure is wrong.",
        "This modal asks for advice rather than permission.",
        "Correct. “May” is used to ask for permission politely."]},
    {q:"In France you ______ provide a payslip when you sign a rental contract.",
     o:["may not","can","mustn’t","have to"], a:3,
     e:["This form refuses permission, which contradicts the idea of a requirement.",
        "This modal expresses ability, not an obligation imposed by rules.",
        "This modal forbids the action, but the document is in fact required.",
        "Correct. “Have to” expresses an obligation that comes from an external rule."]},
    {q:"Choose the correct sentence.",
     o:["She can to speak German and she must finishing her CV.","She cans speak German and she musts finish her CV.","She can speak German and she must finish her CV.","She can speaking German and she must to finish her CV."], a:2,
     e:["“To” must not follow “can”, and “must” must be followed by a base form, not an “-ing” form.",
        "Modals never take a third-person “s”, so both verbs are wrongly conjugated.",
        "Correct. Modals such as “can” and “must” are followed directly by the base form of the verb.",
        "“Can” cannot be followed by an “-ing” form, and “must” is never followed by “to”."]},
    {q:"He ______ drive, so he always travels to the office by train.",
     o:["mustn’t","can’t","shouldn’t","may not"], a:1,
     e:["This modal expresses prohibition, but the sentence explains a lack of skill.",
        "Correct. “Can’t” expresses the absence of ability.",
        "This modal gives negative advice instead of stating a missing skill.",
        "This form refuses permission rather than describing a missing skill."]},
    {q:"You ______ send a cover letter if the advert doesn’t ask for one, but it is a good idea.",
     o:["needn’t","mustn’t","can’t","shouldn’t"], a:0,
     e:["Correct. “Needn’t” shows that the action is not necessary while remaining possible.",
        "This modal forbids the action, but the second clause recommends it.",
        "This modal states that the action is impossible, which contradicts the advice given.",
        "This modal advises against the action, but the sentence says it is a good idea."]},
    {q:"Interviewers say we ______ be honest about our level of English.",
     o:["can","may","should","mustn’t"], a:2,
     e:["This modal expresses ability, not a piece of advice.",
        "This modal expresses permission or possibility rather than recommendation.",
        "Correct. “Should” expresses advice or what is considered the right thing to do.",
        "This modal forbids the action, but honesty is being recommended."]}
   ]},
   {t:"Part 3 · Future Forms & Used To", q:[
    {q:"I’ve already decided: I ______ apply for that internship in Lyon.",
     o:["am going to","will have","used to","would"], a:0,
     e:["Correct. “Going to” expresses a plan or an intention already decided.",
        "This form needs a past participle after “have”, so the construction is incomplete.",
        "This form refers to a past habit, not to a future plan.",
        "This modal expresses a hypothesis, not a decision already taken."]},
    {q:"Don’t worry about the interview questions. I ______ help you with them.",
     o:["used to","am helping","will","was going to"], a:2,
     e:["This form describes a past habit and cannot express a present offer.",
        "The present continuous would announce a fixed arrangement, not a spontaneous offer.",
        "Correct. “Will” is used for an offer or a decision taken at the moment of speaking.",
        "This past form says the plan did not happen, which contradicts the reassurance."]},
    {q:"Before I joined CESI, I ______ work in a supermarket at the weekend.",
     o:["use to","used to","am used to","will use to"], a:1,
     e:["In the affirmative, this form is missing the past “-d”, so it is not correct.",
        "Correct. “Used to” plus a base verb describes a habit that existed in the past but stopped.",
        "This structure means being familiar with something and needs an “-ing” form after it.",
        "“Used to” has no future form, so this construction does not exist."]},
    {q:"Look at those dark clouds. The recruitment fair ______ be cancelled.",
     o:["will","is","used to","is going to"], a:3,
     e:["This modal gives a prediction without the present evidence that the sentence points to.",
        "This gives “is be cancelled”, which is not a possible verb form.",
        "This form refers to a past habit and cannot express a prediction.",
        "Correct. “Going to” is used for a prediction based on present evidence we can see."]},
    {q:"I ______ speak any English at all, but now I can hold a short conversation.",
     o:["didn’t used to","didn’t use to","not used to","don’t use to"], a:1,
     e:["After the auxiliary “didn’t”, the verb must be “use”, without the final “-d”.",
        "Correct. The negative of “used to” is “didn’t use to”, with the base form after “didn’t”.",
        "This form has no auxiliary, so the negative sentence is not complete.",
        "The present auxiliary “don’t” cannot be used for a habit that belongs to the past."]},
    {q:"Our teacher thinks the exam ______ be easier than last year’s.",
     o:["will","is going to have","used to","going to"], a:0,
     e:["Correct. “Will” expresses a prediction or an opinion about the future.",
        "This form adds “have” without a participle, so the verb group is not possible.",
        "This form describes a past habit and cannot express an opinion about a future exam.",
        "This form is missing the verb “be”, so the structure is incomplete."]},
    {q:"We ______ meet the HR manager at ten; the appointment is in my diary.",
     o:["will","used to","are going to","go"], a:2,
     e:["This modal expresses a spontaneous decision, not an arrangement already in the diary.",
        "This form describes a past habit and does not fit a future appointment.",
        "Correct. “Going to” expresses a plan or arrangement already fixed.",
        "The present simple is used for timetables, but here the verb has no future meaning on its own."]},
    {q:"There ______ a photo on my old CV, but I removed it last month.",
     o:["uses to be","used to being","is used to be","used to be"], a:3,
     e:["This form adds a present “-s”, but the sentence refers to past time.",
        "After “used to” for past habits, the verb must be in the base form, not “-ing”.",
        "This structure means being familiar with something, which is not the meaning here.",
        "Correct. “Used to be” describes a past state that is no longer true."]},
    {q:"I’m sure you ______ get a reply before the end of the week.",
     o:["used to","are going","will","would have"], a:2,
     e:["This form refers to a past habit, not to a prediction about this week.",
        "This form needs “to” before the next verb, so the structure is incomplete.",
        "Correct. “Will” is used to make a prediction about the future.",
        "This form refers to something that did not happen in the past."]},
    {q:"Choose the correct sentence.",
     o:["I am going to send my CV tonight and I used to work in a shop.","I will going to send my CV tonight and I use to work in a shop.","I am going send my CV tonight and I was used to work in a shop.","I going to send my CV tonight and I used work in a shop."], a:0,
     e:["Correct. “Going to” expresses the planned future and “used to” plus a base verb expresses a past habit.",
        "“Will” and “going to” cannot be combined, and the past habit needs “used”, not “use”.",
        "“Going to” needs “to” before the verb, and “was used to” expresses familiarity, not a past habit.",
        "The first clause is missing the auxiliary “am”, and “used” must be followed by “to”."]}
   ]},
   {t:"Part 4 · Prepositions, Articles & Quantity", q:[
    {q:"I sent my application ______ Monday morning.",
     o:["in","on","at","during"], a:1,
     e:["This preposition is used with months, years and parts of the day, not with a named day.",
        "Correct. “On” is used before days and dates.",
        "This preposition is used with clock times and fixed expressions, not with days.",
        "This preposition introduces a period of time, not a precise day."]},
    {q:"I have worked in this company ______ 2024.",
     o:["since","for","during","from"], a:0,
     e:["Correct. “Since” is used with a point in time to show when a situation started.",
        "This preposition is used with a length of time, such as “two years”, not with a date.",
        "This preposition introduces a period in which something happens, not a starting point.",
        "This preposition needs a second point, as in “from 2024 to 2026”, so it is incomplete here."]},
    {q:"She is ______ engineering student in her second year.",
     o:["a","no article","the","an"], a:3,
     e:["This article is used before a consonant sound, but the next word begins with a vowel sound.",
        "A singular countable noun describing a job or status needs an article.",
        "The definite article points to a known person, but here the person is introduced for the first time.",
        "Correct. “An” is used before a word beginning with a vowel sound, as in “engineering”."]},
    {q:"How ______ experience do you have with technical drawing?",
     o:["many","much","few","a lot"], a:1,
     e:["This quantifier is used with countable plural nouns, but “experience” is uncountable here.",
        "Correct. “Much” is used in questions with uncountable nouns such as “experience”.",
        "This quantifier is used with countable nouns and is not used in this question pattern.",
        "This expression is not used in questions of this type and needs “of” before an uncountable noun."]},
    {q:"There are only ______ places left on the English course.",
     o:["a little","much","a few","any"], a:2,
     e:["This quantifier is used with uncountable nouns, but “places” is countable and plural.",
        "This quantifier is also used with uncountable nouns, so it does not fit “places”.",
        "Correct. “A few” is used with countable plural nouns to mean a small number.",
        "This quantifier is normally used in questions and negative sentences, not in this affirmative one."]},
    {q:"I keep my diplomas ______ a blue folder on my desk.",
     o:["on","at","in","to"], a:2,
     e:["This preposition means on a surface, but the diplomas are inside the folder.",
        "This preposition indicates a point or a place in general, not the inside of an object.",
        "Correct. “In” is used for something inside a container or closed space.",
        "This preposition expresses movement towards a place, not a position."]},
    {q:"We talked about my skills ______ the whole interview.",
     o:["during","since","while","for the"], a:0,
     e:["Correct. “During” is followed by a noun and shows when something happens inside a period.",
        "This preposition marks the start of a situation, not the period in which something happens.",
        "This word introduces a clause with a verb, not a noun phrase like “the whole interview”.",
        "This combination is not used before this kind of noun phrase, so the structure is wrong."]},
    {q:"Did you get ______ feedback after the interview?",
     o:["few","any","many","a"], a:1,
     e:["“Few” counts separate items, so it cannot go with an uncountable noun like “feedback”.",
        "Correct. “Any” is used with uncountable nouns in questions and negative sentences.",
        "“Many” asks about a number, but “feedback” has no plural form and cannot be counted.",
        "An uncountable noun cannot take the indefinite article."]},
    {q:"______ interview was shorter than I expected, and I left at five.",
     o:["A","An","The","No article"], a:2,
     e:["This article introduces something for the first time, but this interview is already known.",
        "This article also introduces a new item, and the sentence refers to a specific known interview.",
        "Correct. “The” is used for a specific thing already known to both speakers.",
        "A singular countable noun cannot stand alone as the subject without a determiner."]},
    {q:"I usually go ______ the career office ______ lunchtime.",
     o:["to / at","at / to","in / on","to / on"], a:0,
     e:["Correct. “To” shows movement towards a place and “at” is used with points in time such as “lunchtime”.",
        "The first preposition shows position, not movement, and the second expresses direction, not time.",
        "The first preposition cannot follow the verb “go” before a place, and the second is used with days.",
        "The second preposition is used with days and dates, not with “lunchtime”."]}
   ]},
   {t:"Part 5 · Common Phrasal Verbs", q:[
    {q:"Please ______ this form with your personal details and your address.",
     o:["fill in","fill up","fill off","fill out of"], a:0,
     e:["Correct. “Fill in” means to write the required information in a form.",
        "This phrasal verb means to make something completely full, such as a tank or a glass.",

        "Correct. “Hand in” means to give a piece of work to a teacher or a manager."]},
    {q:"The IT team will ______ my new account tomorrow morning.",
     o:["set off","set up","set in","set about"], a:1,
     e:["This phrasal verb means to start a journey or to make something explode.",

    {q:"I called the school to ______ the exact date of the exam.",

        "Correct. “Find out” means to get information about something."]},
    {q:"A good assistant can ______ difficult customers without getting angry.",
     o:["deal in","deal with","deal out","deal on"], a:1,
     e:["This phrasal verb means to buy and sell a type of product.",
        "Correct. “Deal with” means to handle a problem, a task or a person.",
        "This phrasal verb means to distribute something, such as cards.",
        "This combination is not used as a phrasal verb in English."]},
    {q:"He ______ very well ______ his new colleagues.",

     e:["Correct. “Get on with someone” means to have a good relationship with that person.",
        "The first part means to leave your bed, which does not fit a relationship.",
        "The second preposition is wrong, because this phrasal verb is always followed by “with”.",
        "The first part means to enter a car or a building, not to have a good relationship."]},
    {q:"The manager is in a meeting now, but she will ______ you ______ this afternoon.",
     o:["call / off","call / in","call / up to","call / back"], a:3,
     e:["“Call off” means to cancel an event, not to telephone someone.",
        "“Call in” means to visit briefly, and it is not split around the object like this.",
        "“Call up to” is not a possible phrasal verb combination.",
        "Correct. “Call back” means to telephone someone again, often in return."]},
    {q:"Choose the correct sentence.",
     o:["I can’t log on my account, so I will sort this problem on tomorrow.","I can’t log in to my account, so I will sort out this problem tomorrow.","I can’t log in my account, so I will sort this problem off tomorrow.","I can’t log on to in my account, so I will sort up this problem tomorrow."], a:1,
     e:["“Log on” needs “to” before the object (“log on to my account”), and “sort on” is not an English phrasal verb.",
        "Correct. “Log in to” means to enter a system with a password and “sort out” means to solve a problem.",
        "The first verb needs “to” before the object, and “sort off” does not exist in English.",

   ]}
  ]

{
  id: 24, name: "BAC+2 · Test 4", theme: "Working with the UK team",

   {t:"Part 1 · Present Simple, Continuous & Past Simple", q:[

    {q:"Please be quiet — I ______ to the Manchester office on the phone right now.",

        "The past simple describes a finished action, but the call is happening now.",
        "Correct. The present continuous is used for an action happening at the moment of speaking, here with “right now”."]},
    {q:"We ______ the new London office last March.",
     o:["visited","visit","are visiting","have visited"], a:0,
     e:["Correct. The past simple is used with a finished time expression such as “last March”.",
        "The present simple cannot be used with a finished past time like “last March”.",
        "The present continuous refers to now or to a future plan, not to last March.",
        "The present perfect is never used with a precise finished past time."]},
    {q:"Sorry, Mr Clarke ______ for a client at the moment. Can I take a message?",
     o:["waited","waits","is waiting","waiting"], a:2,
     e:["The past simple describes a finished past situation, not the present moment.",
        "The present simple is for routines, but “at the moment” needs a temporary action.",

        "A verb form without an auxiliary cannot be a main verb in this sentence."]},
    {q:"What time ______ the video call start every Tuesday?",
     o:["is","does","did","do"], a:1,
     e:["“Is” would need an -ing form after it, not the base verb “start”.",
        "Correct. Present simple questions with a singular subject use the auxiliary “does” plus the base verb.",
        "“Did” makes a past question, but the call happens every Tuesday.",
        "“Do” does not agree with the singular subject “the video call”."]},
    {q:"Last week I ______ three emails to Birmingham but nobody answered.",
     o:["send","am sending","sent","was sending"], a:2,
     e:["The present simple cannot describe a finished action in “last week”.",

        "The past continuous suggests an action in progress, but here the three emails were completed."]},
    {q:"Choose the correct sentence.",
     o:["She usually is checking the shared folder in the morning.","She is usually check the shared folder in the morning.","She usually check the shared folder in the morning.","She usually checks the shared folder in the morning."], a:3,
     e:["“Usually” signals a habit, so the present continuous is the wrong tense here.",
        "After “is” the verb cannot stay in the base form; this mixes two structures.",

    {q:"They ______ the time of the call this morning, so now the meeting is at four.",

        "The past continuous describes a background action, not a single completed decision."]},
    {q:"Our manager ______ English with the UK team and French with us.",

        "The verb must agree with “our manager”, a singular subject.",
        "The past simple would place this fact in the past, but it is still true.",

    {q:"While I ______ my notes, Sarah called from Leeds.",

        "The past simple here would suggest two separate finished actions, not one interrupting the other.",

   ]},
   {t:"Part 2 · Common Modal Auxiliaries", q:[
    {q:"You ______ be late for the video call with London; it starts exactly at nine.",
     o:["mustn’t","don’t must","aren’t must","needn’t"], a:0,
     e:["Correct. “Mustn’t” expresses a strong prohibition or something it is important not to do.",
        "Modal verbs never take the auxiliary “do” in the negative.",
        "Modal verbs are not combined with “be” to form the negative.",
        "“Needn’t” means it is not necessary, which does not match a strict start time."]},
    {q:"______ you speak English on the phone without any problem?",
     o:["Must","Should","Can","Have"], a:2,
     e:["“Must” asks about obligation, not about someone’s ability.",
        "“Should” asks for advice, not about what a person is able to do.",
        "Correct. “Can” is used to ask about ability or skill.",
        "“Have” would need “to” plus a verb and expresses obligation, not ability."]},
    {q:"I ______ finish this report before five; my boss asked for it today.",
     o:["have to","must to","can to","should to"], a:0,
     e:["Correct. “Have to” expresses an obligation that comes from outside, here from the boss.",
        "“Must” is a modal and is never followed by “to”.",
        "“Can” is never followed by “to” and expresses ability, not obligation.",
        "“Should” is never followed by “to” and gives advice, not obligation."]},
    {q:"______ I use your phone to call back the Bristol office?",
     o:["Should","Must","Would","May"], a:3,
     e:["“Should” asks for advice rather than for permission.",
        "“Must” expresses obligation, so it is strange when asking the other person.",
        "“Would” alone does not ask for permission to do something.",
