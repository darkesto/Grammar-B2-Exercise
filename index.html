        "After “had” the verb must be a past participle, not the base form, and the past perfect needs a past reference.",
        "“Have” does not agree with the singular subject “the HR manager”.",
        "Correct. “Just” with a very recent action takes the present perfect: has + past participle."]},
    {q:"How long ______ your internship ______?",
     o:["did / lasted","has / lasted","is / lasting","has / last"], a:1,
     e:["After “did” the verb must be in the base form “last”, not the past form.",
        "Correct. “How long” about a situation continuing until now uses the present perfect.",
        "The present continuous does not express a duration measured from the past to the present.",
        "After “has” the verb must be in the past participle form, not the base form."]},
    {q:"They ______ the salary range in the advert, so applicants know what to expect.",
     o:["have already mentioned","already mentioned yesterday","are already mentioning","had already mentioned"], a:0,
     e:["Correct. The present perfect with “already” links a completed action to its present result.",
        "“Yesterday” is a finished time marker that does not fit a result valid now in this sentence.",
        "The present continuous describes an action in progress, not a completed mention in the advert.",
        "The past perfect needs an earlier past reference point, and there is none here."]},
    {q:"I ______ never ______ of that recruitment agency before today.",
     o:["was / heard","did / hear","have / heard","am / hearing"], a:2,
     e:["“Was heard” is a passive form, so the sentence would mean that nobody heard the speaker.",
        "“Did” cannot be followed by a past participle, and “never … before” points to experience up to now.",
        "Correct. “Never” for life experience up to the present takes the present perfect.",
        "“Hear” is not normally used in the continuous, and the meaning here is experience, not progress."]}
   ]},
   {t:"Part 3 · Past Continuous Tenses", q:[
    {q:"While I ______ my cover letter, the recruiter ______ me.",
     o:["was writing / was phoning","wrote / phoned","wrote / was phoning","was writing / phoned"], a:3,
     e:["Two past continuous forms would mean both actions lasted together, but one clearly interrupts the other.",
        "Two past simple forms suggest a sequence, not one action interrupting another in progress.",
        "The longer background action needs the continuous, and the short interrupting action the past simple.",
        "Correct. The past continuous gives the background action and the past simple the action that interrupts it."]},
    {q:"When the interview ______, the candidate ______ visibly nervous.",
     o:["started / was looking","started / looked","was starting / was looking","was starting / looked"], a:1,
     e:["“Look” in the sense of appearance is a state verb and is not normally used in the continuous.",
        "Correct. Both the point in time and the state use the past simple here.",
        "Neither verb works in the continuous: one is a single event and the other describes an appearance.",
        "The start of the interview is a single point in time, so the continuous is not appropriate."]},
    {q:"I ______ for the tram when I ______ that I had forgotten my portfolio.",
     o:["was waiting / realised","waited / was realising","was waiting / was realising","waited / realised"], a:0,
     e:["Correct. The past continuous sets the ongoing situation and the past simple gives the sudden realisation.",
        "“Realise” is a mental state verb and is not used in the continuous in this meaning.",
        "The second verb cannot be continuous, as realising is a sudden mental event.",
        "The past simple for “wait” loses the idea of an action in progress interrupted by a thought."]},
    {q:"At three o’clock yesterday the whole panel ______ applications in the meeting room.",
     o:["have reviewed","review","reviewed","were reviewing"], a:3,
     e:["The present perfect cannot be used with the finished time marker “yesterday”.",
        "The present simple cannot describe a specific moment in the past.",
        "The past simple would present the review as a complete event, not as what was happening at that exact time.",
        "Correct. The past continuous describes an action in progress at a precise past moment."]},
    {q:"Choose the correct sentence.",
     o:["He dropped his coffee while he was shaking the recruiter’s hand.","He was dropping his coffee while he shook the recruiter’s hand.","He drops his coffee while he was shaking the recruiter’s hand.","He was dropping his coffee while he was shaking the recruiter’s hand."], a:0,
     e:["Correct. The short event takes the past simple and the longer background action the past continuous.",
        "The tenses are the wrong way round: the handshake is the background, not the sudden event.",
        "Mixing the present simple with a past continuous clause is not possible in one past narrative.",
        "Dropping something is instantaneous, so the continuous does not suit the first verb."]},
    {q:"The candidates ______ in the corridor while the jury ______ about the first interview.",
     o:["waited / was talking","were waiting / talked","waited / talked","were waiting / was talking"], a:3,
     e:["The first verb should also be continuous, since both actions last through the same period.",
        "The second verb should also be continuous, since the discussion was going on at the same time.",
        "Two past simple forms do not show two actions going on at the same time.",
        "Correct. Two past continuous forms show two parallel actions in progress at the same moment."]},
    {q:"She ______ her degree in 2024 and ______ a graduate scheme the same year.",
     o:["finished / joined","finished / was joining","was finishing / joined","was finishing / was joining"], a:0,
     e:["Correct. Two finished past events in sequence both take the past simple.",
        "The second verb is a completed event in 2024, not an action in progress.",
        "The first verb is a completed event, so the continuous is not appropriate.",
        "Both verbs are completed events in a finished year, so the continuous is not used."]},
    {q:"______ you ______ notes when the manager explained the job description?",
     o:["Was / taking","Were / taking","Have / taken","Did / taking"], a:1,
     e:["“Was” does not agree with the subject “you”, which takes “were”.",
        "Correct. The past continuous question asks about an action in progress during another past action.",
        "The present perfect cannot refer to a specific finished past moment introduced by “when”.",
        "“Did” must be followed by the base form, never by an -ing form."]},
    {q:"The office was quiet: the phones ______ and nobody ______ in the open space.",
     o:["didn’t ring / moved","weren’t ringing / was moving","weren’t ringing / moved","didn’t ring / was moving"], a:1,
     e:["The past simple describes events rather than the scene in progress that the sentence is painting.",
        "Correct. Both verbs describe the background scene in progress, so the past continuous is used twice.",
        "The second verb should also be continuous, as it belongs to the same description of the scene.",
        "The first verb should also be continuous, as the sentence describes the atmosphere at that moment."]},
    {q:"I ______ to explain my project when the interviewer ______ me a new question.",
     o:["was still trying / was asking","still tried / asked","was still trying / asked","still tried / was asking"], a:2,
     e:["Asking a question is a short event and cannot be presented as a parallel ongoing action here.",
        "The past simple with “still” does not express an action that was in progress and got cut short.",
        "Correct. The unfinished action takes the past continuous and the interruption the past simple.",
        "The question is a single short event, so it does not take the continuous here."]}
   ]},
   {t:"Part 4 · Advanced Modals: Should, Might, Could", q:[
    {q:"You ______ send a thank-you email after the interview; recruiters appreciate it.",
     o:["should","would","will have to","ought"], a:0,
     e:["Correct. “Should” gives advice or a recommendation.",
        "“Would” expresses a hypothesis or a polite offer, not advice.",
        "“Will have to” expresses a future obligation, which is stronger than the advice meant here.",
        "“Ought” must be followed by “to” before the infinitive."]},
    {q:"According to the advert, candidates ______ send their application either online or by post.",
     o:["had better","may","ought to","would rather"], a:1,
     e:["“Had better” gives urgent advice about one action, not a free choice between two options.",
        "Correct. “May” expresses permission, so both ways of applying are allowed.",
        "“Ought to” says what is the right thing to do, not what the advert permits.",
        "“Would rather” expresses the subject’s own preference, not a rule in an advert."]},
    {q:"Your interview is at eight tomorrow, so you ______ leave home early.",
     o:["had better","would better","might better","should better"], a:0,
     e:["Correct. “Had better” plus the base form gives strong practical advice with a sense of urgency.",
        "“Would better” is not an existing structure in English.",
        "“Might better” is not a possible combination of modals.",
        "“Should better” is incorrect, as “should” and “better” are not combined."]},
    {q:"I am not sure about my plans: I ______ apply for a master’s degree instead of looking for a job.",
     o:["might","must","had better","ought to"], a:0,
     e:["Correct. “Might” expresses a real but uncertain possibility about the future.",
        "“Must” expresses obligation or certainty, which contradicts “I am not sure”.",
        "“Had better” gives urgent advice to someone, which does not fit an undecided personal plan.",
        "“Ought to” says what is the right thing to do, not what is still uncertain."]},
    {q:"______ you tell me a little more about the training programme, please?",
     o:["Should","Could","Must","Ought"], a:1,
     e:["“Should” asks for advice about what is right, not for a favour.",
        "Correct. “Could” makes a polite request in a question.",
        "“Must” expresses obligation and would sound like an order.",
        "“Ought” needs “to” before the verb and expresses duty, not a request."]},
    {q:"We don’t know yet, but the company ______ create two more positions next year.",
     o:["had better","must","may","ought to"], a:2,
     e:["“Had better” gives urgent advice, which does not fit an uncertain plan.",
        "“Must” expresses certainty or obligation, which contradicts “we don’t know yet”.",
        "Correct. “May” expresses a real but uncertain possibility.",
        "“Ought to” gives advice or expresses duty, not uncertainty."]},
    {q:"You ______ arrive late for an interview, even by five minutes.",
     o:["might not","could not","should not","would not"], a:2,
     e:["“Might not” expresses uncertainty about what will happen, not a recommendation.",
        "“Could not” expresses past inability or impossibility, not advice.",
        "Correct. “Should not” gives a clear negative recommendation.",
        "“Would not” describes a hypothesis or a typical reaction, not advice."]},
    {q:"Before the training, I ______ not explain my technical skills clearly in English.",
     o:["might","may","ought to","could"], a:3,
     e:["“Might not” refers to present or future uncertainty, not to a past inability.",
        "“May not” expresses permission or present possibility, not past ability.",
        "“Ought to” judges what is right and does not combine with “not” in this position.",
        "Correct. “Could not” is the usual way to express an inability in the past."]},
    {q:"You ______ to mention your volunteering experience; it shows real team spirit.",
     o:["had better","should","ought","might"], a:2,
     e:["“Had better” is followed by the base form, without “to”.",
        "“Should” is followed directly by the base form, without “to”.",
        "Correct. “Ought” is the only modal here that takes “to” before the infinitive.",
        "“Might” is followed by the base form, without “to”."]},
    {q:"Choose the correct sentence.",
     o:["You had better to send your CV today.","You should to send your CV today.","You would better send your CV today.","You had better send your CV today."], a:3,
     e:["“Had better” is followed by the base form, so “to” must be removed.",
        "“Should” is followed directly by the base form, without “to”.",
        "“Would better” is not an expression in English.",
        "Correct. “Had better” plus the base form gives strong practical advice."]}
   ]},
   {t:"Part 5 · Conditionals with If", q:[
    {q:"If you ______ the deadline, your application is automatically rejected.",
     o:["miss","would miss","missed","will miss"], a:0,
     e:["Correct. The zero conditional uses the present simple in both clauses for a general rule.",
        "“Would” belongs to the result clause of the second conditional, not to the “if” clause.",
        "The past simple would create a hypothetical meaning, but this is a general fact.",
        "“Will” is not used in the “if” clause of a zero conditional."]},
    {q:"If the HR department ______ interested, it sends you an email within a week.",
     o:["is","will be","would be","were"], a:0,
     e:["Correct. The zero conditional pairs the present simple after “if” with the present simple in the result.",
        "“Will” is not used in the “if” clause of a zero conditional.",
        "“Would” does not belong in the “if” clause of a second conditional.",
        "A past form after “if” creates a hypothesis, but the result clause states a general rule."]},
    {q:"If they offer me the job, I ______ it immediately.",
     o:["accept","will accept","would accept","accepted"], a:1,
     e:["The present simple in the result clause would turn this into a general rule, not a future decision.",
        "Correct. The first conditional uses “will” in the result clause for a real future possibility.",
        "“Would” expresses an imaginary situation, which does not match the real possibility here.",
        "The past simple does not express a future consequence."]},
    {q:"If you ______ the online test, the recruiter will invite you to a second interview.",
     o:["will pass","would pass","pass","passed"], a:2,
     e:["“Will” is not used in the “if” clause of a first conditional.",
        "“Would” belongs to the result clause of a second conditional, not to the “if” clause.",
        "Correct. The first conditional uses the present simple after “if” and “will” in the result.",
        "A past form after “if” calls for “would” in the result clause, not “will”."]},
    {q:"If the interview ______ well, I ______ about the training budget.",
     o:["will go / ask","goes / will ask","went / will ask","goes / would ask"], a:1,
     e:["“Will” does not belong in the “if” clause, and the result clause needs a future form.",
        "Correct. The first conditional is “if” plus the present simple, with “will” in the result clause.",
        "A past form after “if” does not combine with “will” in the result clause.",
        "The present simple after “if” announces a real possibility, so the result takes “will”."]},
    {q:"If I ______ more fluent in English, I would apply for the position in Dublin.",
     o:["were","have been","am","will be"], a:0,
     e:["Correct. The second conditional uses the past form, and “were” is standard after “if I”.",
        "The present perfect does not express an imaginary present condition.",
        "The present simple makes the condition real, but the result clause with “would” requires a hypothesis.",
        "“Will” is not used in the “if” clause of this type of conditional."]},
    {q:"If the company ______ my travel costs, I would accept the internship in Lyon.",
     o:["has paid","pays","paid","will pay"], a:2,
     e:["The present perfect does not express a hypothetical condition.",
        "The present simple would create a first conditional, which does not match “would accept”.",
        "Correct. The second conditional pairs a past form after “if” with “would” in the result.",
        "“Will” is not used in the “if” clause of a second conditional."]},
    {q:"If I spoke better German, I ______ for the position in Munich.",
     o:["will apply","apply","applied","would apply"], a:3,
     e:["“Will” belongs to the first conditional, but “spoke” already sets up a hypothesis.",
        "The present simple does not express an imaginary result.",
        "The past simple here would describe a real past action, not a hypothetical result.",
        "Correct. The second conditional pairs a past form after “if” with “would” in the result clause."]},
    {q:"If candidates ______ not understand a question, they ______ always ask for it to be repeated.",
     o:["would / could","did / can","do / can","will / can"], a:2,
     e:["“Would” does not belong in the “if” clause, and the sentence states a general rule, not a hypothesis.",
        "The past form creates a hypothesis that does not match the general advice in the result clause.",
        "Correct. The zero conditional uses the present simple after “if” and a general present modal in the result.",
        "“Will” is not used in the “if” clause of a zero conditional."]},
    {q:"Choose the correct sentence.",
     o:["If I will have more experience, I would get the job.","If I have more experience, I would get the job.","If I would have more experience, I would get the job.","If I had more experience, I would get the job."], a:3,
     e:["“Will” is not used in the “if” clause of a second conditional.",
        "The present simple after “if” does not match “would” in the result clause.",
        "“Would” cannot appear in the “if” clause of a second conditional.",
        "Correct. The second conditional is “if” plus a past form, with “would” in the result clause."]}
   ]},
   {t:"Part 6 · Adverbs of Frequency", q:[
    {q:"I ______ check the company website before an interview.",
     o:["check always","always check","always checking","am always check"], a:1,
     e:["A frequency adverb normally comes before the main verb, not after it.",
        "Correct. “Always” goes between the subject and the main verb in the present simple.",
        "Without an auxiliary, “checking” cannot be the verb of the sentence.",
        "“Am” cannot be followed by the base form “check”."]},
    {q:"Our HR team ______ organises mock interviews for final-year students.",
     o:["often does","organises often","often","does often"], a:2,
     e:["The auxiliary is unnecessary here and would leave two verb forms side by side.",
        "This word order is impossible because the verb is already in the sentence after the gap.",
        "Correct. A frequency adverb normally goes before the main verb in the present simple.",
        "The auxiliary “do” is not used in an affirmative sentence of this kind."]},
    {q:"He ______ late for a meeting; punctuality is one of his strengths.",
     o:["never","is never","never be","is not never"], a:1,
     e:["The sentence needs the verb “be” before the adjective “late”.",
        "Correct. An adverb of frequency comes after the verb “be”.",
        "“Be” cannot follow the adverb in the base form; the sentence needs the conjugated “is”.",
        "“Never” is already negative, so a double negative is impossible."]},
    {q:"Our team meets ______ to review the applications we have received.",
     o:["twice a week","twice at week","a week twice","two time a week"], a:0,
     e:["Correct. A frequency expression of this kind is formed with a number plus “a” and a period of time.",
        "The preposition is wrong; the fixed pattern is “twice a week”.",
        "The order is reversed, because the number of times comes first.",
        "The noun must be plural after a number, and the usual form for two is “twice”."]},
    {q:"She has ______ worked on an international project before.",
     o:["ever","not never","never been","never"], a:3,
     e:["“Ever” appears in questions and negatives, not in a plain affirmative statement like this one.",
        "Two negative words cannot be combined in the same clause.",
        "“Been” would turn the verb into a passive form and change the meaning completely.",
        "Correct. A frequency adverb goes between the auxiliary “has” and the past participle."]},
    {q:"Applications are ______ answered within two weeks.",
     o:["usual","used to","usually","usually being"], a:2,
     e:["“Usual” is an adjective, but an adverb is needed before the past participle.",
        "“Used to” is followed by a base form and refers to a habit that has stopped.",
        "Correct. A frequency adverb comes after “be” and before the past participle.",
        "The continuous passive “being answered” describes one action in progress, not a general rule."]},
    {q:"Interviews in this group ______ last more than forty minutes.",
     o:["not ever hardly","hardly ever","ever hardly","hardly never"], a:1,
     e:["This piles up several negative words, which English does not allow.",
        "Correct. “Hardly ever” means almost never and goes before the main verb.",
        "The two words cannot be reversed; the fixed expression is “hardly ever”.",
        "“Hardly” and “never” are both negative, so combining them is impossible."]},
    {q:"I ______ send the same cover letter to two different companies.",
     o:["don’t never","never don’t","never","am never"], a:2,
     e:["English does not allow two negative words in the same clause.",
        "This order is impossible, because “never” cannot come before a negative auxiliary here.",
        "Correct. “Never” goes before the main verb and is already negative on its own.",
        "“Am” cannot be followed by the base form “send”."]},
    {q:"A recruiter can ______ read a long CV in detail.",
     o:["rarely","rare","rarely to","be rarely"], a:0,
     e:["Correct. A frequency adverb goes between the modal and the base form of the verb.",
        "“Rare” is an adjective and cannot modify the verb “read”.",
        "The modal “can” is followed directly by the base form, not by “to”.",
        "“Be” would need a past participle after it, not the base form “read”."]},
    {q:"Choose the correct sentence.",
     o:["Candidates often asking about remote work.","Candidates ask about remote work often times.","Candidates often are ask about remote work.","Candidates often ask about remote work."], a:3,
     e:["Without an auxiliary, “asking” cannot be the verb of the sentence.",
        "“Often times” is not an English expression; the adverb is simply “often”.",
        "“Are” cannot be followed by the base form “ask”.",
        "Correct. “Often” goes between the subject and the main verb in the present simple."]}
   ]},
   {t:"Part 7 · Comparatives, Superlatives & Intensifiers", q:[
    {q:"The second interview was ______ than the first one.",
     o:["difficulter","most difficult","the more difficult","more difficult"], a:3,
     e:["English does not add “-er” to long adjectives such as “difficult”.",
        "“Most difficult” is a superlative and cannot be followed by “than” in this sentence.",
        "The article “the” marks a superlative and does not go with a comparative plus “than”.",
        "Correct. Long adjectives form the comparative with “more” before the adjective."]},
    {q:"This online application form is ______ than the one I filled in last week.",
     o:["more short","shorter","shortest","more shorter"], a:1,
     e:["Short adjectives form the comparative with “-er”, not with “more”.",
        "Correct. A one-syllable adjective takes “-er” before “than”.",
        "A superlative cannot be followed by “than” in this sentence.",
        "The comparative is marked once, either with “-er” or with “more”, never both."]},
    {q:"This is ______ job offer I have received so far.",
     o:["the better","the best","better","best"], a:1,
     e:["“Better” is a comparative and does not express the idea of “number one so far”.",
        "Correct. “The best” is the superlative of “good” and needs the definite article.",
        "A comparative without “than” cannot express a superlative meaning here.",
        "The superlative requires the article “the” before it in this position."]},
    {q:"Of all the applicants, Léa had ______ experience in automation.",
     o:["more","the more","much","the most"], a:3,
     e:["A comparative needs “than” and compares only two elements.",
        "“The more” is not used as a superlative before a noun in this sentence.",
        "“Much” indicates quantity but does not rank her above all the others.",
        "Correct. “The most” is the superlative used to place someone first in a group."]},
    {q:"My written English is almost ______ my spoken English.",
     o:["as good than","so good as","better as","as good as"], a:3,
     e:["“Than” is used with comparatives, never after “as good”.",
        "In an affirmative sentence the structure is “as … as”, not “so … as”.",
        "“Better” is followed by “than”, not by “as”.",
        "Correct. Equality between two things is expressed with “as + adjective + as”."]},
    {q:"The salary is lower than expected, but the position is ______ interesting.",
     o:["enough","too","far more","very more"], a:2,
     e:["“Enough” follows the adjective and does not create a comparison here.",
        "“Too” means more than acceptable and does not simply strengthen a comparison.",
        "Correct. “Far” is an intensifier used before a comparative such as “more interesting”.",
        "“Very” cannot be placed directly before “more + adjective”; intensifiers such as “far”, “much” or “a lot” are used instead."]},
    {q:"The interview was ______ relaxed that I forgot I was being assessed.",
     o:["so","too","very","enough"], a:0,
     e:["Correct. “So + adjective + that” introduces the consequence of a high degree.",
        "“Too” expresses an excess and is followed by “to + verb”, not by a “that” clause.",
        "“Very” simply shows degree and cannot introduce a “that” clause.",
        "“Enough” comes after the adjective and means sufficient, which does not fit here."]},
    {q:"The application form was ______ long for me to finish before the deadline.",
     o:["too","very","so","enough"], a:0,
     e:["Correct. “Too + adjective + for someone to do something” expresses an excess that prevents the action.",
        "“Very” shows degree but cannot introduce a consequence with “for me to finish”.",
        "“So” expresses a high degree but needs a “that” clause, not “for me to finish”.",
        "“Enough” comes after the adjective and means sufficient, which reverses the meaning."]},
    {q:"I don’t think my English is ______ to work in an international team.",
     o:["enough good","too good","good enough","so good"], a:2,
     e:["“Enough” comes after the adjective, not before it.",
        "“Too good” would mean more than necessary, which is the opposite of the meaning here.",
        "Correct. “Enough” follows the adjective and expresses a sufficient level.",
        "“So” expresses a high degree but needs a “that” clause to introduce a consequence."]},
    {q:"Choose the correct sentence.",
     o:["I am completely sure that this is the more suitable role for me.","I am completely sure that this is the most suitable role for me.","I am completely sure that this is the suitablest role for me.","I am completely sure that this is most suitable role for me."], a:1,
     e:["A comparative without “than” cannot express the idea of the top choice among several roles.",
        "Correct. Long adjectives form the superlative with “the most” before the adjective.",
        "English does not add “-est” to long adjectives such as “suitable”.",
        "The superlative needs the article “the” before “most suitable”."]}
   ]}
  ]
},
{
  id: 34, name: "BAC+3 · Test 4", theme: "Solving a problem at work",
  parts: [
   {t:"Part 1 · Relative Pronouns", q:[
    {q:"The technician ______ repaired the machine left a detailed note on my desk.",
     o:["which","who","whose","where"], a:1,
     e:["“Which” refers to things or animals, never to a person.",
        "Correct. “Who” is the relative pronoun used as the subject when it refers to a person.",
        "“Whose” shows possession and must be followed by a noun.",
        "“Where” refers to a place, not to a person."]},
    {q:"The e-mail ______ you sent this morning never reached the supplier.",
     o:["who","whose","that","where"], a:2,
     e:["“Who” can only refer to a person, but an e-mail is a thing.",
        "“Whose” expresses possession and must be followed by a noun.",
        "Correct. “That” can refer to a thing and works as the object of the relative clause.",
        "“Where” introduces a place, and an e-mail is not a place."]},
    {q:"We called the engineer ______ laptop had crashed during the presentation.",
     o:["whose","who","which","that"], a:0,
     e:["Correct. “Whose” expresses possession and is followed directly by the noun it belongs to.",
        "“Who” is a subject or object pronoun and cannot be followed immediately by a noun like “laptop”.",
        "“Which” refers to things and cannot show possession before a noun here.",
        "“That” cannot introduce a possessive relationship before a noun."]},
    {q:"This is the meeting room ______ we usually hold our crisis calls.",
     o:["which","that","where","whose"], a:2,
     e:["“Which” would need a preposition such as “in” before it to express place here.",
        "“That” alone cannot replace a place expression that requires “in which”.",
        "Correct. “Where” refers to a place and replaces the structure “in which”.",
        "“Whose” shows possession and must be followed by a noun."]},
    {q:"Our head of quality, ______ has worked here for twenty years, explained the procedure.",
     o:["that","who","which","whom"], a:1,
     e:["“That” is not used in a non-defining clause after a comma.",
        "Correct. In a non-defining clause about a person, “who” is used as the subject after the comma.",
        "“Which” refers to things, not to a person.",
        "“Whom” is an object pronoun, but this pronoun is the subject of “has worked”."]},
    {q:"I still remember the day ______ the whole network went down.",
     o:["when","which","who","whose"], a:0,
     e:["Correct. “When” is the relative pronoun used after a noun expressing time such as “the day”.",
        "“Which” would need the preposition “on” before it to work with “the day”.",
        "“Who” refers only to people, and a day is not a person.",
        "“Whose” shows possession and must be followed by a noun."]},
    {q:"Choose the correct sentence.",
     o:["The supplier who we contacted yesterday hasn’t replied.","The supplier what we contacted yesterday hasn’t replied.","The supplier whose we contacted yesterday hasn’t replied.","The supplier, that we contacted yesterday, hasn’t replied."], a:0,
     e:["Correct. “Who” refers to a person and here works as the object of a defining clause.",
        "“What” is never a relative pronoun after a noun in English.",
        "“Whose” expresses possession and must be followed by a noun.",
        "“That” cannot be used in a clause marked off by commas as a non-defining clause."]},
    {q:"The software update ______ caused the bug has now been removed.",
     o:["who","whose","where","which"], a:3,
     e:["“Who” refers only to people, and an update is a thing.",
        "“Whose” shows possession and must be followed by a noun.",
        "“Where” refers to a place, not to a thing performing an action.",
        "Correct. “Which” refers to a thing and acts as the subject of the relative clause."]},
    {q:"The report ______ on the printer is the one you need for the audit.",
     o:["who is","which is lying","that lying","whose is"], a:1,
     e:["“Who” refers to people, so it cannot describe a report.",
        "Correct. “Which” plus a verb correctly introduces a clause describing a thing as the subject.",
        "“That” must be followed by a complete verb form, not by a bare -ing form.",
        "“Whose” shows possession and must be followed by a noun, not by a verb."]},
    {q:"In which sentence can the relative pronoun be left out?",
     o:["The colleague who reported the fault is on holiday.","The fault which appeared on Monday is serious.","The office where we met the client is being renovated.","The solution that the team proposed works perfectly."], a:3,
     e:["“Who” is the subject of “reported”, and a subject pronoun cannot be omitted.",
        "“Which” is the subject of “appeared”, so it must stay in the sentence.",
        "“Where” replaces a place expression and cannot simply disappear.",
        "Correct. The pronoun is the object of “proposed”, and an object pronoun in a defining clause can be omitted."]}
   ]},
   {t:"Part 2 · Present Perfect", q:[
    {q:"The main server ______ down twice since the beginning of the week.",
     o:["has gone","went","was going","had gone"], a:0,
     e:["Correct. The present perfect is used with “since” to count events in a period that continues up to now.",
        "The past simple needs a finished time reference, but “since the beginning of the week” includes the present moment.",
        "The past continuous describes an action in progress in the past, not a number of completed events.",
        "The past perfect places an action before another past moment, and no second past moment is mentioned."]},
    {q:"I ______ the client yesterday afternoon to explain the delay.",
     o:["have called","called","have been calling","was calling"], a:1,
     e:["The present perfect cannot be used with a finished time expression such as “yesterday afternoon”.",
        "Correct. “Yesterday afternoon” is a finished past time, so the past simple is required.",
        "The present perfect continuous suggests an action continuing towards now, which clashes with “yesterday”.",
        "The past continuous would describe an action in progress, not a completed phone call with a clear purpose."]},
    {q:"We ______ for the technician’s report ______ nine o’clock this morning.",
     o:["wait / for","are waiting / since","have been waiting / since","have waited / for"], a:2,
     e:["The present simple does not express an action that started in the past and is still going on.",
        "The present continuous cannot be combined with “since” to measure duration from a starting point.",
        "Correct. The present perfect continuous with “since” expresses an action that began at a past point and continues now.",
        "“For” must be followed by a length of time, not by a clock time like nine o’clock."]},
    {q:"______ you ______ spoken to that supplier about a faulty batch before?",
     o:["Did / ever","Are / ever","Do / ever","Have / ever"], a:3,
     e:["“Spoken” is a past participle and cannot follow the auxiliary “did”.",
        "“Are” is followed by an -ing form or an adjective, never by a past participle like “spoken”.",
        "“Do” must be followed by the base form “speak”, not by a past participle.",
        "Correct. The present perfect with “ever” asks about experience at any time up to now."]},
    {q:"Don’t worry, the engineer has ______ fixed the printer — it was only a loose cable.",
     o:["yet","still","just","since"], a:2,
     e:["“Yet” belongs to questions and negative sentences, not to an affirmative statement like this one.",
        "“Still” means that a situation continues, which contradicts the idea of a finished repair.",
        "Correct. “Just” with the present perfect means that the action was completed a very short time ago.",
        "“Since” introduces a starting point in time and cannot stand alone between “has” and the participle."]},
    {q:"Choose the correct sentence.",
     o:["I have sent him the incident report last Friday.","I sent him the incident report last Friday.","I have been sending him the incident report last Friday.","I had sent him the incident report last Friday."], a:1,
     e:["The present perfect is impossible with the finished time marker “last Friday”.",
        "Correct. A finished past time expression such as “last Friday” requires the past simple.",
        "The present perfect continuous cannot be used with a finished past time expression.",
        "The past perfect needs a later past reference point, which this sentence does not provide."]},
    {q:"The support team ______ my ticket ______, so I am going to call them again.",
     o:["hasn’t answered / yet","didn’t answer / already","hasn’t answered / since","doesn’t answer / yet"], a:0,
     e:["Correct. “Yet” with a negative present perfect shows that something expected has not happened up to now.",
        "“Already” is used in affirmative sentences, so it does not fit a negative statement like this one.",
        "“Since” must introduce a point in time and cannot close the sentence on its own.",
        "The present simple describes habits, not a result that is still missing at this moment."]},
    {q:"How long ______ this software problem ______ the production line?",
     o:["does / affect","is / affecting","did / affected","has / affected"], a:3,
     e:["The present simple cannot answer “how long” about a situation that started in the past and continues.",
        "The present continuous describes the present moment only and does not express duration from a past start.",
        "After “did” the verb must be in the base form “affect”.",
        "Correct. “How long” plus the present perfect asks about a duration running from the past up to now."]},
    {q:"Our manager ______ already ______ a solution before the meeting started.",
     o:["has / found","had / found","was / finding","have / found"], a:1,
     e:["The present perfect cannot be used for an action completed before another clearly past event.",
        "Correct. The past perfect shows that one past action happened before another past action.",
        "The past continuous expresses an action in progress, not one finished before the meeting.",
        "“Have” does not agree with the singular subject “our manager”."]},
    {q:"They ______ never ______ such a serious breakdown before.",
     o:["have / had","did / have","are / having","has / had"], a:0,
     e:["Correct. The present perfect with “never” describes an absence of experience up to the present.",
        "The auxiliary “did” cannot build a perfect structure of this kind with “never … before”.",
        "The present continuous describes a temporary current action, not experience over a whole period.",
        "“Has” does not agree with the plural subject “they”."]}
   ]},
   {t:"Part 3 · Past Continuous Tenses", q:[
    {q:"While I ______ the invoice, the accounting software suddenly ______.",
     o:["checked / was crashing","checked / crashed","was checking / was crashing","was checking / crashed"], a:3,
     e:["The past simple does not fit the long background action, and a crash is a short single event.",
        "Two past simple forms suggest two successive short actions, which does not match “while”.",
        "Two past continuous forms suggest two parallel long actions, but the crash was instantaneous.",
        "Correct. The past continuous gives the longer background action and the past simple gives the short interrupting event."]},
    {q:"The alarm ______ off at three in the morning and everybody ______ the building.",
     o:["went / left","was going / left","went / was leaving","was going / was leaving"], a:0,
     e:["Correct. Two past simple verbs express two short completed actions happening one after the other.",
        "The past continuous does not suit an alarm going off, which is an instant event.",
        "The past continuous for “leave” would describe an action in progress, not a completed reaction.",
        "Neither action here is a long background situation, so the continuous is wrong in both gaps."]},
    {q:"What ______ you ______ when the system administrator called you?",
     o:["are / doing","have / done","were / doing","was / doing"], a:2,
     e:["The present continuous places the question now, but “called” sets it in the past.",
        "The present perfect links to now, but “called” places the question clearly in the past.",
        "Correct. The past continuous asks what was in progress when another past action interrupted it.",
        "“Was” does not agree with the subject “you”, which takes “were”."]},
    {q:"It ______ heavily all morning, so the delivery van ______ two hours late.",
     o:["rained / was arriving","was raining / arrived","was raining / was arriving","rains / arrived"], a:1,
     e:["The past simple does not present the rain as the background situation that explains the delay.",
        "Correct. The past continuous gives the background situation and the past simple gives the completed event.",
        "Arriving late is a single completed event, so the past continuous does not work for the van.",
        "The present simple does not belong in a narrative set entirely in the past."]},
    {q:"Choose the correct sentence.",
     o:["While we discussed the budget, the director was entering the room.","While we discussed the budget, the director entered the room.","While we were discussing the budget, the director was entering the room.","While we were discussing the budget, the director entered the room."], a:3,
     e:["The background action and the interruption are inverted, so the tenses are the wrong way round.",
        "“While” normally introduces a continuous action, so the past simple is not natural in that clause.",
        "Two past continuous forms would mean two long parallel actions, but entering the room is instant.",
        "Correct. “While” plus the past continuous marks the background action, and the past simple marks the interruption."]},
    {q:"Nobody ______ the error message because the technicians ______ in another room.",
     o:["noticed / were working","was noticing / worked","noticed / worked","was noticing / were working"], a:0,
     e:["Correct. The past simple reports the single fact, and the past continuous explains the ongoing situation behind it.",
        "Noticing something is a single moment here, so the past continuous does not suit it.",
        "The past simple for the technicians loses the idea of a situation in progress at that time.",
        "Noticing is not a long background action, so the continuous is wrong in the first gap."]},
    {q:"I ______ to reset the password three times before the account finally unlocked.",
     o:["was trying","am trying","have tried","tried"], a:3,
     e:["The past continuous does not fit an action repeated a stated number of times and then finished.",
        "The present continuous describes now, but the account unlocked in the past.",
        "The present perfect cannot be used in a sequence built around the past event “unlocked”.",
        "Correct. The past simple expresses a repeated action that is completely finished in the past."]},
    {q:"At ten o’clock yesterday we ______ the problem with the Berlin office on a video call.",
     o:["discussed","have discussed","were discussing","discuss"], a:2,
     e:["The past simple would mean the whole discussion fitted into that exact moment.",
        "The present perfect is impossible with the finished time expression “yesterday”.",
        "Correct. The past continuous describes an action in progress at a precise past moment.",
        "The present simple cannot refer to a specific moment yesterday."]},
    {q:"The two engineers ______ the cables while their colleague ______ the manual aloud.",
     o:["were checking / was reading","were checking / read","checked / read","checked / was reading"], a:0,
     e:["Correct. Two past continuous forms express two long actions happening at the same time.",
        "Reading the manual aloud is presented as a parallel ongoing action, not a short event.",
        "Two past simple forms break the idea of two simultaneous activities expressed by “while”.",
        "Checking the cables is here a parallel ongoing action, so the past simple is not suitable."]},
    {q:"When the fire drill started, the team ______ already ______ the test results.",
     o:["was / analysing","had / analysed","has / analysed","were / analysing"], a:1,
     e:["The past continuous with “already” does not express an action finished before the drill.",
        "Correct. The past perfect shows that the analysis was complete before the later past event.",
        "The present perfect connects to the present, but the whole sentence is situated in the past.",
        "This form keeps the continuous idea and so cannot show an action completed before the drill."]}
   ]},
   {t:"Part 4 · Advanced Modals: Should, Might, Could", q:[
    {q:"The line is still busy, so you ______ try sending an e-mail instead.",
     o:["should","should to","must to","ought"], a:0,
     e:["Correct. “Should” plus the base form gives advice about the best thing to do.",
        "“Should” is followed by the bare infinitive, so “to” cannot appear after it (only “ought” takes “to”).",
        "“Must” is also a modal and cannot be followed by “to”.",
        "“Ought” must be followed by “to” before the base form."]},
    {q:"You ______ check the log files before you call the supplier.",
     o:["ought","ought to","ought for","ought that"], a:1,
     e:["“Ought” must always be followed by “to” plus the base form.",
        "Correct. “Ought to” plus the base form expresses a recommendation or a duty.",
        "“Ought for” is not an English structure.",
        "“Ought that” is not a possible construction before a verb."]},
    {q:"______ you send me a screenshot of the error message, please?",
     o:["May","Will to","Could","Ought"], a:2,
     e:["“May” asks for permission for oneself and does not ask the other person to do something.",
        "“Will” is followed by the bare infinitive, so “to” cannot appear after it (only “ought” takes “to”).",
        "Correct. “Could you” plus the base form is a polite way of asking somebody to do something.",
        "“Ought” must be followed by “to” and expresses advice, not a request."]},
    {q:"We ______ finish this report tonight, otherwise the client will complain.",
     o:["had better","would better","better had","should to"], a:0,
     e:["Correct. “Had better” plus the base form gives strong advice about an urgent situation.",
        "“Would better” is not a possible form in English.",
        "The word order is inverted and impossible in a statement.",
        "“Should” is never followed by “to” before the verb."]},
    {q:"We ______ not be able to reconnect the site before noon, but we are doing our best.",
     o:["can to","may","ought","had better"], a:1,
     e:["“Can” is a modal and is never followed by “to” before the verb.",
        "Correct. “May not” plus the base form expresses a possibility the speaker is unsure about.",
        "“Ought” needs “to” before the base form, and it expresses duty rather than possibility.",
        "“Had better not” gives strong advice, which does not fit a statement about what is uncertain."]},
    {q:"______ I use your phone for a minute? Mine ______ be out of battery.",
     o:["Might to / may","Could / ought","Should / may","May / might"], a:3,
     e:["“Might” is followed by the bare infinitive, so “to” cannot appear after it (only “ought” takes “to”).",
        "“Ought” must be followed by “to”, so it cannot stand alone before “be”.",
        "“Should” would ask for advice rather than for permission to use the phone.",
        "Correct. “May” asks for permission politely and “might” expresses an uncertain possibility."]},
    {q:"Keep the old cable: we ______ need it again if the new one fails.",
     o:["ought","had better","must","might"], a:3,
     e:["“Ought” must be followed by “to” before the base form.",
        "“Had better” gives urgent advice, but needing a cable is not an action you can be advised to do.",
        "“Must” expresses certainty or obligation, which does not fit something that may or may not happen.",
        "Correct. “Might” plus the base form expresses a possibility in the future."]},
    {q:"The connection is very slow, so the video call ______ freeze at any moment.",
     o:["must","ought","could","had better"], a:2,
     e:["“Must” expresses near certainty, which is too strong for something that may or may not happen.",
        "“Ought” requires “to” before the verb and expresses advice, not possibility.",
        "Correct. “Could” plus the base form expresses a real possibility in the present or future.",
        "“Had better” gives advice to a person, but a video call cannot receive advice."]},
    {q:"You ______ restart the server during working hours — please wait until this evening.",
     o:["shouldn’t to","shouldn’t","don’t should","not should"], a:1,
     e:["“Shouldn’t” is followed by the bare infinitive, so “to” cannot appear after it (only “ought” takes “to”).",
        "Correct. “Shouldn’t” plus the base form advises somebody not to do something.",
        "Modals form their own negative with “not” and never take the auxiliary “do”.",
        "The negative word must come after the modal, not before it."]},
    {q:"Choose the correct sentence.",
     o:["You should to call the supplier before noon.","You ought call the supplier before noon.","You had better to call the supplier before noon.","You had better call the supplier before noon."], a:3,
     e:["“Should” is a modal and is never followed by “to”.",
        "“Ought” must be followed by “to” before the base form.",
        "“Had better” is followed directly by the base form, without “to”.",
        "Correct. “Had better” plus the base form gives strong advice, with no “to”."]}
   ]},
   {t:"Part 5 · Conditionals with If", q:[
    {q:"If you ______ the red button, the machine stops immediately.",
     o:["press","will press","would press","pressed"], a:0,
     e:["Correct. The zero conditional uses the present simple in both clauses for a general fact.",
        "“Will” is not used after “if” in a conditional sentence of this type.",
        "“Would” belongs to the result clause of a second conditional, not after “if”.",
        "A past simple after “if” would create an unreal situation, but this is a general fact."]},
    {q:"If the supplier ______ us a tracking number, we will know where the parcel is.",
     o:["sends","will send","would send","sent"], a:0,
     e:["Correct. The “if” clause of a first conditional uses the present simple, not a future form.",
        "“Will” is not used in the “if” clause of a first conditional.",
        "“Would” belongs to the result clause of a second conditional, not after “if”.",
        "A past simple after “if” would need “would” in the result clause, but the sentence has “will”."]},
    {q:"If the spare parts don’t arrive tomorrow, we ______ the installation.",
     o:["postponed","will postpone","would postpone","postpone"], a:1,
     e:["The past simple does not express a future consequence of a likely condition.",
        "Correct. The first conditional uses “will” plus the base form for a real future possibility.",
        "“Would” expresses an imaginary result, but the condition here is a realistic future one.",
        "The present simple in the result clause would turn this into a general rule rather than a decision."]},
    {q:"If you still ______ the problem tomorrow, I ______ a technician to your office.",
     o:["will have / send","have / will send","had / would send","have / send"], a:1,
     e:["“Will” is not used in the “if” clause of a first conditional.",
        "Correct. The first conditional pairs a present simple “if” clause with “will” plus the base form.",
        "This second conditional pattern presents the situation as imaginary, but “tomorrow” makes it a real possibility.",
        "The present simple in the result clause states a general rule and does not announce a decision for tomorrow."]},
    {q:"If I ______ you, I ______ the problem to the manager straight away.",
     o:["am / will report","was / report","were / would report","would be / report"], a:2,
     e:["A first conditional does not fit advice based on an imaginary situation of this kind.",
        "A past simple with a present simple result does not form a correct conditional pattern.",
        "Correct. The second conditional uses “were” after “if” and “would” plus the base form in the result.",
        "“Would” cannot be used in the “if” clause of a second conditional."]},
    {q:"If the temperature ______ too high, the machine always ______ itself down automatically.",
     o:["will rise / shuts","rose / shuts","rises / shuts","rises / would shut"], a:2,
     e:["“Will” is not used in the “if” clause of a zero conditional.",
        "A past simple after “if” creates an unreal condition, which does not fit a repeated fact.",
        "Correct. The zero conditional uses the present simple in both clauses to state a general fact.",
        "“Would” expresses an imaginary result and does not fit something that happens every time."]},
    {q:"If we had a second server, the website ______ offline so often.",
     o:["won’t go","doesn’t go","wouldn’t go","hadn’t gone"], a:2,
     e:["“Won’t” belongs to a first conditional, but “had” signals an imaginary condition.",
        "The present simple does not express the imaginary result of an unreal condition.",
        "Correct. The second conditional pairs a past simple “if” clause with “would” plus the base form.",
        "The past perfect does not match a second conditional result clause."]},
    {q:"If we ______ more technicians, the repairs ______ much faster.",
     o:["will have / would be","had / will be","have / would be","had / would be"], a:3,
     e:["“Will” is not used in the “if” clause of a second conditional.",
        "A past simple after “if” does not combine with “will” in the result clause.",
        "A present simple after “if” does not combine with “would” in a standard conditional.",
        "Correct. The second conditional uses the past simple after “if” and “would” plus the base form."]},
    {q:"If the client calls again, ______ him that we ______ working on it right now.",
     o:["tell / are","tell / will be","told / are","telling / are"], a:0,
     e:["Correct. A first conditional can use an imperative in the result clause with a present continuous for current work.",
        "“Will be working” points to a future activity, but the work is going on at this moment.",
        "The past simple does not form an instruction after a present “if” clause.",
        "An -ing form cannot be used as an instruction in the result clause."]},
    {q:"Choose the correct sentence.",
     o:["If I will have time, I would test the new version.","If I have time, I would test the new version.","If I had time, I will test the new version.","If I had time, I would test the new version."], a:3,
     e:["“Will” is not used in the “if” clause of a second conditional, and the two clauses do not match.",
        "A present simple “if” clause does not combine with “would” in a standard conditional.",
        "A past simple “if” clause does not combine with “will” in the result clause.",
        "Correct. The second conditional uses the past simple after “if” and “would” plus the base form."]}
   ]},
   {t:"Part 6 · Adverbs of Frequency", q:[
    {q:"Our team ______ a short online meeting before we contact the client.",
     o:["often has","has often","often is having","is often have"], a:0,
     e:["Correct. In a simple tense the adverb of frequency comes before the main verb.",
        "An adverb of frequency cannot be placed between the main verb and its object.",
        "The adverb must follow “is”, and the continuous form does not express a regular habit.",
        "“Is” cannot be followed by the base form “have”."]},
    {q:"The video platform ______ unavailable on Monday mornings.",
     o:["sometimes be","is sometimes","sometimes being","is being sometimes"], a:1,
     e:["“Be” must be conjugated; “sometimes be unavailable” has no finite verb.",
        "Correct. Adverbs of frequency are placed after the verb “be”.",
        "“Being” cannot be the only verb of a sentence.",
        "The continuous form does not describe a regular situation, and the adverb is badly placed."]},
    {q:"We ______ test the backup system on Friday mornings.",
     o:["test often","test always","always are","usually"], a:3,
     e:["The adverb is placed after the main verb, which is not its normal position in a simple tense.",
        "This word order puts the frequency adverb after the verb instead of before it.",
        "The order “always are” is wrong, and “are” cannot be followed by the base form “test”.",
        "Correct. Adverbs of frequency are placed before the main verb in a simple tense."]},
    {q:"Our colleague in Madrid is ______ late for the weekly online meeting.",
     o:["never is","never","is never","never been"], a:1,
     e:["This repeats the verb “is” and creates a double verb in the sentence.",
        "Correct. An adverb of frequency comes after the verb “be”.",
        "This also repeats the verb, since “is” already appears before the gap.",
        "“Never been” would require the auxiliary “has” to build a perfect tense."]},
    {q:"We ______ a problem with this supplier before today.",
     o:["never has had","have had never","have never had","never had have"], a:2,
     e:["“Has” does not agree with the subject “we”, which takes “have”.",
        "The adverb cannot be placed after the past participle.",
        "Correct. In a perfect tense the adverb of frequency goes between the auxiliary and the past participle.",
        "This word order inverts the two parts of the verb and puts the adverb first."]},
    {q:"The IT department checks the backup logs ______.",
     o:["always","never","hardly","twice a week"], a:3,
     e:["Adverbs of frequency such as “always” come before the main verb, not at the end of the sentence.",
        "“Never” is placed before the main verb and cannot close the sentence like this.",
        "“Hardly” is not a frequency adverb on its own and cannot close the sentence; the expression is “hardly ever”, before the verb.",
        "Correct. Expressions of frequency such as “twice a week” are placed at the end of the sentence."]},
    {q:"The night shift ______ a problem with the cooling system.",
     o:["rarely reports","reports rarely","rarely is reporting","is rarely report"], a:0,
     e:["Correct. “Rarely” is placed before the main verb in a simple tense.",
        "An adverb of frequency cannot come between the main verb and its object.",
        "The adverb must follow “is”, and the continuous form does not describe a habit.",
        "“Is” cannot be followed by the base form “report”."]},
    {q:"How ______ does the helpdesk receive this kind of call?",
     o:["much","many","often","long"], a:2,
     e:["“How much” asks about quantity or price, not about frequency.",
        "“How many” must be followed by a plural noun and asks about number.",
        "Correct. “How often” is the question form used to ask about frequency.",
        "“How long” asks about duration, not about how many times something happens."]},
    {q:"Choose the correct sentence.",
     o:["I have seen hardly ever such a quick repair.","I have hardly ever seen such a quick repair.","Hardly ever I have seen such a quick repair.","I hardly ever have seen such a quick repair."], a:1,
     e:["The adverb is placed after the past participle, which breaks the normal word order.",
        "Correct. In a perfect tense, the adverb of frequency goes between the auxiliary and the past participle.",
        "“Hardly ever” is not placed at the beginning of the sentence; it goes between the auxiliary “have” and the past participle.",
        "The adverb should follow the auxiliary “have”, not come before it."]},
    {q:"Which sentence places the adverb of frequency correctly?",
     o:["The printer is out of order sometimes completely.","The printer is out of order sometimes is.","Sometimes is the printer out of order.","The printer is sometimes out of order."], a:3,
     e:["“Sometimes” cannot be pushed to the end of the sentence after another adverb like this.",
        "The verb “is” cannot be repeated at the end of the sentence.",
        "This order inverts the subject and the verb, which only happens in questions.",
        "Correct. An adverb of frequency is placed directly after the verb “be”."]}
   ]},
   {t:"Part 7 · Comparatives, Superlatives & Intensifiers", q:[
    {q:"This new troubleshooting procedure is ______ than the old one.",
     o:["more simpler","simpler","simplest","as simple"], a:1,
     e:["“More” cannot be combined with the “-er” ending; the two are never used together.",
        "Correct. Short adjectives form the comparative with -er, and “than” introduces the comparison.",
        "A superlative cannot be used with “than” in a comparison between two things.",
        "“As simple” must be followed by a second “as”, not by “than”."]},
    {q:"It was ______ breakdown we have ever had on this site.",
     o:["the worse","worse","the worst","the baddest"], a:2,
     e:["“The worse” is a comparative form and does not fit a comparison with the whole group.",
        "“Worse” is a comparative and only compares two things; ranking one item against the whole group needs the superlative “the worst”.",
        "Correct. The superlative “the worst” compares one thing with all the others in a group.",
        "“Baddest” is not a standard form, because “bad” is irregular."]},
    {q:"The second supplier’s prices are ______ high ______ the first one’s.",
     o:["so / as","too / than","more / than","as / as"], a:3,
     e:["“So … as” is only used in negative or interrogative comparisons; in an affirmative sentence the structure is “as … as”.",
        "“Too” expresses excess and cannot be followed by “than”.",
        "“More” would require “higher” rather than “more high” with this short adjective.",
        "Correct. “As … as” expresses that two things are equal in degree."]},
    {q:"This is ______ reliable supplier we work with.",
     o:["the more","the most","most","more"], a:1,
     e:["“The more” is a comparative and needs “than” or a second comparative clause.",
        "Correct. Long adjectives form the superlative with “the most”.",
        "A superlative needs the article “the” before “most” in this structure.",
        "“More” is a comparative form and does not compare one thing with a whole group."]},
    {q:"The open-plan office was ______ noisy for us to hear the client on the phone.",
     o:["enough","so","too","very much"], a:2,
     e:["“Enough” follows the adjective, as in “quiet enough”, and does not express excess.",
        "“So” needs a “that” clause to express a consequence, not an infinitive like this one.",
        "Correct. “Too” plus an adjective plus “to” plus a verb expresses an excessive degree that prevents something.",
        "“Very much” cannot be placed directly before an adjective such as “noisy”."]},
    {q:"Your explanation was ______ clear — everyone understood the solution at once.",
     o:["absolutely","very much","too","enough"], a:0,
     e:["Correct. “Absolutely” is used before adjectives expressing a complete degree, as in the set phrase “absolutely clear”.",
        "“Very much” cannot be placed directly before an adjective.",
        "“Too” expresses an excessive degree, which contradicts the positive result.",
        "“Enough” comes after the adjective and expresses a sufficient degree, not emphasis."]},
    {q:"The temporary fix was not stable ______ to last until the end of the week.",
     o:["enough","too","so","much"], a:0,
     e:["Correct. “Enough” comes after the adjective and expresses a sufficient degree.",
        "“Too” comes before the adjective and expresses an excessive degree.",
        "“So” comes before the adjective and needs a “that” clause after it.",
        "“Much” is used before comparative forms, not after a plain adjective."]},
    {q:"The new fibre connection is ______ faster than our old line.",
     o:["very","too","far","so"], a:2,
     e:["“Very” cannot be used to intensify a comparative form such as “faster”.",
        "“Too” expresses excess and does not combine with a comparative followed by “than”.",
        "Correct. “Far” is an intensifier placed before a comparative to express a big difference.",
        "“So” cannot strengthen a comparative followed by “than”."]},
    {q:"Of all the solutions on the table, this one is ______ expensive.",
     o:["the less","less","the fewest","the least"], a:3,
     e:["“The less” is not used as a superlative before an adjective.",
        "“Less” is a comparative, but “of all the solutions” calls for a superlative.",
        "“Fewest” is used with countable nouns, not before an adjective.",
        "Correct. “The least” forms the superlative of inferiority before a long adjective."]},
    {q:"After the update the online form was ______ different from the previous version.",
     o:["very too","too much","completely","enough"], a:2,
     e:["“Very” and “too” cannot be combined before an adjective.",
        "“Too much” goes before a noun or after a verb, not before an adjective.",
        "Correct. “Completely” is an intensifier used before an adjective to express a total degree.",
        "“Enough” follows the adjective and expresses a sufficient degree, not a total one."]}
   ]}
  ]
}
];

    {q:"We will miss the milestone if the subcontractor ______ the parts late.",
     o:["will deliver","would deliver","delivered","delivers"], a:3,
     e:["After “if”, English uses the present simple rather than “will”.",
        "“Would deliver” sets up an imaginary case, but the main clause here uses “will”.",
        "The past simple after “if” would require “would” in the main clause.",
        "Correct. In a first conditional the if-clause takes the present simple and the result takes “will”."]},
    {q:"Honestly, I ______ prefer to split the task between two people, but that is not possible here.",
     o:["would","will","am","would have"], a:0,
     e:["Correct. “Would” expresses a hypothetical preference about a situation that is not real.",
        "“Will” states a real future action, but the speaker says this option is not possible.",
        "“Am prefer” is not a possible form, and “prefer” is not used in a continuous structure here.",
        "“Would have” must be followed by a past participle, not by the infinitive “prefer”."]},
    {q:"If the budget ______ bigger, we would hire a second technician for the whole project.",
     o:["is","were","will be","would be"], a:1,
     e:["The present simple after “if” goes with “will”, not with “would”.",
        "Correct. A second conditional uses a past form after “if”, and “were” is standard here.",
        "“Will” is not used in the if-clause of a conditional.",
        "“Would” belongs in the result clause, not after “if”."]}

   {t:"Part 2 · Present Perfect & Past Continuous Tenses", q:[
    {q:"I ______ this team since the beginning of February.",
     o:["lead","led","was leading","have led"], a:3,
     e:["The present simple cannot be used with “since”, which measures a period reaching up to now.",
        "The past simple describes a finished period, so it does not fit “since the beginning of February”.",
        "The past continuous shows an action in progress at one past moment, not a period reaching the present.",
        "Correct. “Since” plus a starting point takes the present perfect for a situation that is still true."]},
    {q:"We were reviewing the budget when the director ______ into the room.",
     o:["was coming","comes","came","has come"], a:2,
     e:["The past continuous suits the longer background action, which “were reviewing” already expresses.",
        "The present simple does not fit a past scene introduced by “were reviewing”.",
        "Correct. The past simple marks the short action that interrupts an action already in progress.",
        "The present perfect cannot be used for an event placed inside a finished past scene."]},
    {q:"We ______ the signed contract yet, so work cannot start.",
     o:["have not received","did not receive","do not receive","had not received"], a:0,
     e:["Correct. “Yet” in a negative sentence about something still missing now takes the present perfect.",
        "The past simple closes the matter in the past, which clashes with “yet” and with “cannot start”.",
        "The present simple would describe a habit, not a document that has still not arrived.",
        "The past perfect needs an earlier past moment to look back from, and there is none here."]},
    {q:"We ______ on this proposal since Monday and it is still not finished.",
     o:["work","have been working","are working","worked"], a:1,
     e:["The present simple cannot be combined with “since Monday”.",
        "Correct. The present perfect continuous links an activity that started in the past and is still going on.",

    {q:"The previous project manager ______ the handover notes in March and then left the company.",

        "The past continuous shows an action in progress, but “and then left” marks a completed step."]},
    {q:"It is a new tool for all of us: none of us ______ it before.",
     o:["did not use","was using","does not use","has used"], a:3,
     e:["“None of us” is already negative, so adding “did not” creates a double negative.",
        "The past continuous places the action at one past moment, not in our experience up to now.",
        "“Does not use” after “none of us” is also a double negative, and the present simple is wrong here.",
        "Correct. The present perfect reports experience up to now, which is what “before” asks about here."]},
    {q:"Good news — the client ______ the new timeline, so we can start straight away.",
     o:["has just approved","just approves","is just approving","was just approving"], a:0,
     e:["Correct. “Just” with the present perfect marks something completed a very short time ago with a result now.",
        "The present simple would describe a habit, not a single piece of news.",
        "The present continuous suggests the approval is still in progress, so work could not start straight away.",

    {q:"Our supplier ______ us for three years and has never been late.",

     e:["The present simple states a current fact but cannot measure a period up to now with “for three years”.",
        "Correct. “For” plus a length of time, with a situation still true, takes the present perfect.",
        "The past simple would mean the arrangement is over, which “has never been late” contradicts.",
        "The present continuous refers to a temporary action now, not to three years of service."]},
    {q:"Choose the correct sentence about the laptop crash.",

     e:["“Was” must be followed by an -ing form, so “was prepare” is not a possible verb form.",
        "This reverses the two roles: the crash is the short event and needs the past simple.",
        "Correct. The longer background action takes the past continuous and the short interrupting event takes the past simple.",

   {t:"Part 3 · Gerund & Infinitive", q:[
    {q:"To stay on schedule, we must avoid ______ the same information twice.",

     e:["Correct. When a verb follows “avoid”, it takes the -ing form.",

    {q:"The team was short-handed, but they managed ______ the prototype on time.",

    {q:"Choose the correct sentence about the training session.",

        "The trainer offered to stay after the session to answer questions.",

   {t:"Part 4 · Linking Words — Level 1", q:[
    {q:"______ the team was small, we delivered the first version on time.",
     o:["Although","Because","So","Then"], a:0,
     e:["Correct. “Although” introduces a contrast between the difficulty and the result.",
        "“Because” would give the small team as the reason for the success, which is not the meaning.",
        "“So” introduces a result and cannot open this kind of clause.",
        "“Then” shows a sequence in time, not a contrast."]},
    {q:"We postponed the test ______ the spare parts had not arrived.",
     o:["although","because","so","but"], a:1,
     e:["“Although” marks a contrast, but the missing parts explain the decision.",
        "Correct. “Because” introduces the reason for the action in the main clause.",
        "“So” introduces a result, but this second clause gives the cause.",
        "“But” links two contrasting ideas, which is not the relation here."]},
    {q:"Two colleagues were on holiday, ______ we shared their tasks between us.",
     o:["because","although","so","while"], a:2,
     e:["“Because” introduces a cause, but the second clause says what the team did about it.",
        "“Although” signals a contrast, and there is no contrast between the two ideas.",
        "Correct. “So” introduces the result of the situation described first.",
        "“While” compares two actions in time, not a situation and its consequence."]},
    {q:"Some tasks can be done in parallel — ______, testing and writing the user guide.",
     o:["because","although","so","for example"], a:3,
     e:["“Because” would announce a reason, not an illustration.",
        "“Although” introduces a contrasting idea rather than an example.",
        "“So” announces a result, not an example.",
        "Correct. “For example” introduces an illustration of the statement just made."]},
    {q:"Please check the figures ______ you send the report to the director, not afterwards.",
     o:["after","before","although","so"], a:1,
     e:["“After” would place the check later, which the words “not afterwards” rule out.",
        "Correct. “Before” places the check earlier than sending the report.",
        "“Although” introduces a contrast and cannot order two actions in time.",
        "“So” introduces a result, not the moment when something must be done."]},
    {q:"I took notes ______ the client was explaining the new requirements.",
     o:["before","after","while","although"], a:2,
     e:["“Before” would place the notes earlier than the explanation, which makes no sense here.",
        "“After” would mean the explanation was already over, but it was still in progress.",
        "Correct. “While” links two actions happening at the same time.",
        "“Although” marks a contrast and cannot express two simultaneous actions."]},
    {q:"The new schedule is shorter, and it is ______ easier to read.",
     o:["too","although","so","also"], a:3,
     e:["In this meaning “too” goes at the end of the clause, not in front of the adjective.",
        "“Although” joins clauses and cannot be placed in front of an adjective.",
        "“So” in front of a comparative is not possible; it would need “so much easier”.",
        "Correct. “Also” adds a second point and stands in front of the adjective phrase."]},
    {q:"We will start with the data, ______ we will build the model, and finally we will test it.",
     o:["for example","next","because","although"], a:1,
     e:["“For example” introduces an illustration, not the second step of a plan.",
        "Correct. “Next” marks the second stage in a sequence that ends with “finally”.",
        "“Because” gives a reason, but this clause continues a list of steps.",
        "“Although” marks a contrast, which does not fit a series of steps."]},
    {q:"You can send the update by email ______ post it on the shared drive — one channel is enough.",
     o:["or","and","so","but"], a:0,
     e:["Correct. “Or” presents two alternatives when only one of them is needed.",
        "“And” would ask for both channels, but one channel is enough.",
        "“So” introduces a result, not a choice between two options.",
        "“But” marks a contrast, but the two channels here are simply alternatives."]},
    {q:"Choose the correct sentence about the planning.",
     o:["Because the deadline was tight, but we finished the work in time.",
        "Although the deadline was tight, so we finished the work in time.",
        "Although the deadline was tight, and we finished the work in time.",
        "Although the deadline was tight, we finished the work in time."], a:3,
     e:["“Because” and “but” both mark the link between the clauses, so the two cannot be used together.",
        "“Although” already marks the contrast, so adding “so” creates a second, conflicting link.",
        "“And” simply adds information, so it cannot follow a clause already introduced by “although”.",
        "Correct. “Although” opens the contrast clause and the main clause follows with no extra connector."]}
   ]}
  ]

    {q:"I still remember ______ my first client in Hamburg five years ago.",

     e:["“Remember to do” refers to a duty you must not forget, which does not fit “five years ago”.",

        "A bare infinitive cannot follow “remember”.",
        "“Remember” is not followed by “to” plus an -ing form."]},
    {q:"Our host suggested ______ the old harbour before dinner.",
     o:["to visit","us to visit","visiting","visit"], a:2,
     e:["“Suggest” is not followed by a to-infinitive.",

        "Correct. “Suggest” is followed by the -ing form.",
        "A bare infinitive cannot follow “suggest” directly."]},
    {q:"The traffic was terrible, but in the end we managed ______ the client at the airport.",

     e:["“Manage” is not followed by an -ing form.",
        "“Manage” cannot be followed by a bare infinitive.",
        "“Manage” does not take the preposition “for” before a verb.",
        "Correct. “Manage” takes a to-infinitive to express success in doing something."]},
    {q:"With three business trips a year, I am used to ______ early in the morning.",

        "This would repeat the preposition “to” that is already there.",

    {q:"Choose the correct sentence about the way the company organised its trips.",
     o:["We used to travelling by plane, but now we often take the train.",

        "We are used to travel by plane, but now we often take the train.",
        "We use to travel by plane, but now we often take the train."], a:1,

        "Correct. “Used to” plus the base verb describes a past habit that has now changed.",
        "“Be used to” means “be accustomed to” and needs an -ing form, which is a different meaning.",
        "“Use to” is not possible in an affirmative statement; the past form is required."]}
